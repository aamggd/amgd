name: Build Fush ERP Phase 14.5.10 Partial Purchase Returns

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-10-partial-purchase-returns.yml'
      - 'phase14_5_10_partial_purchase_returns/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.9 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.9-Transfer-Reversal-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31659921341
      - name: Restore Phase 14.5.9 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.9-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 48' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.9-phase14.5-transfer-reversal' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.10 partial purchase returns
        shell: bash
        run: |
          set -e
          python phase14_5_10_partial_purchase_returns/apply_patch.py
          grep -q 'versionCode = 49' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.10-phase14.5-partial-purchase-returns' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'PostPurchaseReturnRequest' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/PurchaseService.kt
          grep -q 'validateReturnDraft' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/PurchaseMath.kt
          grep -q 'مرتجع مشتريات جزئي' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/PurchaseScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 21 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/21.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-10-output
          mkdir -p phase14-5-10-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-10-output/FushERP-Phase14.5.10-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-10-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-10-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-10-output/apksigner/apksigner
          zip -qr phase14-5-10-output/FushERP-Mobile-Phase14.5.10-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-10-output/FushERP-Phase14.5.10-unsigned.apk > phase14-5-10-output/FushERP-Phase14.5.10-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.10 — Partial Purchase Returns' \
            'Version: 0.15.4.10-phase14.5-partial-purchase-returns (versionCode 49)' \
            'Room schema: 21 (unchanged)' \
            '' \
            'Fixed:' \
            '- A purchase return can contain partial quantities from one or multiple original invoice lines in one document.' \
            '- The UI shows purchased, previously returned and remaining quantity for each line.' \
            '- Over-returning and duplicate line selections are rejected server-side.' \
            '- Exact original lot/expiry stock is validated in aggregate before posting.' \
            '- Return header, stock movements, document number and journal use one consistent return timestamp.' \
            '- Return reason is mandatory.' \
            '- Existing single-line service remains compatible by delegating to the new multi-line return service.' \
            > phase14-5-10-output/FushERP-Phase14.5.10-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.10-Partial-Purchase-Returns-Build
          path: phase14-5-10-output/
          if-no-files-found: error
          retention-days: 7
