name: FAZ v1.0.25 Gate1 Task4 RED

on:
  push:
    branches: [faz/v1.0.25-ops-itemmaster]
    paths:
      - '.github/workflows/faz-v1025-gate1-task4-red.yml'
      - 'ci/UnifiedItemDialogContractTest.kt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FAZ-v1.0.25-Gate1-Task3-UnifiedItem-GREEN
          path: baseline
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 35038399548
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Prepare Task3 source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          Z=$(find baseline -type f -name '*UnifiedItem-Source.zip' -print -quit); test -n "$Z"
          mkdir -p work; unzip -q "$Z" -d work
          S=$(find work -name settings.gradle.kts -print -quit); test -n "$S"
          ROOT=$(dirname "$S")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'suspend fun createUnifiedItem' "$ROOT/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt"
          test ! -f "$ROOT/app/src/main/java/com/fush/erp/ui/screens/UnifiedItemDialog.kt"
      - name: RED - unified same-screen UI must be absent
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          TEST="$ROOT/app/src/test/java/com/fush/erp/ui/UnifiedItemDialogContractTest.kt"
          mkdir -p "$(dirname "$TEST")"
          cp ci/UnifiedItemDialogContractTest.kt "$TEST"
          cd "$ROOT"
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.ui.UnifiedItemDialogContractTest' > "$GITHUB_WORKSPACE/task4-red.log" 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -Eq 'UnifiedItemDialogContractTest|Source file not found|AssertionError' "$GITHUB_WORKSPACE/task4-red.log"
          echo 'GATE1_TASK4_RED=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: FAZ-v1.0.25-Gate1-Task4-RED
          path: task4-red.log
          retention-days: 2
