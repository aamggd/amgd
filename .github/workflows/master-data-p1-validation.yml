name: Validate master-data P1 on Sales P1 Central

on:
  push:
    branches: [fush/master-data]
    paths:
      - 'central_source/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt'
      - 'central_source/app/src/test/java/com/fush/erp/domain/AutoNumberSequencePolicyTest.kt'
      - '.github/workflows/master-data-p1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p1-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Central ancestry, source tree, and exact P1 app patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=ddae764a236cb1916a46e194ccb2d3c24ca6b919
          EXPECTED_SOURCE_TREE=30b028b75d6463c07afd0419429f53c7937fabb1
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$BASE:central_source")" = "$EXPECTED_SOURCE_TREE"
          mapfile -t APP_CHANGED < <(git diff --name-only "$BASE" HEAD -- central_source/app | sort)
          printf '%s\n' "${APP_CHANGED[@]}"
          test "${#APP_CHANGED[@]}" -eq 2
          test "${APP_CHANGED[0]}" = 'central_source/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt'
          test "${APP_CHANGED[1]}" = 'central_source/app/src/test/java/com/fush/erp/domain/AutoNumberSequencePolicyTest.kt'
          test "$(git rev-parse HEAD:central_source/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt)" = '4224ce145965cf45e77b61b14b40b7157875d798'
          test "$(git rev-parse HEAD:central_source/app/src/test/java/com/fush/erp/domain/AutoNumberSequencePolicyTest.kt)" = 'd1d7e05fef4c3a0a31e0e563ae953cdc9dd60e0c'
          git diff --quiet "$BASE" HEAD -- central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/src/main/java/com/fush/erp/data/Migrations.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/schemas

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Focused AutoNumber tests and concurrency reservation contract
        shell: bash
        run: |
          set -euo pipefail
          cd central_source
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.fush.erp.domain.AutoNumberFormatTest \
            --tests com.fush.erp.domain.AutoNumberSequencePolicyTest
          cd ..
          python3 - <<'PY'
          import os, sqlite3, tempfile, threading

          fd, path = tempfile.mkstemp(prefix='fush-number-sequence-', suffix='.db')
          os.close(fd)
          try:
              c = sqlite3.connect(path)
              c.execute('CREATE TABLE number_sequences(sequenceKey TEXT PRIMARY KEY NOT NULL, lastValue INTEGER NOT NULL, updatedAt INTEGER NOT NULL)')
              c.commit()
              c.close()

              values = []
              lock = threading.Lock()

              def reserve(key: str) -> int:
                  con = sqlite3.connect(path, timeout=30, isolation_level=None)
                  con.execute('PRAGMA busy_timeout=30000')
                  try:
                      con.execute('BEGIN IMMEDIATE')
                      row = con.execute('SELECT lastValue FROM number_sequences WHERE sequenceKey=? LIMIT 1', (key,)).fetchone()
                      current = row[0] if row else 0
                      if current < 0 or current >= 9223372036854775807:
                          raise RuntimeError('invalid/exhausted sequence')
                      nxt = current + 1
                      con.execute('INSERT OR REPLACE INTO number_sequences(sequenceKey,lastValue,updatedAt) VALUES(?,?,?)', (key, nxt, nxt))
                      persisted = con.execute('SELECT lastValue FROM number_sequences WHERE sequenceKey=? LIMIT 1', (key,)).fetchone()[0]
                      assert persisted == nxt
                      con.commit()
                      return nxt
                  except Exception:
                      con.rollback()
                      raise
                  finally:
                      con.close()

              def worker():
                  local = [reserve('MASTER:UNT') for _ in range(50)]
                  with lock:
                      values.extend(local)

              threads = [threading.Thread(target=worker) for _ in range(4)]
              for t in threads: t.start()
              for t in threads: t.join()
              assert sorted(values) == list(range(1, 201)), sorted(values)
              assert reserve('MASTER:UNT') == 201
              assert reserve('MASTER:WH') == 1
              assert reserve('MASTER:WH') == 2
          finally:
              try: os.remove(path)
              except FileNotFoundError: pass
          PY

      - name: Full unit tests
        working-directory: central_source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: central_source
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Room and migration preservation
        shell: bash
        run: |
          set -euo pipefail
          BASE=ddae764a236cb1916a46e194ccb2d3c24ca6b919
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f central_source/app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -q 'val MIGRATION_34_35_ACCOUNTING_P1 = object : Migration(34, 35)' central_source/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/src/main/java/com/fush/erp/data/Migrations.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt
          git diff --quiet "$BASE" HEAD -- central_source/app/schemas

      - name: App ID and no-destructive checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' central_source/app/build.gradle.kts
          ! grep -R -q 'fallbackToDestructiveMigration' central_source/app/src/main/java central_source/app/build.gradle.kts
          grep -q 'db.withTransaction' central_source/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt
          grep -q 'AutoNumberSequencePolicy.next' central_source/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt
          ! grep -E -q 'fun[[:space:]]+(reset|delete)[A-Za-z0-9_]*Sequence' central_source/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt
