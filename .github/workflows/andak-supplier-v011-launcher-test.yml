name: ANDAK Supplier v0.1.1 Launcher Icon Test

on:
  push:
    branches:
      - 'andak-supplier-build-v011'
    paths:
      - '.github/workflows/andak-supplier-v011-launcher-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-test:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download permanently signed official APK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/1A9xPByIKO0Z'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v0.1.1-OFFICIAL-SIGNED.apk"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$DOWNLOAD_URL" -o /tmp/ANDAK-Supplier-v0.1.1-OFFICIAL-SIGNED.apk
          echo 'a2527e4437acab06c64321ff1713fa0a59a3ed340fa00026bd92a8a36b8cc870  /tmp/ANDAK-Supplier-v0.1.1-OFFICIAL-SIGNED.apk' | shasum -a 256 -c -
          echo "APK=/tmp/ANDAK-Supplier-v0.1.1-OFFICIAL-SIGNED.apk" >> "$GITHUB_ENV"

      - name: Write launcher verification
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/launcher-test.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          P=com.fush.market.supplier
          adb uninstall "$P" >/dev/null 2>&1 || true
          adb install "$APK"
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$P" | tee "$GITHUB_WORKSPACE/launcher-resolve.txt"
          grep -q 'com.fush.market.supplier/.MainActivity' "$GITHUB_WORKSPACE/launcher-resolve.txt"

          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME
          sleep 2
          # Open Pixel Launcher app drawer.
          adb shell input swipe 540 1700 540 450 500
          sleep 3
          adb shell uiautomator dump /sdcard/launcher.xml >/dev/null 2>&1 || true
          adb pull /sdcard/launcher.xml "$GITHUB_WORKSPACE/launcher-window.xml" >/dev/null 2>&1 || true
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/launcher-screen.png"

          if grep -q 'عندك للمورد' "$GITHUB_WORKSPACE/launcher-window.xml"; then
            echo 'LAUNCHER_LABEL_VISIBLE=YES' | tee "$GITHUB_WORKSPACE/launcher-result.txt"
          else
            # Search the app drawer if the launcher exposes a search field.
            adb shell input tap 540 160
            adb shell input text 'com.fush.market.supplier' || true
            sleep 2
            adb shell uiautomator dump /sdcard/launcher-search.xml >/dev/null 2>&1 || true
            adb pull /sdcard/launcher-search.xml "$GITHUB_WORKSPACE/launcher-search-window.xml" >/dev/null 2>&1 || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/launcher-search-screen.png"
            grep -q 'عندك للمورد' "$GITHUB_WORKSPACE/launcher-search-window.xml"
            echo 'LAUNCHER_LABEL_VISIBLE=YES_SEARCH' | tee "$GITHUB_WORKSPACE/launcher-result.txt"
          fi
          echo LAUNCHER_ICON_TEST_PASS
          EOF
          chmod +x "$GITHUB_WORKSPACE/launcher-test.sh"

      - name: Launcher icon verification on installed signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/launcher-test.sh"

      - name: Package launcher evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for f in launcher-resolve.txt launcher-result.txt launcher-window.xml launcher-screen.png launcher-search-window.xml launcher-search-screen.png; do
            test -f "$GITHUB_WORKSPACE/$f" && cp "$GITHUB_WORKSPACE/$f" evidence/ || true
          done
          printf '%s\n'             'ANDAK Supplier v0.1.1 — Launcher verification'             'APK=permanently signed official release'             'applicationId=com.fush.market.supplier'             'Expected label=عندك للمورد'             > evidence/LAUNCHER-INFO.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANDAK-Supplier-v0.1.1-LAUNCHER-EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
