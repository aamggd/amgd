name: Export Android Build Tools
on:
  workflow_dispatch:
  push:
    branches: [ "baqalati-build-v1.0.39" ]
    paths: [ '.github/workflows/export-android-build-tools.yml' ]
jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Collect signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir -p "$GITHUB_WORKSPACE/tools/lib"
          cp "$BT/apksigner" "$BT/zipalign" "$BT/aapt2" "$GITHUB_WORKSPACE/tools/"
          cp "$BT/lib/apksigner.jar" "$GITHUB_WORKSPACE/tools/lib/"
          chmod +x "$GITHUB_WORKSPACE/tools/apksigner" "$GITHUB_WORKSPACE/tools/zipalign" "$GITHUB_WORKSPACE/tools/aapt2"
          "$GITHUB_WORKSPACE/tools/apksigner" --version
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-signing
          path: tools/**
          retention-days: 1
          if-no-files-found: error
