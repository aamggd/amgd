name: Export v111 Offline Build Kit

on:
  push:
    branches:
      - agent/v111-historical-inventory-build-20260822
    paths:
      - '.github/workflows/export-v111-offline-build-kit.yml'
  pull_request:
    branches:
      - agent/v106-clean-apk-build-20260821
    paths:
      - '.github/workflows/export-v111-offline-build-kit.yml'

permissions:
  contents: read

jobs:
  export-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install exact Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up exact Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Create dependency warmup project matching v111
        shell: bash
        run: |
          mkdir -p warmup/app/schemas warmup/gradle
          cat > warmup/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FushERPWarmup"
          include(":app")
          EOF
          cat > warmup/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.ksp) apply false
              alias(libs.plugins.room) apply false
          }
          EOF
          cat > warmup/gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "9.2.0"
          kotlin = "2.3.21"
          ksp = "2.3.9"
          room = "2.8.4"
          activity = "1.13.0"
          lifecycle = "2.10.0"
          navigation = "2.9.8"
          composeBom = "2026.06.00"
          coreKtx = "1.17.0"
          junit = "4.13.2"

          [libraries]
          androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
          androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
          androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
          androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
          androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
          androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
          androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
          androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
          androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { module = "androidx.compose.ui:ui" }
          androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
          androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
          androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
          androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
          junit = { module = "junit:junit", version.ref = "junit" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          room = { id = "androidx.room", version.ref = "room" }
          EOF
          cat > warmup/app/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.room)
          }
          android {
              namespace = "com.fush.erp.warmup"
              compileSdk = 36
              defaultConfig { applicationId = "com.fush.erp.warmup"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1" }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.room.runtime)
              implementation(libs.androidx.room.ktx)
              ksp(libs.androidx.room.compiler)
              val composeBom = platform(libs.androidx.compose.bom)
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.material.icons.core)
              debugImplementation(libs.androidx.compose.ui.tooling)
              testImplementation(libs.junit)
              testImplementation(libs.androidx.room.testing)
              androidTestImplementation(libs.androidx.room.testing)
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > warmup/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
      - name: Resolve all v111 configurations
        working-directory: warmup
        shell: bash
        run: |
          gradle --no-daemon :app:dependencies
          gradle --no-daemon :app:assembleDebug -x lint || true
      - name: Package offline Gradle Android kit
        shell: bash
        run: |
          set -e
          mkdir -p offline-kit/android-sdk/platforms offline-kit/android-sdk/build-tools offline-kit/android-sdk/platform-tools offline-kit/android-sdk/licenses offline-kit/gradle-home
          cp -a "$ANDROID_SDK_ROOT/platforms/android-36" offline-kit/android-sdk/platforms/
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" offline-kit/android-sdk/build-tools/
          cp -a "$ANDROID_SDK_ROOT/platform-tools/." offline-kit/android-sdk/platform-tools/
          cp -a "$ANDROID_SDK_ROOT/licenses/." offline-kit/android-sdk/licenses/ || true
          cp -a "$HOME/.gradle/caches" offline-kit/gradle-home/
          cp -a "$HOME/.gradle/notifications" offline-kit/gradle-home/ 2>/dev/null || true
          GRADLE_BIN="$(command -v gradle)"
          GRADLE_REAL="$(readlink -f "$GRADLE_BIN")"
          GRADLE_ROOT="$(cd "$(dirname "$GRADLE_REAL")/.." && pwd)"
          cp -a "$GRADLE_ROOT" offline-kit/gradle-9.4.1
          tar -I 'zstd -10 -T0' -cf Fush-v111-offline-build-kit.tar.zst offline-kit
          sha256sum Fush-v111-offline-build-kit.tar.zst > Fush-v111-offline-build-kit.tar.zst.sha256
          ls -lh Fush-v111-offline-build-kit.tar.zst
      - name: Upload offline build kit
        uses: actions/upload-artifact@v4
        with:
          name: Fush-v111-offline-build-kit
          path: |
            Fush-v111-offline-build-kit.tar.zst
            Fush-v111-offline-build-kit.tar.zst.sha256
          retention-days: 2
          if-no-files-found: error
