name: ANDAK Supplier Gate12 R8 Instrumentation Strict
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download exact R8 source with wrapper
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          SHARE="zvpjt3t_rx3K"
          NAME="ANDAK-Supplier-v1.3.2-GATE12-R8-Source-With-Wrapper.zip"
          curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          curl -fsSL -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(jq -r '.downloadUrl' /tmp/download.json)
          curl -fL --retry 3 "$URL" -o /tmp/r8-wrapper.zip
          echo "b5154158f940edb0a4b795347dc165860bf26633f6457aef5d838844d0671b8b  /tmp/r8-wrapper.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/r8w"
          unzip -q /tmp/r8-wrapper.zip -d "$GITHUB_WORKSPACE/r8w"
          test -x "$GITHUB_WORKSPACE/r8w/gradlew"
          test -f "$GITHUB_WORKSPACE/r8w/gradle/wrapper/gradle-wrapper.jar"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run connected Android tests strictly
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            ls -l "$GITHUB_WORKSPACE/r8w/gradlew"
            sh "$GITHUB_WORKSPACE/r8w/gradlew" -p "$GITHUB_WORKSPACE/r8w" --no-daemon :apps:supplier:connectedDebugAndroidTest
            XML=$(find "$GITHUB_WORKSPACE/r8w/apps/supplier/build/outputs/androidTest-results" -name '*.xml' -type f | head -1)
            test -n "$XML"
            grep -R 'tests="' "$GITHUB_WORKSPACE/r8w/apps/supplier/build/outputs/androidTest-results"
            if grep -R -E 'failures="[1-9]|errors="[1-9]' "$GITHUB_WORKSPACE/r8w/apps/supplier/build/outputs/androidTest-results"; then exit 5; fi
            mkdir -p "$GITHUB_WORKSPACE/instrumentation-results"
            cp -R "$GITHUB_WORKSPACE/r8w/apps/supplier/build/outputs/androidTest-results/." "$GITHUB_WORKSPACE/instrumentation-results/"

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Gate12-R8-Instrumentation-Evidence
          path: instrumentation-results/
          if-no-files-found: error
          retention-days: 2
