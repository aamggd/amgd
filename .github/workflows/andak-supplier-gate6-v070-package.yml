name: ANDAK Supplier v0.7.0 Gate6 Package

on:
  push:
    branches: ['andak-supplier-gate6-v070']
    paths: ['.github/workflows/andak-supplier-gate6-v070-package.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmd.zip
          rm -rf /tmp/cmd; mkdir -p /tmp/cmd; unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Exact Gate6 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/yj34WgAdwJq_'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v0.7.0-Gate6-Source.zip"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$URL" -o /tmp/source.zip
          echo '1d9368ad413ecc06714877f623bf911f2cffb27b85c21f6ce3561b4e953c4eef  /tmp/source.zip' | sha256sum -c -
          mkdir source; unzip -q /tmp/source.zip -d source
          SRC=$(find "$GITHUB_WORKSPACE/source" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Gate6 static checks
        shell: bash
        run: |
          set -euo pipefail
          B="$SRC/apps/supplier/build.gradle.kts"
          A="$SRC/apps/supplier/src/main/java/com/fush/market/supplier/SupplierApp.kt"
          grep -q 'applicationId = "com.fush.market.supplier"' "$B"
          grep -q 'versionCode = 8' "$B"
          grep -q 'versionName = "0.7.0"' "$B"
          grep -q 'SyncQueueItem' "$A"
          grep -q 'SupplierNotification' "$A"
          grep -q 'supplier:self' "$A"
          grep -q 'BLOCKED_NO_BACKEND' "$A"
          grep -q 'مركز المزامنة' "$A"
          grep -q 'الخادم المركزي غير مهيأ' "$A"
          grep -q 'بيانات اتصال العميل والعنوان الكامل غير مشمولة' "$A"
          grep -q 'تحديد الكل كمقروء' "$A"
          echo GATE6_STATIC_PASS

      - name: Build Gate6
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          gradle :apps:supplier:assembleDebug :apps:supplier:assembleRelease :apps:supplier:bundleRelease --no-daemon --stacktrace

      - name: Package Gate6
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$SRC/apps/supplier/build/outputs/apk/release/supplier-release-unsigned.apk" "$D/ANDAK-Supplier-v0.7.0-GATE6-ALIGNED-UNSIGNED.apk"
          cp "$SRC/apps/supplier/build/outputs/apk/debug/supplier-debug.apk" "$D/ANDAK-Supplier-v0.7.0-GATE6-DEBUG.apk"
          cp "$SRC/apps/supplier/build/outputs/bundle/release/supplier-release.aab" "$D/ANDAK-Supplier-v0.7.0-GATE6-UNSIGNED.aab"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          cp /tmp/source.zip "$D/ANDAK-Supplier-v0.7.0-Gate6-Source.zip"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$D/ANDAK-Supplier-v0.7.0-GATE6-ALIGNED-UNSIGNED.apk" > "$D/aapt-badging.txt"
          printf '%s\n'             'ANDAK Supplier Gate6 v0.7.0'             'applicationId=com.fush.market.supplier'             'versionCode=8'             'versionName=0.7.0'             'Offline-first Sync Queue=READY'             'Notifications=READY'             'Backend contract scope=supplier:self'             'Real backend connection=NOT CONFIGURED'             'Build debug/release/AAB=PASS'             > "$D/GATE6-PACKAGE-RESULT.txt"
          (cd "$D" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v0.7.0-GATE6-PACKAGE-PASS
          path: dist/
          if-no-files-found: error
          retention-days: 7
