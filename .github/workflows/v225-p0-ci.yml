name: V225 P0 Final Gate

on:
  push:
    branches: [ci-v225-p0-20260913]
    paths:
      - '.github/workflows/v225-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Download v225 source input
        shell: bash
        env:
          SHARE_ID: V345MMPM01dw
          EXPECTED_SHA256: 48ca61b7fd6059c87a0e9b442c3a9ac3552a12722b18e6d0f7fe08e7f435f0d6
        run: |
          set -euxo pipefail
          API_BASE='https://api.firestorage.ai/dev/file'
          curl -fLsS --retry 3 "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" -o files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('files.json',encoding='utf-8'))
          files=d.get('files') or []
          if len(files) != 1:
              raise SystemExit(f'expected 1 file, got {len(files)}')
          print(files[0]['fileId'])
          PY
          )
          curl -fLsS --retry 3 -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          d=json.load(open('download.json',encoding='utf-8'))
          print(d['downloadUrl'])
          PY
          )
          curl -fL --retry 3 "$DOWNLOAD_URL" -o source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null

      - name: Extract source
        shell: bash
        run: |
          mkdir src
          unzip -q source.zip -d src
          test -f src/settings.gradle.kts
          test -f src/gradle/wrapper/gradle-wrapper.jar

      - name: Backend source regression
        working-directory: src
        run: python3 tools/test_v225_backend_hardening.py | tee ../v225-backend-regression.log

      - name: Exact Android final gate
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test lint assembleRelease bundleRelease 2>&1 | tee ../v225-gradle-final-gate.log

      - name: Collect unsigned release outputs
        if: success()
        shell: bash
        run: |
          mkdir -p ci-output
          APK=$(find src/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          AAB=$(find src/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" ci-output/FUSH_ERP_Mobile_v225-P0-UNSIGNED.apk
          cp "$AAB" ci-output/FUSH_ERP_Mobile_v225-P0-UNSIGNED.aab
          cp v225-gradle-final-gate.log ci-output/
          cp v225-backend-regression.log ci-output/
          sha256sum ci-output/* > ci-output/V225_CI_SHA256SUMS.txt

      - name: Upload successful build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v225-P0-CI-unsigned
          path: ci-output/*
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v225-P0-CI-failure-diagnostics
          path: |
            files.json
            download.json
            v225-gradle-final-gate.log
            v225-backend-regression.log
          if-no-files-found: ignore
