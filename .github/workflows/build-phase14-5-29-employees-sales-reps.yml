name: Build Fush ERP Phase 14.5.29 Employees Sales Reps

on:
  push:
    branches: [agent/phase14-5-24-party-subledger-vouchers]
    paths:
      - '.github/workflows/build-phase14-5-29-employees-sales-reps.yml'
      - 'phase14_5_29_patch.gz.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download successful Phase 14.5.28 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.28-Linked-Output-Packaging-Correction-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31846497287

      - name: Restore Phase 14.5.28 source and apply Phase 14.5.29
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.28-Linked-Output-Packaging-Correction-Source.zip
          base64 -d phase14_5_29_patch.gz.b64 | gunzip > /tmp/phase14_5_29.patch
          cd FushERP_Mobile_Phase5
          patch --dry-run -p4 < /tmp/phase14_5_29.patch
          patch -p4 < /tmp/phase14_5_29.patch
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 68' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.29-employees-sales-representatives"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 26' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'SalesRepresentativeEntity::class' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_25_26' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'salesRepId' app/src/main/java/com/fush/erp/data/entity/SalesEntities.kt
          grep -q 'salesRepId' app/src/main/java/com/fush/erp/data/entity/PartyEntities.kt
          grep -q '"مناديب المبيعات" -> SalesRepresentativesScreen' app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify package and Room schema 26
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=FushERP_Mobile_Phase5/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$MANIFEST"
          grep -q 'package="com.fush.erp.recovery"' "$MANIFEST"
          grep -q 'android:authorities="com.fush.erp.recovery.files"' "$MANIFEST"
          SCHEMA=FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/26.json
          test -f "$SCHEMA"
          grep -q 'sales_representatives' "$SCHEMA"
          grep -q 'salesRepId' "$SCHEMA"
          grep -q 'salesRepNameSnapshot' "$SCHEMA"
          grep -q 'salesRepRatePct' "$SCHEMA"

      - name: SQLite migration smoke test 25 to 26
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sqlite3, pathlib
          schema_path = pathlib.Path('FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/25.json')
          schema = json.loads(schema_path.read_text())
          conn = sqlite3.connect(':memory:')
          conn.execute('PRAGMA foreign_keys=ON')
          for e in schema['database']['entities']:
              sql = e['createSql'].replace('${TABLE_NAME}', e['tableName'])
              conn.execute(sql)
          for e in schema['database']['entities']:
              for idx in e.get('indices', []):
                  sql = idx.get('createSql')
                  if sql:
                      conn.execute(sql.replace('${TABLE_NAME}', e['tableName']))
          stmts = [
              '''CREATE TABLE IF NOT EXISTS sales_representatives (id INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, code TEXT NOT NULL, employeeId INTEGER, repType TEXT NOT NULL, fullNameAr TEXT NOT NULL, fullNameEn TEXT NOT NULL, phone TEXT NOT NULL, territory TEXT NOT NULL, commissionRatePct REAL NOT NULL, status TEXT NOT NULL, notes TEXT NOT NULL, createdBy INTEGER NOT NULL, createdAt INTEGER NOT NULL, updatedAt INTEGER NOT NULL, FOREIGN KEY(employeeId) REFERENCES employees(id) ON UPDATE NO ACTION ON DELETE SET NULL)''',
              'CREATE UNIQUE INDEX IF NOT EXISTS index_sales_representatives_code ON sales_representatives(code)',
              'CREATE UNIQUE INDEX IF NOT EXISTS index_sales_representatives_employeeId ON sales_representatives(employeeId)',
              'CREATE INDEX IF NOT EXISTS index_sales_representatives_status ON sales_representatives(status)',
              'CREATE INDEX IF NOT EXISTS index_sales_representatives_territory ON sales_representatives(territory)',
              'ALTER TABLE customers ADD COLUMN salesRepId INTEGER REFERENCES sales_representatives(id) ON UPDATE NO ACTION ON DELETE SET NULL',
              'CREATE INDEX IF NOT EXISTS index_customers_salesRepId ON customers(salesRepId)',
              'ALTER TABLE sales_invoices ADD COLUMN salesRepId INTEGER REFERENCES sales_representatives(id) ON UPDATE NO ACTION ON DELETE SET NULL',
              "ALTER TABLE sales_invoices ADD COLUMN salesRepNameSnapshot TEXT NOT NULL DEFAULT ''",
              'ALTER TABLE sales_invoices ADD COLUMN salesRepRatePct REAL NOT NULL DEFAULT 10.0',
              'CREATE INDEX IF NOT EXISTS index_sales_invoices_salesRepId ON sales_invoices(salesRepId)',
              'ALTER TABLE sales_commissions ADD COLUMN salesRepId INTEGER REFERENCES sales_representatives(id) ON UPDATE NO ACTION ON DELETE SET NULL',
              'CREATE INDEX IF NOT EXISTS index_sales_commissions_salesRepId ON sales_commissions(salesRepId)',
              'ALTER TABLE party_vouchers ADD COLUMN salesRepId INTEGER REFERENCES sales_representatives(id) ON UPDATE NO ACTION ON DELETE RESTRICT',
              'CREATE INDEX IF NOT EXISTS index_party_vouchers_salesRepId ON party_vouchers(salesRepId)',
          ]
          for sql in stmts: conn.execute(sql)
          assert 'salesRepId' in [r[1] for r in conn.execute('PRAGMA table_info(customers)')]
          assert 'salesRepId' in [r[1] for r in conn.execute('PRAGMA table_info(sales_invoices)')]
          assert 'salesRepNameSnapshot' in [r[1] for r in conn.execute('PRAGMA table_info(sales_invoices)')]
          assert 'salesRepRatePct' in [r[1] for r in conn.execute('PRAGMA table_info(sales_invoices)')]
          assert 'salesRepId' in [r[1] for r in conn.execute('PRAGMA table_info(sales_commissions)')]
          assert 'salesRepId' in [r[1] for r in conn.execute('PRAGMA table_info(party_vouchers)')]
          fk_customers = list(conn.execute('PRAGMA foreign_key_list(customers)'))
          assert any(r[2]=='sales_representatives' and r[3]=='salesRepId' for r in fk_customers)
          fk_vouchers = list(conn.execute('PRAGMA foreign_key_list(party_vouchers)'))
          assert any(r[2]=='sales_representatives' and r[3]=='salesRepId' for r in fk_vouchers)
          print('Migration 25->26 SQLite smoke test PASS')
          PY

      - name: Zipalign release APK and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-29-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-29-output/FushERP-Phase14.5.29-Employees-Sales-Reps-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-29-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-29-output/lib/apksigner.jar
          chmod +x phase14-5-29-output/apksigner
          zip -qr phase14-5-29-output/FushERP-Mobile-Phase14.5.29-Employees-Sales-Reps-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.29 — Employees & Sales Representatives' \
            'Package: com.fush.erp.recovery' \
            'Version code: 68' \
            'Room schema: 26; migration 25->26 included' \
            'Employees: dedicated section, profile, edit, training, authorizations, vouchers, audit.' \
            'Sales reps: stable REP ID, internal/external type, territory, phone, default commission rate.' \
            'Sales reps: customer assignment, invoice snapshot, collections, returns, commissions, payouts, vouchers, audit.' \
            'Account 2200 links employees; account 2300 links sales representatives.' \
            'Legacy text-only sales rep names are preserved and not guessed/migrated to IDs.' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Room schema 26: PASS' \
            'SQLite migration smoke test: PASS' \
            'Zipalign: PASS' \
            > phase14-5-29-output/FushERP-Phase14.5.29-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.29-Employees-Sales-Reps-Build
          path: phase14-5-29-output/
          if-no-files-found: error
          retention-days: 7
