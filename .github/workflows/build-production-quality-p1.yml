name: Build Production Quality P1

on:
  push:
    branches: [fush/production-quality]
    paths:
      - '.github/workflows/build-production-quality-p1.yml'
      - 'production_quality_p1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-p1-initial:
    runs-on: ubuntu-latest
    env:
      CENTRAL_HEAD: 2cb8da801fc54aec8c1f0d6a83588f097ca85117
      CENTRAL_TREE: 7733c6570357eb813f7e05e5093752ea26788749
      PATCH_SHA256: 6efe1a09dc54fa1732285646f27963e73814e71d57480384066e6976ffa43fcb
    steps:
      - name: Checkout production-quality branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Restore exact initial Central source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CENTRAL_HEAD}^{commit}"
          mkdir -p central-archive final-repo
          git archive "$CENTRAL_HEAD" central_source | tar -x -C central-archive
          rsync -a central-archive/central_source/ final-repo/
          cd final-repo
          git init -q
          git config user.email production-quality@fush.local
          git config user.name "FUSH Production Quality"
          git add -A
          git commit -qm central-baseline
          TREE=$(git write-tree)
          echo "CENTRAL_SOURCE_TREE=$TREE"
          test "$TREE" = "$CENTRAL_TREE"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts

      - name: Verify and apply exact P1 patch
        shell: bash
        run: |
          set -euo pipefail
          echo "${PATCH_SHA256}  production_quality_p1/production-quality-p1.patch" | sha256sum -c -
          cd final-repo
          git apply --check ../production_quality_p1/production-quality-p1.patch
          git apply ../production_quality_p1/production-quality-p1.patch
          git diff --check
          git add -A
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            app/src/main/java/com/fush/erp/domain/ProductionIssueLotAllocator.kt
            app/src/main/java/com/fush/erp/domain/ProductionService.kt
            app/src/test/java/com/fush/erp/domain/ProductionIssueLotAllocatorTest.kt
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          grep -q 'ProductionIssueLotAllocator.allocate' app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'referenceType = "PRODUCTION_ISSUE"' app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'quantityBase = -allocation.quantityBase' app/src/main/java/com/fush/erp/domain/ProductionService.kt

      - name: P1 domain tests
        working-directory: final-repo
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.fush.erp.domain.ProductionIssueLotAllocatorTest' \
            --tests 'com.fush.erp.domain.ProductionMathTest'

      - name: Full unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Room and destructive guards
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! git diff --cached --name-only | grep -E 'FushDatabase.kt|Migrations.kt|SecurityMigrations.kt|app/schemas/'
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          ! grep -R -E -q 'DROP TABLE|DELETE FROM sqlite_master' app/src/main/java/com/fush/erp/data

      - name: Package initial branch-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          mkdir -p ../output
          cp "$APK" ../output/FushERP-ProductionQuality-P1-initial-branch-only-unsigned.apk
          git diff --cached --binary > ../output/production-quality-p1-exact.patch
          sha256sum ../output/* > ../output/SHA256SUMS.txt

      - name: Upload initial branch-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-ProductionQuality-P1-Initial
          path: output/*
          if-no-files-found: error
