name: Build Production Quality P1

on:
  push:
    branches: [fush/production-quality]
    paths:
      - '.github/workflows/build-production-quality-p1.yml'
      - 'production_quality_p1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-p1-final:
    runs-on: ubuntu-latest
    env:
      CENTRAL_HEAD: ddae764a236cb1916a46e194ccb2d3c24ca6b919
      CENTRAL_TREE: 30b028b75d6463c07afd0419429f53c7937fabb1
      PATCH_SHA256: fe62719a8b1d44b133145ef552329a6c3c9c7d3fa93fa619289170f2b0abae8a
    steps:
      - name: Checkout production-quality branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Restore exact post-Sales Central source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CENTRAL_HEAD}^{commit}"
          mkdir -p central-archive final-repo
          git archive "$CENTRAL_HEAD" central_source | tar -x -C central-archive
          rsync -a central-archive/central_source/ final-repo/
          cd final-repo
          git init -q
          git config user.email production-quality@fush.local
          git config user.name "FUSH Production Quality"
          git add -A
          git commit -qm central-baseline
          TREE=$(git write-tree)
          echo "CENTRAL_SOURCE_TREE=$TREE"
          test "$TREE" = "$CENTRAL_TREE"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts

      - name: Verify and apply same exact P1 patch
        shell: bash
        run: |
          set -euo pipefail
          echo "${PATCH_SHA256}  production_quality_p1/production-quality-p1.patch" | sha256sum -c -
          cd final-repo
          git apply --check ../production_quality_p1/production-quality-p1.patch
          git apply ../production_quality_p1/production-quality-p1.patch
          git diff --check
          git add -A
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            app/src/main/java/com/fush/erp/domain/ProductionIssueLotAllocator.kt
            app/src/main/java/com/fush/erp/domain/ProductionService.kt
            app/src/test/java/com/fush/erp/domain/ProductionIssueLotAllocatorTest.kt
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          grep -q 'ProductionIssueLotAllocator.allocate' app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'referenceType = "PRODUCTION_ISSUE"' app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'quantityBase = -allocation.quantityBase' app/src/main/java/com/fush/erp/domain/ProductionService.kt

      - name: Targeted Production Quality tests
        working-directory: final-repo
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.fush.erp.domain.ProductionIssueLotAllocatorTest' \
            --tests 'com.fush.erp.domain.ProductionMathTest' \
            --tests 'com.fush.erp.domain.StockLedgerInvariantTest'

      - name: Accounting integration regression
        working-directory: final-repo
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.fush.erp.domain.AccountingIntegrationContractTest' \
            --tests 'com.fush.erp.domain.AccountingP1IntegrityPolicyTest'

      - name: Full unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Room migration preservation and no-destructive checks
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! git diff --cached --name-only | grep -E 'FushDatabase.kt|Migrations.kt|SecurityMigrations.kt|AppContainer.kt|app/schemas/'
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          ! grep -E -q 'DROP TABLE|DELETE FROM sqlite_master|fallbackToDestructiveMigration' ../production_quality_p1/production-quality-p1.patch

      - name: Zipalign verification
        shell: bash
        run: |
          set -euo pipefail
          APK=final-repo/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Package final branch-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          mkdir -p ../output
          cp "$APK" ../output/FushERP-ProductionQuality-P1-post-sales-central-unsigned.apk
          git diff --cached --binary > ../output/production-quality-p1-exact.patch
          sha256sum ../output/* > ../output/SHA256SUMS.txt

      - name: Upload final branch-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-ProductionQuality-P1-PostSales-Handoff
          path: output/*
          if-no-files-found: error
