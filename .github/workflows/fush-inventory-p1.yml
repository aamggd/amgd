name: FUSH Inventory P1 Source Identity

on:
  push:
    branches: [fush/inventory]
    paths:
      - '.github/workflows/fush-inventory-p1.yml'
      - 'inventory_p1/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CENTRAL_COMMIT: ddae764a236cb1916a46e194ccb2d3c24ca6b919
  CENTRAL_SOURCE_TREE: 30b028b75d6463c07afd0419429f53c7937fabb1
  APP_ID: com.fush.erp.recovery
  BASE_ROOM: '35'
  P1_ROOM: '36'

jobs:
  validate-inventory-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout inventory branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Central baseline ancestry and exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CENTRAL_COMMIT^{commit}"
          git merge-base --is-ancestor "$CENTRAL_COMMIT" HEAD
          test "$(git rev-parse HEAD:central_source)" = "$CENTRAL_SOURCE_TREE"
          grep -q 'applicationId = "com.fush.erp.recovery"' central_source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f central_source/app/schemas/com.fush.erp.data.FushDatabase/35.json
          ! grep -R -q 'fallbackToDestructiveMigration' central_source/app/src/main/java central_source/app/build.gradle.kts
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt

      - name: Prepare exact Central worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' central_source/ work/
          cd work
          git init -q
          git config user.email inventory-p1@fush.local
          git config user.name 'FUSH Inventory P1'
          git add -A
          git commit -qm baseline-central-35
          test "$(git write-tree)" = "$CENTRAL_SOURCE_TREE"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Apply Inventory P1 only
        shell: bash
        run: |
          set -euo pipefail
          python inventory_p1/apply_p1.py work
          python - <<'PY'
          from pathlib import Path
          path = Path('work/app/src/main/java/com/fush/erp/data/Migrations.kt')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          cd work
          git diff --check
          grep -q 'FUSH_DB_SCHEMA_VERSION = 36' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_35_36_INVENTORY_P1_PROVISIONAL' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_35_36_INVENTORY_P1_PROVISIONAL' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'sourceKey' app/src/main/java/com/fush/erp/data/entity/PurchaseEntities.kt
          grep -q 'class StockMovementWriter' app/src/main/java/com/fush/erp/domain/StockMovementWriter.kt
          grep -q 'object StockMovementPolicy' app/src/main/java/com/fush/erp/domain/StockMovementPolicy.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          ! grep -R -E -q 'deleteDatabase\(|DROP TABLE stock_movements|DELETE FROM stock_movements' app/src/main/java/com/fush/erp/data/Migrations.kt app/src/main/java/com/fush/erp/data/AppContainer.kt
          direct=$(grep -R -l '\.insertMovement(' app/src/main/java --include='*.kt' || true)
          test -z "$direct"

      - name: Verify P1 changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git diff --name-only | sort > /tmp/actual
          cat > /tmp/allowed <<'EOF'
          app/src/main/java/com/fush/erp/data/AppContainer.kt
          app/src/main/java/com/fush/erp/data/FushDatabase.kt
          app/src/main/java/com/fush/erp/data/Migrations.kt
          app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          app/src/main/java/com/fush/erp/data/entity/PurchaseEntities.kt
          app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          app/src/main/java/com/fush/erp/domain/InventoryService.kt
          app/src/main/java/com/fush/erp/domain/ProductionService.kt
          app/src/main/java/com/fush/erp/domain/PurchaseService.kt
          app/src/main/java/com/fush/erp/domain/SalesService.kt
          EOF
          sed -i 's/^          //' /tmp/allowed
          printf '%s\n' \
            app/src/main/java/com/fush/erp/domain/StockMovementPolicy.kt \
            app/src/main/java/com/fush/erp/domain/StockMovementWriter.kt \
            app/src/test/java/com/fush/erp/domain/StockMovementPolicyTest.kt >> /tmp/allowed
          sort -u /tmp/allowed -o /tmp/allowed
          find app/src/main/java/com/fush/erp/domain app/src/test/java/com/fush/erp/domain -type f \( -name 'StockMovementPolicy.kt' -o -name 'StockMovementWriter.kt' -o -name 'StockMovementPolicyTest.kt' \) | sort >> /tmp/actual
          sort -u /tmp/actual -o /tmp/actual
          echo 'Changed files:'; cat /tmp/actual
          diff -u /tmp/allowed /tmp/actual
          ! git diff | grep -E 'factorToBase.*history|genealogy|Inventory count: snapshot|historical cost suite'

      - name: Migration and data preservation smoke
        run: python inventory_p1/migration_smoke.py

      - name: Targeted Inventory P1 tests
        working-directory: work
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.fush.erp.domain.StockMovementPolicyTest --tests com.fush.erp.domain.StockLedgerInvariantTest

      - name: Full Unit tests
        working-directory: work
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work
        run: gradle --no-daemon :app:assembleRelease

      - name: Post-build Room and release safety
        shell: bash
        run: |
          set -euo pipefail
          cd work
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 36' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          test -f app/schemas/com.fush.erp.data.FushDatabase/36.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          zipalign -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee ../inventory_p1-apk.sha256

      - name: Generate exact P1 patch and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory_p1_generated
          cd work
          git add -N app/src/main/java/com/fush/erp/domain/StockMovementPolicy.kt \
                     app/src/main/java/com/fush/erp/domain/StockMovementWriter.kt \
                     app/src/test/java/com/fush/erp/domain/StockMovementPolicyTest.kt \
                     app/schemas/com.fush.erp.data.FushDatabase/36.json
          git diff --binary > ../inventory_p1_generated/inventory-p1.patch
          test -s ../inventory_p1_generated/inventory-p1.patch
          sha256sum ../inventory_p1_generated/inventory-p1.patch | tee ../inventory_p1_generated/inventory-p1.patch.sha256
          cp app/schemas/com.fush.erp.data.FushDatabase/36.json ../inventory_p1_generated/36.json
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../inventory_p1_generated/FushERP-Inventory-P1-unsigned.apk
          cd ..
          cp inventory_p1-apk.sha256 inventory_p1_generated/apk.sha256
          cat > inventory_p1_generated/VALIDATION.txt <<EOF
          Inventory P1 validation: SUCCESS
          Baseline commit: $CENTRAL_COMMIT
          Baseline source tree: $CENTRAL_SOURCE_TREE
          Application ID: $APP_ID
          Base Room: $BASE_ROOM
          Branch-only provisional Room: $P1_ROOM
          Targeted tests: PASS
          Full Unit: PASS
          Release: PASS
          Migration/data preservation: PASS
          Destructive migration: absent
          P2+: not started
          EOF

      - name: Upload exact handoff candidate
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Inventory-P1-Candidate
          path: inventory_p1_generated/
          if-no-files-found: error
