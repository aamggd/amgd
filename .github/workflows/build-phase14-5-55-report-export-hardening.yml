name: Build Fush ERP Phase 14.5.55 Report Export Hardening

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-55-report-export-hardening.yml'
      - 'phase14_5_55_report_export_hardening/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.54 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-PDF-Text-Layout-Fix-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31912603712

      - name: Restore Phase 14.5.54 and apply Phase 14.5.55 report export hardening
        shell: bash
        run: |
          set -euo pipefail
          echo 'b1e9153016c2795700c6b0e54abf1be1176ab4da689dd194e17761442f2660c3  phase14_5_55_report_export_hardening/payload/p55-part00.txt' | sha256sum -c -
          echo '7d5438a96be33d4a473c2885cf5f89894ea51d534910c013e72cb7c6d201b447  phase14_5_55_report_export_hardening/payload/p55-part01.txt' | sha256sum -c -
          echo '92390799cc04ee85f481eeea40a9dd5905f1c20cfcdb3563ee8bb8f77d4cae8d  phase14_5_55_report_export_hardening/payload/p55-part02.txt' | sha256sum -c -
          echo '02ed6e302536cc0271f66289716521d1d51506349318db4ee2278921b23f4672  phase14_5_55_report_export_hardening/payload/p55-part03.txt' | sha256sum -c -
          cat phase14_5_55_report_export_hardening/payload/p55-part*.txt > phase14_5_55_report_export_hardening/p55.full.b64
          echo '759c45d60504fa7ae5818af842bf386a7c7e6bad931d9133784fd4469d03634e  phase14_5_55_report_export_hardening/p55.full.b64' | sha256sum -c -
          base64 -d phase14_5_55_report_export_hardening/p55.full.b64 | gzip -dc > phase14_5_55_report_export_hardening/01_report_export_hardening.patch
          echo '4d06fc137031b7c606605ee39e7af2db22e4a14bcf4971acdff2be34782493f2  phase14_5_55_report_export_hardening/01_report_export_hardening.patch' | sha256sum -c -
          unzip -q previous-build/FushERP-Mobile-Phase14.5.54-PDF-Text-Layout-Fix-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build .kotlin
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.54
          git apply --check ../phase14_5_55_report_export_hardening/01_report_export_hardening.patch
          git apply ../phase14_5_55_report_export_hardening/01_report_export_hardening.patch
          git diff --check HEAD
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 94' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.55-report-export-hardening"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          test -f app/src/main/java/com/fush/erp/ui/export/ReportExportLayout.kt
          test -f app/src/test/java/com/fush/erp/ui/export/ReportExportLayoutTest.kt
          test -f app/src/test/java/com/fush/erp/ui/export/ReportSpreadsheetExportTest.kt
          grep -q 'ReportExportLayout.requiresLandscape' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          grep -q 'showGridLines=\\"0\\"' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          grep -q '<headerFooter>' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 94' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.55-report-export-hardening"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-55-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-55-output/FushERP-Phase14.5.55-Report-Export-Hardening-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-55-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-55-output/lib/apksigner.jar
          chmod +x phase14-5-55-output/apksigner
          zip -qr phase14-5-55-output/FushERP-Mobile-Phase14.5.55-Report-Export-Hardening-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.55 — Professional Report Export Hardening' \
            'Base verified source: Phase 14.5.54 PDF Text Layout Fix' \
            'Branch: fush/reports-printing' \
            'Smart portrait/landscape selection: PASS' \
            'Adaptive PDF column widths: PASS' \
            'Orphan table heading prevention: PASS' \
            'Professional date/code/amount alignment: PASS' \
            'Long-text hard wrapping and clipping retained: PASS' \
            'Professional XLSX table styles and borders: PASS' \
            'Dynamic XLSX column widths: PASS' \
            'Merged XLSX section headings: PASS' \
            'XLSX print footer and page numbering: PASS' \
            'XLSX generated XML validity regression test: PASS' \
            'Accounting posting logic unchanged: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 94' \
            'Version name: 0.15.4.55-report-export-hardening' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Room/Compose compilation: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-55-output/FushERP-Phase14.5.55-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.55-Report-Export-Hardening-Build
          path: phase14-5-55-output/
          if-no-files-found: error
          retention-days: 7
