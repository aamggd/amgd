name: FAZ Yemen v27 Emulator Upgrade Smoke

on:
  push:
    branches: [faz-yemen-v24-ci]

permissions:
  contents: read

jobs:
  upgrade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed v26 and v27 APKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir browser && cd browser
          npm init -y >/dev/null
          npm install playwright@latest >/dev/null
          npx playwright install chromium >/dev/null
          cat > download.mjs <<'JS'
          import { chromium } from 'playwright';
          const [url, out] = process.argv.slice(2);
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(8000);
          const candidates = [
            page.getByRole('button', {name:/ダウンロード|download/i}),
            page.getByRole('link', {name:/ダウンロード|download/i}),
            page.locator('a[download]'),
            page.locator('a[href*="download"]')
          ];
          let done=false;
          for (const loc of candidates) {
            if (!(await loc.count())) continue;
            try {
              const [download] = await Promise.all([
                page.waitForEvent('download', {timeout:30000}),
                loc.first().click({timeout:10000})
              ]);
              await download.saveAs(out);
              done=true;
              break;
            } catch (e) { console.log('candidate failed', String(e)); }
          }
          if (!done) throw new Error('No downloadable file control found for '+url);
          await browser.close();
          JS
          node download.mjs 'https://firestorage.ai/ja/f/Sz3_7jNFFP81' '../v26.apk'
          node download.mjs 'https://firestorage.ai/ja/f/-EDZXwOaTN2B' '../v27.apk'
          cd ..
          echo 'eb5304158097443b23a24518488e240fd0d2e7e9d310fa6893e49cb6594c5183  v26.apk' | sha256sum -c -
          echo 'cfbcc6b6f8f88ac5d1cbe423c39384e58cbe54caacc01c28704fdd0f065c6b71  v27.apk' | sha256sum -c -

      - name: Prepare upgrade smoke script
        shell: bash
        run: |
          cat > smoke-v27.sh <<'BASH'
          #!/usr/bin/env bash
          set -euxo pipefail
          adb devices -l
          adb install v26.apk | tee v26-install.txt
          BEFORE_UID="$(adb shell dumpsys package com.faz.yemen | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          test -n "$BEFORE_UID"
          echo "$BEFORE_UID" > before_uid.txt
          adb logcat -c
          adb shell am start -W -n com.faz.yemen/com.fush.erp.MainActivity | tee v26-start.txt
          sleep 15
          PID="$(adb shell pidof com.faz.yemen | tr -d '\r')"
          test -n "$PID"
          adb logcat -d -v threadtime AndroidRuntime:E '*:S' > v26-androidruntime.log || true
          if grep -q 'Process: com.faz.yemen' v26-androidruntime.log; then cat v26-androidruntime.log; exit 1; fi
          adb shell dumpsys package com.faz.yemen | grep -E 'versionCode=26|versionName=1.0.25-faz-yemen-barcode-gate1'
          adb install -r v27.apk | tee upgrade-install.txt
          AFTER_UID="$(adb shell dumpsys package com.faz.yemen | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          test -n "$AFTER_UID"
          test "$BEFORE_UID" = "$AFTER_UID"
          adb shell dumpsys package com.faz.yemen | tee v27-package.txt | grep -E 'versionCode=27|versionName=1.0.26-faz-yemen-sales-structure-gate2'
          adb shell am force-stop com.faz.yemen
          adb logcat -c
          adb shell am start -W -n com.faz.yemen/com.fush.erp.MainActivity | tee v27-start.txt
          sleep 20
          PID="$(adb shell pidof com.faz.yemen | tr -d '\r')"
          test -n "$PID"
          adb logcat -d -v threadtime AndroidRuntime:E '*:S' > v27-androidruntime.log || true
          if grep -q 'Process: com.faz.yemen' v27-androidruntime.log; then cat v27-androidruntime.log; exit 1; fi
          echo "UPGRADE_SMOKE=PASS" | tee smoke-result.txt
          echo "UID_PRESERVED=$AFTER_UID" | tee -a smoke-result.txt
          BASH
          chmod +x smoke-v27.sh
          bash -n smoke-v27.sh

      - name: Run v26 to v27 upgrade smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./smoke-v27.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAZ-Yemen-v27-Emulator-Smoke-Evidence
          path: |
            v26-install.txt
            v26-start.txt
            v26-androidruntime.log
            upgrade-install.txt
            v27-package.txt
            v27-start.txt
            v27-androidruntime.log
            before_uid.txt
            smoke-result.txt
          if-no-files-found: warn
