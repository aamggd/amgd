name: FAZ Yemen v25 Emulator Upgrade Smoke

on:
  push:
    branches: [faz-yemen-v24-ci]

permissions:
  contents: read

jobs:
  upgrade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed v24 and v25 APKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir browser && cd browser
          npm init -y >/dev/null
          npm install playwright@latest >/dev/null
          npx playwright install chromium >/dev/null
          cat > download.mjs <<'JS'
          import { chromium } from 'playwright';
          const [url, out] = process.argv.slice(2);
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(8000);
          const candidates = [
            page.getByRole('button', {name:/ダウンロード|download/i}),
            page.getByRole('link', {name:/ダウンロード|download/i}),
            page.locator('a[download]'),
            page.locator('a[href*="download"]')
          ];
          let done=false;
          for (const loc of candidates) {
            if (!(await loc.count())) continue;
            try {
              const [download] = await Promise.all([
                page.waitForEvent('download', {timeout:30000}),
                loc.first().click({timeout:10000})
              ]);
              await download.saveAs(out);
              done=true;
              break;
            } catch (e) { console.log('candidate failed', String(e)); }
          }
          if (!done) throw new Error('No downloadable file control found for '+url);
          await browser.close();
          JS
          node download.mjs 'https://firestorage.ai/ja/f/V6FaXXCk1wff' '../v24.apk'
          node download.mjs 'https://firestorage.ai/ja/f/XHoetf5fE_Wk' '../v25.apk'
          cd ..
          echo '4cec674639ac3458bd5f2a27f7ee9a8fe833f5d2ad95bedef5cd0d7ffa20910d  v24.apk' | sha256sum -c -
          echo 'bcda51847058a420c499bd616b6aa5d4f28d4c6c34ce7cc01d03a5c36f929bcc  v25.apk' | sha256sum -c -

      - name: Run v24 to v25 upgrade smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash -euxo pipefail <<'BASH'
            adb devices -l
            adb install v24.apk | tee v24-install.txt
            BEFORE_UID="$(adb shell dumpsys package com.faz.yemen | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            test -n "$BEFORE_UID"
            echo "$BEFORE_UID" > before_uid.txt
            adb logcat -c
            adb shell am start -W -n com.faz.yemen/com.fush.erp.MainActivity | tee v24-start.txt
            sleep 15
            PID="$(adb shell pidof com.faz.yemen | tr -d '\r')"
            test -n "$PID"
            adb logcat -d -v threadtime AndroidRuntime:E '*:S' > v24-androidruntime.log || true
            if grep -q 'Process: com.faz.yemen' v24-androidruntime.log; then cat v24-androidruntime.log; exit 1; fi
            adb shell dumpsys package com.faz.yemen | grep -E 'versionCode=24|versionName=1.0.23-faz-yemen-catalog'
            adb install -r v25.apk | tee upgrade-install.txt
            AFTER_UID="$(adb shell dumpsys package com.faz.yemen | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
            test "$BEFORE_UID" = "$AFTER_UID"
            adb shell dumpsys package com.faz.yemen | tee v25-package.txt | grep -E 'versionCode=25|versionName=1.0.24-faz-yemen-modal-scroll-hotfix'
            adb shell am force-stop com.faz.yemen
            adb logcat -c
            adb shell am start -W -n com.faz.yemen/com.fush.erp.MainActivity | tee v25-start.txt
            sleep 20
            PID="$(adb shell pidof com.faz.yemen | tr -d '\r')"
            test -n "$PID"
            adb logcat -d -v threadtime AndroidRuntime:E '*:S' > v25-androidruntime.log || true
            if grep -q 'Process: com.faz.yemen' v25-androidruntime.log; then cat v25-androidruntime.log; exit 1; fi
            echo "UPGRADE_SMOKE=PASS" | tee smoke-result.txt
            echo "UID_PRESERVED=$AFTER_UID" | tee -a smoke-result.txt
            BASH

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAZ-Yemen-v25-Emulator-Smoke-Evidence
          path: |
            v24-install.txt
            v24-start.txt
            v24-androidruntime.log
            upgrade-install.txt
            v25-package.txt
            v25-start.txt
            v25-androidruntime.log
            before_uid.txt
            smoke-result.txt
          if-no-files-found: warn
