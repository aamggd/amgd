name: Build Fush ERP Phase 14.5.49 Treasury Reports

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-49-treasury-reports.yml'
      - 'phase14_5_49_treasury_reports/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.48 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.48-Expense-Analysis-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31867194499

      - name: Restore Phase 14.5.48 and apply Phase 14.5.49 treasury patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.48-Expense-Analysis-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.48
          base64 -d ../phase14_5_49_treasury_reports/patches/01_treasury_reports.patch.gz.b64 | gzip -dc > ../phase14_5_49_treasury_reports/01_treasury_reports.patch
          echo '678411474f27eb21f87b5d086f86b8b7fe3bf0d2aec33c5ec9097c990c2899fa  ../phase14_5_49_treasury_reports/01_treasury_reports.patch' | sha256sum -c -
          git apply --check ../phase14_5_49_treasury_reports/01_treasury_reports.patch
          git apply ../phase14_5_49_treasury_reports/01_treasury_reports.patch
          git diff --check HEAD
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 88' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.49-treasury-reports"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          test -f app/src/main/java/com/fush/erp/domain/TreasuryReportMath.kt
          test -f app/src/test/java/com/fush/erp/domain/TreasuryReportMathTest.kt
          grep -q '"الخزائن والبنوك"' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          grep -q 'treasuryMovementsThrough' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q "original.sourceType = 'TREASURY_TRANSFER'" app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 88' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.49-treasury-reports"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-49-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-49-output/FushERP-Phase14.5.49-Treasury-Reports-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-49-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-49-output/lib/apksigner.jar
          chmod +x phase14-5-49-output/apksigner
          zip -qr phase14-5-49-output/FushERP-Mobile-Phase14.5.49-Treasury-Reports-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.49 — Treasury & Bank Movement Reports' \
            'Base verified source: Phase 14.5.48 Expense Analysis' \
            'Branch: fush/reports-printing' \
            'Per-treasury opening / external in / external out / transfer in / transfer out / closing: PASS' \
            'Internal transfers excluded from external cash flow: PASS' \
            'Reversed treasury transfers remain classified as internal: PASS' \
            'Detailed treasury movement report: PASS' \
            'Professional PDF/XLSX export integration: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 88' \
            'Version name: 0.15.4.49-treasury-reports' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Room/Compose compilation: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-49-output/FushERP-Phase14.5.49-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.49-Treasury-Reports-Build
          path: phase14-5-49-output/
          if-no-files-found: error
          retention-days: 7
