name: Apply customer statement UI wiring

on:
  push:
    branches:
      - agent/customer-statement-pdf-20260821
    paths:
      - '.github/workflows/apply-customer-statement-ui.yml'

permissions:
  contents: write

jobs:
  apply-source-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source wiring
        shell: python
        run: |
          from pathlib import Path

          party = Path('central_source/app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt')
          text = party.read_text(encoding='utf-8')
          old = '            1 -> customerLedgerItems(running)'
          new = '''            1 -> {
              item {
                  CustomerStatementExportPanel(
                      customer = customer,
                      events = events,
                      invoices = invoices,
                      receipts = receipts,
                      returns = returns,
                      vouchers = vouchers,
                      modifier = Modifier.fillMaxWidth(),
                  )
              }
              customerLedgerItems(running)
          }'''
          if 'CustomerStatementExportPanel(' not in text:
              if old not in text:
                  raise SystemExit('Customer ledger wiring anchor was not found')
              text = text.replace(old, new, 1)
              party.write_text(text, encoding='utf-8')

          export = Path('central_source/app/src/main/java/com/fush/erp/ui/screens/CustomerStatementExport.kt')
          source = export.read_text(encoding='utf-8')
          required = 'import androidx.compose.foundation.layout.weight\n'
          anchor = 'import androidx.compose.foundation.layout.padding\n'
          if required not in source:
              if anchor not in source:
                  raise SystemExit('Customer statement import anchor was not found')
              source = source.replace(anchor, anchor + required, 1)
              export.write_text(source, encoding='utf-8')

      - name: Commit wired source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- central_source/app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt central_source/app/src/main/java/com/fush/erp/ui/screens/CustomerStatementExport.kt; then
            echo 'Source already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central_source/app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt \
                  central_source/app/src/main/java/com/fush/erp/ui/screens/CustomerStatementExport.kt
          git commit -m 'Wire professional customer statement export into customer profile'
          git push origin HEAD:agent/customer-statement-pdf-20260821
