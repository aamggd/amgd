name: ANDAK Supplier v0.6.0 Gate5

on:
  push:
    branches: ['andak-supplier-gate5-v060']
    paths: ['.github/workflows/andak-supplier-gate5-v060.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate5:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmd.zip
          rm -rf /tmp/cmd; mkdir -p /tmp/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Exact Gate5 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/Lq26zBKSfW2P'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v0.6.0-Gate5-Source.zip"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$URL" -o /tmp/source.zip
          echo '315ec62a485e4c1f874b0ee6301a9fcc801c21976b4bebfdb399f7a6db8e0dcf  /tmp/source.zip' | sha256sum -c -
          mkdir source; unzip -q /tmp/source.zip -d source
          SRC=$(find "$GITHUB_WORKSPACE/source" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Gate5 static checks
        shell: bash
        run: |
          set -euo pipefail
          B="$SRC/apps/supplier/build.gradle.kts"
          A="$SRC/apps/supplier/src/main/java/com/fush/market/supplier/SupplierApp.kt"
          grep -q 'applicationId = "com.fush.market.supplier"' "$B"
          grep -q 'versionCode = 7' "$B"
          grep -q 'versionName = "0.6.0"' "$B"
          grep -q 'getSharedPreferences("andak_supplier_gate5"' "$A"
          grep -q 'restoreOrders' "$A"
          grep -q 'saveOrders' "$A"
          grep -q 'restoreProducts' "$A"
          grep -q 'saveProducts' "$A"
          grep -q 'إعدادات المتجر' "$A"
          grep -q 'المساعدة والدعم' "$A"
          grep -q 'تم طلب كشف الحساب' "$A"
          grep -q 'الاستمرارية دون إنترنت' "$A"
          echo GATE5_STATIC_PASS

      - name: Build Gate5
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          gradle :apps:supplier:assembleDebug :apps:supplier:assembleRelease :apps:supplier:bundleRelease --no-daemon --stacktrace

      - name: Write Gate5 runtime
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/runtime-gate5.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          P=com.fush.market.supplier
          APK="$SRC/apps/supplier/build/outputs/apk/debug/supplier-debug.apk"
          E="$GITHUB_WORKSPACE/evidence"; mkdir -p "$E"

          dump_ui(){ local n="$1"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true; adb pull /sdcard/window.xml "$E/$n.xml" >/dev/null 2>&1 || true; }

          tap_text(){
            local txt="$1"
            dump_ui tap-source
            python - "$E/tap-source.xml" "$txt" <<'PY'
          import re,sys,subprocess,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); target=sys.argv[2]
          nodes=[n for n in root.iter('node') if n.attrib.get('text')==target or n.attrib.get('content-desc')==target]
          if not nodes: raise SystemExit("TEXT_NOT_FOUND "+target)
          m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',nodes[0].attrib.get('bounds',''))
          if not m: raise SystemExit("BAD_BOUNDS")
          x1,y1,x2,y2=map(int,m.groups())
          subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
          PY
            sleep 2
          }

          tap_switch(){
            dump_ui switch-source
            python - "$E/switch-source.xml" <<'PY'
          import re,sys,subprocess,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          nodes=[n for n in root.iter('node') if n.attrib.get('checkable')=='true' or n.attrib.get('checked') in ('true','false')]
          if not nodes: raise SystemExit("SWITCH_NOT_FOUND")
          m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',nodes[0].attrib.get('bounds',''))
          x1,y1,x2,y2=map(int,m.groups())
          subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
          PY
            sleep 2
          }

          relaunch(){
            adb shell am force-stop "$P" >/dev/null 2>&1 || true
            adb shell am start -n "$P/.MainActivity" >/dev/null 2>&1 || true
            sleep 8
            test -n "$(adb shell pidof "$P" | tr -d '\r' || true)"
          }

          adb uninstall "$P" >/dev/null 2>&1 || true
          adb install "$APK" | tee "$E/install.txt"
          adb logcat -c
          relaunch
          dump_ui home-online
          grep -q 'المتجر متاح الآن' "$E/home-online.xml"

          tap_switch
          dump_ui home-offline
          grep -q 'المتجر متوقف مؤقتًا' "$E/home-offline.xml"

          relaunch
          dump_ui persisted-offline
          grep -q 'المتجر متوقف مؤقتًا' "$E/persisted-offline.xml"

          tap_text 'الحساب'
          dump_ui account
          grep -q 'الحفظ المحلي' "$E/account.xml"
          grep -q 'الاستمرارية دون إنترنت' "$E/account.xml"

          tap_text 'طلب كشف حساب'
          dump_ui statement
          grep -q 'تم طلب كشف الحساب' "$E/statement.xml"

          relaunch
          tap_text 'الحساب'
          dump_ui statement-persisted
          grep -q 'تم طلب كشف الحساب' "$E/statement-persisted.xml"

          tap_text 'إعدادات المتجر'
          dump_ui settings
          grep -q 'بيانات التشغيل المحفوظة على الجهاز' "$E/settings.xml"
          grep -q 'حفظ إعدادات المتجر' "$E/settings.xml"
          tap_text 'العودة إلى الحساب'

          tap_text 'المساعدة والدعم'
          dump_ui support
          grep -q 'إرسال طلب دعم من تطبيق المورد' "$E/support.xml"
          grep -q 'إرسال طلب الدعم' "$E/support.xml"

          adb logcat -d -b crash > "$E/crash.log" || true
          adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|ResourceResolutionException|Caused by|$P" > "$E/relevant.log" || true
          ! grep -q "$P" "$E/crash.log"
          adb exec-out screencap -p > "$E/final-screen.png"
          echo GATE5_RUNTIME_PASS | tee "$E/result.txt"
          EOF
          chmod +x "$GITHUB_WORKSPACE/runtime-gate5.sh"

      - name: Gate5 runtime API29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/runtime-gate5.sh"

      - name: Package Gate5
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$SRC/apps/supplier/build/outputs/apk/release/supplier-release-unsigned.apk" "$D/ANDAK-Supplier-v0.6.0-GATE5-ALIGNED-UNSIGNED.apk"
          cp "$SRC/apps/supplier/build/outputs/bundle/release/supplier-release.aab" "$D/ANDAK-Supplier-v0.6.0-GATE5-UNSIGNED.aab"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          cp /tmp/source.zip "$D/ANDAK-Supplier-v0.6.0-Gate5-Source.zip"
          cp -r "$GITHUB_WORKSPACE/evidence" "$D/"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$D/ANDAK-Supplier-v0.6.0-GATE5-ALIGNED-UNSIGNED.apk" > "$D/aapt-badging.txt"
          printf '%s\n' 'ANDAK Supplier Gate5 v0.6.0' 'applicationId=com.fush.market.supplier' 'versionCode=7' 'versionName=0.6.0' 'Persistence/settings/support runtime=PASS' 'Signing=pending permanent-key local signing' > "$D/GATE5-RESULT.txt"
          (cd "$D" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v0.6.0-GATE5-PASS
          path: dist/
          if-no-files-found: error
          retention-days: 7
