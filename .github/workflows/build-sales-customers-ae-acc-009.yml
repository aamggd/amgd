name: Build Sales Customers AE-ACC-009 Receipt Atomicity

on:
  push:
    branches: [fush/sales-customers]
    paths:
      - 'sales_customers_ae_acc_009/**'
      - '.github/workflows/build-sales-customers-ae-acc-009.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CENTRAL_SHA: 'ddae764a236cb1916a46e194ccb2d3c24ca6b919'
  CENTRAL_TREE: '30b028b75d6463c07afd0419429f53c7937fabb1'

jobs:
  validate-ae-acc-009:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout owner branch
        uses: actions/checkout@v4
        with:
          ref: fush/sales-customers
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Restore exact verified Central and apply AE-ACC-009
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CENTRAL_SHA}^{commit}"
          test "$(git rev-parse ${CENTRAL_SHA})" = "${CENTRAL_SHA}"
          rm -rf work-source central-ae-export output
          mkdir central-ae-export output
          git archive "${CENTRAL_SHA}" central_source | tar -x -C central-ae-export
          mv central-ae-export/central_source work-source
          cd work-source
          git init -q
          git config user.name sales-customers-ae-acc-009-ci
          git config user.email sales-customers-ae-acc-009-ci@users.noreply.github.com
          git add -A
          BASE_TREE=$(git write-tree)
          echo "BASE_TREE=${BASE_TREE}"
          test "${BASE_TREE}" = "${CENTRAL_TREE}"
          git commit -qm "Exact Central before AE-ACC-009"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          python3 "$GITHUB_WORKSPACE/sales_customers_ae_acc_009/apply_fix.py"
          git diff --check

      - name: AE-ACC-009 dedicated atomicity regression
        shell: bash
        run: |
          set -euo pipefail
          cd work-source
          python3 - <<'PY'
          from pathlib import Path

          source = Path('app/src/main/java/com/fush/erp/domain/SalesService.kt').read_text(encoding='utf-8')

          post_receipt = source.split('    suspend fun postReceipt(', 1)[1].split('    suspend fun postReceiptAutoAllocate(', 1)[0]
          assert '): ReceiptResult = db.withTransaction {' in post_receipt, 'postReceipt lacks explicit Room transaction'
          assert 'postReceiptAllocationsInternal(' in post_receipt, 'postReceipt does not execute the mutation routine inside its transaction'

          auto_allocate = source.split('    suspend fun postReceiptAutoAllocate(', 1)[1].split('    suspend fun postReceiptAllocations(', 1)[0]
          assert '= db.withTransaction {' in auto_allocate, 'auto allocation lost its Room transaction'
          assert 'postReceiptAllocationsInternal(' in auto_allocate

          allocations = source.split('    suspend fun postReceiptAllocations(', 1)[1].split('    private suspend fun postReceiptAllocationsInternal(', 1)[0]
          assert '= db.withTransaction {' in allocations, 'receipt allocations lost their Room transaction'
          assert 'postReceiptAllocationsInternal(' in allocations

          internal = source.split('    private suspend fun postReceiptAllocationsInternal(', 1)[1].split('    suspend fun reverseReceipt(', 1)[0]
          guard = internal.index('CustomerReceiptAtomicityPolicy.requireActiveTransaction(db.inTransaction())')
          preflight = internal.index('val collectionJournalLines = prepareCollectionJournalLines(')
          first_mutation = min(
              internal.index('numbering.nextDocumentNo("RCPT", receiptDate)'),
              internal.index('db.salesDao().insertReceipt('),
              internal.index('db.salesDao().insertReceiptAllocation(')
          )
          journal = internal.index('postCollectionJournal(')
          assert guard < first_mutation, 'transaction guard occurs after receipt mutation'
          assert preflight < first_mutation, 'journal dependency validation occurs after receipt mutation'
          assert first_mutation < journal, 'journal posting order is not inside the mutation transaction'

          prep = source.split('    private suspend fun prepareCollectionJournalLines(', 1)[1].split('    private suspend fun postCollectionJournal(', 1)[0]
          assert 'db.accountDao().byId(treasuryAccountId)' in prep
          assert 'db.accountDao().byCode("1300")' in prep
          assert 'AccountingValidator.validate(lines)' in prep

          post = source.split('    private suspend fun postCollectionJournal(', 1)[1].split('    private suspend fun postSalesReturnJournal(', 1)[0]
          assert 'db.accountDao()' not in post, 'late GL dependency lookup remains after receipt mutation'
          assert 'try {' not in post and 'catch (' not in post, 'journal failure must propagate to Room transaction'
          assert 'postJournal(' in post and 'lines = lines' in post

          policy = Path('app/src/main/java/com/fush/erp/domain/CustomerReceiptAtomicityPolicy.kt').read_text(encoding='utf-8')
          assert 'check(active)' in policy
          print('AE-ACC-009 regression PASS: preflight-before-mutation + active transaction + journal exception propagation')
          PY

      - name: Exact scope and patch
        shell: bash
        run: |
          set -euo pipefail
          cd work-source
          git add -A
          mapfile -t FILES < <(git diff --cached --name-only | sort)
          EXPECTED=(
            "app/src/main/java/com/fush/erp/domain/CustomerReceiptAtomicityPolicy.kt"
            "app/src/main/java/com/fush/erp/domain/SalesService.kt"
            "app/src/test/java/com/fush/erp/domain/CustomerReceiptAtomicityPolicyTest.kt"
            "app/src/test/java/com/fush/erp/domain/OperationalReversalMathTest.kt"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#FILES[@]}" -eq "${#EXPECTED_SORTED[@]}"
          for i in "${!FILES[@]}"; do test "${FILES[$i]}" = "${EXPECTED_SORTED[$i]}"; done
          ! git diff --cached --name-only | grep -Eq 'app/src/main/java/com/fush/erp/data/(FushDatabase|Migrations|SecurityMigrations|entity)|app/schemas/'
          ! git diff --cached | grep -q 'fallbackToDestructiveMigration'
          git diff --cached --binary > "$GITHUB_WORKSPACE/output/ae_acc_009_customer_receipt_atomicity.patch"
          test -s "$GITHUB_WORKSPACE/output/ae_acc_009_customer_receipt_atomicity.patch"
          git apply --check --reverse "$GITHUB_WORKSPACE/output/ae_acc_009_customer_receipt_atomicity.patch"
          echo -n 'EXACT_PATCH_SHA256='
          sha256sum "$GITHUB_WORKSPACE/output/ae_acc_009_customer_receipt_atomicity.patch" | awk '{print $1}'

      - name: AR receipt reversal targeted tests
        working-directory: work-source
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.fush.erp.domain.CustomerReceiptAtomicityPolicyTest \
            --tests com.fush.erp.domain.CustomerArMathTest \
            --tests com.fush.erp.domain.SettlementAllocationMathTest \
            --tests com.fush.erp.domain.CustomerMovementIdentityTest \
            --tests com.fush.erp.domain.OperationalReversalMathTest \
            --tests com.fush.erp.domain.AccountingReconciliationMathTest \
            --tests com.fush.erp.domain.TreasuryReconciliationTest

      - name: Full unit regression suite
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Room35 AppID no-destructive release gates
        shell: bash
        run: |
          set -euo pipefail
          cd work-source
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -R -Eq 'Migration\(34, *35\)|MIGRATION_34_35' app/src/main/java
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          ! git diff --cached --name-only | grep -Eq 'app/src/main/java/com/fush/erp/data/(FushDatabase|Migrations|SecurityMigrations|entity)|app/schemas/'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Package AE-ACC-009 handoff artifact
        shell: bash
        run: |
          set -euo pipefail
          cp work-source/app/build/outputs/apk/release/app-release-unsigned.apk output/FushERP-Sales-Customers-AE-ACC-009-Receipt-Atomicity-unsigned.apk
          cp sales_customers_ae_acc_009/README.md output/README.md
          sha256sum output/ae_acc_009_customer_receipt_atomicity.patch output/FushERP-Sales-Customers-AE-ACC-009-Receipt-Atomicity-unsigned.apk > output/SHA256SUMS.txt

      - name: Upload AE-ACC-009 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Sales-Customers-AE-ACC-009-Receipt-Atomicity
          path: output/*
          if-no-files-found: error
