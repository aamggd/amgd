name: Build Fush ERP Phase 14.5.6 Inventory Warehouse Separation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-6-inventory-warehouse-separation.yml'
      - 'phase14_5_6_inventory_warehouse_separation/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.5 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.5-Warehouse-Transfers-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31649359297
      - name: Restore Phase 14.5.5 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.5-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 44' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.5-phase14.5-warehouse-transfers' FushERP_Mobile_Phase5/app/build.gradle.kts
      - name: Apply Phase 14.5.6 warehouse separation
        shell: bash
        run: |
          set -e
          python phase14_5_6_inventory_warehouse_separation/apply_patch.py
          python - <<'PY'
          from pathlib import Path
          root = Path('FushERP_Mobile_Phase5')
          checks = {
              'app/build.gradle.kts': ['versionCode = 45', '0.15.4.6-phase14.5-inventory-warehouse-separation'],
              'app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt': ['observeWarehouseBalances'],
              'app/src/main/java/com/fush/erp/data/entity/PurchaseEntities.kt': ['WarehouseStockBalanceRow'],
              'app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt': ['warehouseBalances', 'selectedWarehouseId', 'warehouseId == row.warehouseId'],
              'app/src/main/java/com/fush/erp/data/FushDatabase.kt': ['version = 19'],
          }
          for rel, needles in checks.items():
              text = (root / rel).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{needle} missing from {rel}'
          print('Phase 14.5.6 patch verification passed')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema remains 19
        shell: bash
        run: |
          set -e
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/19.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-6-output
          mkdir -p phase14-5-6-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-6-output/FushERP-Phase14.5.6-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-6-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-6-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-6-output/apksigner/apksigner
          zip -qr phase14-5-6-output/FushERP-Mobile-Phase14.5.6-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-6-output/FushERP-Phase14.5.6-unsigned.apk > phase14-5-6-output/FushERP-Phase14.5.6-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.6 — Inventory Warehouse Separation' \
            'Version: 0.15.4.6-phase14.5-inventory-warehouse-separation (versionCode 45)' \
            'Room schema: 19 (unchanged)' \
            '' \
            'Added/fixed:' \
            '- Stock balance screen is separated by actual warehouse instead of aggregating all warehouses.' \
            '- Dedicated warehouse filters for raw materials, finished goods, quarantine and returns.' \
            '- Item-category filters for raw materials, packaging and finished goods.' \
            '- Lot sellable/expired/quarantine quantities are calculated within the selected warehouse only.' \
            '- Existing stock movements are not moved or rewritten; this is a reporting/UI separation change.' \
            > phase14-5-6-output/FushERP-Phase14.5.6-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.6-Inventory-Warehouse-Separation-Build
          path: phase14-5-6-output/
          if-no-files-found: error
          retention-days: 7
