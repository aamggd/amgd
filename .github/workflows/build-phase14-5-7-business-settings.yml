name: Build Fush ERP Phase 14.5.7 Business Settings

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-7-business-settings.yml'
      - 'phase14_5_7_business_settings/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.6 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.6-Inventory-Separation-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31652355941
      - name: Restore Phase 14.5.6 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.6-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 45' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.6-phase14.5-inventory-warehouse-separation' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 19' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.7 business settings
        shell: bash
        run: |
          set -e
          python phase14_5_7_business_settings/apply_patch.py
          grep -q 'versionCode = 46' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.7-phase14.5-business-settings' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_19_20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'BusinessSettingsScreen' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/BusinessSettingsScreen.kt
          grep -q 'snapshotAt(request.invoiceDate)' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/SalesService.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 20
        shell: bash
        run: |
          set -e
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/20.json
          grep -q 'business_settings' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/20.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-7-output
          mkdir -p phase14-5-7-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-7-output/FushERP-Phase14.5.7-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-7-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-7-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-7-output/apksigner/apksigner
          zip -qr phase14-5-7-output/FushERP-Mobile-Phase14.5.7-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-7-output/FushERP-Phase14.5.7-unsigned.apk > phase14-5-7-output/FushERP-Phase14.5.7-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.7 — Effective-Dated Business Settings' \
            'Version: 0.15.4.7-phase14.5-business-settings (versionCode 46)' \
            'Room schema: 20 (migration 19 -> 20)' \
            '' \
            'Added/fixed:' \
            '- Business policies are stored with effective dates instead of relying on fixed sales constants.' \
            '- Configurable maximum credit days, commission rate, Fush 60 price floor, bulk threshold, and cash/credit discount limits.' \
            '- New Business Settings screen preserves policy history by inserting new effective-dated values.' \
            '- Sales invoices use the policy effective on the invoice date; commission records snapshot the applicable rate.' \
            '- Customer credit-day validation uses the current configured maximum.' \
            '- Aden/province transport defaults are read from province policies instead of hard-coded 10,000 values in the sale dialog.' \
            '- Carton equivalents use the item carton conversion when available rather than a fixed 480 in geographic costing.' \
            '- Unit tests cover configurable discount tiers and configurable credit-day limits.' \
            > phase14-5-7-output/FushERP-Phase14.5.7-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.7-Business-Settings-Build
          path: phase14-5-7-output/
          if-no-files-found: error
          retention-days: 7
