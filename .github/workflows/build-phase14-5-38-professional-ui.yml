name: Build Fush ERP Phase 14.5.38 Professional UI

on:
  push:
    branches: [fush/ui-professional-build-14.5.38]
    paths:
      - '.github/workflows/build-phase14-5-38-professional-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.33 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.33-Expense-Dimensions-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31854443269

      - name: Restore Phase 14.5.33 and apply professional UI phases 34-38
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.33-Expense-Dimensions-Source.zip
          cd FushERP_Mobile_Phase5
          git init -q
          for phase in \
            phase14_5_34_ui_professionalization \
            phase14_5_35_sales_customers_ui \
            phase14_5_36_purchases_suppliers_ui \
            phase14_5_37_accounting_treasury_ui \
            phase14_5_38_inventory_master_data_ui
          do
            echo "Applying $phase"
            cat "../$phase/patches/"*.patch > "/tmp/$phase.patch"
            git apply --check "/tmp/$phase.patch"
            git apply "/tmp/$phase.patch"
          done
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.38-ui-inventory-master-data"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          rm -rf .git app/build .gradle build

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify UI release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 77' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.38-ui-inventory-master-data"' FushERP_Mobile_Phase5/app/build.gradle.kts
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-38-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-38-output/FushERP-Phase14.5.38-Professional-UI-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-38-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-38-output/lib/apksigner.jar
          chmod +x phase14-5-38-output/apksigner
          zip -qr phase14-5-38-output/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.38 — Professional UI integrated build' \
            'Base functional source: Phase 14.5.33 Expense Dimensions' \
            'Package: com.fush.erp.recovery' \
            'Version code: 77' \
            'Version name: 0.15.4.38-ui-inventory-master-data' \
            'Room schema: 27 unchanged' \
            'UI packages applied: 14.5.34 shell/theme/login; 14.5.35 sales/customers; 14.5.36 purchases/suppliers; 14.5.37 accounting/treasury; 14.5.38 inventory/master data.' \
            'Business logic/database schema intentionally unchanged by UI stream.' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-38-output/FushERP-Phase14.5.38-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.38-Professional-UI-Build
          path: phase14-5-38-output/
          if-no-files-found: error
          retention-days: 7
