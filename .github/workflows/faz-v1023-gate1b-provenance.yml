name: FAZ v1.0.23 Gate1B Supplier Provenance

on:
  push:
    branches: [faz/v1.0.23-supplier-item-movement-report]
    paths:
      - '.github/workflows/faz-v1023-gate1b-provenance.yml'
      - 'ci/faz_v1023_gate1b_apply.py'
      - 'ci/SupplierStockProvenancePlannerTest.kt'
      - 'ci/verify_supplier_provenance_migration.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FAZ-v1.0.23-Gate1A-SupplierMovementMath
          path: gate1a
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 34672892427
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare Gate1A source and Android SDK
        id: src
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          Z=$(find gate1a -type f -name '*Source.zip' -print -quit)
          test -n "$Z"
          mkdir -p work
          unzip -q "$Z" -d work
          S=$(find work -name settings.gradle.kts -print -quit)
          ROOT=$(dirname "$S")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 52' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"

      - name: RED - provenance planner test fails before implementation
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          TEST="$ROOT/app/src/test/java/com/fush/erp/domain/SupplierStockProvenancePlannerTest.kt"
          mkdir -p "$(dirname "$TEST")"
          cp ci/SupplierStockProvenancePlannerTest.kt "$TEST"
          cd "$ROOT"
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.domain.SupplierStockProvenancePlannerTest' > "$GITHUB_WORKSPACE/red1b.log" 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -Eq 'SupplierStockProvenancePlanner|SupplierStockSourceBalance|Unresolved reference|unresolved reference' "$GITHUB_WORKSPACE/red1b.log"
          echo 'GATE1B_RED=PASS'

      - name: GREEN - apply Room53 supplier provenance implementation
        shell: bash
        run: |
          set -euo pipefail
          python ci/faz_v1023_gate1b_apply.py '${{ steps.src.outputs.root }}'

      - name: Verify Migration 52 to 53 ledger preservation
        shell: bash
        run: |
          set -euo pipefail
          python ci/verify_supplier_provenance_migration.py '${{ steps.src.outputs.root }}/app/src/main/java/com/fush/erp/data/SupplierStockProvenanceMigration.kt'

      - name: Run Gate1A and Gate1B unit tests
        shell: bash
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.domain.SupplierItemMovementMathTest' --tests 'com.fush.erp.domain.SupplierStockProvenancePlannerTest' | tee "$GITHUB_WORKSPACE/gate1b-tests.log"
          echo 'GATE1B_GREEN=PASS'

      - name: Compile full app and generate Room schema 53
        shell: bash
        working-directory: ${{ steps.src.outputs.root }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify Room53 and provenance integration contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          grep -q 'FUSH_DB_SCHEMA_VERSION = 53' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
          grep -Rqs 'MIGRATION_52_53_SUPPLIER_PROVENANCE' "$ROOT/app/src/main/java"
          ! grep -RIn --include='*.kt' --include='*.kts' 'fallbackToDestructiveMigration' "$ROOT/app/src" "$ROOT/app/build.gradle.kts"
          SCHEMA=$(find "$ROOT" -type f -name '53.json' -print -quit)
          test -n "$SCHEMA"
          python - "$SCHEMA" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); v=d.get('database',{}).get('version',d.get('version'))
          assert v==53, v
          txt=open(sys.argv[1]).read()
          assert 'supplier_stock_sources' in txt and 'supplier_stock_allocations' in txt
          print('ROOM_SCHEMA_53=PASS')
          PY
          grep -q 'supplierStockProvenance.recordPurchaseSource' "$ROOT/app/src/main/java/com/fush/erp/domain/PurchaseService.kt"
          grep -q 'supplierStockProvenance.consumePurchaseReturn' "$ROOT/app/src/main/java/com/fush/erp/domain/PurchaseService.kt"
          grep -q 'supplierStockProvenance.allocateSale' "$ROOT/app/src/main/java/com/fush/erp/domain/SalesService.kt"
          grep -q 'supplierStockProvenance.restoreSalesReturn' "$ROOT/app/src/main/java/com/fush/erp/domain/SalesService.kt"
          grep -q 'ProductVariant.id intentionally equals items.id' "$ROOT/app/src/main/java/com/fush/erp/data/entity/ProductMasterEntities.kt"
          echo 'PROVENANCE_HOOKS=PASS'
          echo 'LEGACY_VARIANT_IDENTITY=PASS'

      - name: Package Gate1B source and evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          mkdir -p gate1b-out/room-schema-53
          cp red1b.log gate1b-tests.log gate1b-out/
          SCHEMA=$(find "$ROOT" -type f -name '53.json' -print -quit)
          cp "$SCHEMA" gate1b-out/room-schema-53/53.json
          rm -rf "$ROOT/app/build" "$ROOT/.gradle" || true
          (cd "$(dirname "$ROOT")" && zip -qr "$GITHUB_WORKSPACE/gate1b-out/FAZ-Solar-ERP-v1.0.23-Gate1B-SupplierProvenance-Source.zip" "$(basename "$ROOT")")
          sha256sum gate1b-out/*.zip > gate1b-out/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FAZ-v1.0.23-Gate1B-SupplierProvenance
          path: gate1b-out/**
          retention-days: 2
