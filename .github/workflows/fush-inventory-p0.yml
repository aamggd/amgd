name: FUSH Inventory P0 Ledger Invariant

on:
  push:
    branches: [fush/inventory]
    paths:
      - '.github/workflows/fush-inventory-p0.yml'
      - 'inventory_p0/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-inventory-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inventory branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download validated central 14.5.54 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: artifacts/base54
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750

      - name: Restore exact 14.5.54 central baseline
        shell: bash
        run: |
          set -euo pipefail
          ZIP=artifacts/base54/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          test -s "$ZIP"
          mkdir -p sources/base54 work
          unzip -q "$ZIP" -d sources/base54
          BASE=$(find sources/base54 -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$BASE"
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' "$BASE/" work/
          cd work
          git init -q
          git config user.email inventory@fush.local
          git config user.name FUSH
          git add -A
          git commit -qm baseline-14.5.54
          BASE_TREE=$(git write-tree)
          echo "BASE54_TREE=$BASE_TREE"
          test "$BASE_TREE" = '1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff'
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 93' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.54-printing-integrated"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts

      - name: Apply P0 inventory ledger invariant patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'e169dc89ba6d6598c30f4937f4e6f0013e2e8498137381b8569eb9e3f08b8f73  inventory_p0/inventory-p0.patch' | sha256sum -c -
          cd work
          git apply --check ../inventory_p0/inventory-p0.patch
          git apply ../inventory_p0/inventory-p0.patch
          git diff --check
          grep -q 'suspend fun balanceAt(warehouseId: Long, itemId: Long, asOf: Long): Double' app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          test -f app/src/main/java/com/fush/erp/domain/StockLedgerInvariant.kt
          test -f app/src/test/java/com/fush/erp/domain/StockLedgerInvariantTest.kt

      - name: Verify branch constraints
        shell: bash
        run: |
          set -euo pipefail
          cd work
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 93' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.54-printing-integrated"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          # P0 must not alter Room entities/schema or migrations.
          ! git diff --name-only | grep -E '^app/src/main/java/com/fush/erp/data/(FushDatabase|Migrations)\.kt$'
          ! git diff --name-only | grep -E '^app/schemas/'

      - name: Unit tests
        working-directory: work
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=work/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          cd work
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
