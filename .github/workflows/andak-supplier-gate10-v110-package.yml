name: ANDAK Supplier v1.1.0 Gate10 Package

on:
  push:
    branches: ['andak-supplier-gate10-v110']
    paths: ['.github/workflows/andak-supplier-gate10-v110-package.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmd.zip
          rm -rf /tmp/cmd; mkdir -p /tmp/cmd; unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Exact Gate10 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/p-5BNNVTxtyy'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v1.1.0-Gate10-Source.zip"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$URL" -o /tmp/source.zip
          echo '49ea35af712b03f986817df3dfc75bba4c0a742b7b1d955f91617958440ae178  /tmp/source.zip' | sha256sum -c -
          mkdir source; unzip -q /tmp/source.zip -d source
          SRC=$(find "$GITHUB_WORKSPACE/source" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Gate10 static checks
        shell: bash
        run: |
          set -euo pipefail
          B="$SRC/apps/supplier/build.gradle.kts"
          A="$SRC/apps/supplier/src/main/java/com/fush/market/supplier/SupplierApp.kt"
          C="$SRC/apps/supplier/src/main/java/com/fush/market/supplier/SupplierBackendClient.kt"
          grep -q 'applicationId = "com.fush.market.supplier"' "$B"
          grep -q 'versionCode = 12' "$B"
          grep -q 'versionName = "1.1.0"' "$B"
          grep -q 'SupplierCloudProduct' "$C"
          grep -q 'SupplierCloudOrder' "$C"
          grep -q 'CloudOrderCard' "$A"
          grep -q 'CloudProductCard' "$A"
          grep -q 'Authenticated Live Supplier E2E' "$A"
          grep -q 'transitionCloudOrder' "$A"
          ! grep -q 'service_role' "$C"
          echo GATE10_STATIC_PASS

      - name: Live backend health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST             'https://bkbjtyacoiaheunweyuu.supabase.co/rest/v1/rpc/andak_backend_status'             -H 'apikey: sb_publishable_-DaXGQuwuWK_oRFLNU-uxg_-q5LDAnY'             -H 'Content-Type: application/json' -d '{}' > /tmp/backend-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/backend-health.json'))
          assert d['status']=='ok'
          assert d['supplier_scope']=='supplier:self'
          assert d['auth_required'] is True
          assert d['customer_pii_excluded'] is True
          print('GATE10_BACKEND_HEALTH_PASS')
          PY

      - name: Build Gate10
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          gradle :apps:supplier:assembleDebug :apps:supplier:assembleRelease :apps:supplier:bundleRelease --no-daemon --stacktrace

      - name: Package Gate10
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4             "$SRC/apps/supplier/build/outputs/apk/release/supplier-release-unsigned.apk"             "$D/ANDAK-Supplier-v1.1.0-GATE10-ALIGNED-UNSIGNED.apk"
          cp "$SRC/apps/supplier/build/outputs/apk/debug/supplier-debug.apk" "$D/ANDAK-Supplier-v1.1.0-GATE10-DEBUG.apk"
          cp "$SRC/apps/supplier/build/outputs/bundle/release/supplier-release.aab" "$D/ANDAK-Supplier-v1.1.0-GATE10-UNSIGNED.aab"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          cp /tmp/source.zip "$D/ANDAK-Supplier-v1.1.0-Gate10-Source.zip"
          cp /tmp/backend-health.json "$D/backend-health.json"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging             "$D/ANDAK-Supplier-v1.1.0-GATE10-ALIGNED-UNSIGNED.apk" > "$D/aapt-badging.txt"
          printf '%s\n'             'ANDAK Supplier Gate10 v1.1.0'             'applicationId=com.fush.market.supplier'             'versionCode=12'             'versionName=1.1.0'             'Full cloud product/order snapshot UI=READY'             'Server order transitions UI=READY'             'Live backend health=PASS'             'Positive E2E auth/runtime pending signed APK test account'             > "$D/GATE10-PACKAGE-RESULT.txt"
          (cd "$D" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v1.1.0-GATE10-PACKAGE-PASS
          path: dist/
          if-no-files-found: error
          retention-days: 7
