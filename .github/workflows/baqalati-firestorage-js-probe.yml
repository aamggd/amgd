name: Baqalati Firestorage JS Probe

on:
  push:
    branches: [baqalati-secure-build-r3]
    paths:
      - '.github/workflows/baqalati-firestorage-js-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Firestorage client bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -A 'Mozilla/5.0' 'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' -o page.js
          grep -Eo '.{0,180}(fetch\(|/api/|download|share|public[_-]?id|file[_-]?id|presign|signed).{0,260}' page.js > clues.txt || true
          grep -Eo 'https?://[^"'\'' <>]+' page.js | sort -u > urls.txt || true
          grep -Eo '/api/[A-Za-z0-9_?=&/.$:{}-]+' page.js | sort -u > api-paths.txt || true
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: firestorage-js-probe
          path: |
            page.js
            clues.txt
            urls.txt
            api-paths.txt
          retention-days: 1
