name: FAZ v1.0.25 Gate1 Task3 RED

on:
  push:
    branches: [faz/v1.0.25-ops-itemmaster]
    paths:
      - '.github/workflows/faz-v1025-gate1-task3-red.yml'
      - 'ci/UnifiedItemCreationContractTest.kt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FAZ-v1.0.24-StartupMigrationHotfix-FINAL-UNSIGNED
          path: baseline
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 34796845084
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare Task2 source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          Z=$(find baseline -type f -name '*FINAL-Source.zip' -print -quit); test -n "$Z"
          mkdir -p work; unzip -q "$Z" -d work
          S=$(find work -name settings.gradle.kts -print -quit); ROOT=$(dirname "$S")
          python3 ci/faz_v1025_gate1_schema54_apply.py "$ROOT"
          python3 ci/faz_v1025_gate1_task2_apply.py "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 54' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
          ! grep -q 'suspend fun createUnifiedItem' "$ROOT/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt"
      - name: RED - unified creation service must be absent
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          TEST="$ROOT/app/src/test/java/com/fush/erp/domain/UnifiedItemCreationContractTest.kt"
          mkdir -p "$(dirname "$TEST")"
          cp ci/UnifiedItemCreationContractTest.kt "$TEST"
          cd "$ROOT"
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.domain.UnifiedItemCreationContractTest' > "$GITHUB_WORKSPACE/task3-red.log" 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -q 'UnifiedItemCreationContractTest' "$GITHUB_WORKSPACE/task3-red.log"
          echo 'GATE1_TASK3_RED=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: FAZ-v1.0.25-Gate1-Task3-RED
          path: task3-red.log
          retention-days: 2
