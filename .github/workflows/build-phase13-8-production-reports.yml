name: Build Fush ERP Phase 13.8 Production Reports

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase13-8-production-reports.yml'
      - 'phase13_8_production_reports/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 13.7 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase13.7-Production-Detail-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31550594929

      - name: Restore Phase 13.7 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase13.7-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 27' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.7-phase13-production-detail' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 13.8 production reports
        shell: bash
        run: |
          set -e
          python phase13_8_production_reports/apply_patch.py
          grep -q 'versionCode = 28' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.8-phase13-production-reports' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'productionMaterialUsage' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'مؤشرات الإنتاج للفترة' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          grep -q 'تقارير الإنتاج والتحليل' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/ProductionScreens.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase13-8-output
          mkdir -p phase13-8-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase13-8-output/FushERP-Phase13.8-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase13-8-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase13-8-output/apksigner/lib/apksigner.jar
          chmod +x phase13-8-output/apksigner/apksigner
          zip -qr phase13-8-output/FushERP-Mobile-Phase13.8-Source.zip FushERP_Mobile_Phase5
          sha256sum phase13-8-output/FushERP-Phase13.8-unsigned.apk > phase13-8-output/FushERP-Phase13.8-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase13.8-Production-Reports-Build
          path: phase13-8-output/
          if-no-files-found: error
          retention-days: 7
