name: Baqalati v1.0.38 Hierarchical Units Auto Compact

on:
  push:
    branches: [ "baqalati-build-v1.0.38" ]
  workflow_dispatch:

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v1.0.38 source R7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/downloads
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import time,glob,os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage')
          opts.add_experimental_option('prefs', {'download.default_directory':'/tmp/downloads','download.prompt_for_download':False})
          d=webdriver.Chrome(options=opts)
          d.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':'/tmp/downloads'})
          d.get('https://firestorage.ai/ja/f/vjB1zet8oUhT'); time.sleep(8)
          buttons=[b for b in d.find_elements(By.TAG_NAME,'button') if (b.text or '').strip()=='ダウンロード']
          if not buttons: raise RuntimeError('Firestorage download button not found')
          d.execute_script('arguments[0].click()',buttons[0])
          files=[]
          for _ in range(90):
              time.sleep(1); files=glob.glob('/tmp/downloads/*.zip')
              if files and not glob.glob('/tmp/downloads/*.crdownload'): break
          d.quit()
          if not files: raise RuntimeError('source archive was not downloaded')
          os.rename(files[0],'/tmp/baqalati-source.zip')
          PY
          echo '7b95db01a8c8faa3112e91b802783ce43128851820dac7300622ae28a89f5e28  /tmp/baqalati-source.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: baqalati-v138-source
          path: /tmp/baqalati-source.zip
          retention-days: 1
          if-no-files-found: error

  android-build:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baqalati-v138-source
          path: /tmp/source
      - name: Extract source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/baqalati"
          unzip -q /tmp/source/baqalati-source.zip -d "$GITHUB_WORKSPACE/baqalati"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify release identity and unit feature
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 39' app/build.gradle.kts
          grep -q '1.0.38-baqalati-hierarchical-units-auto-compact' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 55' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'decomposeBaseQuantity' app/src/main/java/com/fush/erp/domain/SalesMath.kt
          grep -q 'appendManualLineWithAutoUnits' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'itemUnitConversionDao().byBarcode' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'سلسلة التحويل' app/src/main/java/com/fush/erp/ui/screens/RetailProductScreens.kt
          grep -q 'openingQuantityBase' app/src/main/java/com/fush/erp/domain/InventoryMath.kt
          grep -q 'تكلفة الوحدة المختارة' app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt
          grep -q 'تكلفة الوحدة المختارة' app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'validateReturnComponent' app/src/main/java/com/fush/erp/domain/SalesMath.kt
          grep -q 'SalesMath.validateReturnComponent(paidQuantity' app/src/main/java/com/fush/erp/domain/SalesService.kt
          test -f .gitignore
          grep -q '^keystore.properties$' .gitignore
          test ! -f keystore.properties
      - name: Licensing core and app unit tests
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :licensing-core:test :app:testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/android-tests.log"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baqalati-v138-diagnostics
          path: android-tests.log
          retention-days: 1
          if-no-files-found: error
      - name: Build and align Baqalati release
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          APP_APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          test -n "$APP_APK"
          "$BT/zipalign" -f -p 4 "$APP_APK" "$GITHUB_WORKSPACE/out/Baqalati-v1.0.38-Hierarchical-Units-Auto-Compact-ALIGNED-UNSIGNED.apk"
          "$BT/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/Baqalati-v1.0.38-Hierarchical-Units-Auto-Compact-ALIGNED-UNSIGNED.apk"
          sha256sum "$GITHUB_WORKSPACE/out/Baqalati-v1.0.38-Hierarchical-Units-Auto-Compact-ALIGNED-UNSIGNED.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: baqalati-v138-android-artifact
          path: out/*.apk
          retention-days: 1
          if-no-files-found: error

  android-regression:
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baqalati-v138-source
          path: /tmp/source
      - name: Extract source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/baqalati"
          unzip -q /tmp/source/baqalati-source.zip -d "$GITHUB_WORKSPACE/baqalati"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolate migration image and scanner feedback regressions
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v138-tests/data /tmp/v138-tests/attachments /tmp/v138-tests/ui
          cp app/src/androidTest/java/com/fush/erp/data/RetailProductMigrationTest.kt /tmp/v138-tests/data/
          cp app/src/androidTest/java/com/fush/erp/attachments/ProductImageStorageAndroidTest.kt /tmp/v138-tests/attachments/
          cp app/src/androidTest/java/com/fush/erp/ui/BarcodeScanSoundPlayerInstrumentedTest.kt /tmp/v138-tests/ui/
          rm -rf app/src/androidTest/java
          mkdir -p app/src/androidTest/java/com/fush/erp/{data,attachments,ui}
          cp /tmp/v138-tests/data/RetailProductMigrationTest.kt app/src/androidTest/java/com/fush/erp/data/
          cp /tmp/v138-tests/attachments/ProductImageStorageAndroidTest.kt app/src/androidTest/java/com/fush/erp/attachments/
          cp /tmp/v138-tests/ui/BarcodeScanSoundPlayerInstrumentedTest.kt app/src/androidTest/java/com/fush/erp/ui/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android regressions on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: baqalati
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.data.RetailProductMigrationTest,com.fush.erp.attachments.ProductImageStorageAndroidTest,com.fush.erp.ui.BarcodeScanSoundPlayerInstrumentedTest
