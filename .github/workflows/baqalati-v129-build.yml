name: Baqalati v1.0.31 Note10 License Hotfix

on:
  push:
    branches: [ "baqalati-build-v1.0.29" ]
  workflow_dispatch:

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v1.0.31 R2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/downloads
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import time,glob,os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage')
          opts.add_experimental_option('prefs', {'download.default_directory':'/tmp/downloads','download.prompt_for_download':False})
          d=webdriver.Chrome(options=opts)
          d.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':'/tmp/downloads'})
          d.get('https://firestorage.ai/ja/f/vZZGlQ9qrmCV'); time.sleep(8)
          buttons=[b for b in d.find_elements(By.TAG_NAME,'button') if (b.text or '').strip()=='ダウンロード']
          if not buttons: raise RuntimeError('Firestorage download button not found')
          d.execute_script('arguments[0].click()',buttons[0])
          files=[]
          for _ in range(90):
              time.sleep(1); files=glob.glob('/tmp/downloads/*.zip')
              if files and not glob.glob('/tmp/downloads/*.crdownload'): break
          d.quit()
          if not files: raise RuntimeError('source archive was not downloaded')
          os.rename(files[0],'/tmp/baqalati-source.zip')
          PY
          echo '5587c3e14ae41d335c7dbf06b19fcfb2c04d4e3784f13797ed7f9dd8c0bfd555  /tmp/baqalati-source.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: baqalati-v131-source
          path: /tmp/baqalati-source.zip
          retention-days: 1
          if-no-files-found: error

  android-build:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baqalati-v131-source
          path: /tmp/source
      - name: Extract source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/baqalati"
          unzip -q /tmp/source/baqalati-source.zip -d "$GITHUB_WORKSPACE/baqalati"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Licensing core and app unit tests
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :licensing-core:test :app:testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/android-tests.log"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baqalati-v131-diagnostics
          path: android-tests.log
          retention-days: 1
          if-no-files-found: error
      - name: Build and align Baqalati release
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          APP_APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          test -n "$APP_APK"
          "$BT/zipalign" -f -p 4 "$APP_APK" "$GITHUB_WORKSPACE/out/Baqalati-v1.0.31-Note10-License-Hotfix-ALIGNED-UNSIGNED.apk"
          "$BT/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/Baqalati-v1.0.31-Note10-License-Hotfix-ALIGNED-UNSIGNED.apk"
          sha256sum "$GITHUB_WORKSPACE/out/Baqalati-v1.0.31-Note10-License-Hotfix-ALIGNED-UNSIGNED.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: baqalati-v131-android-artifact
          path: out/*.apk
          retention-days: 1
          if-no-files-found: error

  note10-keystore-compatibility:
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baqalati-v131-source
          path: /tmp/source
      - name: Extract source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/baqalati"
          unzip -q /tmp/source/baqalati-source.zip -d "$GITHUB_WORKSPACE/baqalati"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolate Note10 licensing instrumentation test
        working-directory: baqalati
        shell: bash
        run: |
          set -euo pipefail
          TEST='app/src/androidTest/java/com/fush/erp/licensing/Note10LicenseCompatibilityInstrumentedTest.kt'
          test -f "$TEST"
          cp "$TEST" /tmp/Note10LicenseCompatibilityInstrumentedTest.kt
          rm -rf app/src/androidTest/java
          mkdir -p app/src/androidTest/java/com/fush/erp/licensing
          cp /tmp/Note10LicenseCompatibilityInstrumentedTest.kt "$TEST"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run license Keystore compatibility test on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: baqalati
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.licensing.Note10LicenseCompatibilityInstrumentedTest
