name: Build SHIBANI SOFT ERP v1.0.4 Room 55 to 56 Bootstrap Hotfix R4

on:
  push:
    branches: [fush-customer-v1-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact SHIBANI v1.0.4 R4 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file'
          SHARE='Wo1Z6doNlXZ1'
          FILE='01a08f7f936d77289102780838cb9576'
          COOKIE=/tmp/firestorage.cookies
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "$BASE/shares/$SHARE/cushion-sessions" --data '{"password":null}' -o /tmp/cushion.json
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/shares/$SHARE/files/$FILE/download" -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json'))['downloadUrl'])
          PY
          )"
          curl -fL "$DOWNLOAD_URL" -o /tmp/source.zip
          echo 'dae9fbe0d2fc2f74ceb572a0d7ffb498740bafdef0b65a28ffb531db54c8ce5f  /tmp/source.zip' | sha256sum -c -
          rm -rf customer-v1-src && mkdir customer-v1-src
          unzip -oq /tmp/source.zip -d customer-v1-src
          grep 'applicationId = "com.shibanisoft.erp"' customer-v1-src/app/build.gradle.kts
          grep 'versionCode = 5' customer-v1-src/app/build.gradle.kts
          grep 'versionName = "1.0.4"' customer-v1-src/app/build.gradle.kts
          grep 'const val FUSH_DB_SCHEMA_VERSION = 56' customer-v1-src/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep 'MIGRATION_55_56_LOCAL_COMPANY_IDENTITY' customer-v1-src/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt
          grep 'MIGRATION_55_56_LOCAL_COMPANY_IDENTITY' customer-v1-src/app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! grep -R 'fallbackToDestructiveMigration' customer-v1-src/app/src/main/java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify Room bootstrap hotfix
        run: cd customer-v1-src && python3 tools/verify_shibani_room55_56_bootstrap_hotfix.py
      - name: Verify P0 license lock regression
        run: cd customer-v1-src && python3 tools/verify_shibani_license_locked_gate.py
      - name: Verify commercial closeout regression
        run: cd customer-v1-src && python3 tools/verify_shibani_commercial_closeout.py
      - name: Verify Local Only regression
        run: cd customer-v1-src && python3 tools/verify_shibani_local_only_flow_fix.py
      - name: Verify customer flow regression
        run: cd customer-v1-src && python3 tools/verify_shibani_customer_client_flow.py

      - name: Unit tests
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failures=errors=skipped=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); total+=int(r.attrib.get('tests',0)); failures+=int(r.attrib.get('failures',0)); errors+=int(r.attrib.get('errors',0)); skipped+=int(r.attrib.get('skipped',0))
          s=f'UNIT_TESTS total={total} failures={failures} errors={errors} skipped={skipped}'
          print(s); open('UNIT_TEST_SUMMARY.txt','w').write(s+'\n')
          if total == 0 or failures or errors: raise SystemExit(1)
          PY

      - name: Compile Android tests
        run: cd customer-v1-src && gradle --no-daemon :app:compileDebugAndroidTestKotlin
      - name: Test production bootstrap migration 55 to 56 on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd customer-v1-src && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.data.AccountingWaveBRoomBootstrap55To56Test
      - name: Test direct migration 55 to 56 data preservation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd customer-v1-src && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.data.LocalCompanyIdentityMigrationTest

      - name: Assemble release APK
        run: cd customer-v1-src && gradle --no-daemon :app:assembleRelease
      - name: Build release AAB
        run: cd customer-v1-src && gradle --no-daemon :app:bundleRelease
      - name: Release lint
        run: cd customer-v1-src && gradle --no-daemon :app:lintVitalRelease
      - name: Align and identify outputs
        shell: bash
        run: |
          set -euo pipefail
          cd customer-v1-src
          ZIPALIGN="$ANDROID_HOME/build-tools/36.1.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          APK_OUT='SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED-ALIGNED.apk'
          AAB_OUT='SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED.aab'
          "$ZIPALIGN" -f -v 4 app/build/outputs/apk/release/app-release-unsigned.apk "$APK_OUT"
          "$ZIPALIGN" -c -v 4 "$APK_OUT"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB_OUT"
          "$AAPT2" dump badging "$APK_OUT" | head -20 | tee APK_IDENTITY.txt
          grep "package: name='com.shibanisoft.erp' versionCode='5' versionName='1.0.4'" APK_IDENTITY.txt
          unzip -t "$AAB_OUT" >/dev/null
          sha256sum "$APK_OUT" "$AAB_OUT" > SHA256SUMS.txt
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.1.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.1.0/lib/apksigner.jar" signing-tools/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: SHIBANI-SOFT-ERP-v1.0.4-Room55To56BootstrapHotfix-Unsigned
          path: |
            customer-v1-src/SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED-ALIGNED.apk
            customer-v1-src/SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED.aab
            customer-v1-src/APK_IDENTITY.txt
            customer-v1-src/SHA256SUMS.txt
            customer-v1-src/UNIT_TEST_SUMMARY.txt
            customer-v1-src/app/build/outputs/androidTest-results/connected/**
            customer-v1-src/signing-tools/**
          if-no-files-found: error
