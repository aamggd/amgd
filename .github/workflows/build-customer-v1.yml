name: Build FUSH Customer V1

on:
  push:
    branches:
      - fush-customer-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify exact Customer V1 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file'
          SHARE='NgoYu80Xs4Mz'
          FILE='01a08e1199bf746b9bb257e0b9906abc'
          COOKIE=/tmp/firestorage.cookies
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/shares/$SHARE/cushion-sessions" \
            --data '{"password":null}' \
            -o /tmp/cushion.json
          curl -fsS -c "$COOKIE" -b "$COOKIE" \
            -X POST "$BASE/shares/$SHARE/files/$FILE/download" \
            -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          with open('/tmp/download.json', encoding='utf-8') as f:
              data = json.load(f)
          url = data.get('downloadUrl')
          if not url:
              raise SystemExit('downloadUrl missing')
          print(url)
          PY
          )"
          curl -fL "$DOWNLOAD_URL" -o /tmp/customer-v1-source.zip
          echo '6226f65bf74b8c404bc4bfeac81a1d2ffee5be4ea007ed3ac1fd20d65dbcc712  /tmp/customer-v1-source.zip' | sha256sum -c -
          rm -rf customer-v1-src
          mkdir -p customer-v1-src
          unzip -oq /tmp/customer-v1-source.zip -d customer-v1-src
          test -f customer-v1-src/settings.gradle.kts
          test -f customer-v1-src/app/build.gradle.kts
          grep 'applicationId = "com.fush.erp.recovery"' customer-v1-src/app/build.gradle.kts
          grep 'versionCode = 1' customer-v1-src/app/build.gradle.kts
          grep 'versionName = "1.0.0"' customer-v1-src/app/build.gradle.kts
          grep 'const val FUSH_DB_SCHEMA_VERSION = 55' customer-v1-src/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R 'fallbackToDestructiveMigration' customer-v1-src/app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify inherited v219 company bootstrap regression
        shell: bash
        run: |
          cd customer-v1-src
          python3 tools/verify_v219_company_bootstrap_regression_v220.py

      - name: Verify inherited v220 auth clarity contract
        shell: bash
        run: |
          cd customer-v1-src
          python3 tools/verify_v220_cloud_auth_error_clarity.py

      - name: Verify Customer V1 release contract
        shell: bash
        run: |
          cd customer-v1-src
          python3 tools/verify_customer_v1_release.py

      - name: Unit tests
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failures=errors=skipped=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              total += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'UNIT_TESTS total={total} failures={failures} errors={errors} skipped={skipped}')
          with open('UNIT_TEST_SUMMARY.txt','w') as f:
              f.write(f'UNIT_TESTS total={total} failures={failures} errors={errors} skipped={skipped}\n')
          if total == 0 or failures or errors:
              raise SystemExit(1)
          PY

      - name: Compile Android migration tests
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Assemble release APK
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:assembleRelease

      - name: Build release AAB
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:bundleRelease

      - name: Release lint
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:lintVitalRelease

      - name: Align and identify release outputs
        shell: bash
        run: |
          set -euo pipefail
          cd customer-v1-src
          ZIPALIGN="$ANDROID_HOME/build-tools/36.1.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -f "$APK"
          test -f "$AAB"
          APK_OUT='FUSH_Customer_V1-UNSIGNED-ALIGNED.apk'
          AAB_OUT='FUSH_Customer_V1-UNSIGNED.aab'
          "$ZIPALIGN" -f -v 4 "$APK" "$APK_OUT"
          "$ZIPALIGN" -c -v 4 "$APK_OUT"
          cp "$AAB" "$AAB_OUT"
          "$AAPT2" dump badging "$APK_OUT" | head -20 | tee APK_IDENTITY.txt
          unzip -t "$AAB_OUT" >/dev/null
          sha256sum "$APK_OUT" "$AAB_OUT" > SHA256SUMS.txt
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.1.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.1.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: FUSH-Customer-V1-Unsigned
          path: |
            customer-v1-src/FUSH_Customer_V1-UNSIGNED-ALIGNED.apk
            customer-v1-src/FUSH_Customer_V1-UNSIGNED.aab
            customer-v1-src/APK_IDENTITY.txt
            customer-v1-src/SHA256SUMS.txt
            customer-v1-src/UNIT_TEST_SUMMARY.txt
            customer-v1-src/signing-tools/apksigner
            customer-v1-src/signing-tools/lib/apksigner.jar
          if-no-files-found: error
