name: Build SHIBANI SOFT ERP v1.0.4 Room 55 to 56 Bootstrap Hotfix

on:
  push:
    branches:
      - fush-customer-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify exact SHIBANI v1.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file'
          SHARE='NAXfs1h4--Jc'
          FILE='01a08f7520c6750ca4497dd6c943fa93'
          COOKIE=/tmp/firestorage.cookies
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "$BASE/shares/$SHARE/cushion-sessions" --data '{"password":null}' -o /tmp/cushion.json
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/shares/$SHARE/files/$FILE/download" -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          with open('/tmp/download.json', encoding='utf-8') as f:
              data=json.load(f)
          url=data.get('downloadUrl')
          if not url: raise SystemExit('downloadUrl missing')
          print(url)
          PY
          )"
          curl -fL "$DOWNLOAD_URL" -o /tmp/shibani-v104-source.zip
          echo 'dea928b598f6075954091e0e8464892fd838669d82c5f90cc297ae276ba10e09  /tmp/shibani-v104-source.zip' | sha256sum -c -
          rm -rf customer-v1-src && mkdir -p customer-v1-src
          unzip -oq /tmp/shibani-v104-source.zip -d customer-v1-src
          grep 'applicationId = "com.shibanisoft.erp"' customer-v1-src/app/build.gradle.kts
          grep 'versionCode = 5' customer-v1-src/app/build.gradle.kts
          grep 'versionName = "1.0.4"' customer-v1-src/app/build.gradle.kts
          grep 'const val FUSH_DB_SCHEMA_VERSION = 56' customer-v1-src/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep 'MIGRATION_55_56_LOCAL_COMPANY_IDENTITY' customer-v1-src/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt
          grep 'MIGRATION_55_56_LOCAL_COMPANY_IDENTITY' customer-v1-src/app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! grep -R 'fallbackToDestructiveMigration' customer-v1-src/app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify Room 55 to 56 bootstrap hotfix
        run: cd customer-v1-src && python3 tools/verify_shibani_room55_56_bootstrap_hotfix.py

      - name: Verify P0 central license lock regression
        run: cd customer-v1-src && python3 tools/verify_shibani_license_locked_gate.py

      - name: Unit tests
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failures=errors=skipped=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              total += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0)); skipped += int(root.attrib.get('skipped',0))
          summary=f'UNIT_TESTS total={total} failures={failures} errors={errors} skipped={skipped}'
          print(summary)
          open('UNIT_TEST_SUMMARY.txt','w').write(summary+'\n')
          if total == 0 or failures or errors: raise SystemExit(1)
          PY

      - name: Compile Android tests
        run: cd customer-v1-src && gradle --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Run real Room 55 to 56 production bootstrap migration on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd customer-v1-src
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.data.AccountingWaveBRoomBootstrap55To56Test

      - name: Run direct Room 55 to 56 migration preservation test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd customer-v1-src
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.data.LocalCompanyIdentityMigrationTest

      - name: Assemble release APK
        run: cd customer-v1-src && gradle --no-daemon :app:assembleRelease

      - name: Build release AAB
        run: cd customer-v1-src && gradle --no-daemon :app:bundleRelease

      - name: Release lint
        run: cd customer-v1-src && gradle --no-daemon :app:lintVitalRelease

      - name: Align and identify release outputs
        shell: bash
        run: |
          set -euo pipefail
          cd customer-v1-src
          ZIPALIGN="$ANDROID_HOME/build-tools/36.1.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK_OUT='SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED-ALIGNED.apk'
          AAB_OUT='SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED.aab'
          "$ZIPALIGN" -f -v 4 "$APK" "$APK_OUT"
          "$ZIPALIGN" -c -v 4 "$APK_OUT"
          cp "$AAB" "$AAB_OUT"
          "$AAPT2" dump badging "$APK_OUT" | head -20 | tee APK_IDENTITY.txt
          grep "package: name='com.shibanisoft.erp' versionCode='5' versionName='1.0.4'" APK_IDENTITY.txt
          unzip -t "$AAB_OUT" >/dev/null
          sha256sum "$APK_OUT" "$AAB_OUT" > SHA256SUMS.txt
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.1.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.1.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: SHIBANI-SOFT-ERP-v1.0.4-Room55To56BootstrapHotfix-Unsigned
          path: |
            customer-v1-src/SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED-ALIGNED.apk
            customer-v1-src/SHIBANI_SOFT_ERP_v1.0.4-Room55To56BootstrapHotfix-UNSIGNED.aab
            customer-v1-src/APK_IDENTITY.txt
            customer-v1-src/SHA256SUMS.txt
            customer-v1-src/UNIT_TEST_SUMMARY.txt
            customer-v1-src/app/build/outputs/androidTest-results/connected/**
            customer-v1-src/signing-tools/apksigner
            customer-v1-src/signing-tools/lib/apksigner.jar
          if-no-files-found: error
