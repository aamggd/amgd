name: Build SHIBANI SOFT ERP v1.0.3 License Locked Gate R6

on:
  push:
    branches:
      - fush-customer-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify exact SHIBANI v1.0.3 R6 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file'
          SHARE='2A7QvZeyChnW'
          FILE='01a08f42d553736ea88bd0d6bf9ec954'
          COOKIE=/tmp/firestorage.cookies
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "$BASE/shares/$SHARE/cushion-sessions" --data '{"password":null}' -o /tmp/cushion.json
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/shares/$SHARE/files/$FILE/download" -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          with open('/tmp/download.json', encoding='utf-8') as f:
              data=json.load(f)
          url=data.get('downloadUrl')
          if not url: raise SystemExit('downloadUrl missing')
          print(url)
          PY
          )"
          curl -fL "$DOWNLOAD_URL" -o /tmp/shibani-v103-r6-source.zip
          echo 'ce22d8d124a6d7c023df2eebe1328fea4f8cfa66bc0704539f15b03428d75288  /tmp/shibani-v103-r6-source.zip' | sha256sum -c -
          rm -rf customer-v1-src && mkdir -p customer-v1-src
          unzip -oq /tmp/shibani-v103-r6-source.zip -d customer-v1-src
          test -f customer-v1-src/settings.gradle.kts
          grep 'applicationId = "com.shibanisoft.erp"' customer-v1-src/app/build.gradle.kts
          grep 'versionCode = 4' customer-v1-src/app/build.gradle.kts
          grep 'versionName = "1.0.3"' customer-v1-src/app/build.gradle.kts
          grep 'const val FUSH_DB_SCHEMA_VERSION = 56' customer-v1-src/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep 'const val EXPECTED_APPLICATION_ID = "com.shibanisoft.erp"' customer-v1-src/app/src/main/java/com/fush/erp/domain/ReleaseIdentityVerifier.kt
          grep 'EXPECTED_CERT_SHA256 = "22D5E2A8BD48DDD2339ABDC4748648B509E02D046524D6E118FBE05088155586"' customer-v1-src/app/src/main/java/com/fush/erp/domain/ReleaseIdentityVerifier.kt
          test -f customer-v1-src/app/src/androidTest/java/com/fush/erp/data/LicenseLockedOperationalWriteIntegrationTest.kt
          ! grep -R 'fallbackToDestructiveMigration' customer-v1-src/app/src/main/java
          ! grep -R -E 'sb_secret_[A-Za-z0-9_-]{8,}|service[_-]?role[[:space:]]*=' customer-v1-src/app/build.gradle.kts customer-v1-src/app/src/main 2>/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify P0 central license lock
        run: cd customer-v1-src && python3 tools/verify_shibani_license_locked_gate.py
      - name: Verify commercial closeout regression
        run: cd customer-v1-src && python3 tools/verify_shibani_commercial_closeout.py
      - name: Verify Local Only flow regression
        run: cd customer-v1-src && python3 tools/verify_shibani_local_only_flow_fix.py
      - name: Verify release identity
        run: cd customer-v1-src && python3 tools/verify_shibani_release_identity_hotfix.py
      - name: Verify auth clarity regression
        run: cd customer-v1-src && python3 tools/verify_v220_cloud_auth_error_clarity.py
      - name: Verify Customer inventory and operational sync regression
        run: cd customer-v1-src && python3 tools/verify_customer_v1_release.py
      - name: Verify SHIBANI customer flow
        run: cd customer-v1-src && python3 tools/verify_shibani_customer_client_flow.py

      - name: Unit tests
        shell: bash
        run: |
          cd customer-v1-src
          gradle --no-daemon :app:testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failures=errors=skipped=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              total += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0)); skipped += int(root.attrib.get('skipped',0))
          summary=f'UNIT_TESTS total={total} failures={failures} errors={errors} skipped={skipped}'
          print(summary)
          open('UNIT_TEST_SUMMARY.txt','w').write(summary+'\n')
          if total == 0 or failures or errors: raise SystemExit(1)
          PY

      - name: Compile Android tests
        run: cd customer-v1-src && gradle --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Run license-lock operational write test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd customer-v1-src && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.data.LicenseLockedOperationalWriteIntegrationTest

      - name: Assemble release APK
        run: cd customer-v1-src && gradle --no-daemon :app:assembleRelease
      - name: Build release AAB
        run: cd customer-v1-src && gradle --no-daemon :app:bundleRelease
      - name: Release lint
        run: cd customer-v1-src && gradle --no-daemon :app:lintVitalRelease

      - name: Align and identify release outputs
        shell: bash
        run: |
          set -euo pipefail
          cd customer-v1-src
          ZIPALIGN="$ANDROID_HOME/build-tools/36.1.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK_OUT='SHIBANI_SOFT_ERP_v1.0.3-LicenseLockedGate-UNSIGNED-ALIGNED.apk'
          AAB_OUT='SHIBANI_SOFT_ERP_v1.0.3-LicenseLockedGate-UNSIGNED.aab'
          "$ZIPALIGN" -f -v 4 "$APK" "$APK_OUT"
          "$ZIPALIGN" -c -v 4 "$APK_OUT"
          cp "$AAB" "$AAB_OUT"
          "$AAPT2" dump badging "$APK_OUT" | head -20 | tee APK_IDENTITY.txt
          grep "package: name='com.shibanisoft.erp' versionCode='4' versionName='1.0.3'" APK_IDENTITY.txt
          unzip -t "$AAB_OUT" >/dev/null
          sha256sum "$APK_OUT" "$AAB_OUT" > SHA256SUMS.txt
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.1.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.1.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: SHIBANI-SOFT-ERP-v1.0.3-LicenseLockedGate-Unsigned
          path: |
            customer-v1-src/SHIBANI_SOFT_ERP_v1.0.3-LicenseLockedGate-UNSIGNED-ALIGNED.apk
            customer-v1-src/SHIBANI_SOFT_ERP_v1.0.3-LicenseLockedGate-UNSIGNED.aab
            customer-v1-src/APK_IDENTITY.txt
            customer-v1-src/SHA256SUMS.txt
            customer-v1-src/UNIT_TEST_SUMMARY.txt
            customer-v1-src/app/build/outputs/androidTest-results/connected/**
            customer-v1-src/signing-tools/apksigner
            customer-v1-src/signing-tools/lib/apksigner.jar
          if-no-files-found: error
