name: Build FUSH Integrated Updates 14.5.52

on:
  push:
    branches: [fush/integration-updates-14.5.52]
    paths:
      - '.github/workflows/build-integration-updates-14.5.52.yml'
      - 'integration_14_5_52/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Download validated final 14.5.48 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.48-Final-Integrated-Build
          path: artifacts/base48
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31870087495

      - name: Verify and decode deterministic 14.5.52 payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find integration_14_5_52/payload -maxdepth 1 -type f -name 'chunk_*.b64' | wc -l)" -eq 9
          cat integration_14_5_52/payload/chunk_*.b64 > phase14_5_52.b64
          echo '8e1ba7f68263a7d107c50b794f5cd14ff7810e68cc14155ed39c418ee3535161  phase14_5_52.b64' | sha256sum -c -
          base64 -d phase14_5_52.b64 > phase14_5_52.patch.gz
          echo 'c10d0f04d854684fc258ffe6683d6a70352257b160e6878fe2a691cef1a6edf0  phase14_5_52.patch.gz' | sha256sum -c -
          gzip -dc phase14_5_52.patch.gz > phase14_5_52.patch
          echo '4f2cded03d35668227617fe7087689cd7b4e613e56a0ce2b005ee98d3f337463  phase14_5_52.patch' | sha256sum -c -

      - name: Reproduce exact integrated 14.5.52 source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/base48 final-repo
          unzip -q artifacts/base48/FushERP-Mobile-Phase14.5.48-Final-Integrated-Source.zip -d sources/base48
          BASE=$(find sources/base48 -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$BASE"
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' "$BASE/" final-repo/
          cd final-repo
          git init -q
          git config user.email integration@fush.local
          git config user.name FUSH
          git add -A
          git commit -qm 'validated 14.5.48 source package'
          git apply --check "$GITHUB_WORKSPACE/phase14_5_52.patch"
          git apply "$GITHUB_WORKSPACE/phase14_5_52.patch"
          git diff --check
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          TREE=$(git write-tree)
          echo "Integrated tree: $TREE"
          test "$TREE" = '769c4ecd7f7a31ae2c009c05c0258d55574f9a0c'

      - name: Central integrity and security gates
        shell: bash
        working-directory: final-repo
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 91' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.52-integrated-updates"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_32_33_SECURITY' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'MIGRATION_33_34_FIXED_ASSETS' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'Migration(33, 34)' app/src/main/java/com/fush/erp/data/Migrations.kt
          ! grep -R -n -E 'fallbackToDestructiveMigration|fallbackToDestructiveMigrationFrom' app/src/main/java
          grep -q 'securityService.authenticate' app/src/main/java/com/fush/erp/ui/screens/LoginScreen.kt
          grep -q 'MfaSetupRequired' app/src/main/java/com/fush/erp/ui/screens/LoginScreen.kt
          ! grep -q 'PasswordHasher.verify' app/src/main/java/com/fush/erp/ui/screens/LoginScreen.kt
          grep -q 'InitialAdminSetupScreen' app/src/main/java/com/fush/erp/ui/FushErpApp.kt
          grep -q 'MfaSetupScreen' app/src/main/java/com/fush/erp/ui/FushErpApp.kt
          grep -q 'ChangePasswordScreen' app/src/main/java/com/fush/erp/ui/FushErpApp.kt
          grep -q 'SecurityPermissions.COLLECTION_POST' app/src/main/java/com/fush/erp/domain/SalesService.kt
          grep -q 'SecurityPermissions.SUPPLIER_PAYMENT_POST' app/src/main/java/com/fush/erp/domain/PurchaseService.kt
          grep -q 'FixedAssetService' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'InventoryReportMath' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          en = Path('app/src/main/res/values/strings.xml')
          ar = Path('app/src/main/res/values-ar/strings.xml')
          e = ET.parse(en).getroot()
          a = ET.parse(ar).getroot()
          ek = {x.attrib['name'] for x in e.findall('string')}
          ak = {x.attrib['name'] for x in a.findall('string')}
          assert ek == ak, (len(ek), len(ak), sorted(ek-ak)[:10], sorted(ak-ek)[:10])
          assert len(ek) >= 192, len(ek)
          print('Localization keys:', len(ek))
          PY

      - name: Unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Release build
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Validate APK identity schema and zipalign
        shell: bash
        run: |
          set -euo pipefail
          REPO=final-repo
          APK="$REPO/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.fush.erp.recovery' versionCode='91' versionName='0.15.4.52-integrated-updates'" apk-badging.txt
          test -s "$REPO/app/schemas/com.fush.erp.data.FushDatabase/34.json"
          grep -q '"version": 34' "$REPO/app/schemas/com.fush.erp.data.FushDatabase/34.json"
          test -s "$REPO/app/schemas/com.fush.erp.data.FushDatabase/33.json"
          mkdir -p final-output/apksigner/lib
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -p -f 4 "$APK" final-output/FushERP-Phase14.5.52-Integrated-Updates-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -v 4 final-output/FushERP-Phase14.5.52-Integrated-Updates-aligned-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" final-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" final-output/apksigner/lib/apksigner.jar
          chmod +x final-output/apksigner/apksigner
          sha256sum final-output/FushERP-Phase14.5.52-Integrated-Updates-aligned-unsigned.apk > final-output/FushERP-Phase14.5.52-Integrated-Updates-aligned-unsigned.apk.sha256

      - name: Package full validated source and report
        shell: bash
        run: |
          set -euo pipefail
          rm -rf FushERP_Mobile_Phase14_5_52_Integrated_Updates
          mkdir FushERP_Mobile_Phase14_5_52_Integrated_Updates
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' final-repo/ FushERP_Mobile_Phase14_5_52_Integrated_Updates/
          zip -qr final-output/FushERP-Mobile-Phase14.5.52-Integrated-Updates-Source.zip FushERP_Mobile_Phase14_5_52_Integrated_Updates
          sha256sum final-output/FushERP-Mobile-Phase14.5.52-Integrated-Updates-Source.zip > final-output/FushERP-Mobile-Phase14.5.52-Integrated-Updates-Source.zip.sha256
          cat > final-output/FushERP-Phase14.5.52-INTEGRATION-REPORT.txt <<'EOF'
          FUSH ERP Mobile — Central Integrated Updates Phase 14.5.52
          App ID: com.fush.erp.recovery
          versionCode: 91
          versionName: 0.15.4.52-integrated-updates
          Room schema: 34
          Prior central schema: 33
          New central migration: 33 -> 34 Fixed Assets
          Existing security migration preserved: 32 -> 33
          Validated source tree before build products: 769c4ecd7f7a31ae2c009c05c0258d55574f9a0c
          Deterministic integration patch SHA256: 4f2cded03d35668227617fe7087689cd7b4e613e56a0ce2b005ee98d3f337463

          Integrated streams:
          - Accounting 14.5.40 Fixed Asset Accounting
          - Accounting 14.5.41 Multi-Invoice Settlement
          - Reports/Printing 14.5.47 through 14.5.51
          - UI 14.5.48 through 14.5.50
          - Existing users/permissions security stream preserved from final 14.5.48

          Gates:
          - deterministic payload and source tree
          - security/RBAC/MFA static invariants
          - no destructive Room fallback
          - Room migration continuity 32->33->34
          - Arabic/English localization key parity
          - unit tests
          - release build
          - APK package/version/schema validation
          - zipalign

          Permanent project signing remains outside GitHub and is performed only after this unsigned artifact passes all gates.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.52-Integrated-Updates-Build
          path: final-output/
          if-no-files-found: error
          retention-days: 7
