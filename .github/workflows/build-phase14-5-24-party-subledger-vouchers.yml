name: Build Fush ERP Phase 14.5.24 Party Subledger Vouchers

on:
  push:
    branches: [agent/phase14-5-24-party-subledger-vouchers]
    paths:
      - '.github/workflows/build-phase14-5-24-party-subledger-vouchers.yml'
      - 'phase14_5_24_party_subledger_vouchers/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.23 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.23-Legacy-Lot-Assignment-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31757260560
      - name: Restore Phase 14.5.23 source
        run: |
          unzip -q previous-build/FushERP-Mobile-Phase14.5.23-Source.zip
          grep -q 'versionCode = 62' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply Phase 14.5.24 party subledger patch
        shell: bash
        run: |
          set -e
          cat phase14_5_24_party_subledger_vouchers/part_*.b64 | base64 -d | gunzip > phase14524.diff
          cd FushERP_Mobile_Phase5
          patch -p1 < ../phase14524.diff
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q '0.15.4.24-party-subledger-vouchers' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 24' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'PartyVoucherEntity::class' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_23_24' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'customerId: Long? = null' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'يجب تحديد العميل عند استخدام حساب العملاء' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'يجب تحديد المورد عند استخدام حساب الموردين' app/src/main/java/com/fush/erp/domain/AccountingService.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug and release APKs
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify Room schema 24
        run: |
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        run: |
          mkdir -p phase14-5-24-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/debug/app-debug.apk phase14-5-24-output/FushERP-Phase14.5.24-debug.apk
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-24-output/FushERP-Phase14.5.24-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-24-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-24-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-24-output/apksigner/apksigner
          zip -qr phase14-5-24-output/FushERP-Mobile-Phase14.5.24-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-24-output/FushERP-Phase14.5.24-debug.apk > phase14-5-24-output/FushERP-Phase14.5.24-debug.apk.sha256
          sha256sum phase14-5-24-output/FushERP-Phase14.5.24-unsigned.apk > phase14-5-24-output/FushERP-Phase14.5.24-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.24 — Party Subledger & Linked Vouchers' \
            'Version: 0.15.4.24-party-subledger-vouchers (versionCode 63)' \
            'Room schema: 24' \
            '' \
            'Implemented:' \
            '- Separate customer and supplier workspaces with party profiles.' \
            '- Unified chronological customer/supplier statements including party vouchers and reversals.' \
            '- General receipt/payment vouchers link by customerId, supplierId or employeeId when required.' \
            '- Mandatory party validation for customer/supplier control accounts.' \
            '- Voucher posting, GL entry, party link and audit occur in one Room transaction.' \
            '- Posted party vouchers are corrected by reversal with reason/user/timestamp; no direct edit/delete path.' \
            '- Quick receipt/payment creation from customer and supplier profiles.' \
            '- Party attachments and audit tabs.' \
            > phase14-5-24-output/FushERP-Phase14.5.24-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.24-Party-Subledger-Vouchers-Build
          path: phase14-5-24-output/
          if-no-files-found: error
          retention-days: 7
