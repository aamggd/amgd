name: Build Fush ERP Phase 14.2.1 Planning Menu Fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-2-1-planning-menu.yml'
      - 'phase14_2_1_planning_menu/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.2-Demand-Plan-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31557739829
      - name: Restore Phase 14.2 source
        run: |
          unzip -q previous-build/FushERP-Mobile-Phase14.2-Source.zip
          test -d FushERP_Mobile_Phase5
      - name: Apply Phase 14.2.1 fix
        run: python phase14_2_1_planning_menu/apply_patch.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        run: |
          rm -rf phase14-2-1-output
          mkdir -p phase14-2-1-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-2-1-output/FushERP-Phase14.2.1-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-2-1-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-2-1-output/apksigner/lib/apksigner.jar
          chmod +x phase14-2-1-output/apksigner/apksigner
          zip -qr phase14-2-1-output/FushERP-Mobile-Phase14.2.1-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-2-1-output/FushERP-Phase14.2.1-unsigned.apk > phase14-2-1-output/FushERP-Phase14.2.1-unsigned.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.2.1-Planning-Menu-Fix-Build
          path: phase14-2-1-output/
          if-no-files-found: error
          retention-days: 7
