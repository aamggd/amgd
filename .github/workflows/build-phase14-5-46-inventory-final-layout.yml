name: Freeze Fush ERP Phase 14.5.46 Inventory UI Handoff

on:
  push:
    branches: [fush/ui-inventory-final-layout-14.5.46]
    paths:
      - 'phase14_5_46/**'
      - '.github/workflows/build-phase14-5-46-inventory-final-layout.yml'
  workflow_dispatch:

concurrency:
  group: fush-ui-inventory-14-5-46
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freeze-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm emulator visual test is disabled
        run: |
          echo 'Phase 14.5.46 visual emulator test stopped by central integration decision.'
          echo 'The UI/layout handoff files remain available for merge into fush/ui-professional-redesign.'
