name: FUSH ERP v237 Local Access Gate

on:
  push:
    branches: [ci-v237-local-access-20261119]
    paths:
      - '.github/workflows/v237-local-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Download v237 source and check SHA-256
        shell: bash
        env:
          SHARE_ID: "-szeyYxgleot"
          EXPECTED_SHA256: "c61ee9729252a1f9470b6b4cacab74d8d76b0dc9794a025b6762d7d55362618a"
        run: |
          set -euxo pipefail
          BASE="https://api.firestorage.ai/dev/file"
          curl -fLsS --retry 3 "$BASE/shares/$SHARE_ID/files?maxResults=1000" -o files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('files.json')); f=d.get('files') or []
          if len(f)!=1: raise SystemExit(f'expected one source zip, got {len(f)}')
          print(f[0]['fileId'])
          PY
          )
          curl -fLsS --retry 3 -X POST "$BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          URL=$(python3 - <<'PY'
          import json
          print(json.load(open('download.json'))['downloadUrl'])
          PY
          )
          curl -fLsS --retry 3 "$URL" -o source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          mkdir -p src
          unzip -q source.zip -d src
      - name: Source regressions and v237 policy gate
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          python3 tools/test_v225_backend_hardening.py
          python3 tools/test_v227_local_ai_actions.py
          python3 tools/test_v228_cloud_sync_hotfix.py
          python3 tools/test_v229_conflict_resolution_hotfix.py
          python3 tools/test_v230_cloud_connectivity_diagnostics.py
          python3 tools/test_v231_posted_journal_collision_hardening.py
          python3 tools/test_v232_posted_journal_immutable_runtime_guard.py
          python3 tools/test_v233_sync_all_preflight_resilience.py
          python3 tools/test_v236_sync_all_main_thread_hotfix.py
          python3 tools/test_v237_local_access.py
      - name: All JVM unit tests
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee ../v237-unit-test.log
      - name: Build release APK and AAB
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee ../v237-release-build.log
      - name: Package unsigned outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find src/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find src/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"; test -s "$AAB"
          cp "$APK" out/FUSH_ERP_Mobile_v237-LocalAccessAlwaysAvailable-UNSIGNED.apk
          cp "$AAB" out/FUSH_ERP_Mobile_v237-LocalAccessAlwaysAvailable-UNSIGNED.aab
          cp v237-unit-test.log v237-release-build.log out/
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v237-BUILD-TESTED-UNSIGNED
          path: out
          if-no-files-found: error
