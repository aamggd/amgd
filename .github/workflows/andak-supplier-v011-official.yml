name: ANDAK Supplier v0.1.1 Official Source Gate0

on:
  push:
    branches:
      - 'andak-supplier-build-v011'
    paths:
      - '.github/workflows/andak-supplier-v011-official.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-gate0:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmd.zip
          rm -rf /tmp/cmd && mkdir -p /tmp/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download exact official source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/Sjz2YeEiiC8D'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v0.1.1-OFFICIAL-SOURCE-FIXED.zip"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$DOWNLOAD_URL" -o /tmp/official-source.zip
          echo 'd67adee8dcb4eb84efc9925f72e67d40fc5a2217c5a7fee1ddbb05928c5b66bf  /tmp/official-source.zip' | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/official"
          unzip -q /tmp/official-source.zip -d "$GITHUB_WORKSPACE/official"
          SRC=$(find "$GITHUB_WORKSPACE/official" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=d67adee8dcb4eb84efc9925f72e67d40fc5a2217c5a7fee1ddbb05928c5b66bf" >> "$GITHUB_ENV"

      - name: Official source static gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.market.supplier"' "$SRC/apps/supplier/build.gradle.kts"
          grep -q 'versionCode = 2' "$SRC/apps/supplier/build.gradle.kts"
          grep -q 'versionName = "0.1.1"' "$SRC/apps/supplier/build.gradle.kts"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$SRC/apps/supplier/src/main/AndroidManifest.xml"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$SRC/apps/supplier/src/main/AndroidManifest.xml"
          grep -q 'android:supportsRtl="true"' "$SRC/apps/supplier/src/main/AndroidManifest.xml"
          grep -q '<string name="app_name">عندك للمورد</string>' "$SRC/apps/supplier/src/main/res/values/strings.xml"
          grep -q 'logoRawRes = R.raw.andak_supplier_logo' "$SRC/apps/supplier/src/main/java/com/fush/market/supplier/MainActivity.kt"
          grep -q 'SafeRawLogo' "$SRC/core/ui/src/main/java/com/fush/market/core/ui/AndakApp.kt"
          test -s "$SRC/apps/supplier/src/main/res/raw/andak_supplier_logo.webp"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$SRC/apps/supplier/src/main/res/mipmap-$d/ic_launcher.webp"
            test -s "$SRC/apps/supplier/src/main/res/mipmap-$d/ic_launcher_round.webp"
            test -s "$SRC/apps/supplier/src/main/res/mipmap-$d/ic_launcher_foreground.webp"
          done
          echo OFFICIAL_STATIC_GATE_PASS

      - name: Build exact official supplier
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          gradle :apps:supplier:assembleDebug :apps:supplier:assembleRelease :apps:supplier:bundleRelease --no-daemon --stacktrace

      - name: Write runtime test
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/runtime-official.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          P=com.fush.market.supplier
          APK="$SRC/apps/supplier/build/outputs/apk/debug/supplier-debug.apk"
          test -f "$APK"
          adb uninstall "$P" >/dev/null 2>&1 || true
          adb install "$APK"
          adb logcat -c
          adb shell am start -W -n "$P/.MainActivity" > "$GITHUB_WORKSPACE/official-start.txt" 2>&1 || true
          sleep 7
          PID="$(adb shell pidof "$P" | tr -d '\r' || true)"
          echo "$PID" > "$GITHUB_WORKSPACE/official-pid.txt"
          adb logcat -d -b crash > "$GITHUB_WORKSPACE/official-crash.log" || true
          adb logcat -d | grep -E "AndroidRuntime|$P|FATAL EXCEPTION|ResourceResolutionException|Caused by" > "$GITHUB_WORKSPACE/official-relevant.log" || true
          test -n "$PID"
          if grep -q "$P" "$GITHUB_WORKSPACE/official-crash.log"; then
            echo "FATAL: official supplier crash detected"
            cat "$GITHUB_WORKSPACE/official-crash.log"
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/official-screen.png" || true
          adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/official-window.xml" >/dev/null 2>&1 || true
          echo OFFICIAL_RUNTIME_PASS
          EOF
          chmod +x "$GITHUB_WORKSPACE/runtime-official.sh"

      - name: Runtime official API 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/runtime-official.sh"

      - name: Package exact official outputs
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/dist"
          mkdir -p "$D"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4             "$SRC/apps/supplier/build/outputs/apk/release/supplier-release-unsigned.apk"             "$D/ANDAK-Supplier-v0.1.1-OFFICIAL-ALIGNED-UNSIGNED.apk"
          cp "$SRC/apps/supplier/build/outputs/bundle/release/supplier-release.aab" "$D/ANDAK-Supplier-v0.1.1-OFFICIAL-UNSIGNED.aab"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$D/ANDAK-Supplier-v0.1.1-OFFICIAL-ALIGNED-UNSIGNED.apk" > "$D/aapt-badging.txt"
          cp /tmp/official-source.zip "$D/ANDAK-Supplier-v0.1.1-OFFICIAL-SOURCE-FIXED.zip"
          cp "$GITHUB_WORKSPACE"/official-{start.txt,pid.txt,crash.log,relevant.log,screen.png} "$D/" 2>/dev/null || true
          test -f "$GITHUB_WORKSPACE/official-window.xml" && cp "$GITHUB_WORKSPACE/official-window.xml" "$D/" || true
          printf '%s\n'             'ANDAK Supplier v0.1.1 — Exact Official Source'             'applicationId=com.fush.market.supplier'             'versionCode=2'             'versionName=0.1.1'             'Source SHA-256=d67adee8dcb4eb84efc9925f72e67d40fc5a2217c5a7fee1ddbb05928c5b66bf'             'Static gate=PASS'             'Build debug/release/AAB=PASS'             'Runtime API29=PASS'             'Crash buffer=clean for com.fush.market.supplier'             'Signing=pending permanent-key local signing'             > "$D/OFFICIAL-BUILD-RESULT.txt"
          (cd "$D" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v0.1.1-OFFICIAL-GATE0-PASS
          path: dist/
          if-no-files-found: error
          retention-days: 7
