name: Export Integration Sources 14.5.43
on:
  push:
    branches: [fush/integration-all-14.5.43]
    paths: ['.github/workflows/export-integration-sources-14-5-43.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 14.5.38 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.38-Professional-UI-Build
          path: baseline38
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31858347166
      - name: Download 14.5.33 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.33-Expense-Dimensions-Build
          path: baseline33
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31854443269
      - name: Fetch integration branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fush/ui-professional-redesign fush/accounting fush/users-permissions --depth=1
          git archive --format=tar origin/fush/ui-professional-redesign phase14_5_39_production_quality_ui phase14_5_40_employees_sales_reps_ui phase14_5_41_assets_maintenance_expenses_ui phase14_5_42_reports_adaptive_ui | tar -xf -
          git archive --format=tar origin/fush/accounting fush_accounting | tar -xf -
          git archive --format=tar origin/fush/users-permissions phase14_5_34_users_permissions | tar -xf -
      - name: Compose current UI42 + Accounting35 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work-current
          cd work-current
          unzip -q ../baseline38/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip
          cd FushERP_Mobile_Phase5
          git init -q
          git config user.name CI
          git config user.email ci@example.invalid
          git add -A && git commit -qm base
          for phase in phase14_5_39_production_quality_ui phase14_5_40_employees_sales_reps_ui phase14_5_41_assets_maintenance_expenses_ui phase14_5_42_reports_adaptive_ui; do
            for p in ../../$phase/patches/*.patch; do
              if git apply --check "$p"; then
                git apply "$p"
              else
                cp "$p" /tmp/uip.patch
                printf '\n' >> /tmp/uip.patch
                git apply --recount /tmp/uip.patch
              fi
            done
          done
          base64 -d ../../fush_accounting/patches/phase14.5.34-accounting-integrity.patch.gz.b64 | gzip -dc > /tmp/a34.patch
          base64 -d ../../fush_accounting/patches/phase14.5.35-accounting-periods-reconciliation.patch.gz.b64 | gzip -dc > /tmp/a35.patch
          git apply --exclude=app/build.gradle.kts --exclude=app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt /tmp/a34.patch
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          raw=Path('/tmp/a34.patch').read_text(); target='app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt'
          part=next(p for p in re.split(r'(?=^diff --git )',raw,flags=re.M) if p.startswith('diff --git ') and f' b/{target}' in p.splitlines()[0])
          subprocess.run(['patch','-p1','--forward','--fuzz=3'],input=part,text=True,check=False)
          p=Path(target); s=p.read_text()
          s=s.replace('''                Button(onClick = { voucherType = "RECEIPT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند قبض") }\n                OutlinedButton(onClick = { voucherType = "PAYMENT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند صرف") }''','''                Button(onClick = { showSettlement = true }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("تحصيل فاتورة") }\n                OutlinedButton(onClick = { message = "صرف مبلغ للعميل يجب أن يتم من مرتجع المبيعات مع اختيار رد نقدي حتى تبقى الفاتورة والذمة والأستاذ متطابقة." }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("صرف للعميل") }''',1)
          s=s.replace('''                Button(onClick = { voucherType = "PAYMENT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند صرف") }\n                OutlinedButton(onClick = { voucherType = "RECEIPT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند قبض") }''','''                Button(onClick = { showSettlement = true }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("دفع فاتورة") }\n                OutlinedButton(onClick = { message = "قبض مبلغ من المورد يجب أن يتم من مرتجع المشتريات مع اختيار استرداد نقدي حتى تبقى الفاتورة والذمة والأستاذ متطابقة." }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("قبض من المورد") }''',1)
          p.write_text(s)
          PY
          rm -f app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt.rej
          git apply --exclude=app/build.gradle.kts --exclude=app/src/main/java/com/fush/erp/ui/screens/AccountingScreens.kt /tmp/a35.patch
          python - <<'PY'
          from pathlib import Path
          import re
          patch=Path('/tmp/a35.patch').read_text(); target='app/src/main/java/com/fush/erp/ui/screens/AccountingScreens.kt'
          part=next(x for x in re.split(r'(?=^diff --git )',patch,flags=re.M) if x.startswith('diff --git ') and f' b/{target}' in x.splitlines()[0])
          added=[]; capture=False
          for line in part.splitlines():
              if line.startswith('+@Composable'): capture=True
              if capture:
                  if line.startswith('+') and not line.startswith('+++'): added.append(line[1:])
                  elif line.startswith(' @Composable') and added: break
          block='\n'.join(added).rstrip()+'\n\n'
          p=Path(target); s=p.read_text()
          s=s.replace('val tabs = listOf("اليومية", "الخزينة", "المصروفات", "قيد يدوي", "الأستاذ", "ميزان المراجعة", "قائمة الدخل", "المركز المالي", "التدفق النقدي")','val tabs = listOf("اليومية", "الخزينة", "المصروفات", "قيد يدوي", "الأستاذ", "ميزان المراجعة", "قائمة الدخل", "المركز المالي", "التدفق النقدي", "الفترات والمطابقة")',1)
          s=s.replace('''            7 -> BalanceSheetTab(container, Modifier.weight(1f))\n            else -> CashFlowTab(container, Modifier.weight(1f))''','''            7 -> BalanceSheetTab(container, Modifier.weight(1f))\n            8 -> CashFlowTab(container, Modifier.weight(1f))\n            else -> AccountingPeriodsTab(container, user, Modifier.weight(1f))''',1)
          s=s.replace('@Composable\nprivate fun JournalTab',block+'@Composable\nprivate fun JournalTab',1)
          p.write_text(s)
          PY
          cd ..
          zip -qr ../../Current-UI42-Accounting35-Source.zip FushERP_Mobile_Phase5
      - name: Compose users-permissions source from 14.5.33
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work-security
          cd work-security
          unzip -q ../baseline33/FushERP-Mobile-Phase14.5.33-Expense-Dimensions-Source.zip
          cd FushERP_Mobile_Phase5
          git init -q
          git config user.name CI
          git config user.email ci@example.invalid
          git add -A && git commit -qm base
          cp ../../phase14_5_34_users_permissions/patch_*.b64 ../../phase14_5_34_users_permissions/apply_patch.py .
          python apply_patch.py
          rm -f patch_*.b64 apply_patch.py
          cd ..
          zip -qr ../../Users-Permissions-Theirs-Source.zip FushERP_Mobile_Phase5
      - name: Upload source comparison bundle
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-14.5.43-Integration-Comparison-Sources
          path: |
            Current-UI42-Accounting35-Source.zip
            Users-Permissions-Theirs-Source.zip
          compression-level: 0
          retention-days: 3
