name: ANDAK Customer v0.1.1 Build

on:
  push:
    branches:
      - 'fush-market/gate0-build-20260918'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmd.zip
          mkdir -p /tmp/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download merged source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,urllib.request,sys
          share="https://firestorage.ai/ja/f/U-QKSF7_mnj0"
          req=urllib.request.Request(share,headers={"User-Agent":"Mozilla/5.0"})
          page=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
          page=html.unescape(page).replace("\\u0026","&").replace("\\/","/")
          urls=re.findall(r'https?://[^"\'<> ]+',page)
          candidates=[]
          for u in urls:
              lu=u.lower()
              if ".zip" in lu or "download" in lu or "storage" in lu:
                  candidates.append(u)
          for u in candidates:
              try:
                  req2=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Referer":share})
                  d=urllib.request.urlopen(req2,timeout=30).read()
                  if d.startswith(b"PK\x03\x04"):
                      open("/tmp/source.zip","wb").write(d)
                      print("downloaded",len(d),"bytes")
                      sys.exit(0)
              except Exception:
                  pass
          raise SystemExit("Could not resolve ZIP download from share page")
          PY
          mkdir -p /tmp/src
          unzip -q /tmp/source.zip -d /tmp/src
          SRC="$(find /tmp/src -type d -name fush-market-generated | head -1)"
          test -n "$SRC"
          cp -a "$SRC" "$GITHUB_WORKSPACE/andak-src"

      - name: Build customer and other apps
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/andak-src"
          gradle             :apps:customer:assembleRelease :apps:customer:bundleRelease             :apps:supplier:assembleRelease :apps:supplier:bundleRelease             :apps:driver:assembleRelease :apps:driver:bundleRelease             :apps:admin:assembleRelease :apps:admin:bundleRelease             --no-daemon --stacktrace

      - name: Align and package
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/andak-src"
          D="$GITHUB_WORKSPACE/dist"
          mkdir -p "$D"
          for APP in customer supplier driver admin; do
            IN="$P/apps/$APP/build/outputs/apk/release/$APP-release-unsigned.apk"
            OUT="$D/ANDAK-$APP-ALIGNED-UNSIGNED.apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$IN" "$OUT"
            cp "$P/apps/$APP/build/outputs/bundle/release/$APP-release.aab" "$D/ANDAK-$APP-UNSIGNED.aab"
          done
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          cp /tmp/source.zip "$D/ANDAK-Full-Source-Merged-Customer-v0.1.1.zip"
          (cd "$D" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Merged-Customer-v0.1.1-Build
          path: dist/
          if-no-files-found: error
          retention-days: 7
