name: ANDAK Customer v0.1.1 Runtime Smoke

on:
  push:
    branches:
      - 'fush-market/gate0-build-20260918'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download built Customer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download 35300778518 -n ANDAK-Customer-v0.1.1-Unsigned --dir artifact
          ls -lah artifact

      - name: Sign APK for runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore /tmp/runtime-smoke.p12 -storetype PKCS12 \
            -storepass runtime123 -keypass runtime123 -alias runtime \
            -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Runtime Smoke,O=ANDAK,C=YE'
          java -jar artifact/apksigner.jar sign \
            --ks /tmp/runtime-smoke.p12 --ks-type PKCS12 --ks-key-alias runtime \
            --ks-pass pass:runtime123 --key-pass pass:runtime123 \
            --out artifact/ANDAK-Customer-v0.1.1-RUNTIME.apk \
            artifact/ANDAK-customer-v0.1.1-ALIGNED-UNSIGNED.apk

      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r artifact/ANDAK-Customer-v0.1.1-RUNTIME.apk
            adb logcat -c
            adb shell am start -W -n com.fush.market.customer/.MainActivity
            sleep 5
            PID="$(adb shell pidof com.fush.market.customer | tr -d '\r' || true)"
            echo "PID=$PID"
            adb logcat -d -b crash > runtime-crash.log || true
            cat runtime-crash.log
            test -n "$PID"
            if grep -q 'com.fush.market.customer' runtime-crash.log; then
              echo 'FATAL: crash buffer contains customer package'
              exit 1
            fi
            echo 'RUNTIME_SMOKE_PASS'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANDAK-Customer-v0.1.1-Runtime-Evidence
          path: runtime-crash.log
          retention-days: 7