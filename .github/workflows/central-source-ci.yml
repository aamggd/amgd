name: Central Source CI

on:
  pull_request:
    paths:
      - 'central_source/**'
      - '.github/workflows/central-source-ci.yml'
  push:
    branches:
      - fush/integration-current
    paths:
      - 'central_source/**'
      - '.github/workflows/central-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-central:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify current Room schema baseline
        shell: bash
        run: |
          test -f central_source/app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt

      - name: Run unit tests
        working-directory: central_source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build current Central debug APK
        working-directory: central_source
        run: gradle --no-daemon :app:assembleDebug

      - name: Record APK checksum
        shell: bash
        run: |
          sha256sum central_source/app/build/outputs/apk/debug/app-debug.apk \
            > central_source/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload tested Central APK
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Central-debug-${{ github.sha }}
          path: |
            central_source/app/build/outputs/apk/debug/app-debug.apk
            central_source/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Reject uncommitted Room schema drift
        shell: bash
        run: git diff --exit-code -- central_source/app/schemas
