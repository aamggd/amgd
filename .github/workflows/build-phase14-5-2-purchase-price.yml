name: Build Fush ERP Phase 14.5.2 Purchase Price Comparison

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-2-purchase-price.yml'
      - 'phase14_5_2_purchase_price/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.1 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.1-Customer-Purchase-Details-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31639999249
      - name: Restore Phase 14.5.1 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.1-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 40' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.1-phase14.5-customer-purchase-details' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 17' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply Phase 14.5.2 purchase price comparison
        shell: bash
        run: |
          set -e
          python phase14_5_2_purchase_price/apply_patch.py
          grep -q 'versionCode = 41' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.2-phase14.5-purchase-price-compare' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'lastPurchasePrice' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'آخر سعر شراء:' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/PurchaseScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-2-output
          mkdir -p phase14-5-2-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-2-output/FushERP-Phase14.5.2-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-2-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-2-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-2-output/apksigner/apksigner
          zip -qr phase14-5-2-output/FushERP-Mobile-Phase14.5.2-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-2-output/FushERP-Phase14.5.2-unsigned.apk > phase14-5-2-output/FushERP-Phase14.5.2-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.2 — Last Purchase Price Comparison' \
            'Version: 0.15.4.2-phase14.5-purchase-price-compare (versionCode 41)' \
            'Room schema: 17 (unchanged)' \
            '' \
            'Scope:' \
            '- Shows last POSTED purchase price while entering a new purchase line.' \
            '- Comparison is by same item + same purchase unit + same currency.' \
            '- Shows prior supplier/date and price difference amount and percentage.' \
            '- No posting, inventory, accounting, or database-schema logic changed.' \
            > phase14-5-2-output/FushERP-Phase14.5.2-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.2-Purchase-Price-Build
          path: phase14-5-2-output/
          if-no-files-found: error
          retention-days: 7
