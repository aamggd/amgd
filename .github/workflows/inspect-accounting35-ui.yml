name: Inspect Accounting 14.5.35 UI
on:
  push:
    branches: [fush/integration-all-14.5.43]
    paths: ['.github/workflows/inspect-accounting35-ui.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print AccountingScreens contribution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fush/accounting --depth=1
          git show origin/fush/accounting:fush_accounting/patches/phase14.5.35-accounting-periods-reconciliation.patch.gz.b64 | base64 -d | gzip -dc > /tmp/a35.patch
          python - <<'PY'
          import pathlib,re
          raw=pathlib.Path('/tmp/a35.patch').read_text()
          target='app/src/main/java/com/fush/erp/ui/screens/AccountingScreens.kt'
          part=next(p for p in re.split(r'(?=^diff --git )',raw,flags=re.M) if p.startswith('diff --git ') and f' b/{target}' in p.splitlines()[0])
          print(part)
          PY
