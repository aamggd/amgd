name: Central Consolidation - UI Professional Redesign P1

on:
  push:
    branches: [fush/integration-current]
    paths:
      - '.github/workflows/central-consolidation-ui-p1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  INPUT_TREE: '75ee2644b578aa0697bfff960e2484a1f8234624'
  HANDOFF_SHA: 'a90367181746a2840f336882b5ccce826f04bb35'
  PATCH_SHA256: '946e1f848bbd579b4cdf0d2b174b71609c3eecd0f5c52bab8badc600eba5c38c'

jobs:
  integrate-ui-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fush/integration-current
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          cp -a central_source work-source
          cd work-source
          git init -q
          git config user.name central-integration-ci
          git config user.email central-integration-ci@users.noreply.github.com
          git add -A
          TREE=$(git write-tree)
          echo "input_tree=$TREE"
          test "$TREE" = "$INPUT_TREE"
          git commit -qm "Cumulative Central before UI P1"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -q 'AndroidKeyStore' app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'ADMIN_IDLE_MINUTES = 3L' app/src/main/java/com/fush/erp/domain/SecurityPolicy.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts

      - name: Fetch and apply exact validated UI P1 patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://raw.githubusercontent.com/aamggd/amgd/${HANDOFF_SHA}/phase14_5_54_ui_plan_p1_unified_design_system/payload/p1.patch.gz.b64" -o ui-p1.patch.gz.b64
          base64 -d ui-p1.patch.gz.b64 | gzip -dc > ui-p1.patch
          echo "${PATCH_SHA256}  ui-p1.patch" | sha256sum -c -
          cd work-source
          git apply --check ../ui-p1.patch
          git apply ../ui-p1.patch
          git diff --check
          git add -A
          git diff --cached --name-only | sort | tee ../ui-p1-changed-files.txt
          cat > ../ui-p1-expected-files.txt <<'EOF'
          UI_PLAN_P1_UNIFIED_DESIGN_SYSTEM_SCOPE.md
          app/src/main/java/com/fush/erp/ui/FushDesignSystem.kt
          app/src/main/java/com/fush/erp/ui/FushTheme.kt
          app/src/main/java/com/fush/erp/ui/ProfessionalComponents.kt
          app/src/main/java/com/fush/erp/ui/ProfessionalFormComponents.kt
          app/src/test/java/com/fush/erp/ui/FushDesignSystemContractTest.kt
          EOF
          sed -i 's/^          //' ../ui-p1-expected-files.txt
          sort -o ../ui-p1-expected-files.txt ../ui-p1-expected-files.txt
          diff -u ../ui-p1-expected-files.txt ../ui-p1-changed-files.txt
          git commit -qm "Integrate UI Professional Redesign P1"
          echo "ui_p1_source_tree=$(git write-tree)" | tee ../ui-p1-source-tree.txt

      - name: UI design-system domain regression
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.ui.FushDesignSystemContractTest'

      - name: Full unit tests
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Central safety checks
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -R -q 'MIGRATION_32_33_SECURITY' app/src/main/java
          grep -R -Eq 'Migration\(33, *34\)|MIGRATION_33_34' app/src/main/java
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          ! grep -R -nE 'deleteDatabase\(|clearAllTables\(' app/src/main/java/com/fush/erp
          grep -q 'AndroidKeyStore' app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'ADMIN_IDLE_MINUTES = 3L' app/src/main/java/com/fush/erp/domain/SecurityPolicy.kt
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Replace Central source with cumulative tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf central_source
          mkdir central_source
          git -C work-source archive --format=tar HEAD | tar -x -C central_source
          grep -q 'FushDimensions' central_source/app/src/main/java/com/fush/erp/ui/FushDesignSystem.kt
          grep -q 'AndroidKeyStore' central_source/app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'ADMIN_IDLE_MINUTES = 3L' central_source/app/src/main/java/com/fush/erp/domain/SecurityPolicy.kt

      - name: Commit actual cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central_source ui-p1-source-tree.txt
          git commit -m "Central integration: add UI Professional Redesign P1"
          git push origin HEAD:fush/integration-current
