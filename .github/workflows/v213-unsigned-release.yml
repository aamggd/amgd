name: v213 R2 Unsigned Release

on:
  push:
    branches: [v213-stock-issue-supplier-sales-build]
    paths:
      - '.github/workflows/v213-unsigned-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct clean v213 source transfer
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          files = [Path('ci/v213/build_source_parts/raw_000.b64')] + sorted(Path('ci/v213/continuation').glob('cont_*.b64'))
          assert files[0].exists(), 'raw_000 missing'
          out = bytearray()
          for p in files:
              s = ''.join(p.read_text().split())
              b = base64.b64decode(s, validate=True)
              out += b
              print(p, 'chars=', len(s), 'bytes=', len(b))
          Path('/tmp/v213.payload').write_bytes(out)
          r = subprocess.run(['xz','-t','/tmp/v213.payload'], capture_output=True, text=True)
          print('XZ_RC=', r.returncode, r.stderr.strip(), 'TOTAL_BYTES=', len(out))
          assert r.returncode == 0, 'Clean second transfer is not complete yet'
          PY
          file /tmp/v213.payload
          mkdir -p /tmp/v213src
          tar -xJf /tmp/v213.payload -C /tmp/v213src
          ROOT="$(find /tmp/v213src -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          find "$ROOT" -maxdepth 2 -type f | head -80

      - name: Verify exact v213 R2 identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -n 'versionCode = 213' "$ROOT/app/build.gradle.kts"
          grep -n '0.15.4.164-commercial-multitenant-foundation' "$ROOT/app/build.gradle.kts"
          grep -R -n 'FUSH_DB_SCHEMA_VERSION = 54' "$ROOT/app/src/main/java"
          test -f "$ROOT/app/src/main/java/com/fush/erp/data/V213CommercialTenantBindingMigration.kt"
          ! grep -R -n 'fallbackToDestructiveMigration' "$ROOT/app/src/main/java"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Host gate
        shell: bash
        run: |
          if [ -f "$ROOT/tools/v213_commercial_multitenant_host_gate.py" ]; then
            python "$ROOT/tools/v213_commercial_multitenant_host_gate.py"
          fi

      - name: Unit tests
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Release lint
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon :app:lintVitalRelease

      - name: Prepare aligned unsigned APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find "$ROOT/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p out
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" -p -f 4 "$APK" out/FUSH_ERP_Mobile_v213-CommercialMultiTenant-FOUNDATION-R2-ALIGNED-UNSIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" -c -v 4 out/FUSH_ERP_Mobile_v213-CommercialMultiTenant-FOUNDATION-R2-ALIGNED-UNSIGNED.apk
          sha256sum out/*.apk > out/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v213-R2-Unsigned-Release
          path: out
          if-no-files-found: error
          retention-days: 2
