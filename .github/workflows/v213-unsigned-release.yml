name: v213 R2 Unsigned Release

on:
  push:
    branches: [v213-stock-issue-supplier-sales-build]
    paths:
      - '.github/workflows/v213-unsigned-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v213 source archive
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, subprocess

          parts = sorted(Path('ci/v213/parts').glob('part_*.b64'))
          assert parts, 'No v213 parts found'
          payload = bytearray()
          for p in parts[:-1]:
              s = ''.join(p.read_text().split())
              payload += base64.b64decode(s, validate=True)
              print(p.name, 'decoded', len(s), 'chars')

          p = parts[-1]
          raw = ''.join(p.read_text().split())
          print(p.name, 'raw chars', len(raw), 'tail', repr(raw[-80:]))
          recovered = None
          recovered_cut = None
          # Find the longest valid Base64 prefix near the end.
          for cut in range(len(raw), max(0, len(raw)-512), -1):
              if cut % 4:
                  continue
              try:
                  decoded = base64.b64decode(raw[:cut], validate=True)
              except Exception:
                  continue
              recovered = decoded
              recovered_cut = cut
              break
          assert recovered is not None, 'Could not recover a valid Base64 prefix from final part'
          payload += recovered
          print('recovered final prefix chars', recovered_cut, 'ignored tail', repr(raw[recovered_cut:]))
          Path('/tmp/v213-base.payload').write_bytes(payload)

          candidates = [('/tmp/v213-base.payload', bytes(payload))]
          cont = Path('ci/v213/continuation/cont_000.b64')
          if cont.exists():
              cs = ''.join(cont.read_text().split())
              try:
                  cb = base64.b64decode(cs, validate=True)
                  candidates.append(('/tmp/v213-with-cont.payload', bytes(payload) + cb))
                  print('continuation decoded bytes', len(cb))
              except Exception as exc:
                  print('continuation decode failed', exc)

          chosen = None
          for name, data in candidates:
              Path(name).write_bytes(data)
              r = subprocess.run(['xz','-t',name], capture_output=True, text=True)
              print('xz test', name, 'rc=', r.returncode, r.stderr.strip())
              if r.returncode == 0:
                  chosen = name
                  break
          assert chosen, 'No complete XZ source payload found from uploaded v213 chunks'
          Path('/tmp/v213.payload').write_bytes(Path(chosen).read_bytes())
          print('CHOSEN', chosen, 'bytes', Path(chosen).stat().st_size)
          PY
          file /tmp/v213.payload
          mkdir -p /tmp/v213src
          tar -xJf /tmp/v213.payload -C /tmp/v213src
          find /tmp/v213src -maxdepth 3 -type f | head -80
          ROOT="$(find /tmp/v213src -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify exact v213 R2 identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -R -n 'versionCode = 213' "$ROOT/app/build.gradle.kts"
          grep -R -n '0.15.4.164-commercial-multitenant-foundation' "$ROOT/app/build.gradle.kts"
          grep -R -n 'FUSH_DB_SCHEMA_VERSION = 54' "$ROOT/app/src/main/java"
          test -f "$ROOT/app/src/main/java/com/fush/erp/data/V213CommercialTenantBindingMigration.kt"
          ! grep -R -n 'fallbackToDestructiveMigration' "$ROOT/app/src/main/java"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Host gate
        shell: bash
        run: |
          if [ -f "$ROOT/tools/v213_commercial_multitenant_host_gate.py" ]; then
            python "$ROOT/tools/v213_commercial_multitenant_host_gate.py"
          fi

      - name: Unit tests
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Release lint
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon :app:lintVitalRelease

      - name: Prepare aligned unsigned APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find "$ROOT/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p out
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" -p -f 4 "$APK" out/FUSH_ERP_Mobile_v213-CommercialMultiTenant-FOUNDATION-R2-ALIGNED-UNSIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" -c -v 4 out/FUSH_ERP_Mobile_v213-CommercialMultiTenant-FOUNDATION-R2-ALIGNED-UNSIGNED.apk
          sha256sum out/*.apk > out/SHA256.txt
          cp -r "$ROOT/app/build/reports/tests" out/test-reports 2>/dev/null || true
          cp -r "$ROOT/app/build/reports/lint-results-release.html" out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v213-R2-Unsigned-Release
          path: out
          if-no-files-found: error
          retention-days: 2
