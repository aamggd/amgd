name: FAZ v1.0.22 Source Probe

on:
  push:
    branches: [faz/v1.0.22-productmaster-build]
    paths:
      - '.github/workflows/faz-v1022-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect firestorage implementation chunk
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          SHARE="$BASE/ja/f/K0rEOsxvE2bR"
          curl -L --fail -A 'Mozilla/5.0' "$SHARE" -o share.html
          CHUNK=$(python - <<'PY'
          import re
          s=open('share.html',encoding='utf-8',errors='ignore').read()
          xs=re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)
          for x in xs:
              if '/4899-' in x:
                  print(x); break
          PY
          )
          echo "CHUNK=$CHUNK"
          curl -L --fail -A 'Mozilla/5.0' "$BASE$CHUNK" -o impl.js
          echo "JS_BYTES=$(wc -c < impl.js)"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('impl.js').read_text(encoding='utf-8',errors='ignore')
          print('FIRST=',s[:500])
          for needle in ['download','fetch(','/api/','share','public','file','presign','signed','token','axios']:
              print('\n###',needle)
              low=s.lower(); n=needle.lower(); start=0; c=0
              while c<40:
                  i=low.find(n,start)
                  if i<0: break
                  print(s[max(0,i-500):min(len(s),i+1200)].replace('\n',' ')[:1800])
                  start=i+len(n); c+=1
          print('\n### LIKELY_STRINGS')
          vals=sorted(set(re.findall(r'["\']([^"\']{1,350})["\']',s)))
          for v in vals:
              lv=v.lower()
              if any(k in lv for k in ['api','download','share','file','public','token','presign','storage']): print(v)
          PY
