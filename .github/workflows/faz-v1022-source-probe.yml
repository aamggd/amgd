name: FAZ v1.0.22 Source Probe

on:
  push:
    branches: [faz/v1.0.22-productmaster-build]
    paths:
      - '.github/workflows/faz-v1022-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect firestorage loader bundle
        shell: bash
        run: |
          set -euo pipefail
          U='https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          curl -L --fail -A 'Mozilla/5.0' -D headers.txt "$U" -o page.js
          echo '--- HEADERS ---'; cat headers.txt
          echo '--- BODY ---'; cat page.js; echo
