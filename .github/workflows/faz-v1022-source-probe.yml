name: FAZ v1.0.22 Source Probe

on:
  push:
    branches: [faz/v1.0.22-productmaster-build]
    paths:
      - '.github/workflows/faz-v1022-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect temporary source share
        shell: bash
        run: |
          set -euo pipefail
          SHARE='https://firestorage.ai/ja/f/K0rEOsxvE2bR'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$SHARE" -o share.html
          echo "HTML_BYTES=$(wc -c < share.html)"
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('share.html').read_text(encoding='utf-8',errors='ignore')
          print('HAS_FILENAME=', 'FAZ-Solar-ERP-v1.0.22-ProductMaster-Variants-Source.zip' in s)
          for needle in ['FAZ-Solar','gpYbtwqbwBQud0og','01a093866c3773debb1e6ea902563632','download','api/','__NEXT_DATA__','_next/data']:
              print('\n###', needle)
              low=s.lower(); n=needle.lower(); start=0; count=0
              while count<8:
                  i=low.find(n,start)
                  if i<0: break
                  print(html.unescape(s[max(0,i-350):min(len(s),i+700)]).replace('\n',' ')[:1200])
                  start=i+len(n); count+=1
          print('\n### SCRIPT_SRCS')
          for u in re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I): print(u)
          print('\n### HREFS')
          for u in re.findall(r'href=["\']([^"\']+)',s,re.I):
              if any(k in u.lower() for k in ['api','download','file','zip','share']): print(u)
          PY
