name: FAZ v1.0.22 Import Diagnostic

on:
  push:
    branches: [faz/v1.0.22-productmaster-build]
    paths:
      - '.github/workflows/faz-v1022-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source and inspect imports
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='K0rEOsxvE2bR'
          EXPECTED='FAZ-Solar-ERP-v1.0.22-ProductMaster-Variants-Source.zip'
          curl -fsSL --retry 3 "$API/shares/$SHARE/files?maxResults=1000" -o files.json
          python - <<'PY'
          import json
          d=json.load(open('files.json'))
          target=next((x for x in (d.get('files') or []) if x.get('fileName')=='FAZ-Solar-ERP-v1.0.22-ProductMaster-Variants-Source.zip'), None)
          if not target: raise SystemExit('source not found')
          open('file-id.txt','w').write(str(target['fileId']))
          PY
          FILE_ID=$(cat file-id.txt)
          curl -fsSL --retry 3 -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          python - <<'PY'
          import json
          d=json.load(open('download.json'))
          open('download-url.txt','w').write(d['downloadUrl'])
          PY
          curl -fsSL --retry 3 "$(cat download-url.txt)" -o faz-source.zip
          mkdir -p work
          unzip -q faz-source.zip -d work
          ROOT=$(dirname "$(find work -type f -name settings.gradle.kts -print -quit)")
          M="$ROOT/app/src/main/java/com/fush/erp/domain/MasterDataService.kt"
          P="$ROOT/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt"
          E="$ROOT/app/src/main/java/com/fush/erp/data/entity/ProductMasterEntities.kt"
          echo '=== MasterDataService 1..95 ==='
          nl -ba "$M" | sed -n '1,95p'
          echo '=== ProductMasterService imports ==='
          nl -ba "$P" | sed -n '1,80p'
          echo '=== ProductMasterEntities package/classes ==='
          grep -nE '^package |^data class (BrandEntity|ProductFamilyEntity|ProductTemplateEntity|ProductVariantEntity)' "$E"
          echo '=== Existing imports mentioning entity package ==='
          grep -n '^import com.fush.erp.data.entity' "$M" || true
