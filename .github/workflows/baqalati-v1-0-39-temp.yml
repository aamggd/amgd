name: Baqalati v1.0.39 Temp Build

on:
  push:
    branches:
      - baqalati-v1-0-39-ci-temp

permissions:
  contents: read

jobs:
  inspect-download:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage download client
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://firestorage.ai'
          PAGE='https://firestorage.ai/ja/f/JlIVt8RWKfKp'
          curl -L -A 'Mozilla/5.0' -o page.html "$PAGE"
          JS=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[A-Za-z0-9]+\.js' page.html | head -1)
          echo "JS=$JS"
          test -n "$JS"
          curl -L -A 'Mozilla/5.0' -o page.js "$BASE$JS"
          echo '=== JS SIZE ==='
          wc -c page.js
          echo '=== API/DOWNLOAD STRINGS ==='
          python3 - <<'PY'
          import re
          s=open('page.js','r',encoding='utf-8',errors='ignore').read()
          vals=[]
          for m in re.finditer(r'["\'`]([^"\'`]{1,300})["\'`]', s):
              v=m.group(1)
              if any(k in v.lower() for k in ('api','download','share','file','public','token','signed','url')):
                  vals.append(v)
          seen=set()
          for v in vals:
              if v not in seen:
                  print(v)
                  seen.add(v)
          PY
          echo '=== FETCH CONTEXT ==='
          grep -Eo '.{0,180}fetch\(.{0,300}' page.js | head -80 || true
          echo '=== AXIOS/ENDPOINT CONTEXT ==='
          grep -Eo '.{0,180}(download|share|public_id|file_id|signed|presign|token).{0,300}' page.js | head -120 || true
