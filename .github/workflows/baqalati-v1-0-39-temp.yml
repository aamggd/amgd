name: Baqalati v1.0.39 Temp Build

on:
  push:
    branches:
      - baqalati-v1-0-39-ci-temp

permissions:
  contents: read

jobs:
  inspect-download:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect all firestorage JS chunks
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://firestorage.ai/ja/f/JlIVt8RWKfKp'
          curl -L -A 'Mozilla/5.0' -o page.html "$PAGE"
          python3 - <<'PY'
          import html, pathlib, re, subprocess, urllib.parse
          text=pathlib.Path('page.html').read_text('utf-8',errors='ignore')
          srcs=[]
          for s in re.findall(r'<script[^>]+src="([^"]+)"', text):
              s=html.unescape(s)
              if s.startswith('/'):
                  srcs.append(s)
          print('SCRIPTS', len(srcs))
          for i,s in enumerate(dict.fromkeys(srcs)):
              enc=urllib.parse.quote(s, safe='/._-')
              url='https://firestorage.ai'+enc
              out=f'chunk-{i}.js'
              print('FETCH', url)
              subprocess.run(['curl','-fsSL','-A','Mozilla/5.0','-o',out,url], check=False)
              p=pathlib.Path(out)
              if not p.exists():
                  continue
              data=p.read_text('utf-8',errors='ignore')
              print('SIZE', out, len(data))
              if len(data)<500:
                  print('SMALL', repr(data[:300]))
              hits=[]
              for m in re.finditer(r'["\'`]([^"\'`]{1,400})["\'`]', data):
                  v=m.group(1)
                  if any(k in v.lower() for k in ('api','download','share','file','public','token','signed','presign','url')):
                      hits.append(v)
              seen=set()
              for v in hits:
                  if v not in seen:
                      print('HIT', v)
                      seen.add(v)
              for pat in (r'.{0,160}fetch\(.{0,400}', r'.{0,160}(?:download|share|public_id|file_id|signed|presign|token).{0,400}'):
                  for m in re.finditer(pat,data,re.I|re.S):
                      c=' '.join(m.group(0).split())
                      print('CTX',c[:700])
          PY
