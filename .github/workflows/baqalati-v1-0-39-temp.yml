name: Baqalati v1.0.39 Temp Build

on:
  push:
    branches:
      - baqalati-v1-0-39-ci-temp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source package
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://firestorage.ai/ja/f/JlIVt8RWKfKp'
          curl -L -A 'Mozilla/5.0' -D source-headers.txt -o source-download.bin "$URL"
          file source-download.bin || true
          wc -c source-download.bin
          if unzip -t source-download.bin >/dev/null 2>&1; then
            mv source-download.bin Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip
          else
            echo 'Source share did not resolve directly to ZIP.'
            head -c 20000 source-download.bin || true
            exit 42
          fi

      - name: Extract source
        shell: bash
        run: |
          mkdir -p baqalati
          unzip -q Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip -d baqalati
          test -f baqalati/settings.gradle.kts
          test -f baqalati/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x baqalati/gradlew

      - name: Run unit tests
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect build outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apk-out
          find baqalati/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find baqalati/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk
          sha256sum apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk > apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk.sha256

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-v1.0.39-unsigned
          path: apk-out/*
          if-no-files-found: error
