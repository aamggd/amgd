name: Baqalati v1.0.39 Temp Build

on:
  push:
    branches:
      - baqalati-v1-0-39-ci-temp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download corrected Baqalati source via firestorage API
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='R6q0ElSZJMTj'
          SOURCE='Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE-FIX1.zip'
          curl -fsSL -A 'Mozilla/5.0' "$API/shares/$SHARE/files?maxResults=1000" -o files.json
          python3 - <<'PY'
          import json
          d=json.load(open('files.json',encoding='utf-8'))
          fs=d.get('files') or []
          preferred=[x for x in fs if x.get('fileName')=='Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE-FIX1.zip']
          if not preferred:
              raise SystemExit('Corrected source not found')
          f=preferred[0]
          open('file_id.txt','w').write(f['fileId'])
          print('Selected:',f.get('fileName'),f.get('sizeBytes'))
          PY
          FILE_ID=$(cat file_id.txt)
          curl -fsSL -A 'Mozilla/5.0' -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json
          d=json.load(open('download.json',encoding='utf-8'))
          u=d.get('downloadUrl')
          if not u:
              raise SystemExit('downloadUrl missing')
          open('download_url.txt','w').write(u)
          PY
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$(cat download_url.txt)" -o "$SOURCE"
          unzip -t "$SOURCE" >/dev/null
          echo '979ec8d795115b079cfb1f6997808ead91867caa353e309f93488aa2ff0a6738  Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE-FIX1.zip' | sha256sum -c -

      - name: Extract and validate source identity
        shell: bash
        run: |
          mkdir -p baqalati
          unzip -q Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE-FIX1.zip -d baqalati
          test -f baqalati/settings.gradle.kts
          test -f baqalati/app/build.gradle.kts
          test -f baqalati/gradlew
          grep -q 'applicationId = "com.faz.yemen"' baqalati/app/build.gradle.kts
          grep -q 'versionCode = 40' baqalati/app/build.gradle.kts
          grep -q '1.0.39-baqalati-uiux-phase1-pos' baqalati/app/build.gradle.kts
          ! grep -q '^import androidx.compose.foundation.layout.weight$' baqalati/app/src/main/java/com/fush/erp/ui/BarcodeScannerDialog.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version

      - name: Make Gradle wrapper executable
        run: chmod +x baqalati/gradlew

      - name: Run unit tests
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK and signing utilities
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apk-out signing-tools/lib
          find baqalati/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find baqalati/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk
          sha256sum apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk > apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk.sha256
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign signing-tools/aapt signing-tools/aapt2

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-v1.0.39-unsigned
          path: apk-out/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Android signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-36-Signing
          path: signing-tools/**
          if-no-files-found: error
          retention-days: 1
