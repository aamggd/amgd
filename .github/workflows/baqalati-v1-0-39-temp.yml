name: Baqalati v1.0.39 Temp Build

on:
  push:
    branches:
      - baqalati-v1-0-39-ci-temp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Baqalati source via firestorage API
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='JlIVt8RWKfKp'
          curl -fsSL -A 'Mozilla/5.0' "$API/shares/$SHARE/files?maxResults=1000" -o files.json
          python3 - <<'PY'
          import json
          d=json.load(open('files.json',encoding='utf-8'))
          fs=d.get('files') or []
          if not fs:
              raise SystemExit('No files in share')
          preferred=[x for x in fs if x.get('fileName')=='Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip']
          f=(preferred or fs)[0]
          open('file_id.txt','w').write(f['fileId'])
          print('Selected:',f.get('fileName'),f.get('sizeBytes'))
          PY
          FILE_ID=$(cat file_id.txt)
          curl -fsSL -A 'Mozilla/5.0' -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json
          d=json.load(open('download.json',encoding='utf-8'))
          u=d.get('downloadUrl')
          if not u:
              raise SystemExit('downloadUrl missing')
          open('download_url.txt','w').write(u)
          print('Direct download URL obtained')
          PY
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$(cat download_url.txt)" -o Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip
          unzip -t Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip >/dev/null
          sha256sum Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip

      - name: Extract source
        shell: bash
        run: |
          mkdir -p baqalati
          unzip -q Baqalati-v1.0.39-UIUX-Phase1-POS-SOURCE.zip -d baqalati
          test -f baqalati/settings.gradle.kts
          test -f baqalati/app/build.gradle.kts
          test -f baqalati/gradlew
          grep -q 'applicationId = "com.faz.yemen"' baqalati/app/build.gradle.kts
          grep -q 'versionCode = 40' baqalati/app/build.gradle.kts
          grep -q '1.0.39-baqalati-uiux-phase1-pos' baqalati/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version

      - name: Make Gradle wrapper executable
        run: chmod +x baqalati/gradlew

      - name: Run unit tests
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect build outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apk-out
          find baqalati/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find baqalati/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk
          sha256sum apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk > apk-out/Baqalati-v1.0.39-UIUX-Phase1-UNSIGNED.apk.sha256

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-v1.0.39-unsigned
          path: apk-out/*
          if-no-files-found: error
