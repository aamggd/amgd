name: Build FUSH Employees HR P1

on:
  push:
    branches: [fush/employees-hr]
    paths:
      - 'employees_hr_p1/**'
      - '.github/workflows/build-employees-hr-p1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-p1-initial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout employees HR branch
        uses: actions/checkout@v4
        with:
          path: branch-repo

      - name: Checkout exact initial Central baseline
        uses: actions/checkout@v4
        with:
          ref: 2cb8da801fc54aec8c1f0d6a83588f097ca85117
          path: central-repo

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Restore exact Central source and apply P1 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C central-repo rev-parse HEAD)" = "2cb8da801fc54aec8c1f0d6a83588f097ca85117"
          test "$(git -C central-repo rev-parse HEAD:central_source)" = "7733c6570357eb813f7e05e5093752ea26788749"
          mkdir final-repo
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' central-repo/central_source/ final-repo/
          cd final-repo
          git init -q
          git config user.email employees-hr@fush.local
          git config user.name FUSH
          git add -A
          git commit -qm central-2cb8da8
          git apply --check ../branch-repo/employees_hr_p1/employees-hr-p1.patch
          git apply ../branch-repo/employees_hr_p1/employees-hr-p1.patch
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' \
            'app/src/main/java/com/fush/erp/domain/EmployeeEntitlementType.kt' \
            'app/src/test/java/com/fush/erp/domain/EmployeeEntitlementTypeTest.kt' | sort)
          test "$CHANGED" = "$EXPECTED"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          test -z "$(git diff --name-only | grep -E 'FushDatabase.kt|Migrations.kt|SecurityMigrations.kt|app/schemas/' || true)"
          git add -A
          git commit -qm employees-hr-p1-entitlement-types

      - name: P1 domain tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.fush.erp.domain.EmployeeEntitlementTypeTest

      - name: Full unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate Room and release invariants
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          test -z "$(git diff --name-only HEAD^ HEAD | grep -E 'FushDatabase.kt|Migrations.kt|SecurityMigrations.kt|app/schemas/' || true)"
          mkdir -p ../output
          cp "$APK" ../output/FushERP-Employees-HR-P1-initial-unsigned.apk
          cp ../branch-repo/employees_hr_p1/employees-hr-p1.patch ../output/employees-hr-p1-exact.patch
          sha256sum ../output/employees-hr-p1-exact.patch > ../output/employees-hr-p1-exact.patch.sha256
          printf '%s\n' \
            'branch=fush/employees-hr' \
            'phase=P1 employee entitlement types' \
            'validation=INITIAL ONLY / NOT FINAL HANDOFF' \
            'baseline=fush/integration-current@2cb8da801fc54aec8c1f0d6a83588f097ca85117' \
            'centralSourceTree=7733c6570357eb813f7e05e5093752ea26788749' \
            'applicationId=com.fush.erp.recovery' \
            'roomSchema=34 unchanged' \
            'migration=none' \
            'domainTests=PASS' \
            'unitTests=PASS' \
            'releaseBuild=PASS' \
            'accountingPostingLogic=unchanged' \
            'inventoryImpact=none' \
            'productionImpact=classification contract only' \
            'finalGate=REAPPLY EXACT PATCH TO POST-WAVE CENTRAL AND RETEST' \
            > ../output/PRELIMINARY_HANDOFF.txt

      - name: Upload initial P1 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Employees-HR-P1-Initial-Validated
          path: output/
          if-no-files-found: error
