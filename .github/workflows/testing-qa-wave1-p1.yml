name: Testing QA Wave1 P1 Pre-Acceptance

on:
  push:
    branches: [fush/testing-qa]
    paths:
      - 'qa/p1/**'
      - '.github/workflows/testing-qa-wave1-p1.yml'
  workflow_dispatch:
    inputs:
      require_all_p1:
        description: 'Require Accounting + Treasury + Purchases + Sales P1 to coexist in Central source'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  source-and-migration-preacceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export latest Central source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fush/integration-current:refs/remotes/origin/fush/integration-current
          CENTRAL_SHA="$(git rev-parse refs/remotes/origin/fush/integration-current)"
          echo "CENTRAL_SHA=$CENTRAL_SHA" >> "$GITHUB_ENV"
          rm -rf work-source evidence
          mkdir -p work-source evidence
          git archive "$CENTRAL_SHA" central_source | tar -x -C work-source --strip-components=1
          git show -s --format='%H %s' "$CENTRAL_SHA" | tee evidence/central-commit.txt
          git ls-tree "$CENTRAL_SHA" central_source | tee evidence/central-source-tree-entry.txt
          grep -n 'applicationId = "com.fush.erp.recovery"' work-source/app/build.gradle.kts | tee evidence/application-id.txt
          grep -n 'FUSH_DB_SCHEMA_VERSION' work-source/app/src/main/java/com/fush/erp/data/FushDatabase.kt | head -1 | tee evidence/room-schema.txt

      - name: Validate Wave1 P1 source contracts
        shell: bash
        run: |
          set -euo pipefail
          STRICT=''
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.require_all_p1 }}" = 'true' ]; then
            STRICT='--require-all'
          fi
          python3 qa/p1/validate_wave1_contracts.py \
            --source work-source $STRICT \
            --json-out evidence/wave1-contracts.json

      - name: Inject QA-only migration test dependencies and source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work-source/app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          needle = '    testImplementation(libs.androidx.room.testing)\n'
          extra = (
              needle
              + '    androidTestImplementation(libs.junit)\n'
              + '    androidTestImplementation(libs.androidx.room.testing)\n'
              + '    androidTestImplementation("androidx.test:core-ktx:1.7.0")\n'
              + '    androidTestImplementation("androidx.test.ext:junit-ktx:1.3.0")\n'
          )
          if 'androidx.test:core-ktx:1.7.0' not in text:
              if needle not in text:
                  raise SystemExit('Expected room testing dependency anchor not found')
              text = text.replace(needle, extra)
              p.write_text(text, encoding='utf-8')
          PY
          mkdir -p work-source/app/src/androidTest/java/com/fush/erp/data
          cp qa/p1/AccountingP1Migration34To35Test.kt \
            work-source/app/src/androidTest/java/com/fush/erp/data/AccountingP1Migration34To35Test.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Full Unit tests and release build on exact Central export
        working-directory: work-source
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:assembleRelease

      - name: Run MigrationTestHelper on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: work-source
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Record pre-acceptance APK evidence
        shell: bash
        run: |
          set -euo pipefail
          APK='work-source/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          sha256sum "$APK" | tee evidence/release-apk.sha256
          echo 'STATUS=PRE-ACCEPTANCE_ONLY' | tee evidence/status.txt
          echo 'Final QA remains open until the exact merged Central APK is retested after all intended P1 integrations.' >> evidence/status.txt

      - name: Upload QA pre-acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Testing-QA-Wave1-P1-${{ github.run_id }}
          path: |
            evidence/**
            work-source/app/build/outputs/apk/release/app-release-unsigned.apk
            work-source/app/build/reports/androidTests/**
            work-source/app/build/reports/tests/**
          if-no-files-found: error
