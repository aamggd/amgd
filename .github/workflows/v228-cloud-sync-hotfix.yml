name: V228 Cloud Sync Hotfix Final Gate

on:
  push:
    branches: [ci-v228-cloud-sync-hotfix-20260921]
    paths:
      - '.github/workflows/v228-cloud-sync-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Download v228 source input
        shell: bash
        env:
          SHARE_ID: trXw2xyAacUb
          EXPECTED_SHA256: a99684ba0d7104955b2c296fffc2d02789261ff2fd36f9c33571a51525c619da
        run: |
          set -euxo pipefail
          API_BASE='https://api.firestorage.ai/dev/file'
          curl -fLsS --retry 3 "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" -o files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('files.json',encoding='utf-8'))
          files=d.get('files') or []
          if len(files) != 1:
              raise SystemExit(f'expected 1 file, got {len(files)}')
          print(files[0]['fileId'])
          PY
          )
          curl -fLsS --retry 3 -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          d=json.load(open('download.json',encoding='utf-8'))
          print(d['downloadUrl'])
          PY
          )
          curl -fL --retry 3 "$DOWNLOAD_URL" -o source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null

      - name: Extract source
        shell: bash
        run: |
          mkdir src
          unzip -q source.zip -d src
          test -f src/settings.gradle.kts
          test -f src/gradle/wrapper/gradle-wrapper.jar
          test -f src/tools/test_v228_cloud_sync_hotfix.py
          test -f src/supabase/V228_CLOUD_SYNC_DOCUMENT_RESERVATION_HOTFIX.sql

      - name: Static regressions
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_v225_backend_hardening.py | tee ../v225-backend-regression.log
          python3 tools/test_v227_local_ai_actions.py | tee ../v227-local-ai-regression.log
          python3 tools/test_v228_cloud_sync_hotfix.py | tee ../v228-cloud-sync-static.log

      - name: Android JVM lint release and test APK gate
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test lint assembleRelease bundleRelease assembleDebug assembleDebugAndroidTest 2>&1 | tee ../v228-gradle-final-gate.log

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd src && gradle --no-daemon connectedDebugAndroidTest 2>&1 | tee ../v228-instrumented-tests.log

      - name: Collect release evidence
        if: success()
        shell: bash
        run: |
          mkdir -p ci-output/reports ci-output/schema ci-output/supabase
          APK=$(find src/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          AAB=$(find src/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" ci-output/FUSH_ERP_Mobile_v228-CloudSyncHotfix-UNSIGNED.apk
          cp "$AAB" ci-output/FUSH_ERP_Mobile_v228-CloudSyncHotfix-UNSIGNED.aab
          cp v228-gradle-final-gate.log ci-output/
          cp v228-instrumented-tests.log ci-output/
          cp v225-backend-regression.log ci-output/
          cp v227-local-ai-regression.log ci-output/
          cp v228-cloud-sync-static.log ci-output/
          cp src/V228_CLOUD_SYNC_HOTFIX_VALIDATION.md ci-output/
          cp src/supabase/V228_CLOUD_SYNC_DOCUMENT_RESERVATION_HOTFIX.sql ci-output/supabase/
          if [ -d src/app/build/reports/tests ]; then cp -R src/app/build/reports/tests ci-output/reports/unit-tests; fi
          if [ -f src/app/build/reports/lint-results-release.html ]; then cp src/app/build/reports/lint-results-release.html ci-output/reports/; fi
          if [ -d src/app/build/reports/androidTests ]; then cp -R src/app/build/reports/androidTests ci-output/reports/androidTests; fi
          if [ -d src/app/build/outputs/androidTest-results ]; then cp -R src/app/build/outputs/androidTest-results ci-output/reports/androidTest-results; fi
          find src/app/schemas -type f -name '57.json' -exec cp {} ci-output/schema/ \; || true
          sha256sum ci-output/FUSH_ERP_Mobile_v228-CloudSyncHotfix-UNSIGNED.apk ci-output/FUSH_ERP_Mobile_v228-CloudSyncHotfix-UNSIGNED.aab > ci-output/V228_CI_SHA256SUMS.txt

      - name: Upload successful build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v228-Cloud-Sync-Hotfix-Final-Gate-unsigned
          path: ci-output
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v228-Cloud-Sync-Hotfix-failure-diagnostics
          path: |
            files.json
            download.json
            v228-gradle-final-gate.log
            v228-instrumented-tests.log
            v225-backend-regression.log
            v227-local-ai-regression.log
            v228-cloud-sync-static.log
            src/app/build/reports
            src/app/build/outputs/androidTest-results
          if-no-files-found: ignore
