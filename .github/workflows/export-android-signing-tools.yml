name: Export Android Signing Tools

on:
  push:
    branches: [fush/central-unified-test-build]
    paths:
      - '.github/workflows/export-android-signing-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
      - name: Package signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" signing-tools/lib64/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum signing-tools/apksigner signing-tools/zipalign signing-tools/lib/apksigner.jar signing-tools/lib64/libc++.so > signing-tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36-signing-runtime
          path: signing-tools/
          if-no-files-found: error
