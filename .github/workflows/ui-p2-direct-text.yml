name: UI P2 Direct Text Localization

on:
  push:
    branches: [fush/ui-professional-redesign-p2]
    paths:
      - 'ui_p2/tools/localize_direct_text.py'
      - '.github/workflows/ui-p2-direct-text.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_CENTRAL_HEAD: 'ddae764a236cb1916a46e194ccb2d3c24ca6b919'
  BASE_SOURCE_TREE: '30b028b75d6463c07afd0419429f53c7937fabb1'
  APP_ID: 'com.fush.erp.recovery'
  ROOM_SCHEMA: '35'

jobs:
  localize-direct-text:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout P2 work branch
        uses: actions/checkout@v4
        with:
          ref: fush/ui-professional-redesign-p2
          fetch-depth: 0

      - name: Fetch and materialize exact Central baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_CENTRAL_HEAD"
          test "$(git rev-parse "$BASE_CENTRAL_HEAD:central_source")" = "$BASE_SOURCE_TREE"
          git checkout "$BASE_CENTRAL_HEAD" -- central_source
          test "$(git write-tree >/dev/null 2>&1; git rev-parse "$BASE_CENTRAL_HEAD:central_source")" = "$BASE_SOURCE_TREE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Restore resumable translation cache
        uses: actions/cache@v4
        with:
          path: ui_p2/generated/translation_cache.json
          key: ui-p2-translation-${{ env.BASE_SOURCE_TREE }}-${{ github.run_id }}
          restore-keys: |
            ui-p2-translation-${{ env.BASE_SOURCE_TREE }}-

      - name: Guard exact requested Central baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_CENTRAL_HEAD:central_source")" = "$BASE_SOURCE_TREE"
          grep -Fq 'applicationId = "com.fush.erp.recovery"' central_source/app/build.gradle.kts
          grep -Fq "FUSH_DB_SCHEMA_VERSION = $ROOM_SCHEMA" central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f "central_source/app/schemas/com.fush.erp.data.FushDatabase/$ROOM_SCHEMA.json"
          ! grep -R -nE 'fallbackToDestructiveMigration|deleteDatabase\(|clearAllTables\(' central_source/app/src/main central_source/app/build.gradle.kts

      - name: Record protected-tree hashes before P2
        shell: bash
        run: |
          set -euo pipefail
          find central_source/app/src/main/java/com/fush/erp/data central_source/app/src/main/java/com/fush/erp/domain central_source/app/schemas -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/protected-before.sha256
          sha256sum central_source/app/build.gradle.kts > /tmp/build-before.sha256

      - name: Generate direct Text localization resources
        shell: bash
        env:
          FUSH_TRANSLATION_MIN_INTERVAL: '1.0'
        run: |
          set -euo pipefail
          python3 ui_p2/tools/localize_direct_text.py

      - name: Validate generated resources and placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          en=Path('central_source/app/src/main/res/values/p2_direct_text.xml')
          ar=Path('central_source/app/src/main/res/values-ar/p2_direct_text.xml')
          assert en.is_file() and ar.is_file()
          er=ET.parse(en).getroot(); arroot=ET.parse(ar).getroot()
          em={x.attrib['name']: ''.join(x.itertext()) for x in er.findall('string')}
          am={x.attrib['name']: ''.join(x.itertext()) for x in arroot.findall('string')}
          assert em.keys()==am.keys(), (len(em),len(am),sorted(em.keys()-am.keys())[:10],sorted(am.keys()-em.keys())[:10])
          pat=re.compile(r'%\d+\$[sdfoxegc]')
          for k in em:
              ep=sorted(pat.findall(em[k])); ap=sorted(pat.findall(am[k]))
              assert ep==ap, (k,ep,ap,em[k],am[k])
          assert len(em)>0
          print('P2_RESOURCE_PAIRS',len(em))
          PY

      - name: Enforce P2-only changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_CENTRAL_HEAD" -- central_source
          git diff --name-only "$BASE_CENTRAL_HEAD" -- central_source > /tmp/changed.txt
          cat /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('/tmp/changed.txt').read_text().splitlines():
              ok=(
                p.startswith('central_source/app/src/main/java/com/fush/erp/ui/') and p.endswith('.kt')
              ) or p in {
                'central_source/app/src/main/res/values/p2_direct_text.xml',
                'central_source/app/src/main/res/values-ar/p2_direct_text.xml',
              }
              if not ok: bad.append(p)
          assert not bad, f'Unexpected P2 changed files: {bad}'
          PY
          sha256sum -c /tmp/protected-before.sha256
          sha256sum -c /tmp/build-before.sha256
          ! git diff --name-only "$BASE_CENTRAL_HEAD" -- central_source | grep -E '^central_source/app/src/main/java/com/fush/erp/(data|domain)/|^central_source/app/schemas/|^central_source/app/build.gradle.kts$'

      - name: Unit tests
        working-directory: central_source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: central_source
        run: gradle --no-daemon :app:assembleRelease

      - name: Release guards
        shell: bash
        run: |
          set -euo pipefail
          APK=central_source/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          grep -Fq 'applicationId = "com.fush.erp.recovery"' central_source/app/build.gradle.kts
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n1 | grep -Fq "name='com.fush.erp.recovery'"
          grep -Fq "FUSH_DB_SCHEMA_VERSION = $ROOM_SCHEMA" central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f "central_source/app/schemas/com.fush.erp.data.FushDatabase/$ROOM_SCHEMA.json"
          ! grep -R -nE 'fallbackToDestructiveMigration|deleteDatabase\(|clearAllTables\(' central_source/app/src/main central_source/app/build.gradle.kts
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p ui_p2/generated
          sha256sum "$APK" | tee ui_p2/generated/release-apk.sha256

      - name: Measure remaining hard-coded UI candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 ui_p2/tools/extract_localization.py > ui_p2/generated/post_direct_inventory.log
          cp ui_p2/extract/summary.json ui_p2/generated/post_direct_summary.json

      - name: Create validated delivery patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui_p2/generated
          git diff --binary "$BASE_CENTRAL_HEAD" -- central_source > ui_p2/generated/p2_direct_text.patch
          test -s ui_p2/generated/p2_direct_text.patch
          sha256sum ui_p2/generated/p2_direct_text.patch | tee ui_p2/generated/p2_direct_text.patch.sha256
          git diff --name-only "$BASE_CENTRAL_HEAD" -- central_source > ui_p2/generated/p2_direct_text.changed-files.txt
          git diff --stat "$BASE_CENTRAL_HEAD" -- central_source > ui_p2/generated/p2_direct_text.stat.txt
          printf '%s\n' "$BASE_CENTRAL_HEAD" > ui_p2/generated/base-central-head.txt
          printf '%s\n' "$BASE_SOURCE_TREE" > ui_p2/generated/base-central-source-tree.txt
          printf '%s\n' "$ROOM_SCHEMA" > ui_p2/generated/base-room-schema.txt

      - name: Reject stale Central completion
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_REMOTE_HEAD="$(git ls-remote origin refs/heads/fush/integration-current | awk '{print $1}')"
          echo "validated_base=$BASE_CENTRAL_HEAD"
          echo "current_remote=$CURRENT_REMOTE_HEAD"
          test "$CURRENT_REMOTE_HEAD" = "$BASE_CENTRAL_HEAD"

      - name: Upload P2 direct localization evidence
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-UI-P2-Direct-Localization-Validation
          path: |
            ui_p2/generated/direct_text_report.json
            ui_p2/generated/post_direct_summary.json
            ui_p2/generated/post_direct_inventory.log
            ui_p2/generated/release-apk.sha256
            ui_p2/generated/p2_direct_text.patch
            ui_p2/generated/p2_direct_text.patch.sha256
            ui_p2/generated/p2_direct_text.changed-files.txt
            ui_p2/generated/p2_direct_text.stat.txt
            ui_p2/generated/base-central-head.txt
            ui_p2/generated/base-central-source-tree.txt
            ui_p2/generated/base-room-schema.txt
            central_source/app/src/main/res/values/p2_direct_text.xml
            central_source/app/src/main/res/values-ar/p2_direct_text.xml
          if-no-files-found: error
