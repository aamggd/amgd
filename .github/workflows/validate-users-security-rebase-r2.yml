name: Validate Users Security Rebase Final

on:
  push:
    branches: [fush/users-permissions]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4

      - name: Download official Phase 14.5.38 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir baseline-artifact source security-ci-out
          gh run download 31858347166 --repo "$GITHUB_REPOSITORY" --name FushERP-Phase14.5.38-Professional-UI-Build --dir baseline-artifact
          test -f baseline-artifact/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip
          echo 'd4ff24af274e3aedc14cdf39762e9a0b3bd6ff4f3b563062063e5b79342ec38f  baseline-artifact/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip' | sha256sum -c -
          unzip -q baseline-artifact/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip -d source

      - name: Apply verified final security rebase
        run: |
          set -euo pipefail
          cd source/FushERP_Mobile_Phase5
          rm -rf app/build .gradle .kotlin
          git init -q
          git config user.name security-ci
          git config user.email security-ci@users.noreply.github.com
          git add . && git commit -qm baseline
          python ../../security_rebase_official_14_5_38_final/apply_patch.py
          git apply --check ../../security_rebase_official_14_5_38_final/security_rebase_final.patch
          git apply ../../security_rebase_official_14_5_38_final/security_rebase_final.patch
          git apply --check ../../security_rebase_official_14_5_38_final/users_permissions_visible_entry_fix.patch
          git apply ../../security_rebase_official_14_5_38_final/users_permissions_visible_entry_fix.patch
          git apply --check ../../security_rebase_official_14_5_38_final/session_timeout_settings.patch
          git apply ../../security_rebase_official_14_5_38_final/session_timeout_settings.patch
          cat ../../security_rebase_official_14_5_38_final/database_encryption_parts_v2/part_*.b64 | tr -d '\n\r' > ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.combined.b64
          echo '3ffd9d682cdb9fb65b6696a1152990824377b936be01a32133a85210a0499f06  ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.combined.b64' | sha256sum -c -
          base64 -d ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.combined.b64 | gzip -dc > ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.patch
          echo '821bd4419050f0631415e2b872bed46b597b0a1d862860d4e4692e1885e30537  ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.patch' | sha256sum -c -
          git apply --check ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.patch
          git apply ../../security_rebase_official_14_5_38_final/database_encryption_at_rest.patch
          echo 'fa54f84809e5e6dca8a1fc033939045d0bae346b80ed3eb0a552c8aaa203f4a6  ../../security_rebase_official_14_5_38_final/database_encryption_cleanup_root_fix.patch' | sha256sum -c -
          git apply --check ../../security_rebase_official_14_5_38_final/database_encryption_cleanup_root_fix.patch
          git apply ../../security_rebase_official_14_5_38_final/database_encryption_cleanup_root_fix.patch
          git diff --check
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.38-ui-inventory-master-data"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 28' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_27_28_SECURITY_BRANCH_ONLY' app/src/main/java/com/fush/erp/data/SecurityMigrations.kt
          grep -q '"المستخدمون والصلاحيات" -> "المستخدمون"' app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'automaticLogoutEnabled: Boolean = false' app/src/main/java/com/fush/erp/domain/SecurityPolicy.kt
          grep -q 'الإغلاق التلقائي للجلسة' app/src/main/java/com/fush/erp/ui/screens/SecurityScreens.kt
          grep -q 'SessionSettingsStore' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'sqlcipher-android:4.17.0' app/build.gradle.kts
          grep -q 'androidx.test.ext:junit:1.3.0' app/build.gradle.kts
          grep -q 'SupportOpenHelperFactory' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/fush/erp/backup/DatabaseKeyManager.kt
          grep -q 'cleanupStalePlaintextSafety(context)' app/src/main/java/com/fush/erp/backup/DatabaseEncryptionManager.kt
          grep -q 'allowBackup="false"' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fush/erp/data/SessionSettingsStore.kt
          test -f app/src/main/java/com/fush/erp/backup/DatabaseEncryptionManager.kt
          test -f app/src/test/java/com/fush/erp/backup/DatabaseEncryptionManagerTest.kt
          test -f app/src/androidTest/java/com/fush/erp/backup/DatabaseEncryptionInstrumentedTest.kt
          test -f app/src/test/java/com/fush/erp/ui/screens/HomeShellNavigationTest.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main
          test -z "$(find . -name '*.p12' -print -quit)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests with captured log
        id: unit
        continue-on-error: true
        working-directory: source/FushERP_Mobile_Phase5
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee ../../security-ci-out/unit-tests.log

      - name: Build release with captured log
        id: release
        continue-on-error: true
        working-directory: source/FushERP_Mobile_Phase5
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee ../../security-ci-out/release-build.log

      - name: Run encrypted database migration on Android emulator
        id: instrumented
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd --force --name fush-security-ci --package "system-images;android-35;google_apis;x86_64" --device "pixel_6" --path "$ANDROID_AVD_HOME/fush-security-ci.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee security-ci-out/avd-list.log
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'fush-security-ci'
          nohup "$ANDROID_HOME/emulator/emulator" -avd fush-security-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > security-ci-out/emulator.log 2>&1 &
          EMU_PID=$!
          device_seen=""
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'Emulator exited before ADB became available'
              cat security-ci-out/emulator.log
              exit 1
            fi
            if adb devices | grep -q '^emulator-'; then
              device_seen=1
              break
            fi
            sleep 2
          done
          test "$device_seen" = "1" || { echo 'Emulator did not appear in ADB'; cat security-ci-out/emulator.log; exit 1; }
          timeout 60s adb wait-for-device
          booted=""
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'Emulator exited before boot completed'
              cat security-ci-out/emulator.log
              exit 1
            fi
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$booted" = "1" ] && break
            sleep 2
          done
          test "$booted" = "1" || { echo 'Android boot timeout'; cat security-ci-out/emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          cd source/FushERP_Mobile_Phase5
          set -o pipefail
          timeout 900s gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.backup.DatabaseEncryptionInstrumentedTest 2>&1 | tee ../../security-ci-out/instrumented-encryption.log

      - name: Package validation outputs
        id: package
        continue-on-error: true
        run: |
          cd source/FushERP_Mobile_Phase5
          test -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          grep -q '"version": 28' app/schemas/com.fush.erp.data.FushDatabase/28.json
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -q 'lib/arm64-v8a/libsqlcipher.so'
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -q 'lib/x86_64/libsqlcipher.so'
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../security-ci-out/FushERP-Security-Rebase-Final-release-unsigned.apk
          sha256sum ../../security-ci-out/FushERP-Security-Rebase-Final-release-unsigned.apk > ../../security-ci-out/FushERP-Security-Rebase-Final-release-unsigned.apk.sha256
          cd ..
          zip -qr ../security-ci-out/FushERP-Security-Rebase-Final-Source.zip FushERP_Mobile_Phase5
          sha256sum ../security-ci-out/FushERP-Security-Rebase-Final-Source.zip > ../security-ci-out/FushERP-Security-Rebase-Final-Source.zip.sha256

      - name: Upload validation logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Security-Rebase-Final-Validation
          path: security-ci-out/*
          if-no-files-found: error

      - name: Enforce validation gate
        if: always()
        shell: bash
        run: |
          echo "unit_outcome=${{ steps.unit.outcome }}"
          echo "release_outcome=${{ steps.release.outcome }}"
          echo "instrumented_outcome=${{ steps.instrumented.outcome }}"
          echo "package_outcome=${{ steps.package.outcome }}"
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.release.outcome }}" = "success"
          test "${{ steps.instrumented.outcome }}" = "success"
          test "${{ steps.package.outcome }}" = "success"
