name: Build Fush ERP Phase 14.5.52 Audit Reporting

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-52-audit-reporting.yml'
      - 'phase14_5_52_audit_reporting/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.51 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.51-Inventory-Analytics-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31870536927

      - name: Restore Phase 14.5.51 and apply Phase 14.5.52 audit patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'b406c356773d5ea6c21d9fe5805f1cd1e02bf7de212d22cd5cdddcf12bf38d5d  phase14_5_52_audit_reporting/payload/a52-part00.txt' | sha256sum -c -
          echo '2da8ef80c3df8163f43e878e76b03bc5d83de2ba0ced484cf1498479a03272df  phase14_5_52_audit_reporting/payload/a52-part01.txt' | sha256sum -c -
          echo 'e5737b66e3faa2c919cc49d205eefe56c22ee2c1ad3832164458a660abc05d07  phase14_5_52_audit_reporting/payload/a52-part02.txt' | sha256sum -c -
          cat phase14_5_52_audit_reporting/payload/a52-part00.txt phase14_5_52_audit_reporting/payload/a52-part01.txt phase14_5_52_audit_reporting/payload/a52-part02.txt > phase14_5_52_audit_reporting/a52.full.b64
          echo '5e16cb9b237c1114cd75c6d768cca145978367383b67c04bdcbce2d4636080e8  phase14_5_52_audit_reporting/a52.full.b64' | sha256sum -c -
          base64 -d phase14_5_52_audit_reporting/a52.full.b64 | gzip -dc > phase14_5_52_audit_reporting/01_audit_reporting.patch
          echo 'ad83d7f696d37ca6471bd5f171bfc7228b490f65b536fb1ef88630e714911766  phase14_5_52_audit_reporting/01_audit_reporting.patch' | sha256sum -c -
          unzip -q previous-build/FushERP-Mobile-Phase14.5.51-Inventory-Analytics-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build .kotlin
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.51
          git apply --check ../phase14_5_52_audit_reporting/01_audit_reporting.patch
          git apply ../phase14_5_52_audit_reporting/01_audit_reporting.patch
          git diff --check HEAD
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 91' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.52-audit-reporting"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          test -f app/src/main/java/com/fush/erp/domain/AuditReportMath.kt
          test -f app/src/test/java/com/fush/erp/domain/AuditReportMathTest.kt
          grep -q 'suspend fun auditReport' app/src/main/java/com/fush/erp/data/dao/GovernanceDao.kt
          grep -q 'LEFT JOIN users u ON u.id = ae.userId' app/src/main/java/com/fush/erp/data/dao/GovernanceDao.kt
          grep -q 'سجل التدقيق' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 91' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.52-audit-reporting"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-52-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-52-output/FushERP-Phase14.5.52-Audit-Reporting-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-52-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-52-output/lib/apksigner.jar
          chmod +x phase14-5-52-output/apksigner
          zip -qr phase14-5-52-output/FushERP-Mobile-Phase14.5.52-Audit-Reporting-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.52 — Audit Reporting and Control' \
            'Base verified source: Phase 14.5.51 Inventory Analytics' \
            'Branch: fush/reports-printing' \
            'Audit period query with user join: PASS' \
            'User/action/entity/search filters: PASS' \
            'Filtered PDF/XLSX export: PASS' \
            'Old/new value visibility: PASS' \
            'Audit coverage limitation disclosed: PASS' \
            'No department value invented: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 91' \
            'Version name: 0.15.4.52-audit-reporting' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Room/Compose compilation: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-52-output/FushERP-Phase14.5.52-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.52-Audit-Reporting-Build
          path: phase14-5-52-output/
          if-no-files-found: error
          retention-days: 7
