name: Build FUSH Employees HR P0

on:
  push:
    branches: [fush/employees-hr]
    paths:
      - 'employees_hr_p0/**'
      - '.github/workflows/build-employees-hr-p0.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout employees HR branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download validated central 14.5.54 baseline
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: artifacts/base54
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750

      - name: Restore exact central source and apply P0
        shell: bash
        run: |
          set -euo pipefail
          ZIP=artifacts/base54/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          test -s "$ZIP"
          mkdir -p sources final-repo
          unzip -q "$ZIP" -d sources
          BASE=$(find sources -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$BASE"
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' "$BASE/" final-repo/
          cd final-repo
          git init -q
          git config user.email employees-hr@fush.local
          git config user.name FUSH
          git add -A
          git commit -qm baseline-14.5.54
          BASE_TREE=$(git write-tree)
          echo "BASE54_TREE=$BASE_TREE"
          test "$BASE_TREE" = '1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff'
          git apply --check ../employees_hr_p0/employees-hr-p0.patch
          git apply ../employees_hr_p0/employees-hr-p0.patch
          git diff --check
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 93' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.54-printing-integrated"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          grep -q 'employeeIdentityChangeAllowed' app/src/main/java/com/fush/erp/domain/HrRules.kt
          grep -q 'PRODUCTION_LABOR' app/src/main/java/com/fush/erp/domain/EmployeeService.kt
          grep -q 'pa.employeeId AS employeeId' app/src/main/java/com/fush/erp/data/dao/EmployeeDao.kt
          git add -A
          git commit -qm employees-hr-p0

      - name: Unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release invariants
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          test -z "$(git diff --name-only HEAD^ HEAD | grep -E 'FushDatabase.kt|Migrations.kt|SecurityMigrations.kt|app/schemas/' || true)"
          mkdir -p ../output
          cp "$APK" ../output/FushERP-Employees-HR-P0-14.5.54-aligned-unsigned.apk
          git format-patch -1 --stdout HEAD > ../output/employees-hr-p0.patch
          cat > ../output/HANDOFF.txt <<'EOF'
branch=fush/employees-hr
phase=P0 stable employee identity
baseline=Phase14.5.54 Printing Integrated
applicationId=com.fush.erp.recovery
roomSchema=34 unchanged
migration=none
signing=unsigned test build only
unitTests=PASS
releaseBuild=PASS
accountingLogic=unchanged; reads existing PRODUCTION_LABOR posting to lock employee identity
inventoryImpact=none
productionImpact=operator employee cannot be reassigned after labor accrual
EOF

      - name: Upload P0 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Employees-HR-P0-Validated
          path: output/
          if-no-files-found: error
