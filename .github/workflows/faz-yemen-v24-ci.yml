name: FAZ Yemen v28 Simplified Entry + YER Main Cash CI

on:
  push:
    branches: [faz-yemen-v24-ci]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download temporary source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir browser && cd browser
          npm init -y >/dev/null
          npm install playwright@latest >/dev/null
          npx playwright install chromium >/dev/null
          cat > download.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto('https://firestorage.ai/ja/f/yBA2zlGPOdbT', {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(8000);
          const candidates = [
            page.getByRole('button', {name:/ダウンロード|download/i}),
            page.getByRole('link', {name:/ダウンロード|download/i}),
            page.locator('a[download]'),
            page.locator('a[href*="download"]')
          ];
          let done=false;
          for (const loc of candidates) {
            if (!(await loc.count())) continue;
            try {
              const [download] = await Promise.all([
                page.waitForEvent('download', {timeout:30000}),
                loc.first().click({timeout:10000})
              ]);
              await download.saveAs('../source.zip');
              done=true;
              break;
            } catch (e) { console.log('candidate failed', String(e)); }
          }
          if (!done) throw new Error('No downloadable file control found');
          await browser.close();
          JS
          node download.mjs
          cd ..
          echo 'dcd3c20987f3ae418d16a3bd3cc9f49993f21f8e5fdb61907ffb6373d28847fa  source.zip' | sha256sum -c -
          mkdir source
          unzip -q source.zip -d source
          test -f source/settings.gradle.kts
          test ! -e source/keystore.properties
          test -f source/app/src/main/java/com/fush/erp/data/MainCashboxYerMigration.kt
          test -f source/app/src/test/java/com/fush/erp/domain/SalesSimplifiedEntryContractTest.kt
          test -f source/app/src/test/java/com/fush/erp/domain/ProductMasterAutomaticCodesContractTest.kt
          test -f source/app/src/test/java/com/fush/erp/domain/MainCashboxYerContractTest.kt
          grep -q 'applicationId = "com.faz.yemen"' source/app/build.gradle.kts
          grep -q 'versionCode = 28' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.27-faz-yemen-simplified-entry"' source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 54' source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_53_54_MAIN_CASHBOX_YER' source/app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'nextDocumentNo("SINV", request.invoiceDate)' source/app/src/main/java/com/fush/erp/domain/SalesService.kt
          grep -q 'nextProductFamilyCode()' source/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt
          grep -q 'nextBrandCode()' source/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt
          grep -q 'nextVariantSku()' source/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt
          grep -q 'nextAttributeValueCode()' source/app/src/main/java/com/fush/erp/domain/ProductMasterService.kt
          grep -q 'رقم الفاتورة يُنشأ تلقائياً' source/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'الفئة: منتج نهائي' source/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'currencyCode = "YER_NEW"' source/app/src/main/java/com/fush/erp/data/AppContainer.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        working-directory: source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build release APK from source
        working-directory: source
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -f source/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f source/app/schemas/com.fush.erp.data.FushDatabase/54.json
          mkdir -p out
          cp source/app/build/outputs/apk/release/app-release-unsigned.apk out/FAZ-Yemen-v28-SimplifiedEntry-MainCashYer-UNSIGNED.apk
          cp source/app/schemas/com.fush.erp.data.FushDatabase/54.json out/FushDatabase-54.json
          (cd source && zip -qr ../out/FAZ-Yemen-v28-SimplifiedEntry-MainCashYer-BUILT-Source.zip . -x 'keystore.properties' '*.p12' '*.pfx' '*Signing-Credentials*' '.gradle/*' '.kotlin/*' 'app/build/*' '**/build/*')
          sha256sum out/* > out/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FAZ-Yemen-v28-SimplifiedEntry-MainCashYer
          path: out/*
          if-no-files-found: error
