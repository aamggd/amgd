name: FAZ Yemen v24 Catalog CI

on:
  push:
    branches: [faz-yemen-v24-ci]

permissions:
  contents: read

jobs:
  inspect-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect temporary source share
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL 'https://firestorage.ai/ja/f/sdWWNq-YZGoq' -o share.html
          grep -aoE '/_next/static/chunks/app/[^" ]+\.js' share.html | sort -u > js_paths.txt || true
          cat js_paths.txt || true
          while IFS= read -r p; do
            curl -fsSL "https://firestorage.ai${p}" >> page.js || true
            printf '\n' >> page.js
          done < js_paths.txt
          echo '--- API-like strings from page JS ---'
          grep -aoE '/api/[A-Za-z0-9_./?=&${}-]+' page.js | sort -u | head -200 || true
          echo '--- download/share keywords ---'
          strings page.js | grep -Eio '.{0,120}(download|public_id|publicId|share|file_id|fileId|presign|signed).{0,180}' | head -200 || true
          echo '--- identifiers in HTML ---'
          grep -aoE 'sdWWNq-YZGoq|onbkHihDz68Hlzcp|01a09437d1957712b25a6d63ccd487c4|FAZ-Yemen[^"<]+' share.html | head -100 || true
