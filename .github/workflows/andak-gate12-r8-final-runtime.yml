name: ANDAK Supplier Gate12 R8 Final Runtime
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]
permissions:
  contents: read
  id-token: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download exact runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          download_share() {
            local share="$1" name="$2" out="$3"
            curl -fsSL "$API/shares/$share/files?maxResults=1000" -o /tmp/files.json
            local id url
            id=$(jq -r --arg n "$name" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
            test -n "$id" && test "$id" != "null"
            curl -fsSL -X POST "$API/shares/$share/files/$id/download" -o /tmp/download.json
            url=$(jq -r '.downloadUrl' /tmp/download.json)
            test -n "$url" && test "$url" != "null"
            curl -fL --retry 3 "$url" -o "$out"
          }
          download_share "VGrPGLA9F5Cq" "ANDAK-Supplier-v1.3.2-GATE12-R8-FINAL-SIGNED.apk" "$GITHUB_WORKSPACE/r8.apk"
          download_share "A08rHZ8pD47s" "ANDAK-Supplier-v1.3.1-GATE12-P0-HOTFIX-R7-FINAL-SIGNED.apk" "$GITHUB_WORKSPACE/r7.apk"
          download_share "K6shjTxTL266" "r8_runtime_final.sh" "$GITHUB_WORKSPACE/runtime.sh"
          chmod +x "$GITHUB_WORKSPACE/runtime.sh"
          echo "0863d73929688bda825ff2f7ed22fe6a9ec2cb5bb640276c0655eb6ea068880c  $GITHUB_WORKSPACE/r8.apk" | sha256sum -c -
          echo "42bdd3878a64b65ca40457dd9966ac31ff872ff78f8f59f8a36f2dddec9b58b7  $GITHUB_WORKSPACE/r7.apk" | sha256sum -c -
      - name: Create temporary live supplier fixture via GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=andak-gate12-r8-runtime")
          OIDC_TOKEN=$(printf '%s' "$OIDC_JSON" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          curl -fsSL -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" -d '{"action":"setup"}' \
            "https://bkbjtyacoiaheunweyuu.supabase.co/functions/v1/andak-gate12-r8-runtime-fixture" -o /tmp/fixture.json
          jq -e '.ok == true' /tmp/fixture.json >/dev/null
          EMAIL=$(jq -r '.email' /tmp/fixture.json); PASSWORD=$(jq -r '.password' /tmp/fixture.json); USER_ID=$(jq -r '.user_id' /tmp/fixture.json)
          STORE=$(jq -r '.expected_store_name' /tmp/fixture.json); PRODUCT=$(jq -r '.expected_product' /tmp/fixture.json); ORDER=$(jq -r '.expected_order' /tmp/fixture.json)
          echo "::add-mask::$EMAIL"; echo "::add-mask::$PASSWORD"
          echo "RUNTIME_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "RUNTIME_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "RUNTIME_USER_ID=$USER_ID" >> "$GITHUB_ENV"
          echo "RUNTIME_STORE=$STORE" >> "$GITHUB_ENV"
          echo "RUNTIME_PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
          echo "RUNTIME_ORDER=$ORDER" >> "$GITHUB_ENV"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run signed R8 runtime matrix on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/runtime.sh"
      - name: Cleanup temporary live supplier fixture
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${RUNTIME_USER_ID:-}" ]; then
            OIDC_JSON=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=andak-gate12-r8-runtime")
            OIDC_TOKEN=$(printf '%s' "$OIDC_JSON" | jq -r '.value')
            curl -fsSL -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" \
              -d "{\"action\":\"cleanup\",\"user_id\":\"$RUNTIME_USER_ID\"}" \
              "https://bkbjtyacoiaheunweyuu.supabase.co/functions/v1/andak-gate12-r8-runtime-fixture" -o /tmp/cleanup.json
            jq -e '.ok == true' /tmp/cleanup.json >/dev/null
          fi
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Gate12-R8-Final-Runtime-Evidence
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 2
