name: Central Consolidation - Inventory

on:
  push:
    branches: [fush/integration-current]
    paths:
      - '.github/workflows/central-consolidation-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  INPUT_TREE: 'a5e6b4104b6760735fb6a6d7da472dc6c040b5cc'
  INVENTORY_HANDOFF_SHA: 'ebbebdc88dd8b30105cdb025717517b8dead1468'
  INVENTORY_PATCH_SHA256: 'e169dc89ba6d6598c30f4937f4e6f0013e2e8498137381b8569eb9e3f08b8f73'

jobs:
  integrate-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fush/integration-current
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          cp -a central_source work-source
          cd work-source
          git init -q
          git config user.name central-integration-ci
          git config user.email central-integration-ci@users.noreply.github.com
          git add -A
          TREE=$(git write-tree)
          echo "input_tree=$TREE"
          test "$TREE" = "$INPUT_TREE"
          git commit -qm "Cumulative Central before Inventory"
          test -f app/src/main/java/com/fush/erp/domain/ExpenseClassificationPolicy.kt
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main

      - name: Fetch exact validated Inventory P0 patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://raw.githubusercontent.com/aamggd/amgd/${INVENTORY_HANDOFF_SHA}/inventory_p0/inventory-p0.patch" -o inventory.patch
          echo "${INVENTORY_PATCH_SHA256}  inventory.patch" | sha256sum -c -
          cd work-source
          git apply --check ../inventory.patch
          git apply ../inventory.patch
          git diff --check
          test -f app/src/main/java/com/fush/erp/domain/StockLedgerInvariant.kt
          test -f app/src/test/java/com/fush/erp/domain/StockLedgerInvariantTest.kt
          git add -A
          git commit -qm "Integrate Inventory P0"
          echo "inventory_source_tree=$(git write-tree)" | tee ../inventory-source-tree.txt

      - name: Inventory domain regression
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.domain.StockLedgerInvariantTest' --tests 'com.fush.erp.domain.InventoryReportMathTest'

      - name: Full unit tests
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Central safety checks
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -R -q 'MIGRATION_32_33_SECURITY' app/src/main/java
          grep -R -Eq 'Migration\(33, *34\)|MIGRATION_33_34' app/src/main/java
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Replace Central source with cumulative tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf central_source
          mkdir central_source
          git -C work-source archive --format=tar HEAD | tar -x -C central_source
          test -f central_source/app/src/main/java/com/fush/erp/domain/StockLedgerInvariant.kt
          test -f central_source/app/src/main/java/com/fush/erp/domain/ExpenseClassificationPolicy.kt

      - name: Commit actual cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central_source inventory-source-tree.txt
          git commit -m "Central integration: add Inventory P0"
          git push origin HEAD:fush/integration-current
