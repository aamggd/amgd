name: Build Fush ERP Phase 14.5.4 Supplier AP

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-4-supplier-ap.yml'
      - 'phase14_5_4_supplier_ap/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.3 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.3-Historical-Reports-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31643733564
      - name: Restore Phase 14.5.3 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.3-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 42' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.3-phase14.5-historical-report-fix' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 17' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply Phase 14.5.4 supplier AP
        shell: bash
        run: |
          set -e
          python phase14_5_4_supplier_ap/apply_patch.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-4-output
          mkdir -p phase14-5-4-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-4-output/FushERP-Phase14.5.4-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-4-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-4-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-4-output/apksigner/apksigner
          zip -qr phase14-5-4-output/FushERP-Mobile-Phase14.5.4-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-4-output/FushERP-Phase14.5.4-unsigned.apk > phase14-5-4-output/FushERP-Phase14.5.4-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.4 — Supplier Payments, AP Ledger and Aging' \
            'Version: 0.15.4.4-phase14.5-supplier-ap (versionCode 43)' \
            'Room schema: 18 (migration 17 -> 18)' \
            '' \
            'Added:' \
            '- Supplier payments with invoice allocation and treasury/bank selection.' \
            '- Historical invoice due date snapshot for credit purchases.' \
            '- Supplier card totals: due, paid, outstanding and overdue.' \
            '- Supplier account ledger with invoices, supplier-credit returns and payments in true date order.' \
            '- AP aging buckets: current, 1-30, 31-60, 61-90, over 90 days.' \
            '- Purchase invoice detail now shows supplier payments and remaining payable.' \
            '- Foreign-currency supplier payments preserve historical invoice liability and post FX gain/loss difference.' \
            '- Unit tests for AP outstanding, FX split and aging buckets.' \
            > phase14-5-4-output/FushERP-Phase14.5.4-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.4-Supplier-AP-Build
          path: phase14-5-4-output/
          if-no-files-found: error
          retention-days: 7
