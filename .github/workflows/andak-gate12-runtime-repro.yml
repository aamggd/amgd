name: ANDAK Supplier Gate12 P0 Hotfix Runtime
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download exact signed hotfix
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          SHARE="tb39Ac1yh8nS"
          NAME="ANDAK-Supplier-v1.3.1-GATE12-P0-HOTFIX-R7-FINAL-SIGNED.apk"
          curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          curl -fsSL -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(jq -r '.downloadUrl' /tmp/download.json)
          curl -fL --retry 3 "$URL" -o "$GITHUB_WORKSPACE/andak-hotfix.apk"
          sha256sum "$GITHUB_WORKSPACE/andak-hotfix.apk"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Cold start, force-stop reopen, repeated launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            PKG=com.fush.market.supplier
            APK="$GITHUB_WORKSPACE/andak-hotfix.apk"
            LOG="$GITHUB_WORKSPACE/hotfix-runtime-logcat.txt"

            adb install "$APK"
            adb logcat -c

            echo "=== COLD START ==="
            adb shell am force-stop "$PKG"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 30
            PID1=$(adb shell pidof "$PKG" || true)
            echo "cold_start_pid=$PID1"
            test -n "$PID1"

            echo "=== FORCE STOP + REOPEN ==="
            adb shell am force-stop "$PKG"
            sleep 2
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 12
            PID2=$(adb shell pidof "$PKG" || true)
            echo "reopen_pid=$PID2"
            test -n "$PID2"

            echo "=== HOME + RESUME ==="
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 8
            PID3=$(adb shell pidof "$PKG" || true)
            echo "resume_pid=$PID3"
            test -n "$PID3"

            echo "=== REPEATED LAUNCH x3 ==="
            for i in 1 2 3; do
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
              sleep 3
            done
            PID4=$(adb shell pidof "$PKG" || true)
            echo "repeat_pid=$PID4"
            test -n "$PID4"

            adb logcat -d -v threadtime > "$LOG"
            echo "=== FATAL CHECK ==="
            grep -n -A80 -B20 -E "FATAL EXCEPTION|AndroidRuntime|Process: $PKG" "$LOG" || true
            if grep -q "FATAL EXCEPTION" "$LOG"; then
              echo "P0_RUNTIME=FAIL"
              exit 2
            fi
            echo "P0_RUNTIME=PASS"

      - name: Upload hotfix runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v1.3.1-P0-Hotfix-Runtime-Log
          path: hotfix-runtime-logcat.txt
          if-no-files-found: warn
          retention-days: 1
