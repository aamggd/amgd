name: ANDAK Supplier Gate12 Runtime Repro
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download exact final signed APK
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          SHARE="_WnjY8OlknwQ"
          NAME="ANDAK-Supplier-v1.3.0-GATE12-FINAL-SIGNED.apk"
          curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          curl -fsSL -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(jq -r '.downloadUrl' /tmp/download.json)
          curl -fL --retry 3 "$URL" -o "$GITHUB_WORKSPACE/andak-final.apk"
          sha256sum "$GITHUB_WORKSPACE/andak-final.apk"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run exact release and capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/andak-final.apk"
            adb logcat -c
            adb shell am force-stop com.fush.market.supplier
            adb shell monkey -p com.fush.market.supplier -c android.intent.category.LAUNCHER 1 || true
            sleep 15
            echo "PID=$(adb shell pidof com.fush.market.supplier || true)"
            adb shell dumpsys activity activities | grep -A5 -B5 com.fush.market.supplier || true
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/runtime-logcat.txt"
            echo "=== APP/FATAL EXCERPT ==="
            grep -n -A120 -B30 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.fush.market.supplier|com.fush.market.supplier" "$GITHUB_WORKSPACE/runtime-logcat.txt" | tail -400 || true
            if grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/runtime-logcat.txt"; then exit 2; fi
            test -n "$(adb shell pidof com.fush.market.supplier || true)"

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Gate12-Final-Runtime-Log
          path: runtime-logcat.txt
          if-no-files-found: warn
          retention-days: 1
