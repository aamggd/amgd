name: ANDAK Supplier Gate12 Runtime Repro
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download exact R6 source
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          SHARE="THdn4-kcQedc"
          NAME="ANDAK-Supplier-v1.3.0-GATE12-Source-R6.zip"
          curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          curl -fsSL -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(jq -r '.downloadUrl' /tmp/download.json)
          curl -fL --retry 3 "$URL" -o /tmp/source.zip
          mkdir -p "$GITHUB_WORKSPACE/gate12"
          unzip -q /tmp/source.zip -d "$GITHUB_WORKSPACE/gate12"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: gate12
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :apps:supplier:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run app and capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK=$(find "$GITHUB_WORKSPACE/gate12/apps/supplier/build/outputs/apk/debug" -name '*.apk' | head -1)
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.fush.market.supplier
            adb shell monkey -p com.fush.market.supplier -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb shell pidof com.fush.market.supplier || true
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/runtime-logcat.txt"
            echo "=== FATAL ==="
            grep -n -A80 -B20 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.fush.market.supplier" "$GITHUB_WORKSPACE/runtime-logcat.txt" || true
            if grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/runtime-logcat.txt"; then exit 2; fi

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Gate12-R6-Runtime-Log
          path: runtime-logcat.txt
          if-no-files-found: warn
          retention-days: 1
