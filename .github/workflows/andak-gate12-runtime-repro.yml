name: ANDAK Supplier Gate12 R8 Strict Instrumentation
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]

jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download exact R8 source with wrapper
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          SHARE="WI2KFLGYSsYm"
          NAME="ANDAK-Supplier-v1.3.2-GATE12-R8-Source-With-Wrapper.zip"
          curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          curl -fsSL -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(jq -r '.downloadUrl' /tmp/download.json)
          curl -fL --retry 3 "$URL" -o /tmp/r8.zip
          mkdir -p "$GITHUB_WORKSPACE/r8"
          unzip -q /tmp/r8.zip -d "$GITHUB_WORKSPACE/r8"
          chmod +x "$GITHUB_WORKSPACE/r8/gradlew"
          test -x "$GITHUB_WORKSPACE/r8/gradlew"
          test -f "$GITHUB_WORKSPACE/r8/gradle/wrapper/gradle-wrapper.jar"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run strict instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/r8"
            test -x ./gradlew
            ./gradlew --version
            ./gradlew --no-daemon :apps:supplier:connectedDebugAndroidTest 2>&1 | tee "$GITHUB_WORKSPACE/r8-strict-instrumentation.log"
            grep -q "BUILD SUCCESSFUL" "$GITHUB_WORKSPACE/r8-strict-instrumentation.log"

      - name: Upload strict instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Gate12-R8-Strict-Instrumentation
          path: r8-strict-instrumentation.log
          if-no-files-found: error
          retention-days: 2
