name: Validate Reports Printing Current Central34 Handoff V2

on:
  push:
    branches: [fush/reports-printing-central34-handoff]
    paths:
      - '.github/workflows/validate-reports-printing-current34-handoff-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 14.5.53 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.53-Accounting-Printing-Build
          path: refs/p53
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31908733997
      - name: Download Phase 14.5.55 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.55-Report-Export-Hardening-Build
          path: refs/p55
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31913717196
      - name: Download Phase 14.5.57 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.57-Management-Print-Coverage-Build
          path: refs/p57
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31915147268
      - name: Download Phase 14.5.58 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.58-Nonblocking-Export-Build
          path: refs/p58
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31915869146

      - name: Build exact current-Central selective handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 2cb8da801fc54aec8c1f0d6a83588f097ca85117)" = "2cb8da801fc54aec8c1f0d6a83588f097ca85117"
          grep -q 'applicationId = "com.fush.erp.recovery"' central_source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f central_source/app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -q 'MIGRATION_32_33_SECURITY' central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'MIGRATION_33_34_FIXED_ASSETS' central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! grep -Rqs 'fallbackToDestructiveMigration' central_source/app/src/main

          extract_ref() {
            local phase="$1" out="$2" src
            src="$(find "refs/$phase" -maxdepth 1 -type f -name '*Source.zip' | head -1)"
            test -n "$src"
            rm -rf "$out"; mkdir -p "$out"; unzip -q "$src" -d "$out"
            find "$out" -maxdepth 1 -type d -name 'FushERP_Mobile_*' | head -1
          }
          P53="$(extract_ref p53 /tmp/ref53)"
          P55="$(extract_ref p55 /tmp/ref55)"
          P57="$(extract_ref p57 /tmp/ref57)"
          P58="$(extract_ref p58 /tmp/ref58)"

          # Exact-base proof for the two shared exporter files.
          test "$(git hash-object central_source/app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt)" = "$(git hash-object "$P53/app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt")"
          test "$(git hash-object central_source/app/src/main/java/com/fush/erp/ui/export/ReportExportActions.kt)" = "$(git hash-object "$P57/app/src/main/java/com/fush/erp/ui/export/ReportExportActions.kt")"

          cd central_source
          rm -rf .git app/build .gradle build .kotlin
          git init -q
          git config user.email reports-current34@fush.local
          git config user.name "FUSH Reports Current34"
          git add -A; git commit -qm current-central-2cb8da8-room34
          BASE_SHA="$(git rev-parse HEAD)"

          make_repo() {
            local src="$1" out="$2"
            rm -rf "$out"; mkdir -p "$out"; cp -a "$src/." "$out/"
            cd "$out"; rm -rf .git app/build .gradle build .kotlin
            git init -q; git config user.email refs@fush.local; git config user.name "FUSH Historical Reference"
            git add -A; git commit -qm reference-base
          }

          # 1) Export engine hardening: exact p53 -> p55 exporter-only delta.
          make_repo "$P53" /tmp/gen1
          cd /tmp/gen1
          mkdir -p app/src/main/java/com/fush/erp/ui/export app/src/test/java/com/fush/erp/ui/export
          for f in ReportExportSupport.kt ReportExportLayout.kt ReportTextLayout.kt; do cp "$P55/app/src/main/java/com/fush/erp/ui/export/$f" app/src/main/java/com/fush/erp/ui/export/; done
          for f in ReportExportLayoutTest.kt ReportSpreadsheetExportTest.kt ReportTextLayoutTest.kt; do cp "$P55/app/src/test/java/com/fush/erp/ui/export/$f" app/src/test/java/com/fush/erp/ui/export/; done
          git add -A; git diff --cached --binary --full-index HEAD > /tmp/01-export-hardening.patch
          cd "$GITHUB_WORKSPACE/central_source"
          git apply --check /tmp/01-export-hardening.patch; git apply --index /tmp/01-export-hardening.patch
          git commit -qm reports-export-hardening

          # 2a) Direct print coverage that applies cleanly to current Central.
          make_repo "$P55" /tmp/gen2
          cd /tmp/gen2
          CLEAN=(CollectionsDetailScreen.kt EmployeeScreens.kt PartyScreens.kt PurchaseScreens.kt SalesRepresentativeScreens.kt SalesScreens.kt)
          mkdir -p app/src/main/java/com/fush/erp/ui/screens app/src/test/java/com/fush/erp/ui/screens
          for f in "${CLEAN[@]}" DirectSectionReports.kt RemainingSectionReports.kt; do cp "$P57/app/src/main/java/com/fush/erp/ui/screens/$f" app/src/main/java/com/fush/erp/ui/screens/; done
          for f in DirectSectionReportsTest.kt RemainingSectionReportsTest.kt; do cp "$P57/app/src/test/java/com/fush/erp/ui/screens/$f" app/src/test/java/com/fush/erp/ui/screens/; done
          git add -A; git diff --cached --binary --full-index HEAD > /tmp/02-clean-print-coverage.patch
          cd "$GITHUB_WORKSPACE/central_source"
          for f in "${CLEAN[@]}"; do git hash-object -w "$P55/app/src/main/java/com/fush/erp/ui/screens/$f" >/dev/null; done
          git apply --3way --index /tmp/02-clean-print-coverage.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -qm reports-clean-direct-print-coverage

          # 2b) The 8 evolved Central screens: transplant only the report hooks into CURRENT code.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/com/fush/erp/ui/screens')

          def read(name): return (root/name).read_text()
          def write(name, s): (root/name).write_text(s)
          def add_import(s, line, after):
              if line in s: return s
              if after not in s: raise SystemExit(f'import anchor missing: {after}')
              return s.replace(after, after + '\n' + line, 1)
          def insert_after(s, anchor, block, marker):
              if marker in s: return s
              if anchor not in s: raise SystemExit(f'anchor missing for {marker}: {anchor[:100]}')
              return s.replace(anchor, anchor + block, 1)
          def insert_before(s, anchor, block, marker):
              if marker in s: return s
              if anchor not in s: raise SystemExit(f'anchor missing for {marker}: {anchor[:100]}')
              return s.replace(anchor, block + anchor, 1)

          # Advanced inventory
          n='AdvancedInventoryScreens.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          a='''                LazyRow(horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                    items(sectionLabels) { (sectionKey, labelRes) ->\n                        FilterChip(selected = section == sectionKey, onClick = { section = sectionKey }, label = { Text(stringResource(labelRes)) })\n                    }\n                }'''
          b='''\n                Spacer(Modifier.height(8.dp))\n                ReportExportActions(\n                    document = inventoryDirectReport(section, balances, reorder, expiry, counts, transfers, lots, movements),\n                    baseName = "FushERP-Inventory-${section}",\n                    printJobName = "Fush ERP — المخزون والمستودعات — $section",\n                    enabled = balances.isNotEmpty() || reorder.isNotEmpty() || expiry.isNotEmpty() || counts.isNotEmpty() || transfers.isNotEmpty() || lots.isNotEmpty() || movements.isNotEmpty(),\n                )'''
          s=insert_after(s,a,b,'FushERP-Inventory-${section}'); write(n,s)

          # Backup/restore
          n='BackupRestoreScreen.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.BuildConfig','import com.fush.erp.backup.RestoreInspection')
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          a='''                    Text("SHA-256: ${info.databaseSha256}", style = MaterialTheme.typography.bodySmall)'''
          b='''\n                    Spacer(Modifier.height(6.dp))\n                    ReportExportActions(\n                        document = backupVerificationReport(info, BuildConfig.VERSION_NAME),\n                        baseName = "FushERP-Backup-Verification",\n                        printJobName = "FUSH ERP - شهادة تحقق النسخة الاحتياطية"\n                    )'''
          s=insert_after(s,a,b,'FushERP-Backup-Verification'); write(n,s)

          # Geography
          n='GeographyScreens.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          pairs=[
          ('''            Button(onClick = { showAdd = true }) { Text("تسجيل سعر يومي") }''','''\n            Spacer(Modifier.height(6.dp))\n            ReportExportActions(\n                document = geographyFxReport(snapshots, rates),\n                baseName = "FushERP-FX-History",\n                printJobName = "FUSH ERP - أسعار الصرف",\n                enabled = snapshots.isNotEmpty() || rates.isNotEmpty()\n            )''','FushERP-FX-History'),
          ('''            Button(enabled = product != null && policies.isNotEmpty(), onClick = { showPrice = true }) { Text("إضافة سعر محافظة") }''','''\n            Spacer(Modifier.height(6.dp))\n            ReportExportActions(\n                document = geographyPoliciesReport(policies),\n                baseName = "FushERP-Province-Policies",\n                printJobName = "FUSH ERP - سياسات المحافظات",\n                enabled = policies.isNotEmpty()\n            )''','FushERP-Province-Policies'),
          ('''        Text("البيع يستخدم فقط القائمة الفعالة والسارية في تاريخ الفاتورة لنفس المحافظة والقناة والعملة.", style = MaterialTheme.typography.bodySmall)''','''\n        ReportExportActions(\n            document = geographyPricesReport(product, prices),\n            baseName = "FushERP-Province-Prices-${product.code}",\n            printJobName = "FUSH ERP - قائمة أسعار ${product.nameAr}",\n            enabled = prices.isNotEmpty()\n        )''','FushERP-Province-Prices-${product.code}'),
          ('''                        Text("المكافئ: ${geoMoney(q.totalBaseEquivalent)} ريال جديد", style = MaterialTheme.typography.titleMedium)''','''\n                        Spacer(Modifier.height(6.dp))\n                        ReportExportActions(\n                            document = geographyQuoteReport(policy, q),\n                            baseName = "FushERP-Geographic-Quote",\n                            printJobName = "FUSH ERP - عرض تسعير جغرافي"\n                        )''','FushERP-Geographic-Quote'),
          ('''            Button(onClick = { reload() }) { Text("تحديث التقرير") }''','''\n            Spacer(Modifier.height(6.dp))\n            ReportExportActions(\n                document = geographyProfitabilityReport(from, to, provinces, invoices),\n                baseName = "FushERP-Geographic-Profitability",\n                printJobName = "FUSH ERP - الربحية الجغرافية",\n                enabled = provinces.isNotEmpty() || invoices.isNotEmpty()\n            )''','FushERP-Geographic-Profitability')]
          for a,b,m in pairs: s=insert_after(s,a,b,m)
          write(n,s)

          # Governance: preserve new permissions/list structure, add only report item.
          n='GovernanceScreen.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          a='''        if (message != null) {\n            item { FushOperationMessage(message, onConsumed = { message = null }) }\n        }'''
          b='''\n        item {\n            ReportExportActions(\n                document = governanceDirectReport(tab, documents, changes, approvals, audit),\n                baseName = "FushERP-Governance-${tab + 1}",\n                printJobName = "Fush ERP — الحوكمة والتدقيق",\n                enabled = documents.isNotEmpty() || changes.isNotEmpty() || approvals.isNotEmpty() || audit.isNotEmpty(),\n            )\n        }'''
          s=insert_after(s,a,b,'FushERP-Governance-${tab + 1}'); write(n,s)

          # Maintenance
          n='MaintenanceScreens.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.FushOperationMessage')
          a='''                    Text("النتائج: ${filteredAssets.size}", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          b='''\n                    ReportExportActions(\n                        document = maintenanceDirectReport(filteredAssets, workOrders, breakdowns, safetyIncidents, search, statusFilter, criticalityFilter),\n                        baseName = "FushERP-Maintenance-Safety",\n                        printJobName = "Fush ERP — الأصول والصيانة والسلامة",\n                        enabled = filteredAssets.isNotEmpty() || workOrders.isNotEmpty() || breakdowns.isNotEmpty() || safetyIncidents.isNotEmpty(),\n                    )'''
          s=insert_after(s,a,b,'FushERP-Maintenance-Safety'); write(n,s)

          # Planning
          n='PlanningScreen.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          anchor='''        item {\n            ElevatedCard(Modifier.fillMaxWidth()) {\n                Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                    Text("توقع الشهر القادم", style = MaterialTheme.typography.titleMedium)'''
          block='''        item {\n            ReportExportActions(\n                document = planningDirectReport(\n                    selectedItem, selectedPolicy, forecast, seasonality, demandPlan,\n                    weeklyBudget, weeklyActual, seasonalAnalysis, provinceSeasonalityRows,\n                    finishedPolicy, productionPlan, productionPlanMaterials\n                ),\n                baseName = "FushERP-Planning-Seasonality",\n                printJobName = "FUSH ERP - التخطيط والموسمية",\n                enabled = selectedItem != null && selectedPolicy != null\n            )\n        }\n\n'''
          s=insert_before(s,anchor,block,'FushERP-Planning-Seasonality'); write(n,s)

          # Risk control: preserve new LazyColumn/metrics, add only report item.
          n='RiskControlScreen.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          a='''        if (message != null) {\n            item { FushOperationMessage(message, onConsumed = { message = null }) }\n        }'''
          b='''\n        item {\n            ReportExportActions(\n                document = riskDirectReport(tab, risks, controls, tests, exceptions, rules),\n                baseName = "FushERP-Risk-Control",\n                printJobName = "FUSH ERP - المخاطر والرقابة الداخلية",\n                enabled = when (tab) {\n                    0 -> risks.isNotEmpty()\n                    1 -> controls.isNotEmpty()\n                    2 -> tests.isNotEmpty()\n                    3 -> exceptions.isNotEmpty()\n                    else -> rules.isNotEmpty()\n                }\n            )\n        }'''
          s=insert_after(s,a,b,'FushERP-Risk-Control'); write(n,s)

          # HomeShell: adapt historical report intent to current localized dashboard structure.
          n='HomeShell.kt'; s=read(n)
          s=add_import(s,'import com.fush.erp.BuildConfig','import com.fush.erp.R')
          s=add_import(s,'import com.fush.erp.ui.export.ReportExportActions','import com.fush.erp.ui.*')
          a='''    val readiness = when {\n        criticalCount > 0 -> stringResource(R.string.common_needs_action)\n        alerts.isNotEmpty() -> stringResource(R.string.common_follow_up)\n        else -> stringResource(R.string.common_stable)\n    }'''
          b='''\n    val dashboardPulse = listOf(\n        "العملاء" to customerCount.toString(),\n        "فواتير البيع" to salesCount.toString(),\n        "التحصيلات" to receiptCount.toString(),\n        "الموردون" to supplierCount.toString(),\n        "المشتريات" to purchaseCount.toString(),\n        "أوامر الإنتاج" to productionCount.toString(),\n        "الأصناف" to itemCount.toString(),\n        "الموظفون" to employeeCount.toString(),\n        "المناديب" to salesRepCount.toString(),\n        "صيانة مفتوحة" to openMaintenanceCount.toString(),\n        "مخاطر مفتوحة" to openRiskCount.toString(),\n        "موافقات معلقة" to pendingApprovalCount.toString(),\n        "تدريب منتهي" to expiredTrainingCount.toString(),\n        "تصاريح منتهية" to expiredAuthorizationCount.toString(),\n        "الإصدار" to BuildConfig.VERSION_NAME\n    )\n    val dashboardReportAlerts = alerts.map { alert ->\n        Triple(\n            stringResource(alert.titleRes),\n            stringResource(alert.detailRes, *alert.detailArgs.toTypedArray()),\n            alert.critical\n        )\n    }'''
          s=insert_after(s,a,b,'dashboardReportAlerts')
          a='''        item {\n            FushSectionHeader(\n                title = stringResource(R.string.dashboard_title),\n                subtitle = stringResource(R.string.dashboard_subtitle),\n            )\n        }'''
          b='''\n        item {\n            ReportExportActions(\n                document = executiveDashboardReport(executive, readiness, dashboardReportAlerts, dashboardPulse),\n                baseName = "FushERP-Executive-Dashboard",\n                printJobName = "FUSH ERP - لوحة الإدارة التنفيذية"\n            )\n        }'''
          s=insert_after(s,a,b,'FushERP-Executive-Dashboard')
          a='''        FushOperationMessage(message, onConsumed = { message = null })'''
          b='''\n        Spacer(Modifier.height(8.dp))\n        ReportExportActions(\n            document = masterDataDirectReport(\n                section = section,\n                search = search,\n                items = filteredItems,\n                units = filteredUnits,\n                warehouses = filteredWarehouses,\n                conversions = filteredConversions,\n                allItems = itemsList,\n                allUnits = units\n            ),\n            baseName = "FushERP-Master-Data",\n            printJobName = "FUSH ERP - البيانات الأساسية",\n            enabled = when (section) {\n                "الوحدات" -> filteredUnits.isNotEmpty()\n                "المخازن" -> filteredWarehouses.isNotEmpty()\n                "التحويلات" -> filteredConversions.isNotEmpty()\n                else -> filteredItems.isNotEmpty()\n            }\n        )'''
          # Use the last MasterData occurrence, not any earlier message block.
          if 'FushERP-Master-Data' not in s:
              idx=s.find('@Composable\nprivate fun MasterDataScreen')
              if idx < 0: raise SystemExit('MasterDataScreen missing')
              pre, tail=s[:idx],s[idx:]
              if a not in tail: raise SystemExit('MasterData operation message anchor missing')
              tail=tail.replace(a,a+b,1)
              s=pre+tail
          write(n,s)
          PY
          git add app/src/main/java/com/fush/erp/ui/screens
          git diff --cached --check HEAD
          git commit -qm reports-selective-hooks-on-evolved-central-screens

          # 3) Non-blocking export: exact p57 -> p58 exporter-only delta.
          make_repo "$P57" /tmp/gen3
          cd /tmp/gen3
          cp "$P58/app/src/main/java/com/fush/erp/ui/export/ReportExportActions.kt" app/src/main/java/com/fush/erp/ui/export/
          cp "$P58/app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt" app/src/main/java/com/fush/erp/ui/export/
          cp "$P58/app/src/test/java/com/fush/erp/ui/export/ReportSpreadsheetExportTest.kt" app/src/test/java/com/fush/erp/ui/export/
          git add -A; git diff --cached --binary --full-index HEAD > /tmp/03-nonblocking-export.patch
          cd "$GITHUB_WORKSPACE/central_source"
          git apply --check /tmp/03-nonblocking-export.patch; git apply --index /tmp/03-nonblocking-export.patch
          git commit -qm reports-nonblocking-export

          # Test-only Android Print Framework harness.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts'); s=p.read_text()
          needle='    testImplementation(libs.androidx.room.testing)\n'
          extra='''    testImplementation(libs.androidx.room.testing)\n    androidTestImplementation("androidx.test:runner:1.6.2")\n    androidTestImplementation("androidx.test:core-ktx:1.6.1")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")\n'''
          if 'androidx.test:runner:1.6.2' not in s:
              if needle not in s: raise SystemExit('androidTest dependency anchor missing')
              p.write_text(s.replace(needle,extra,1))
          PY
          mkdir -p app/src/androidTest/java/com/fush/erp/ui/export
          cat > app/src/androidTest/java/com/fush/erp/ui/export/ReportPrintFrameworkSmokeTest.kt <<'KOTLIN'
          package com.fush.erp.ui.export
          import android.content.Context
          import android.os.SystemClock
          import android.print.PrintManager
          import androidx.test.core.app.ActivityScenario
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import com.fush.erp.MainActivity
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class ReportPrintFrameworkSmokeTest {
              @Test fun generatedReportIsAcceptedByAndroidPrintFramework() {
                  val doc = ReportExportDocument(
                      title = "اختبار طباعة Fush ERP",
                      subtitle = "Arabic RTL + English + 123,456.78 ر.ي",
                      summary = listOf("الحالة" to "Print Framework Smoke"),
                      tables = listOf(ReportExportTable(
                          "قيود اختبارية",
                          listOf("التاريخ", "رقم القيد", "البيان"),
                          listOf(listOf("2026-08-17", "RV-20260817-VERY-LONG-REFERENCE-WITHOUT-SPACES-1234567890", "بيان عربي طويل لاختبار الالتفاف وعدم تداخل النص مع العمود المجاور English 12345"))
                      ))
                  )
                  val bytes = ReportExportSupport.buildPdfBytesForAction(doc)
                  assertTrue(bytes.size > 100)
                  assertTrue(String(bytes.copyOfRange(0,4), Charsets.US_ASCII) == "%PDF")
                  val scenario = ActivityScenario.launch(MainActivity::class.java)
                  scenario.onActivity { activity ->
                      val pm=activity.getSystemService(Context.PRINT_SERVICE) as PrintManager
                      val label="FUSH-REPORT-PRINT-SMOKE"
                      ReportExportSupport.printPreparedPdf(activity, doc, label, bytes)
                      SystemClock.sleep(1200)
                      assertTrue(pm.printJobs.any { it.info.label == label })
                  }
                  InstrumentationRegistry.getInstrumentation().uiAutomation.pressBack()
                  scenario.close()
              }
          }
          KOTLIN
          git add app/build.gradle.kts app/src/androidTest
          git commit -qm reports-print-framework-smoke-test

          git diff --binary "$BASE_SHA"..HEAD > "$GITHUB_WORKSPACE/reports_printing_current34_handoff/HANDOFF.patch"
          git diff --name-only "$BASE_SHA"..HEAD > "$GITHUB_WORKSPACE/reports_printing_current34_handoff/CHANGED_FILES.txt"
          git diff --check "$BASE_SHA"..HEAD
          ! git diff --name-only "$BASE_SHA"..HEAD | grep -E '^app/src/main/java/com/fush/erp/data/(FushDatabase|AppContainer)\.kt$'
          ! git diff --name-only "$BASE_SHA"..HEAD | grep -E '^app/src/main/java/com/fush/erp/data/(entity|migration|Migrations)'
          ! git diff --name-only "$BASE_SHA"..HEAD | grep -E '^app/src/main/java/com/fush/erp/domain/'
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -Rqs 'fallbackToDestructiveMigration' app/src/main

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Unit tests
        shell: bash
        run: cd central_source && gradle --no-daemon :app:testDebugUnitTest
      - name: Release build and Central safety
        shell: bash
        run: |
          set -euo pipefail
          cd central_source
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -Rqs 'fallbackToDestructiveMigration' app/src/main
      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -f -n fush_reports_print -k "system-images;android-35;google_apis;x86_64" --device "pixel_6"
      - name: Android Print Framework emulator smoke
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          nohup emulator -avd fush_reports_print -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82 || true
          cd central_source
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.ui.export.ReportPrintFrameworkSmokeTest
          adb shell dumpsys print > ../reports_printing_current34_handoff/PRINT_DUMPSYS.txt || true
      - name: Package verified handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports-handoff-output
          cp reports_printing_current34_handoff/HANDOFF.patch reports-handoff-output/
          cp reports_printing_current34_handoff/CHANGED_FILES.txt reports-handoff-output/
          cp reports_printing_current34_handoff/PRINT_DUMPSYS.txt reports-handoff-output/ 2>/dev/null || true
          cp reports_printing_current34_handoff/README.md reports-handoff-output/HANDOFF.md
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 central_source/app/build/outputs/apk/release/app-release-unsigned.apk reports-handoff-output/FushERP-Reports-Printing-Current34-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 reports-handoff-output/FushERP-Reports-Printing-Current34-aligned-unsigned.apk
          sha256sum reports-handoff-output/HANDOFF.patch reports-handoff-output/FushERP-Reports-Printing-Current34-aligned-unsigned.apk > reports-handoff-output/SHA256SUMS.txt
          printf '%s\n' \
            'FUSH Reports/Printing — Current Central Room34 Handoff' \
            'Base Central HEAD: 2cb8da801fc54aec8c1f0d6a83588f097ca85117' \
            'Base Central source tree: 7733c6570357eb813f7e05e5093752ea26788749' \
            'Application ID: com.fush.erp.recovery' \
            'Room schema: 34 unchanged' \
            'Migrations: unchanged' \
            'Historical Phase 14.5.58 full merge: NOT USED' \
            'Full JVM unit tests: PASS' \
            'Release build: PASS' \
            'Android Print Framework emulator smoke: PASS' \
            'Zipalign: PASS' \
            'STOP: ready for handoff approval; no next phase started.' > reports-handoff-output/BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Reports-Printing-Current34-Handoff-V2
          path: reports-handoff-output/
          if-no-files-found: error
          retention-days: 7
