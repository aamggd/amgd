name: Export Android Signing Tools Native

on:
  push:
    branches: [ci-android-tools-native-20260929]
    paths:
      - '.github/workflows/export-android-signing-tools-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Android tools
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36"
      - name: Package tools and compile platform
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/build-tools-36.0.0/lib out/build-tools-36.0.0/lib64 out/platforms/android-36
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/build-tools-36.0.0/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/build-tools-36.0.0/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/build-tools-36.0.0/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" out/build-tools-36.0.0/lib64/
          cp "$ANDROID_HOME/platforms/android-36/android.jar" out/platforms/android-36/
          chmod +x out/build-tools-36.0.0/apksigner out/build-tools-36.0.0/zipalign
          tar -C out -czf out/android-tools-36-native-platform.tgz build-tools-36.0.0 platforms/android-36
          sha256sum out/android-tools-36-native-platform.tgz > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-tools-36-native-platform
          path: out
          if-no-files-found: error
