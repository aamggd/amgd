name: Audit P2C P1 Cross-Module Pre-Merge

on:
  push:
    branches: [fush/audit-evaluation]
    paths:
      - 'audit_evaluation/PART2C_P1_CROSS_MODULE_TEST_MATRIX.md'
      - 'audit_evaluation/tests/CrossModuleP1ContractAuditTest.kt'
      - '.github/workflows/audit-evaluation-p2c-p1-cross-module-premerge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CENTRAL_SHA: 'bd39c9fdce444da865460539ea80058f02770d4a'
  CENTRAL_REPO_TREE: '8b44fe7f02ae146673e11637cfa9f9169738a452'
  CENTRAL_SOURCE_TREE: '2c8f39d515e627d9d7d6ba1eac3e065a1d17f245'
  ACCOUNTING_P1_HANDOFF_SHA: '7510ff3dc03d28ebf751ebe32624e36ef175b9a7'
  TREASURY_P1_SHA: '7a1f1aec9f0315a23b62205aa5e4b049449203cc'
  PURCHASES_P1_SHA: 'b6a154a908898a25fcb40bd55dddfedce596c643'
  SALES_P1_SHA: 'f7e6263f2c675704913fb6c1fb675f7ade36fc37'
  PURCHASES_PATCH_BLOB: '6dd1066ef1b8e7c2e0fe25b0ec97d0357f7ee921'
  SALES_PATCH_BLOB: '8b5372494baf1e5943de24fa10b7e0a400c85928'

jobs:
  p2c-premerge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout audit branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Pin current Central and specialist P1 identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            fush/integration-current \
            fush/accounting \
            fush/treasury-banking \
            fush/purchases-suppliers \
            fush/sales-customers

          test "$(git rev-parse origin/fush/integration-current)" = "$CENTRAL_SHA"
          test "$(git rev-parse origin/fush/accounting)" = "$ACCOUNTING_P1_HANDOFF_SHA"
          test "$(git rev-parse origin/fush/treasury-banking)" = "$TREASURY_P1_SHA"
          test "$(git rev-parse origin/fush/purchases-suppliers)" = "$PURCHASES_P1_SHA"
          test "$(git rev-parse origin/fush/sales-customers)" = "$SALES_P1_SHA"
          test "$(git rev-parse ${CENTRAL_SHA}^{tree})" = "$CENTRAL_REPO_TREE"
          test "$(git rev-parse ${CENTRAL_SHA}:central_source)" = "$CENTRAL_SOURCE_TREE"

      - name: Export exact current Central with Accounting P1 and Treasury P1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work-source output /tmp/p2c-*.patch
          mkdir -p work-source output
          git archive "${CENTRAL_SHA}:central_source" | tar -x -C work-source

          cd work-source
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -q 'AccountingP1IntegrityPolicy' app/src/main/java/com/fush/erp/domain/AccountingP1IntegrityPolicy.kt
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'TreasuryPartyRequirementPolicy.requireValidSelection' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          test -f app/src/main/java/com/fush/erp/domain/TreasuryPartyRequirementPolicy.kt
          test -f app/src/test/java/com/fush/erp/domain/TreasuryPartyRequirementPolicyTest.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts

          git init -q
          git config user.name 'FUSH Audit P2C'
          git config user.email audit-p2c@fush.local
          git add -A
          git commit -qm 'Exact current Central with Accounting P1 and Treasury P1'
          test "$(git write-tree)" = "$CENTRAL_SOURCE_TREE"

      - name: Extract and verify exact pending Purchases P1 and Sales P1 patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse ${PURCHASES_P1_SHA}:purchases_suppliers_p1/phase_p1.patch)" = "$PURCHASES_PATCH_BLOB"
          test "$(git rev-parse ${SALES_P1_SHA}:sales_customers_p1/customer_identity_p1.patch)" = "$SALES_PATCH_BLOB"

          git show "${PURCHASES_P1_SHA}:purchases_suppliers_p1/phase_p1.patch" > /tmp/p2c-purchases.patch
          git show "${SALES_P1_SHA}:sales_customers_p1/customer_identity_p1.patch" > /tmp/p2c-sales.patch

          test "$(git hash-object /tmp/p2c-purchases.patch)" = "$PURCHASES_PATCH_BLOB"
          test "$(git hash-object /tmp/p2c-sales.patch)" = "$SALES_PATCH_BLOB"

          {
            echo "PURCHASES_GIT_BLOB=$PURCHASES_PATCH_BLOB"
            echo "SALES_GIT_BLOB=$SALES_PATCH_BLOB"
            sha256sum /tmp/p2c-purchases.patch /tmp/p2c-sales.patch
          } | tee output/PENDING_P1_PATCH_IDENTITIES.txt

      - name: Selectively apply Purchases then Sales P1 over current Central
        shell: bash
        run: |
          set -euo pipefail
          cd work-source

          git apply --check --recount /tmp/p2c-purchases.patch
          git apply --recount /tmp/p2c-purchases.patch

          git apply --check --recount /tmp/p2c-sales.patch
          git apply --recount /tmp/p2c-sales.patch

          git add -A
          git diff --cached --check

          cat > /tmp/p2c-expected-files <<'EOF'
          app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          app/src/main/java/com/fush/erp/domain/AccountingService.kt
          app/src/main/java/com/fush/erp/domain/CustomerMovementIdentity.kt
          app/src/main/java/com/fush/erp/domain/SalesService.kt
          app/src/main/java/com/fush/erp/domain/SupplierProfileMath.kt
          app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          app/src/test/java/com/fush/erp/domain/CustomerMovementIdentityTest.kt
          app/src/test/java/com/fush/erp/domain/SupplierProfileMathTest.kt
          EOF
          sort /tmp/p2c-expected-files -o /tmp/p2c-expected-files
          git diff --cached --name-only | sort > /tmp/p2c-actual-files
          diff -u /tmp/p2c-expected-files /tmp/p2c-actual-files

          ! git diff --cached --name-only | grep -Eq '^app/src/main/java/com/fush/erp/data/(FushDatabase|Migrations|SecurityMigrations)\.kt$|^app/schemas/'
          ! git diff --cached --name-only | grep -q '^app/build.gradle.kts$'

          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -q 'TreasuryPartyRequirementPolicy.requireValidSelection' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'CustomerMovementIdentity.requireId' app/src/main/java/com/fush/erp/domain/SalesService.kt
          grep -q 'supplierVoucherAdjustmentAt' app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'sp.supplierId=p.supplierId' app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'SupplierProfileMath.build' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts

          git commit -qm 'P2C pre-merge candidate: Purchases P1 and Sales P1 over current Central'
          echo "P2C_PREMERGE_SOURCE_TREE=$(git write-tree)" | tee -a "$GITHUB_ENV"

      - name: Inject audit-only cross-module contract test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work-source/app/src/test/java/com/fush/erp/audit
          cp audit_evaluation/tests/CrossModuleP1ContractAuditTest.kt \
            work-source/app/src/test/java/com/fush/erp/audit/CrossModuleP1ContractAuditTest.kt

      - name: Run focused Accounting Treasury Purchases Sales P1 tests
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.fush.erp.audit.CrossModuleP1ContractAuditTest' \
            --tests 'com.fush.erp.domain.AccountingP1IntegrityPolicyTest' \
            --tests 'com.fush.erp.domain.TreasuryPartyRequirementPolicyTest' \
            --tests 'com.fush.erp.domain.CustomerMovementIdentityTest' \
            --tests 'com.fush.erp.domain.SupplierMovementIdentityTest' \
            --tests 'com.fush.erp.domain.SupplierProfileMathTest'

      - name: Run full Unit regression suite
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build pre-merge release candidate
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate candidate invariants and mark NOT FINAL
        shell: bash
        run: |
          set -euo pipefail
          APK=work-source/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          grep -q 'applicationId = "com.fush.erp.recovery"' work-source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' work-source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f work-source/app/schemas/com.fush.erp.data.FushDatabase/35.json
          ! grep -R -n 'fallbackToDestructiveMigration' work-source/app/src/main work-source/app/build.gradle.kts

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$APK" output/FushERP-P2C-PREMERGE-NOT-FINAL-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -v 4 output/FushERP-P2C-PREMERGE-NOT-FINAL-aligned-unsigned.apk

          cat > output/PREMERGE_STATUS.txt <<EOF
          STATUS=PRE-MERGE COMPATIBILITY / CONTRACT TESTED ONLY
          FINAL_STATUS=BLOCKED UNTIL NEW INTEGRATED CENTRAL APK IS BUILT AND RETESTED
          CENTRAL_SHA=$CENTRAL_SHA
          CENTRAL_SOURCE_TREE=$CENTRAL_SOURCE_TREE
          PREMERGE_SOURCE_TREE=$P2C_PREMERGE_SOURCE_TREE
          ACCOUNTING_P1=INTEGRATED
          TREASURY_P1=INTEGRATED
          PURCHASES_P1=PREMERGE_CANDIDATE
          SALES_P1=PREMERGE_CANDIDATE
          ROOM_SCHEMA=35
          APPLICATION_ID=com.fush.erp.recovery
          EOF
          sha256sum output/FushERP-P2C-PREMERGE-NOT-FINAL-aligned-unsigned.apk >> output/PREMERGE_STATUS.txt

      - name: Upload pre-merge audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-P2C-P1-Cross-Module-PREMERGE-NOT-FINAL
          path: output/
          if-no-files-found: error
