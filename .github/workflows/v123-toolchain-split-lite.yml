name: V123 Toolchain Split Lite

on:
  push:
    branches:
      - agent/v123-toolchain-bootstrap-20260822
    paths:
      - '.github/workflows/v123-toolchain-split-lite.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/v123-toolchain-split-lite.yml'
  workflow_dispatch:

jobs:
  package-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Generate Gradle Wrapper 9.4.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrapper-project
          cd /tmp/wrapper-project
          printf '%s\n' 'rootProject.name = "wrapper-project"' > settings.gradle
          printf '%s\n' '' > build.gradle
          gradle --no-daemon wrapper --gradle-version 9.4.1
          ./gradlew --version
          mkdir -p "$GITHUB_WORKSPACE/v123-small/gradle/wrapper"
          cp gradlew "$GITHUB_WORKSPACE/v123-small/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/v123-small/gradlew.bat"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/v123-small/gradle/wrapper/gradle-wrapper.jar"
          cp gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/v123-small/gradle/wrapper/gradle-wrapper.properties"
      - name: Seed v123 dependencies without dexing
        shell: bash
        run: |
          set -euo pipefail
          SEED=/tmp/v123-seed
          mkdir -p "$SEED/app/src/main" "$SEED/app/schemas"
          cat > "$SEED/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FushV123DependencySeed"
          include(":app")
          EOF
          cat > "$SEED/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "9.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
              id("com.google.devtools.ksp") version "2.3.9" apply false
              id("androidx.room") version "2.8.4" apply false
          }
          EOF
          cat > "$SEED/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
              id("androidx.room")
          }
          android {
              namespace = "com.fush.seed"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.fush.seed"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              ksp("androidx.room:room-compiler:2.8.4")
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              testImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > "$SEED/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF
          cd "$SEED"
          gradle --no-daemon --max-workers=2 :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest
      - name: Package split offline assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v123-small/offline v123-parts
          tar -czf v123-small/offline/android-sdk36.tgz -C "$ANDROID_SDK_ROOT" build-tools/36.0.0 platforms/android-36 platform-tools licenses
          tar -czf /tmp/gradle-modules.tgz -C "$HOME/.gradle" caches/modules-2 wrapper
          split -b 200M -d -a 2 /tmp/gradle-modules.tgz v123-parts/gradle-modules.part.
          sha256sum v123-small/offline/android-sdk36.tgz > v123-small/offline/android-sdk36.tgz.sha256
          sha256sum /tmp/gradle-modules.tgz > v123-parts/gradle-modules.tgz.sha256
          sha256sum v123-parts/gradle-modules.part.* > v123-parts/parts.sha256
          ls -lh v123-small/offline/android-sdk36.tgz v123-parts/*
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-SDK36-And-Wrapper-Lite
          path: v123-small/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-GradleLite-00
          path: v123-parts/gradle-modules.part.00
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-GradleLite-01
          path: v123-parts/gradle-modules.part.01
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-GradleLite-02
          path: v123-parts/gradle-modules.part.02
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-GradleLite-03
          path: v123-parts/gradle-modules.part.03
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-GradleLite-Metadata
          path: |
            v123-parts/gradle-modules.tgz.sha256
            v123-parts/parts.sha256
          if-no-files-found: error
          retention-days: 1
