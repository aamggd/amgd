name: V236 Final Gate R1

on:
  push:
    branches: [ci-v236-final-r1-20260930]
    paths:
      - '.github/workflows/v236-final-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Download exact v236 source
        shell: bash
        env:
          SHARE_ID: kcR1HlKCjXmieNQt
          EXPECTED_SHA256: 37bd55fd2deec1ff7b5a8cbea9e310ff85617f9d6fbd46b6aa795f30406905da
        run: |
          set -euxo pipefail
          API_BASE='https://api.firestorage.ai/dev/file'
          curl -fLsS --retry 3 "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" -o files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('files.json')); files=d.get('files') or []
          if len(files)!=1: raise SystemExit(f'expected 1 file, got {len(files)}')
          print(files[0]['fileId'])
          PY
          )
          curl -fLsS --retry 3 -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('download.json'))['downloadUrl'])
          PY
          )
          curl -fL --retry 3 "$DOWNLOAD_URL" -o source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d src
      - name: Static gates
        working-directory: src
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/test_v225_backend_hardening.py
          python3 tools/test_v227_local_ai_actions.py
          python3 tools/test_v228_cloud_sync_hotfix.py
          python3 tools/test_v229_conflict_resolution_hotfix.py
          python3 tools/test_v230_cloud_connectivity_diagnostics.py
          python3 tools/test_v231_posted_journal_collision_hardening.py
          python3 tools/test_v232_posted_journal_immutable_runtime_guard.py
          python3 tools/test_v233_sync_all_preflight_resilience.py
          python3 tools/test_v236_sync_all_main_thread_hotfix.py
      - name: Full debug unit test suite
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee ../v236-full-unit-tests.log
      - name: Release build
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee ../v236-release-build.log
      - name: Package outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find src/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          AAB=$(find src/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -n "$APK"; test -n "$AAB"
          cp "$APK" out/FUSH_ERP_Mobile_v236-SyncAllMainThreadHotfix-UNSIGNED.apk
          cp "$AAB" out/FUSH_ERP_Mobile_v236-SyncAllMainThreadHotfix-UNSIGNED.aab
          (cd src && zip -qr ../out/FushERP-Mobile-v236-SyncAllMainThreadHotfix-Source-R1-BUILT.zip . -x 'app/build/*' '.gradle/*')
          cp v236-full-unit-tests.log out/
          cp v236-release-build.log out/
          sha256sum out/* > out/SHA256SUMS-V236.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v236-FINAL-GATE-R1
          path: out
          if-no-files-found: error
