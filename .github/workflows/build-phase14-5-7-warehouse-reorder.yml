name: Build Fush ERP Phase 14.5.7 Warehouse Reorder

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-7-warehouse-reorder.yml'
      - 'phase14_5_7_warehouse_reorder/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.6 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.6-Inventory-Separation-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31652536059
      - name: Restore Phase 14.5.6 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.6-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 45' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.6-phase14.5-inventory-warehouse-separation' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 19' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and diagnose Phase 14.5.7 warehouse reorder
        shell: bash
        run: |
          set +e
          python phase14_5_7_warehouse_reorder/apply_patch.py
          rc=$?
          echo "apply_patch exit=$rc"
          if [ -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt.rej ]; then
            echo '----- AdvancedInventoryScreens.kt.rej -----'
            cat FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt.rej
            echo '----- current screen head -----'
            sed -n '1,100p' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt
          fi
          exit $rc
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 20
        shell: bash
        run: |
          set -e
          grep -q 'version = 20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/20.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-7-output
          mkdir -p phase14-5-7-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-7-output/FushERP-Phase14.5.7-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-7-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-7-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-7-output/apksigner/apksigner
          zip -qr phase14-5-7-output/FushERP-Mobile-Phase14.5.7-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-7-output/FushERP-Phase14.5.7-unsigned.apk > phase14-5-7-output/FushERP-Phase14.5.7-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.7 — Warehouse-specific Reorder' \
            'Version: 0.15.4.7-phase14.5-warehouse-reorder (versionCode 46)' \
            'Room schema: 20 (migration 19 -> 20)' \
            '' \
            'Fixed:' \
            '- Reorder policy can now be configured per item and warehouse instead of item total only.' \
            '- Reorder alerts use usable stock in the selected warehouse.' \
            '- Expired and quarantined/blocked lot quantities are excluded from usable stock.' \
            '- Existing item-level reorder level remains available as fallback when no warehouse override exists.' \
            '- Added unit tests for warehouse usable-stock and reorder math.' \
            > phase14-5-7-output/FushERP-Phase14.5.7-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.7-Warehouse-Reorder-Build
          path: phase14-5-7-output/
          if-no-files-found: error
          retention-days: 7
