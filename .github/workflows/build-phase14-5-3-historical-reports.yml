name: Build Fush ERP Phase 14.5.3 Historical Reports

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-3-historical-reports.yml'
      - 'phase14_5_3_historical_reports/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.2-Purchase-Price-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31641917732
      - name: Restore Phase 14.5.2 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.2-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 41' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.2-phase14.5-purchase-price-compare' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 17' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply Phase 14.5.3 historical report fixes
        shell: bash
        run: |
          set -e
          python phase14_5_3_historical_reports/apply_patch.py
          grep -q 'versionCode = 42' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.3-phase14.5-historical-report-fix' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'movementDate <= :to' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'WITH period_activity AS' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'WITH period_suppliers AS' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q "COMMISSION_REVERSAL" FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/GeographyDao.kt
          grep -q 'returnDate <= :to' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/GeographyDao.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-3-output
          mkdir -p phase14-5-3-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-3-output/FushERP-Phase14.5.3-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-3-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-3-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-3-output/apksigner/apksigner
          zip -qr phase14-5-3-output/FushERP-Mobile-Phase14.5.3-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-3-output/FushERP-Phase14.5.3-unsigned.apk > phase14-5-3-output/FushERP-Phase14.5.3-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.3 — Historical Reporting P0 Fixes' \
            'Version: 0.15.4.3-phase14.5-historical-report-fix (versionCode 42)' \
            'Room schema: 17 (unchanged)' \
            '' \
            'Fixed:' \
            '- Executive inventory valuation is cut off at report end date.' \
            '- Executive receivables and overdue balances are reconstructed as of report end date.' \
            '- Customer report includes invoices, returns and receipts by their true transaction dates, including activity tied to older invoices.' \
            '- Supplier purchase report groups invoices and returns independently by their true dates.' \
            '- Geographic invoice/province profitability ignores returns after report end date.' \
            '- Historical commission impact uses dated accounting journal entries instead of mutable current reversed commission totals.' \
            > phase14-5-3-output/FushERP-Phase14.5.3-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.3-Historical-Reports-Build
          path: phase14-5-3-output/
          if-no-files-found: error
          retention-days: 7
