name: Central Consolidation - Treasury Banking

on:
  push:
    branches: [fush/integration-current]
    paths:
      - '.github/workflows/central-consolidation-treasury-banking.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  INPUT_TREE: 'eb312f774493aaa84d703cd2e4bcca50bccf3562'
  TREASURY_HANDOFF_SHA: '6a0270e1b9e06fcb735ac6205b2b4bfcf01ed11c'
  TREASURY_PATCH_SHA256: 'f0471f24fca05c1babdbb888975cd37cae8bac5c7640c28329a8575e528b1e2e'

jobs:
  integrate-treasury-banking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fush/integration-current
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          cp -a central_source work-source
          cd work-source
          git init -q
          git config user.name central-integration-ci
          git config user.email central-integration-ci@users.noreply.github.com
          git add -A
          TREE=$(git write-tree)
          echo "input_tree=$TREE"
          test "$TREE" = "$INPUT_TREE"
          git commit -qm "Cumulative Central before Treasury Banking"
          test -f app/src/main/java/com/fush/erp/domain/SupplierMovementIdentity.kt
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main

      - name: Fetch exact validated Treasury Banking P0 patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://raw.githubusercontent.com/aamggd/amgd/${TREASURY_HANDOFF_SHA}/phase_treasury_banking_p0/payload.patch.gz.b64" -o treasury-payload.b64
          base64 -d treasury-payload.b64 | gzip -dc > treasury-banking.patch
          echo "${TREASURY_PATCH_SHA256}  treasury-banking.patch" | sha256sum -c -
          cd work-source
          git am ../treasury-banking.patch
          git diff HEAD^ --check
          git add -A
          echo "treasury_source_tree=$(git write-tree)" | tee ../treasury-source-tree.txt

      - name: Treasury Banking domain regression
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.domain.TreasuryMovementTypePolicyTest' --tests 'com.fush.erp.domain.AccountingReportMathTest'
          for code in CUSTOMER_RECEIPT SUPPLIER_PAYMENT EXPENSE_PAYMENT EMPLOYEE_PAYMENT TRANSFER ADJUSTMENT; do
            grep -q "$code" app/src/main/java/com/fush/erp/domain/TreasuryMovementType.kt
          done

      - name: Full unit tests
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Central safety checks
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -R -q 'MIGRATION_32_33_SECURITY' app/src/main/java
          grep -R -Eq 'Migration\(33, *34\)|MIGRATION_33_34' app/src/main/java
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Replace Central source with cumulative tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf central_source
          mkdir central_source
          git -C work-source archive --format=tar HEAD | tar -x -C central_source
          test -f central_source/app/src/main/java/com/fush/erp/domain/TreasuryMovementType.kt
          test -f central_source/app/src/main/java/com/fush/erp/domain/SupplierMovementIdentity.kt

      - name: Commit actual cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central_source treasury-source-tree.txt
          git commit -m "Central integration: add Treasury Banking P0"
          git push origin HEAD:fush/integration-current
