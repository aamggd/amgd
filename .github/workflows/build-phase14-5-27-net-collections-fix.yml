name: Build Fush ERP Phase 14.5.27 Net Collections Fix

on:
  push:
    branches: [agent/phase14-5-24-party-subledger-vouchers]
    paths:
      - '.github/workflows/build-phase14-5-27-net-collections-fix.yml'
      - 'phase14_5_27_net_collections_fix/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download successful Phase 14.5.26 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.26-Stable-Recovery-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31841726668

      - name: Restore Phase 14.5.26 source and apply fix
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.26-Stable-Recovery-Source.zip
          cd FushERP_Mobile_Phase5
          patch -p1 < ../phase14_5_27_net_collections_fix/net_collections.diff
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 66' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.27-net-collections-fix"' app/build.gradle.kts
          grep -q 'voucherType=.PAYMENT' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'VOUCHER_PAYMENT' app/src/main/java/com/fush/erp/ui/screens/CollectionsDetailScreen.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify package, schema and queries
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=FushERP_Mobile_Phase5/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$MANIFEST"
          grep -q 'package="com.fush.erp.recovery"' "$MANIFEST"
          grep -q 'android:authorities="com.fush.erp.recovery.files"' "$MANIFEST"
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/25.json
          grep -q 'party_vouchers' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/25.json

      - name: Zipalign release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-27-output
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-27-output/FushERP-Phase14.5.27-Net-Collections-Fix-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-27-output/apksigner
          mkdir -p phase14-5-27-output/lib
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-27-output/lib/apksigner.jar
          chmod +x phase14-5-27-output/apksigner
          zip -qr phase14-5-27-output/FushERP-Mobile-Phase14.5.27-Net-Collections-Fix-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.27 — Net Collections Fix' \
            'Package: com.fush.erp.recovery' \
            'Version code: 66' \
            'Room schema: 25 (no migration required)' \
            'Fix: customer-linked RECEIPT vouchers increase collections.' \
            'Fix: customer-linked PAYMENT vouchers reduce collections.' \
            'Fix: reversed party vouchers are excluded.' \
            'Fix: collection details and customer sales reports use the same logic.' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-27-output/FushERP-Phase14.5.27-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.27-Net-Collections-Fix-Build
          path: phase14-5-27-output/
          if-no-files-found: error
          retention-days: 7
