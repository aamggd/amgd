name: Build Fush ERP Phase 14.5.33 Expense Dimensions

on:
  push:
    branches: [agent/phase14-5-24-party-subledger-vouchers]
    paths:
      - '.github/workflows/build-phase14-5-33-expense-dimensions.yml'
      - 'phase14_5_33_patch.part00'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download successful Phase 14.5.32 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.32-Production-Employee-Compensation-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31853152004
      - name: Restore Phase 14.5.32 and apply Phase 14.5.33
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.32-Production-Employee-Compensation-Source.zip
          cat phase14_5_33_patch.part00 | base64 -d | gunzip > /tmp/phase14_5_33.patch
          cd FushERP_Mobile_Phase5
          patch --dry-run -p4 < /tmp/phase14_5_33.patch
          patch -p4 < /tmp/phase14_5_33.patch
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 72' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.33-expense-dimensions-reporting"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'expense_dimensions' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'مساهمة مندوبي المبيعات' app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package and Room schema 27
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=FushERP_Mobile_Phase5/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$MANIFEST"
          grep -q 'package="com.fush.erp.recovery"' "$MANIFEST"
          SCHEMA=FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test -f "$SCHEMA"
          grep -q '"tableName": "expense_dimensions"' "$SCHEMA"
          grep -q '"tableName": "expense_attachments"' "$SCHEMA"
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json
      - name: Expense reporting SQL smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect(':memory:')
          c.executescript('''
          CREATE TABLE accounts(id INTEGER PRIMARY KEY, code TEXT, nameAr TEXT, type TEXT);
          CREATE TABLE party_vouchers(id INTEGER PRIMARY KEY, voucherNo TEXT, voucherType TEXT, offsetAccountId INTEGER, voucherDate INTEGER, currencyCode TEXT, amountOriginal REAL, amountBase REAL, description TEXT, status TEXT);
          CREATE TABLE employees(id INTEGER PRIMARY KEY, fullNameAr TEXT);
          CREATE TABLE sales_representatives(id INTEGER PRIMARY KEY, employeeId INTEGER, fullNameAr TEXT, status TEXT);
          CREATE TABLE customers(id INTEGER PRIMARY KEY, nameAr TEXT);
          CREATE TABLE suppliers(id INTEGER PRIMARY KEY, nameAr TEXT);
          CREATE TABLE items(id INTEGER PRIMARY KEY, nameAr TEXT);
          CREATE TABLE expense_dimensions(id INTEGER PRIMARY KEY, partyVoucherId INTEGER, employeeId INTEGER, employeeNameSnapshot TEXT, salesRepId INTEGER, salesRepNameSnapshot TEXT, costCenterCode TEXT, costCenterNameSnapshot TEXT, organizationUnit TEXT, referenceType TEXT, referenceId INTEGER, referenceNo TEXT, referenceLabelSnapshot TEXT, customerId INTEGER, customerNameSnapshot TEXT, supplierId INTEGER, supplierNameSnapshot TEXT, itemId INTEGER, itemNameSnapshot TEXT, paymentMethodSnapshot TEXT);
          CREATE TABLE expense_attachments(id INTEGER PRIMARY KEY, expenseId INTEGER);
          CREATE TABLE sales_invoices(id INTEGER PRIMARY KEY, salesRepId INTEGER, totalBase REAL, status TEXT);
          CREATE TABLE sales_returns(id INTEGER PRIMARY KEY, salesInvoiceId INTEGER, totalBase REAL, totalCostBase REAL, status TEXT);
          CREATE TABLE sales_lines(id INTEGER PRIMARY KEY, invoiceId INTEGER);
          CREATE TABLE sales_allocations(id INTEGER PRIMARY KEY, salesLineId INTEGER, costBase REAL);
          INSERT INTO accounts VALUES(1,'6430','مصاريف نقل ومواصلات','EXPENSE');
          INSERT INTO employees VALUES(1,'أحمد');
          INSERT INTO sales_representatives VALUES(1,1,'أحمد','ACTIVE');
          INSERT INTO party_vouchers VALUES(1,'EV-1','EXPENSE',1,100,'YER_NEW',5000,5000,'مواصلات توزيع','POSTED');
          INSERT INTO expense_dimensions VALUES(1,1,1,'أحمد',1,'أحمد','DISTRIBUTION','التوزيع','تعز','DISTRIBUTION',NULL,'DEL-1','توصيل عميل',NULL,'',NULL,'',NULL,'','CASH — الصندوق');
          INSERT INTO sales_invoices VALUES(1,1,100000,'POSTED');
          INSERT INTO sales_lines VALUES(1,1);
          INSERT INTO sales_allocations VALUES(1,1,40000);
          ''')
          expense=c.execute("SELECT SUM(pv.amountBase) FROM expense_dimensions ed JOIN party_vouchers pv ON pv.id=ed.partyVoucherId WHERE ed.employeeId=1 AND pv.status='POSTED'").fetchone()[0]
          sales=c.execute("SELECT SUM(totalBase) FROM sales_invoices WHERE salesRepId=1 AND status='POSTED'").fetchone()[0]
          cogs=c.execute("SELECT SUM(sa.costBase) FROM sales_allocations sa JOIN sales_lines sl ON sl.id=sa.salesLineId JOIN sales_invoices si ON si.id=sl.invoiceId WHERE si.salesRepId=1 AND si.status='POSTED'").fetchone()[0]
          assert expense==5000 and sales==100000 and cogs==40000 and sales-cogs-expense==55000
          print('Expense dimensions and sales rep contribution smoke test PASS')
          PY
      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-33-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-33-output/FushERP-Phase14.5.33-Expense-Dimensions-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-33-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-33-output/lib/apksigner.jar
          chmod +x phase14-5-33-output/apksigner
          zip -qr phase14-5-33-output/FushERP-Mobile-Phase14.5.33-Expense-Dimensions-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.33 — Expense Dimensions and Reporting' \
            'Package: com.fush.erp.recovery' \
            'Version code: 72' \
            'Room schema: 27' \
            'Preserves existing accounting data; migration adds analytical expense tables only.' \
            'Expense account remains the GL nature; employee/cost-center/reference are analytical dimensions.' \
            'Employee, sales rep, customer, supplier, product, branch/facility and operational references supported.' \
            'Expense attachments stored as persisted document URI metadata.' \
            'Sales rep contribution = net sales - net COGS - direct linked expenses.' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Room schema 27: PASS' \
            'Expense SQL smoke test: PASS' \
            'Zipalign: PASS' \
            > phase14-5-33-output/FushERP-Phase14.5.33-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.33-Expense-Dimensions-Build
          path: phase14-5-33-output/
          if-no-files-found: error
          retention-days: 7
