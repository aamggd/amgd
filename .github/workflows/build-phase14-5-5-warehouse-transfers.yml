name: Build Fush ERP Phase 14.5.5 Warehouse Transfers

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-5-warehouse-transfers.yml'
      - 'phase14_5_5_warehouse_transfers/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.4 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.4-Supplier-AP-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31646241330
      - name: Restore Phase 14.5.4 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.4-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 43' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.4-phase14.5-supplier-ap' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 18' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply Phase 14.5.5 warehouse transfers
        shell: bash
        run: |
          set -e
          python phase14_5_5_warehouse_transfers/apply_patch.py
          python - <<'PY'
          from pathlib import Path
          root = Path('FushERP_Mobile_Phase5')
          checks = {
              'app/build.gradle.kts': ['versionCode = 44', '0.15.4.5-phase14.5-warehouse-transfers'],
              'app/src/main/java/com/fush/erp/data/FushDatabase.kt': ['version = 19'],
              'app/src/main/java/com/fush/erp/data/Migrations.kt': ['MIGRATION_18_19', 'warehouse_transfers', 'warehouse_transfer_lines'],
              'app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt': ['postWarehouseTransfer', 'TRANSFER_OUT', 'TRANSFER_IN'],
          }
          for rel, needles in checks.items():
              text = (root / rel).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{needle} missing from {rel}'
          for rel in [
              'app/src/main/java/com/fush/erp/domain/WarehouseTransferMath.kt',
              'app/src/test/java/com/fush/erp/domain/WarehouseTransferMathTest.kt',
          ]:
              assert (root / rel).is_file(), f'{rel} missing'
          print('Phase 14.5.5 patch verification passed')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 19
        shell: bash
        run: |
          set -e
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/19.json
          grep -q 'warehouse_transfers' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/19.json
          grep -q 'warehouse_transfer_lines' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/19.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-5-output
          mkdir -p phase14-5-5-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-5-output/FushERP-Phase14.5.5-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-5-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-5-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-5-output/apksigner/apksigner
          zip -qr phase14-5-5-output/FushERP-Mobile-Phase14.5.5-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-5-output/FushERP-Phase14.5.5-unsigned.apk > phase14-5-5-output/FushERP-Phase14.5.5-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.5 — Warehouse Transfers' \
            'Version: 0.15.4.5-phase14.5-warehouse-transfers (versionCode 44)' \
            'Room schema: 19 (migration 18 -> 19)' \
            '' \
            'Added:' \
            '- Draft/posted/cancelled warehouse transfer documents.' \
            '- Multi-line transfers by item and lot/expiry.' \
            '- Atomic TRANSFER_OUT and TRANSFER_IN stock movements.' \
            '- Historical/as-of source balance validation for backdated transfers.' \
            '- Preserves lot, expiry and weighted inventory cost between warehouses.' \
            '- Preserves existing lot-control status when moved to a new warehouse.' \
            '- Prevents same source/destination, zero quantities and overdraw.' \
            '- No GL entry for internal transfers because total inventory value is unchanged.' \
            '- Audit events for create/post/cancel and unit tests for transfer math.' \
            > phase14-5-5-output/FushERP-Phase14.5.5-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.5-Warehouse-Transfers-Build
          path: phase14-5-5-output/
          if-no-files-found: error
          retention-days: 7
