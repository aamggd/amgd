name: Build Fush ERP Phase 14.5.15 Price List Validity

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-15-price-list-validity.yml'
      - 'phase14_5_15_price_list_validity/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.14 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.14-Quantitative-Quality-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31668305581
      - name: Restore Phase 14.5.14 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.14-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 53' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.14-phase14.5-quantitative-quality' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 22' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.15 price-list validity
        shell: bash
        run: |
          set -e
          python phase14_5_15_price_list_validity/apply_patch.py
          grep -q 'versionCode = 54' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.15-phase14.5-price-list-validity' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_22_23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'effectiveTo' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/entity/SalesEntities.kt
          grep -q 'overlappingActivePriceCount' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/SalesDaos.kt
          grep -q 'validateConfiguredUnitPrice' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/SalesService.kt
          grep -q 'لا توجد قائمة أسعار فعالة وسارية' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 23
        shell: bash
        run: |
          set -e
          grep -q 'version = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          grep -q 'sales_prices' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          grep -q 'effectiveTo' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-15-output
          mkdir -p phase14-5-15-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-15-output/FushERP-Phase14.5.15-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-15-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-15-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-15-output/apksigner/apksigner
          zip -qr phase14-5-15-output/FushERP-Mobile-Phase14.5.15-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-15-output/FushERP-Phase14.5.15-unsigned.apk > phase14-5-15-output/FushERP-Phase14.5.15-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.15 — Price List Validity Enforcement' \
            'Version: 0.15.4.15-phase14.5-price-list-validity (versionCode 54)' \
            'Room schema: 23 (migration 22 -> 23)' \
            '' \
            'Added:' \
            '- Optional price-list end date (effectiveTo) with inclusive validity.' \
            '- Active/inactive price-list management while preserving inactive history.' \
            '- Exact province + channel + currency + invoice-date matching at sale.' \
            '- Removed silent Taiz price fallback for other provinces.' \
            '- Sales lines are priced from the active valid list and cannot be manually changed.' \
            '- Service-side enforcement rejects stale or manipulated line prices.' \
            '- Overlapping active price periods are blocked.' \
            '- A later active price closes the previous open-ended active price automatically.' \
            '- Existing historical prices are migrated into non-overlapping periods.' \
            '- Unit tests cover validity periods and configured unit-price enforcement.' \
            > phase14-5-15-output/FushERP-Phase14.5.15-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.15-Price-List-Validity-Build
          path: phase14-5-15-output/
          if-no-files-found: error
          retention-days: 7
