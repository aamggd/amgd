name: Build Fush ERP Phase 13.6 Sales Detail

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase13-6-sales-detail.yml'
      - 'phase13_6_sales_detail/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 13.5 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase13.5-Master-Edit-Build
          path: previous-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: aamggd/amgd
          run-id: 31542203549

      - name: Restore Phase 13.5 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase13.5-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 23' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.5-phase13-master-edit' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 13.6 detailed sales invoice statement
        shell: bash
        run: |
          set -e
          cat phase13_6_sales_detail/part_00.b64 phase13_6_sales_detail/part_01.b64 phase13_6_sales_detail/part_02.b64 phase13_6_sales_detail/part_03.b64 | tr -d '\r\n' > p136.b64
          base64 -d p136.b64 > p136.tgz
          tar -xzf p136.tgz -C FushERP_Mobile_Phase5
          grep -q 'versionCode = 24' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.6-phase13-sales-detail' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'بيان تفصيلي' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'SalesInvoiceDetailDialog' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'receiptsForInvoice' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/SalesDaos.kt
          grep -q 'returnsForInvoice' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/SalesDaos.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase13-6-output
          mkdir -p phase13-6-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase13-6-output/FushERP-Phase13.6-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase13-6-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase13-6-output/apksigner/lib/apksigner.jar
          chmod +x phase13-6-output/apksigner/apksigner
          zip -qr phase13-6-output/FushERP-Mobile-Phase13.6-Source.zip FushERP_Mobile_Phase5
          sha256sum phase13-6-output/FushERP-Phase13.6-unsigned.apk > phase13-6-output/FushERP-Phase13.6-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase13.6-Sales-Detail-Build
          path: phase13-6-output/
          if-no-files-found: error
          retention-days: 7
