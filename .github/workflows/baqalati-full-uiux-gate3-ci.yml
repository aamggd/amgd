name: Baqalati Full UIUX Gate3 CI

on:
  push:
    branches:
      - baqalati-full-uiux-gate3-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact Gate3 candidate source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='bcPkwvRgmTJ5'
          SOURCE='Baqalati-v1.0.42-Full-UIUX-Gate3-SOURCE-CANDIDATE.zip'
          curl -fsSL -A 'Mozilla/5.0' "$API/shares/$SHARE/files?maxResults=1000" -o files.json
          python3 - <<'PY'
          import json
          d=json.load(open('files.json',encoding='utf-8'))
          name='Baqalati-v1.0.42-Full-UIUX-Gate3-SOURCE-CANDIDATE.zip'
          matches=[x for x in (d.get('files') or []) if x.get('fileName')==name]
          if not matches: raise SystemExit('Gate3 candidate source not found')
          open('file_id.txt','w').write(matches[0]['fileId'])
          PY
          FILE_ID=$(cat file_id.txt)
          curl -fsSL -A 'Mozilla/5.0' -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json
          d=json.load(open('download.json',encoding='utf-8'))
          u=d.get('downloadUrl')
          if not u: raise SystemExit('downloadUrl missing')
          open('download_url.txt','w').write(u)
          PY
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$(cat download_url.txt)" -o "$SOURCE"
          unzip -t "$SOURCE" >/dev/null
          echo '0fe46170f1a77e12bd95b8d973d670fc1882cc712dfdc3131170bf9c50280630  Baqalati-v1.0.42-Full-UIUX-Gate3-SOURCE-CANDIDATE.zip' | sha256sum -c -

      - name: Extract and validate source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p baqalati
          unzip -q Baqalati-v1.0.42-Full-UIUX-Gate3-SOURCE-CANDIDATE.zip -d baqalati
          test -f baqalati/settings.gradle.kts
          grep -q 'applicationId = "com.faz.yemen"' baqalati/app/build.gradle.kts
          grep -q 'versionCode = 43' baqalati/app/build.gradle.kts
          grep -q 'const val FUSH_DB_SCHEMA_VERSION = 55' baqalati/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          python3 baqalati/scripts/test_phase1_ui_redesign.py
          python3 baqalati/scripts/test_v1042_ui_biometric_contract.py
          python3 baqalati/scripts/test_full_uiux_gate1_compile_contract.py
          python3 baqalati/scripts/test_full_uiux_gate2_sales_contract.py
          python3 baqalati/scripts/test_full_uiux_gate2_customers_contract.py
          python3 baqalati/scripts/test_full_uiux_gate3_purchases_contract.py
          python3 baqalati/scripts/generate_full_ui_screen_inventory.py
          ! grep -R -E 'fun (PurchaseInvoiceDetailDialog|AddSupplierDialog|PurchaseReturnDialog|SupplierPaymentDialog|SupplierAccountDialog|SupplierAgingDialog|SupplierPartySettlementDialog)\(' -n baqalati/app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x baqalati/gradlew

      - name: Run all unit tests
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK
        working-directory: baqalati
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp Baqalati-v1.0.42-Full-UIUX-Gate3-SOURCE-CANDIDATE.zip out/Baqalati-v1.0.42-Full-UIUX-Gate3-TESTED-SOURCE.zip
          cp baqalati/docs/ui/FULL_UI_SCREEN_INVENTORY.md out/FULL_UI_SCREEN_INVENTORY.md
          cp baqalati/docs/ui/FULL_UIUX_GATE3_STATUS.md out/FULL_UIUX_GATE3_STATUS.md
          APK=$(find baqalati/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" out/Baqalati-v1.0.42-Full-UIUX-Gate3-UNSIGNED.apk
          sha256sum out/* > out/SHA256SUMS.txt

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-full-uiux-gate3-build
          path: out/*
          if-no-files-found: error
          retention-days: 1
