name: Baqalati v1.0.45 Temp Build

on:
  push:
    branches: [ci-baqalati-v1045-20260916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe temporary source share
        shell: bash
        run: |
          set -euo pipefail
          url='https://firestorage.ai/ja/f/XZ2wcQbOpZmo'
          curl -fL -A 'Mozilla/5.0' "$url" -o /tmp/share.html
          echo "bytes=$(stat -c%s /tmp/share.html)"
          file /tmp/share.html
          echo '--- href/src candidates ---'
          python3 - <<'PY'
          import re, urllib.parse
          text=open('/tmp/share.html','rb').read().decode('utf-8','ignore')
          base='https://firestorage.ai/ja/f/XZ2wcQbOpZmo'
          seen=set()
          for raw in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', text):
              u=urllib.parse.urljoin(base, raw)
              if u not in seen:
                  seen.add(u)
                  print(u)
          print('--- strings with download/file/api ---')
          for m in re.findall(r'.{0,120}(?:download|file|api).{0,180}', text, re.I):
              print(m[:300])
          PY
