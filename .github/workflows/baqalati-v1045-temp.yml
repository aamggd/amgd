name: Baqalati v1.0.45 Temp Build

on:
  push:
    branches: [ci-baqalati-v1045-20260916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve temporary source metadata
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/prod/file/shares/XZ2wcQbOpZmo/files?maxResults=1000'
          curl -fsSL -H 'Accept: application/json' "$api" -o /tmp/files.json
          python3 -m json.tool /tmp/files.json
