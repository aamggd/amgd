name: Baqalati v1.0.45 Temp Build

on:
  push:
    branches: [ci-baqalati-v1045-20260916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Locate temporary source download endpoint
        shell: bash
        run: |
          set -euo pipefail
          share='https://firestorage.ai/ja/f/XZ2wcQbOpZmo'
          curl -fL -A 'Mozilla/5.0' "$share" -o /tmp/share.html
          python3 - <<'PY'
          import re, urllib.parse, subprocess, os
          html=open('/tmp/share.html','rb').read().decode('utf-8','ignore')
          base='https://firestorage.ai'
          srcs=[]
          for raw in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html):
              u=urllib.parse.urljoin(base, raw)
              if u not in srcs: srcs.append(u)
          print('scripts',len(srcs))
          alltext=''
          for i,u in enumerate(srcs):
              out=f'/tmp/js{i}.txt'
              p=subprocess.run(['curl','-fsSL','-A','Mozilla/5.0',u,'-o',out])
              if p.returncode==0:
                  data=open(out,'rb').read().decode('utf-8','ignore')
                  print(i,len(data),u)
                  alltext += '\n'+data
          for pat in ['download','shareId','publicId','presign','signedUrl','/api/','api/','objects','storage']:
              print('\n###',pat)
              n=0
              for m in re.finditer(pat, alltext, re.I):
                  a=max(0,m.start()-260); b=min(len(alltext),m.end()+500)
                  print(alltext[a:b].replace('\n',' ')[:800])
                  n+=1
                  if n>=12: break
          PY
