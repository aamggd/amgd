name: Baqalati v1.0.45 Temp Build

on:
  push:
    branches: [ci-baqalati-v1045-20260916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect share client API
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          js="$base/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js"
          curl -fL -A 'Mozilla/5.0' "$js" -o /tmp/page.js
          echo "js_bytes=$(stat -c%s /tmp/page.js)"
          python3 - <<'PY'
          import re
          text=open('/tmp/page.js','rb').read().decode('utf-8','ignore')
          for pat in ['download','shareId','publicId','file_id','api/','/api','presign','signed','objects','files']:
              print('\n###',pat)
              seen=set()
              for m in re.finditer(pat, text, re.I):
                  a=max(0,m.start()-240); b=min(len(text),m.end()+420)
                  chunk=text[a:b]
                  if chunk not in seen:
                      seen.add(chunk)
                      print(chunk[:700])
                  if len(seen)>=8: break
          PY
