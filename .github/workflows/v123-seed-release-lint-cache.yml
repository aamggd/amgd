name: V123 Seed Release Lint Cache

on:
  push:
    branches:
      - agent/v123-toolchain-bootstrap-20260822
    paths:
      - '.github/workflows/v123-seed-release-lint-cache.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/v123-seed-release-lint-cache.yml'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Create dependency seed project
        shell: bash
        run: |
          set -euo pipefail
          SEED=/tmp/v123-lint-seed
          mkdir -p "$SEED/app/src/main" "$SEED/app/schemas"
          cat > "$SEED/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FushV123LintSeed"
          include(":app")
          EOF
          cat > "$SEED/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "9.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
              id("com.google.devtools.ksp") version "2.3.9" apply false
              id("androidx.room") version "2.8.4" apply false
          }
          EOF
          cat > "$SEED/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
              id("androidx.room")
          }
          android {
              namespace = "com.fush.seed"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.fush.seed"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              ksp("androidx.room:room-compiler:2.8.4")
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              testImplementation("androidx.room:room-testing:2.8.4")
          }
          tasks.register("resolveReleaseLintClasspath") {
              doLast {
                  val cfg = configurations.getByName("releaseLintChecksClasspath")
                  println("Resolving: ${cfg.name}")
                  cfg.files.sortedBy { it.absolutePath }.forEach { println("RESOLVED ${it.absolutePath}") }
              }
          }
          EOF
          cat > "$SEED/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF
          cd "$SEED"
          gradle --no-daemon --max-workers=1 :app:resolveReleaseLintClasspath
      - name: Package Gradle modules cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-parts
          tar -czf /tmp/modules-2-lint.tgz -C "$HOME/.gradle/caches" modules-2
          split -b 200M -d -a 2 /tmp/modules-2-lint.tgz cache-parts/modules-2-lint.part.
          sha256sum /tmp/modules-2-lint.tgz > cache-parts/modules-2-lint.tgz.sha256
          sha256sum cache-parts/modules-2-lint.part.* > cache-parts/parts.sha256
          ls -lh cache-parts/*
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-LintCache-00
          path: cache-parts/modules-2-lint.part.00
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-LintCache-01
          path: cache-parts/modules-2-lint.part.01
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-LintCache-02
          path: cache-parts/modules-2-lint.part.02
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-LintCache-03
          path: cache-parts/modules-2-lint.part.03
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v123-LintCache-Metadata
          path: |
            cache-parts/modules-2-lint.tgz.sha256
            cache-parts/parts.sha256
          if-no-files-found: error
          retention-days: 1
