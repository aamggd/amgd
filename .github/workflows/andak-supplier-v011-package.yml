name: ANDAK Supplier v0.1.1 Package Only

on:
  push:
    branches:
      - 'andak-supplier-build-v011'
    paths:
      - '.github/workflows/andak-supplier-v011-package.yml'
      - 'tools/generate_andak_supplier_gate0.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmd.zip
          rm -rf /tmp/cmd && mkdir -p /tmp/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate fixed source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/supplier-fix"
          bash tools/generate_andak_supplier_gate0.sh fixed "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          zip -qr /tmp/ANDAK-Supplier-v0.1.1-Source.zip supplier-fix
      - name: Static gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId="com.fush.market.supplier"' "$SRC/apps/supplier/build.gradle.kts"
          grep -q 'versionCode=2' "$SRC/apps/supplier/build.gradle.kts"
          grep -q 'versionName="0.1.1"' "$SRC/apps/supplier/build.gradle.kts"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$SRC/apps/supplier/src/main/AndroidManifest.xml"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$SRC/apps/supplier/src/main/AndroidManifest.xml"
          grep -q 'android:supportsRtl="true"' "$SRC/apps/supplier/src/main/AndroidManifest.xml"
          grep -q '<string name="app_name">عندك للمورد</string>' "$SRC/apps/supplier/src/main/res/values/strings.xml"
          grep -q 'SafeLogo' "$SRC/core/ui/src/main/java/com/fush/market/core/ui/AndakApp.kt"
          ! grep -q 'painterResource' "$SRC/core/ui/src/main/java/com/fush/market/core/ui/AndakApp.kt"
          echo STATIC_GATE_PASS
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          gradle :apps:supplier:assembleRelease :apps:supplier:bundleRelease --no-daemon --stacktrace
      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/dist"
          mkdir -p "$D"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4             "$SRC/apps/supplier/build/outputs/apk/release/supplier-release-unsigned.apk"             "$D/ANDAK-Supplier-v0.1.1-ALIGNED-UNSIGNED.apk"
          cp "$SRC/apps/supplier/build/outputs/bundle/release/supplier-release.aab" "$D/ANDAK-Supplier-v0.1.1-UNSIGNED.aab"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$D/ANDAK-Supplier-v0.1.1-ALIGNED-UNSIGNED.apk" > "$D/aapt-badging.txt"
          cp /tmp/ANDAK-Supplier-v0.1.1-Source.zip "$D/"
          cat > "$D/BUILD-RESULT.txt" <<'EOF'
ANDAK Supplier v0.1.1
versionCode: 2
applicationId: com.fush.market.supplier
Static gate: PASS
Release APK build: PASS
Release AAB build: PASS
Signing: pending local permanent-key signing
Runtime: handled in separate Gate0 runtime workflow
EOF
          (cd "$D" && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v0.1.1-PACKAGE-PASS
          path: dist/
          if-no-files-found: error
          retention-days: 7
