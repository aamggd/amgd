name: Build Fush ERP Phase 14.5.51 Inventory Analytics

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-51-inventory-analytics.yml'
      - 'phase14_5_51_inventory_analytics/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.50 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.50-Period-Comparison-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31869846703

      - name: Restore Phase 14.5.50 and apply Phase 14.5.51 inventory patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.50-Period-Comparison-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.50
          cp ../phase14_5_51_inventory_analytics/payload/i51.b64.part00 ../phase14_5_51_inventory_analytics/i51.full.b64
          echo '7483fa1dafba12b907abfae576b95b33a32a0a551f2c93c3857c79deefb9e96f  ../phase14_5_51_inventory_analytics/i51.full.b64' | sha256sum -c -
          base64 -d ../phase14_5_51_inventory_analytics/i51.full.b64 | gzip -dc > ../phase14_5_51_inventory_analytics/01_inventory_analytics.patch
          echo 'be110bd9756f372a90fd539f9c055c2850d40fb126598f5071a92fb2ef431555  ../phase14_5_51_inventory_analytics/01_inventory_analytics.patch' | sha256sum -c -
          git apply --check ../phase14_5_51_inventory_analytics/01_inventory_analytics.patch
          git apply ../phase14_5_51_inventory_analytics/01_inventory_analytics.patch
          git diff --check HEAD
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 90' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.51-inventory-analytics"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          test -f app/src/main/java/com/fush/erp/domain/InventoryReportMath.kt
          test -f app/src/test/java/com/fush/erp/domain/InventoryReportMathTest.kt
          grep -q 'inventoryActivity' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'inventoryExpiryLots' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'inventoryMovementDetails' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'الراكد وبطيء الحركة' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 90' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.51-inventory-analytics"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-51-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-51-output/FushERP-Phase14.5.51-Inventory-Analytics-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-51-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-51-output/lib/apksigner.jar
          chmod +x phase14-5-51-output/apksigner
          zip -qr phase14-5-51-output/FushERP-Mobile-Phase14.5.51-Inventory-Analytics-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.51 — Professional Inventory Analytics' \
            'Base verified source: Phase 14.5.50 Period Comparison' \
            'Branch: fush/reports-printing' \
            'Inventory valuation enhancement: PASS' \
            'Period movement analysis: PASS' \
            'Slow/dormant inventory classification: PASS' \
            'Never-issued stock handled explicitly: PASS' \
            'Positive-balance expiry lot analysis: PASS' \
            'Professional PDF/XLSX multi-table export: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 90' \
            'Version name: 0.15.4.51-inventory-analytics' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Room/Compose compilation: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-51-output/FushERP-Phase14.5.51-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.51-Inventory-Analytics-Build
          path: phase14-5-51-output/
          if-no-files-found: error
          retention-days: 7
