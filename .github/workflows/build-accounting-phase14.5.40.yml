name: Validate FUSH Accounting Phase 14.5.40 Fixed Assets

on:
  push:
    branches: [fush/accounting]
    paths:
      - '.github/workflows/build-accounting-phase14.5.40.yml'
      - 'fush_accounting/rebase/phase14.5.40_chunks_v4/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase40-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download validated Phase 14.5.39 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Accounting-Phase14.5.39-FX-Treasury-Validated-Build
          path: phase39-artifact
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31865418288

      - name: Reconstruct and verify Phase 14.5.40 complete patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          CH="$ROOT/fush_accounting/rebase/phase14.5.40_chunks_v4"
          for n in 00 01 02 03 04 05 06 07 08; do test "$(wc -c < "$CH/part${n}.b64")" -eq 2000; done
          test "$(wc -c < "$CH/part09.b64")" -eq 484
          echo '2bfc5004a3a4f28b1531c6a17ae0851da28b3a7c40c56bcf2475df96ce6d2d95  part00.b64' | (cd "$CH" && sha256sum -c -)
          echo '20c5626ec05b7972d01d54440aeddf5c800412eff9cfa053b14ea09e92a02d43  part01.b64' | (cd "$CH" && sha256sum -c -)
          echo 'de9cf1f97575e24a36e0e38d6eace140d16231700872a4d91354ff2798b8153c  part02.b64' | (cd "$CH" && sha256sum -c -)
          echo '0b50febe7bb7a42bad3b8dd2ad5b47a48a701334a93b52dfe635f6b344704925  part03.b64' | (cd "$CH" && sha256sum -c -)
          echo 'a1960cd7024dfc4dd5893f86471ce9a71b5518e3f45f6a5479b745df1ffc1fc9  part04.b64' | (cd "$CH" && sha256sum -c -)
          echo 'abbe6b6b0e2b770d170a1e51154120b4bc4f684a958b0a28c06c02508b70f94a  part05.b64' | (cd "$CH" && sha256sum -c -)
          echo '02440a4752ac4c13f72abb34896a7332600a3f01f7587f00bbbdef736374632d  part06.b64' | (cd "$CH" && sha256sum -c -)
          echo 'dfbc0d68ef83a7ee0241454356c5a253724173a3391b240fdf95ac8d5abbe4cb  part07.b64' | (cd "$CH" && sha256sum -c -)
          echo 'baab87350b086182068269c07ae3c811f45ca935c59e78c2f322da3dc7ce2972  part08.b64' | (cd "$CH" && sha256sum -c -)
          echo '40155c50d2b229df8cad1da7dcdf3ac906c6f3c1f3791fcef0e8b9131bfeb77b  part09.b64' | (cd "$CH" && sha256sum -c -)
          cat "$CH"/part00.b64 "$CH"/part01.b64 "$CH"/part02.b64 "$CH"/part03.b64 "$CH"/part04.b64 "$CH"/part05.b64 "$CH"/part06.b64 "$CH"/part07.b64 "$CH"/part08.b64 "$CH"/part09.b64 > /tmp/phase40.patch.gz.b64
          test "$(wc -c < /tmp/phase40.patch.gz.b64)" -eq 18484
          echo 'a9c8174bf45fb9bd30b25057faa4e0442fc8ec4fa4eea690ce3140149f6be017  /tmp/phase40.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/phase40.patch.gz.b64 > /tmp/phase40.patch.gz
          test "$(wc -c < /tmp/phase40.patch.gz)" -eq 13861
          echo 'c63319a7259588bc8f4c9e41c618cc39bf5efb208039a9d66832e98d2c58a958  /tmp/phase40.patch.gz' | sha256sum -c -
          gzip -t /tmp/phase40.patch.gz
          gzip -dc /tmp/phase40.patch.gz > /tmp/phase40.patch
          test "$(wc -c < /tmp/phase40.patch)" -eq 77156
          echo '97dcc07a18d82693ab532d22e489d82fef6c923ce668a329b60f8d20774ec0cf  /tmp/phase40.patch' | sha256sum -c -

      - name: Apply Phase 14.5.40 to validated Phase 14.5.39
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/work"
          cd "$ROOT/work"
          unzip -q "$ROOT/phase39-artifact/FushERP-Mobile-Phase14.5.39-Foreign-Currency-Treasury-Revaluation-Source.zip"
          cd repo
          git init -q
          git config user.name 'FUSH Accounting Phase40 CI'
          git config user.email 'fush-accounting-ci@example.invalid'
          git add -A
          git commit -qm 'validated Phase14.5.39 baseline'
          git apply --check /tmp/phase40.patch
          git apply /tmp/phase40.patch
          git diff --check

      - name: Verify identity, schema and fixed-asset safety wiring
        shell: bash
        run: |
          set -euo pipefail
          cd work/repo
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.38-ui-inventory-master-data"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 33' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_32_33' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_32_33' app/src/main/java/com/fush/erp/data/AppContainer.kt
          test -f app/src/main/java/com/fush/erp/data/dao/FixedAssetDao.kt
          test -f app/src/main/java/com/fush/erp/data/entity/FixedAssetEntities.kt
          test -f app/src/main/java/com/fush/erp/domain/FixedAssetMath.kt
          test -f app/src/main/java/com/fush/erp/domain/FixedAssetService.kt
          grep -q 'FixedAssetEntity::class' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'abstract fun fixedAssetDao(): FixedAssetDao' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'val fixedAssetService = FixedAssetService(db)' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'لا يمكن إقفال الفترة قبل ترحيل إهلاك الأصول الثابتة' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'fixedAssetsGl' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'fixedAssetsSubledger' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'accumulatedDepreciationGl' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          grep -q 'accumulatedDepreciationSubledger' app/src/main/java/com/fush/erp/domain/AccountingService.kt
          ! grep -R --line-number -E 'fallbackToDestructiveMigration|destructiveMigration' app/src/main/java
          test -f app/src/test/java/com/fush/erp/domain/FixedAssetMathTest.kt
          grep -q 'class FixedAssetMathTest' app/src/test/java/com/fush/erp/domain/FixedAssetMathTest.kt

      - name: Unit tests
        working-directory: work/repo
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/phase40-unit-test.log"

      - name: Upload unit-test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.40-Unit-Test-Diagnostics-v4
          path: phase40-unit-test.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Release build
        working-directory: work/repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Room schema and package output
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT/work/repo"
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/schemas/com.fush.erp.data.FushDatabase/33.json
          grep -q '"version": 33' app/schemas/com.fush.erp.data.FushDatabase/33.json
          mkdir -p "$ROOT/phase40-output"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$ROOT/phase40-output/FushERP-Accounting-Phase14.5.40-Fixed-Assets-aligned-unsigned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 \
            "$ROOT/phase40-output/FushERP-Accounting-Phase14.5.40-Fixed-Assets-aligned-unsigned.apk"
          cp /tmp/phase40.patch "$ROOT/phase40-output/FushERP-Phase14.5.40-Fixed-Asset-Accounting.patch"
          rm -rf .git .gradle .kotlin app/build build
          cd "$ROOT/work"
          zip -qr "$ROOT/phase40-output/FushERP-Mobile-Phase14.5.40-Fixed-Asset-Accounting-Source.zip" repo
          sha256sum "$ROOT/phase40-output/"* > "$ROOT/phase40-output/SHA256SUMS.txt"
          cat > "$ROOT/phase40-output/BUILD-REPORT.txt" <<'REPORT'
          FUSH ERP Mobile — Accounting Phase 14.5.40 validation
          Base: validated Accounting Phase 14.5.39 FX Treasury
          Base validation run: 31865418288
          Application ID: com.fush.erp.recovery
          Branch testing versionCode retained: 77
          Branch testing versionName retained: 0.15.4.38-ui-inventory-master-data
          Accounting branch Room schema: 33 (PROVISIONAL / BRANCH ONLY; integration must renumber after other branch migrations)
          Phase 14.5.40 patch SHA-256: 97dcc07a18d82693ab532d22e489d82fef6c923ce668a329b60f8d20774ec0cf
          Unit Tests: PASS
          Release Build: PASS
          Room Schema 33 generation: PASS
          Zipalign: PASS
          Signing: NOT PERFORMED IN CI — permanent signing material is intentionally not stored in GitHub
          PHASE14_5_40_FIXED_ASSET_ACCOUNTING_VALIDATED_OK
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Accounting-Phase14.5.40-Fixed-Assets-Validated-Build
          path: phase40-output/
          if-no-files-found: error
          retention-days: 7
