name: Validate Accounting AE-ACC-011 Fresh Room35 Parity

on:
  push:
    branches: [ fush/accounting ]
    paths:
      - 'fush_accounting/handoffs/AE-ACC-011_fresh_room35_parity/**'
      - '.github/workflows/validate-accounting-ae-acc-011-fresh-room35-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ae-acc-011-fresh-room35:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout accounting handoff branch
        uses: actions/checkout@v4

      - name: Checkout exact verified Central
        uses: actions/checkout@v4
        with:
          ref: ddae764a236cb1916a46e194ccb2d3c24ca6b919
          path: central-repo
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Exact Central baseline guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C central-repo rev-parse HEAD)" = "ddae764a236cb1916a46e194ccb2d3c24ca6b919"
          test "$(git -C central-repo rev-parse HEAD:central_source)" = "30b028b75d6463c07afd0419429f53c7937fabb1"
          grep -q 'applicationId = "com.fush.erp.recovery"' central-repo/central_source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' central-repo/central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt

      - name: Apply official AE-ACC-011 fix over exact Central
        shell: bash
        run: |
          set -euo pipefail
          python fush_accounting/handoffs/AE-ACC-011_fresh_room35_parity/apply_ae_acc_011_fresh_room35_parity.py central-repo/central_source
          git -C central-repo add -N \
            central_source/app/src/main/java/com/fush/erp/data/AccountingJournalIntegrityGuards.kt \
            central_source/app/src/test/java/com/fush/erp/data/AccountingJournalIntegrityGuardsTest.kt
          git -C central-repo diff --check
          actual="$(git -C central-repo diff --name-only | sort)"
          expected="$(printf '%s\n' \
            central_source/app/src/main/java/com/fush/erp/data/AccountingJournalIntegrityGuards.kt \
            central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt \
            central_source/app/src/main/java/com/fush/erp/data/Migrations.kt \
            central_source/app/src/main/java/com/fush/erp/domain/PurchaseService.kt \
            central_source/app/src/main/java/com/fush/erp/domain/SalesService.kt \
            central_source/app/src/test/java/com/fush/erp/data/AccountingJournalIntegrityGuardsTest.kt | sort)"
          printf 'Changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Fresh and upgraded SQLite integrity parity matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$GITHUB_WORKSPACE/ae-acc-011-sqlite-parity.log"
          import re, sqlite3, textwrap
          from pathlib import Path

          root = Path('central-repo/central_source')
          guard_path = root / 'app/src/main/java/com/fush/erp/data/AccountingJournalIntegrityGuards.kt'
          source = guard_path.read_text(encoding='utf-8')

          stable_match = re.search(r'private val stableSourcesSql = """(.*?)"""\.trimIndent\(\)', source, re.S)
          assert stable_match, 'stableSourcesSql not found'
          stable = textwrap.dedent(stable_match.group(1)).strip()

          trigger_section = source[source.index('internal val triggerSql'):source.index('    fun install')]
          raw_sql = re.findall(r'"""(.*?)"""\.trimIndent\(\)', trigger_section, re.S)
          sql_list = [textwrap.dedent(s).strip().replace('$stableSourcesSql', stable) for s in raw_sql]
          assert len(sql_list) == 9, f'expected 9 triggers, got {len(sql_list)}'

          expected_names = {
              'trg_journal_entries_closed_period',
              'trg_journal_stable_source_id_required_insert',
              'trg_journal_no_duplicate_stable_source_insert',
              'trg_journal_no_duplicate_stable_source_update',
              'trg_posted_journal_no_update',
              'trg_posted_journal_no_delete',
              'trg_journal_line_sanity_insert',
              'trg_posted_journal_line_no_update',
              'trg_posted_journal_line_no_delete',
          }

          def create_schema(conn):
              conn.executescript('''
                  CREATE TABLE accounting_periods(
                      id INTEGER PRIMARY KEY,
                      startDate INTEGER NOT NULL,
                      endDate INTEGER NOT NULL,
                      status TEXT NOT NULL
                  );
                  CREATE TABLE journal_entries(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      entryDate INTEGER NOT NULL,
                      status TEXT NOT NULL,
                      sourceType TEXT NOT NULL,
                      sourceId TEXT
                  );
                  CREATE TABLE journal_lines(
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      entryId INTEGER NOT NULL,
                      debit REAL NOT NULL,
                      credit REAL NOT NULL
                  );
              ''')

          def install(conn):
              for statement in sql_list:
                  conn.execute(statement)

          def trigger_names(conn):
              return {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='trigger'")}

          def expect_block(label, fn, contains=None):
              try:
                  fn()
              except sqlite3.IntegrityError as exc:
                  if contains is not None:
                      assert contains in str(exc), (label, str(exc))
                  print(f'PASS {label}: {exc}')
                  return
              raise AssertionError(f'{label}: operation unexpectedly succeeded')

          operational_sources = ['SALE','CUSTOMER_RECEIPT','SALES_RETURN','PURCHASE','SUPPLIER_PAYMENT','PURCHASE_RETURN']

          # Fresh Room35 creation path.
          fresh = sqlite3.connect(':memory:')
          create_schema(fresh)
          install(fresh)
          assert trigger_names(fresh) == expected_names
          fresh.execute("INSERT INTO accounting_periods VALUES(1,100,200,'CLOSED')")
          for i, source_type in enumerate(operational_sources, 1):
              expect_block(
                  f'fresh closed-period {source_type}',
                  lambda i=i, source_type=source_type: fresh.execute(
                      "INSERT INTO journal_entries(entryDate,status,sourceType,sourceId) VALUES(150,'POSTED',?,?)",
                      (source_type, f'fresh-{i}')
                  ),
                  'الفترة المحاسبية مقفلة'
              )
          expect_block(
              'fresh blank stable source id',
              lambda: fresh.execute("INSERT INTO journal_entries(entryDate,status,sourceType,sourceId) VALUES(300,'POSTED','SALE','  ')"),
              'ACCOUNTING_STABLE_SOURCE_ID_REQUIRED'
          )
          fresh.execute("INSERT INTO journal_entries(entryDate,status,sourceType,sourceId) VALUES(300,'POSTED','SALE','dup-1')")
          posted_id = fresh.execute("SELECT id FROM journal_entries WHERE sourceType='SALE' AND sourceId='dup-1'").fetchone()[0]
          fresh.execute("INSERT INTO journal_lines(entryId,debit,credit) VALUES(?,100,0)", (posted_id,))
          line_id = fresh.execute("SELECT id FROM journal_lines WHERE entryId=?", (posted_id,)).fetchone()[0]
          expect_block('fresh duplicate stable source', lambda: fresh.execute("INSERT INTO journal_entries(entryDate,status,sourceType,sourceId) VALUES(300,'POSTED','SALE','dup-1')"), 'DUPLICATE_ACCOUNTING_POSTING')
          expect_block('fresh POSTED header update', lambda: fresh.execute("UPDATE journal_entries SET sourceId='changed' WHERE id=?", (posted_id,)), 'POSTED_JOURNAL_IMMUTABLE_USE_REVERSAL')
          expect_block('fresh POSTED header delete', lambda: fresh.execute("DELETE FROM journal_entries WHERE id=?", (posted_id,)), 'POSTED_JOURNAL_IMMUTABLE_USE_REVERSAL')
          expect_block('fresh POSTED line update', lambda: fresh.execute("UPDATE journal_lines SET debit=90 WHERE id=?", (line_id,)), 'POSTED_JOURNAL_LINE_IMMUTABLE_USE_REVERSAL')
          expect_block('fresh POSTED line delete', lambda: fresh.execute("DELETE FROM journal_lines WHERE id=?", (line_id,)), 'POSTED_JOURNAL_LINE_IMMUTABLE_USE_REVERSAL')

          # 34 -> 35 upgrade path with pre-existing user data.
          upgraded = sqlite3.connect(':memory:')
          create_schema(upgraded)
          upgraded.execute("INSERT INTO accounting_periods VALUES(1,100,200,'CLOSED')")
          upgraded.execute("INSERT INTO journal_entries(id,entryDate,status,sourceType,sourceId) VALUES(77,50,'POSTED','MANUAL','legacy-user-row')")
          upgraded.execute("INSERT INTO journal_lines(id,entryId,debit,credit) VALUES(88,77,125,0)")
          before = upgraded.execute("SELECT id,entryDate,status,sourceType,sourceId FROM journal_entries WHERE id=77").fetchone()
          before_line = upgraded.execute("SELECT id,entryId,debit,credit FROM journal_lines WHERE id=88").fetchone()
          install(upgraded)
          assert trigger_names(upgraded) == expected_names
          assert upgraded.execute("SELECT id,entryDate,status,sourceType,sourceId FROM journal_entries WHERE id=77").fetchone() == before
          assert upgraded.execute("SELECT id,entryId,debit,credit FROM journal_lines WHERE id=88").fetchone() == before_line
          print('PASS upgraded existing user data preserved')
          for i, source_type in enumerate(operational_sources, 1):
              expect_block(
                  f'upgraded closed-period {source_type}',
                  lambda i=i, source_type=source_type: upgraded.execute(
                      "INSERT INTO journal_entries(entryDate,status,sourceType,sourceId) VALUES(150,'POSTED',?,?)",
                      (source_type, f'upgrade-{i}')
                  ),
                  'الفترة المحاسبية مقفلة'
              )
          expect_block('upgraded POSTED header update', lambda: upgraded.execute("UPDATE journal_entries SET sourceId='x' WHERE id=77"), 'POSTED_JOURNAL_IMMUTABLE_USE_REVERSAL')
          expect_block('upgraded POSTED header delete', lambda: upgraded.execute("DELETE FROM journal_entries WHERE id=77"), 'POSTED_JOURNAL_IMMUTABLE_USE_REVERSAL')
          expect_block('upgraded POSTED line update', lambda: upgraded.execute("UPDATE journal_lines SET debit=100 WHERE id=88"), 'POSTED_JOURNAL_LINE_IMMUTABLE_USE_REVERSAL')
          expect_block('upgraded POSTED line delete', lambda: upgraded.execute("DELETE FROM journal_lines WHERE id=88"), 'POSTED_JOURNAL_LINE_IMMUTABLE_USE_REVERSAL')

          assert trigger_names(fresh) == trigger_names(upgraded)
          print('PASS fresh Room35 protection parity')
          print('PASS 34->35 upgraded DB protection parity')
          print('PASS POSTED immutability parity')
          PY

      - name: Closed-period guards for six operational service paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$GITHUB_WORKSPACE/ae-acc-011-operational-period-guards.log"
          import re
          from pathlib import Path

          root = Path('central-repo/central_source/app/src/main/java/com/fush/erp/domain')
          sales = (root / 'SalesService.kt').read_text(encoding='utf-8')
          purchase = (root / 'PurchaseService.kt').read_text(encoding='utf-8')

          def method_block(text, signature):
              start = text.index(signature)
              m = re.search(r'\n    (?:private )?suspend fun ', text[start + len(signature):])
              end = len(text) if not m else start + len(signature) + m.start()
              return text[start:end]

          checks = [
              ('SALE', sales, 'suspend fun postSale(', 'AccountingService(db).requirePostingPeriodOpen(request.invoiceDate)'),
              ('CUSTOMER_RECEIPT', sales, 'private suspend fun postReceiptAllocationsInternal(', 'AccountingService(db).requirePostingPeriodOpen(receiptDate)'),
              ('SALES_RETURN', sales, 'suspend fun postReturn(', 'AccountingService(db).requirePostingPeriodOpen(returnDate)'),
              ('PURCHASE', purchase, 'suspend fun postPurchase(', 'AccountingService(db).requirePostingPeriodOpen(request.invoiceDate)'),
              ('SUPPLIER_PAYMENT', purchase, 'private suspend fun postSupplierPaymentAllocationsInternal(', 'AccountingService(db).requirePostingPeriodOpen(paymentDate)'),
              ('PURCHASE_RETURN', purchase, 'suspend fun postPurchaseReturn(', 'AccountingService(db).requirePostingPeriodOpen(request.returnDate)'),
          ]
          for label, text, signature, guard in checks:
              block = method_block(text, signature)
              guard_pos = block.find(guard)
              assert guard_pos >= 0, f'{label}: closed-period guard missing'
              write_positions = [p for token in ('.insert', 'postSaleJournal(', 'postCollectionJournal(', 'postSalesReturnJournal(', 'postPurchaseJournal(', 'postSupplierPaymentJournal', 'postReturnJournal(') if (p := block.find(token)) >= 0]
              if write_positions:
                  assert guard_pos < min(write_positions), f'{label}: guard occurs after write/posting path'
              print(f'PASS closed-period service guard {label}')
          PY

      - name: Targeted accounting and integrity unit tests
        shell: bash
        working-directory: central-repo/central_source
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.fush.erp.data.AccountingJournalIntegrityGuardsTest \
            --tests com.fush.erp.domain.AccountingP1IntegrityPolicyTest \
            --tests com.fush.erp.domain.AccountingIntegrationContractTest \
            --tests com.fush.erp.domain.AccountingValidatorTest \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/ae-acc-011-targeted.log"

      - name: Full unit tests
        shell: bash
        working-directory: central-repo/central_source
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/ae-acc-011-full-unit.log"

      - name: Release build
        working-directory: central-repo/central_source
        run: gradle --no-daemon :app:assembleRelease

      - name: Room App ID migration and destructive-safety guards
        shell: bash
        run: |
          set -euo pipefail
          ROOT=central-repo/central_source
          grep -q 'applicationId = "com.fush.erp.recovery"' "$ROOT/app/build.gradle.kts"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
          test -z "$(git -C central-repo diff --name-only -- central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt)"
          grep -q 'MIGRATION_34_35_ACCOUNTING_P1 = object : Migration(34, 35)' "$ROOT/app/src/main/java/com/fush/erp/data/Migrations.kt"
          grep -q 'AccountingJournalIntegrityGuards.install(db)' "$ROOT/app/src/main/java/com/fush/erp/data/Migrations.kt"
          grep -q 'addCallback(AccountingJournalIntegrityGuards.callback)' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          ! grep -R --line-number -E 'fallbackToDestructiveMigration|fallbackToDestructiveMigrationFrom' "$ROOT/app/src/main/java"
          ! grep -R --line-number -E 'Migration\(35,[[:space:]]*[0-9]+' "$ROOT/app/src/main/java/com/fush/erp/data"
          test -f "$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"

      - name: Build exact functional patch and evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/accounting-ae-acc-011-fresh-room35-output"
          mkdir -p "$OUT"
          git -C central-repo diff --binary -- \
            central_source/app/src/main/java/com/fush/erp/data/AccountingJournalIntegrityGuards.kt \
            central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt \
            central_source/app/src/main/java/com/fush/erp/data/Migrations.kt \
            central_source/app/src/main/java/com/fush/erp/domain/PurchaseService.kt \
            central_source/app/src/main/java/com/fush/erp/domain/SalesService.kt \
            central_source/app/src/test/java/com/fush/erp/data/AccountingJournalIntegrityGuardsTest.kt \
            > "$OUT/ACCOUNTING_AE_ACC_011_FRESH_ROOM35_PARITY.patch"
          PATCH_SHA="$(sha256sum "$OUT/ACCOUNTING_AE_ACC_011_FRESH_ROOM35_PARITY.patch" | awk '{print $1}')"
          printf '%s  %s\n' "$PATCH_SHA" 'ACCOUNTING_AE_ACC_011_FRESH_ROOM35_PARITY.patch' > "$OUT/SHA256SUMS.txt"
          cp "$GITHUB_WORKSPACE/ae-acc-011-sqlite-parity.log" "$OUT/"
          cp "$GITHUB_WORKSPACE/ae-acc-011-operational-period-guards.log" "$OUT/"
          cp "$GITHUB_WORKSPACE/ae-acc-011-targeted.log" "$OUT/"
          cp "$GITHUB_WORKSPACE/ae-acc-011-full-unit.log" "$OUT/"
          printf 'ACCOUNTING_AE_ACC_011_FRESH_ROOM35_PATCH_SHA256=%s\n' "$PATCH_SHA"
          cat > "$OUT/BUILD-REPORT.txt" <<REPORT
          FUSH ERP Mobile — Final Part2C Wave1 AE-ACC-011
          Status: READY FOR AUDIT RE-INTEGRATION
          Final audit status: NOT FINAL PASS
          Exact Central HEAD: ddae764a236cb1916a46e194ccb2d3c24ca6b919
          Exact Central source tree: 30b028b75d6463c07afd0419429f53c7937fabb1
          Application ID: com.fush.erp.recovery
          Room schema: 35 UNCHANGED
          Fresh Room35 protection parity: PASS
          34->35 upgraded DB parity: PASS
          Closed-period operational paths SALE/CUSTOMER_RECEIPT/SALES_RETURN/PURCHASE/SUPPLIER_PAYMENT/PURCHASE_RETURN: PASS
          POSTED immutability parity: PASS
          Existing user data preserved: PASS
          Targeted accounting/integrity unit tests: PASS
          Full Unit Tests: PASS
          assembleRelease: PASS
          No destructive migration/fallback: PASS
          Exact functional patch SHA-256: $PATCH_SHA
          Prior journal atomicity work: SEPARATE IMPROVEMENT / NOT AE-ACC-011 CLOSURE / EXCLUDED FROM THIS PATCH
          P2 started: NO
          READY FOR AUDIT RE-INTEGRATION
          REPORT

      - name: Upload official AE-ACC-011 handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Accounting-AE-ACC-011-Fresh-Room35-Ready-For-Audit-Reintegration
          path: accounting-ae-acc-011-fresh-room35-output/
          if-no-files-found: error
          retention-days: 7

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          git -C central-repo diff --check || true
          git -C central-repo diff --name-only || true
          git -C central-repo diff -- central_source/app/src/main/java/com/fush/erp/data/AccountingJournalIntegrityGuards.kt central_source/app/src/main/java/com/fush/erp/data/AppContainer.kt central_source/app/src/main/java/com/fush/erp/data/Migrations.kt central_source/app/src/main/java/com/fush/erp/domain/SalesService.kt central_source/app/src/main/java/com/fush/erp/domain/PurchaseService.kt || true
