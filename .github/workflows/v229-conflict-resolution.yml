name: V229 Conflict Resolution Hotfix Build

on:
  push:
    branches: [ci-v229-conflict-resolution-20260928]
    paths:
      - '.github/workflows/v229-conflict-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Download source
        shell: bash
        env:
          SHARE_ID: nsGlOxu4yCV_
          EXPECTED_SHA256: f27b988087b0e31d41ca5bbebd2c056d33f52b4003defd198f061140c5d93e6b
        run: |
          set -euxo pipefail
          API_BASE='https://api.firestorage.ai/dev/file'
          curl -fLsS --retry 3 "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" -o files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('files.json', encoding='utf-8'))
          files=d.get('files') or []
          if len(files) != 1:
              raise SystemExit(f'expected one source file, got {len(files)}')
          print(files[0]['fileId'])
          PY
          )
          curl -fLsS --retry 3 -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('download.json', encoding='utf-8'))['downloadUrl'])
          PY
          )
          curl -fL --retry 3 "$DOWNLOAD_URL" -o source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          mkdir src
          unzip -q source.zip -d src

      - name: Static gates
        working-directory: src
        shell: bash
        run: |
          python3 tools/test_v225_backend_hardening.py
          python3 tools/test_v227_local_ai_actions.py
          python3 tools/test_v228_cloud_sync_hotfix.py
          python3 tools/test_v229_conflict_resolution_hotfix.py

      - name: Targeted v229 unit test and release build
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest --tests com.fush.erp.cloud.ConflictResolutionPoliciesV229Test assembleRelease bundleRelease 2>&1 | tee ../v229-build.log

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          APK=$(find src/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          AAB=$(find src/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" out/FUSH_ERP_Mobile_v229-ConflictResolutionHotfix-UNSIGNED.apk
          cp "$AAB" out/FUSH_ERP_Mobile_v229-ConflictResolutionHotfix-UNSIGNED.aab
          cp source.zip out/FushERP-Mobile-v229-ConflictResolutionHotfix-Source-R1.zip
          cp v229-build.log out/
          cp src/V229_CONFLICT_RESOLUTION_HOTFIX.md out/
          sha256sum out/FUSH_ERP_Mobile_v229-ConflictResolutionHotfix-UNSIGNED.apk out/FUSH_ERP_Mobile_v229-ConflictResolutionHotfix-UNSIGNED.aab out/FushERP-Mobile-v229-ConflictResolutionHotfix-Source-R1.zip > out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-v229-Conflict-Resolution-Hotfix
          path: out
          if-no-files-found: error
