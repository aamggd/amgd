name: Build Fush ERP Phase 14.5.17 Master Data Controls

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-17-master-data-controls.yml'
      - 'phase14_5_17_master_data_controls/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.16 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.16-Safe-Restore-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31687148216
      - name: Restore Phase 14.5.16 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.16-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 55' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.16-phase14.5-safe-restore' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.17 master data controls
        shell: bash
        run: |
          set -e
          python phase14_5_17_master_data_controls/apply_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/Daos.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('SELECT COUNT(*) FROM recipes WHERE productItemId = :itemId AND isActive = 1', "SELECT COUNT(*) FROM recipes WHERE productItemId = :itemId AND status = 'ACTIVE'")
          s = s.replace('WHERE rc.itemId = :itemId AND r.isActive = 1', "WHERE rc.itemId = :itemId AND r.status = 'ACTIVE'")
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'versionCode = 56' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.17-phase14.5-master-data-controls' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'nextWarehouseCode' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AutoNumberService.kt
          grep -q 'createWarehouse' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/MasterDataService.kt
          grep -q 'setWarehouseActive' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/MasterDataService.kt
          grep -q 'saveConversion' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/MasterDataService.kt
          grep -q 'absoluteWarehouseBalance' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'observeAllIncludingInactive' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/Daos.kt
          grep -q "status = 'ACTIVE'" FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/Daos.kt
          grep -q 'إضافة مخزن جديد' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          test -f FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/domain/MasterDataMathTest.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 23 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-17-output
          mkdir -p phase14-5-17-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-17-output/FushERP-Phase14.5.17-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-17-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-17-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-17-output/apksigner/apksigner
          zip -qr phase14-5-17-output/FushERP-Mobile-Phase14.5.17-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-17-output/FushERP-Phase14.5.17-unsigned.apk > phase14-5-17-output/FushERP-Phase14.5.17-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.17 — Warehouse and Master Data Controls' \
            'Version: 0.15.4.17-phase14.5-master-data-controls (versionCode 56)' \
            'Room schema: 23 (unchanged)' \
            '' \
            'Added and fixed:' \
            '- Create additional warehouses with automatic WH-### codes.' \
            '- Active/inactive master-data visibility for items, units, warehouses and conversions.' \
            '- Audited activation/deactivation instead of destructive deletion.' \
            '- Block warehouse/item deactivation while inventory remains.' \
            '- Block item deactivation while referenced by an active production recipe.' \
            '- Block unit deactivation while used by active items or conversions.' \
            '- Full unit-conversion editing: factor, buy/sell permissions, barcode and status.' \
            '- Base conversion remains factor 1 and cannot be disabled.' \
            '- Duplicate nonblank conversion barcodes are rejected.' \
            '- Purchase and sales services reject inactive items.' \
            '- Master-data creation and status changes are written to the audit trail.' \
            > phase14-5-17-output/FushERP-Phase14.5.17-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.17-Master-Data-Controls-Build
          path: phase14-5-17-output/
          if-no-files-found: error
          retention-days: 7
