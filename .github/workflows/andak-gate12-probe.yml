name: ANDAK Gate12 Firestorage Probe
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe all Firestorage Next chunks
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://firestorage.ai"
          curl -LsS --fail -A "Mozilla/5.0" "$BASE/ja/f/1ub5gOAXyS6s" -o /tmp/page.html
          grep -Eo 'src="[^"]+\.js"' /tmp/page.html | cut -d'"' -f2 | sort -u > /tmp/chunks.txt
          while IFS= read -r CHUNK; do
            ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe="/._-"))' "$CHUNK")
            OUT="/tmp/$(echo "$CHUNK" | tr '/()' '___')"
            curl -LsS --fail "$BASE$ENC" -o "$OUT" || continue
            echo "=== $CHUNK bytes=$(wc -c < "$OUT") ==="
            grep -oE '.{0,180}(/api/|download|presign|signed|shareId|publicId|folder|fileId|objectKey|storage).{0,300}' "$OUT" | head -150 || true
          done < /tmp/chunks.txt
