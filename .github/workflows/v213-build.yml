name: v213 Build FUSH ERP Mobile

on:
  push:
    branches: [v213-build-clean]
    paths:
      - 'ci/v213/source/**'
      - 'ci/v213/SOURCE_URL.txt'
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Direct HTTPS URL to the exact v213 source tar.xz (optional when repo source exists)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'

      - name: Acquire and verify v213 source snapshot
        shell: bash
        env:
          DISPATCH_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v213-src
          SOURCE_URL="${DISPATCH_SOURCE_URL:-}"
          if [ -z "$SOURCE_URL" ] && [ -f ci/v213/SOURCE_URL.txt ]; then
            SOURCE_URL="$(tr -d '\r\n' < ci/v213/SOURCE_URL.txt)"
          fi
          if [ -n "$SOURCE_URL" ]; then
            case "$SOURCE_URL" in
              https://*) ;;
              *) echo 'source_url must use HTTPS' >&2; exit 1 ;;
            esac
            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$SOURCE_URL" --output /tmp/v213-source.tar.xz
          else
            test -n "$(find ci/v213/source -maxdepth 1 -type f -name 'part-*' -print -quit 2>/dev/null || true)"
            cat ci/v213/source/part-* > /tmp/v213-source.tar.xz
          fi
          echo '97e5eaa84945983b44b39f4eb1105fb375bb7e6d585cb463f4ba3835d98a06e  /tmp/v213-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v213-source.tar.xz -C /tmp/v213-src
          if [ -f /tmp/v213-src/settings.gradle.kts ]; then
            echo 'PROJECT_DIR=/tmp/v213-src' >> "$GITHUB_ENV"
          else
            PROJECT_DIR="$(dirname "$(find /tmp/v213-src -maxdepth 3 -name settings.gradle.kts -print -quit)")"
            test -n "$PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'applicationId = "com.fush.erp.recovery"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -R 'versionCode = 213' "$PROJECT_DIR/app/build.gradle.kts"
          if grep -R 'fallbackToDestructiveMigration' "$PROJECT_DIR/app/src/main"; then
            echo 'Destructive migration fallback detected' >&2
            exit 1
          fi

      - name: Unit tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace test

      - name: Assemble release
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -exec cp {} out/ \;
          test -n "$(find out -maxdepth 1 -name '*.apk' -print -quit)"
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cp "$PROJECT_DIR/app/build.gradle.kts" out/build.gradle.kts

      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-ERP-Mobile-v213-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 7
