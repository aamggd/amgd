name: Build Baqalati v1.0.28

on:
  push:
    branches:
      - build-baqalati-v128
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import re, sys, urllib.parse, urllib.request
          share = 'https://firestorage.ai/ja/f/lozF22vJEyVI'
          headers = {'User-Agent': 'Mozilla/5.0'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.geturl(), r.headers, r.read()
          final, hdr, body = get(share)
          if body[:2] == b'PK':
              open('source.zip','wb').write(body)
              sys.exit(0)
          html = body.decode('utf-8','replace')
          candidates = []
          patterns = [
              r'''(?:href|src)=["']([^"']+)["']''',
              r'''https?://[^"'<>\\s]+''',
          ]
          for pat in patterns:
              for m in re.finditer(pat, html, re.I):
                  raw = m.group(1) if m.lastindex else m.group(0)
                  raw = raw.replace('&amp;','&').replace('\\u0026','&').replace('\\/','/')
                  url = urllib.parse.urljoin(final, raw)
                  low = url.lower()
                  if 'download' in low or '.zip' in low or 'file' in low:
                      candidates.append(url)
          for url in dict.fromkeys(candidates):
              try:
                  _, _, data = get(url)
                  if data[:2] == b'PK':
                      open('source.zip','wb').write(data)
                      print('Downloaded ZIP from', url)
                      sys.exit(0)
              except Exception as e:
                  print('candidate failed:', url, e)
          print(html[:20000])
          raise SystemExit('Could not locate downloadable ZIP from temporary share page')
          PY

      - name: Unpack source
        shell: bash
        run: |
          mkdir buildsrc
          unzip -q source.zip -d buildsrc
          test -f buildsrc/source/gradlew

      - name: Build unsigned release APK
        shell: bash
        working-directory: buildsrc/source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          mkdir artifact
          cp buildsrc/source/app/build/outputs/apk/release/*.apk artifact/Baqalati-v1.0.28-UNSIGNED.apk
          sha256sum artifact/Baqalati-v1.0.28-UNSIGNED.apk | tee artifact/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-v1.0.28-unsigned
          path: artifact/
          retention-days: 1
