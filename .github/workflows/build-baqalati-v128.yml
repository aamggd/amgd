name: Build Baqalati v1.0.28

on:
  push:
    branches:
      - build-baqalati-v128
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download source archive through browser
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > download-source.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const share = 'https://firestorage.ai/ja/f/5cfdKbxMCZYP';
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({acceptDownloads:true});
            let saved = false;
            page.on('response', async (resp) => {
              if (saved) return;
              try {
                const h = await resp.allHeaders();
                const ct = (h['content-type'] || '').toLowerCase();
                const cd = (h['content-disposition'] || '').toLowerCase();
                if (ct.includes('zip') || cd.includes('.zip')) {
                  const b = await resp.body();
                  if (b.length > 1000 && b[0] === 0x50 && b[1] === 0x4b) {
                    fs.writeFileSync('source.zip', b);
                    saved = true;
                    console.log('Captured ZIP response:', resp.url());
                  }
                }
              } catch (_) {}
            });
            await page.goto(share, {waitUntil:'domcontentloaded', timeout:120000});
            for (let i=0; i<30 && !saved; i++) {
              await page.waitForTimeout(1000);
              const buttons = page.locator('a,button');
              const count = await buttons.count();
              for (let j=0; j<count && !saved; j++) {
                const el = buttons.nth(j);
                const txt = ((await el.innerText().catch(()=>'')) || '').trim();
                const href = (await el.getAttribute('href').catch(()=>null)) || '';
                if (/download|ダウンロード|保存/i.test(txt + ' ' + href)) {
                  try {
                    const dlPromise = page.waitForEvent('download', {timeout:5000});
                    await el.click({timeout:3000});
                    const dl = await dlPromise;
                    await dl.saveAs('source.zip');
                    saved = true;
                    console.log('Downloaded via UI:', txt || href);
                  } catch (_) {}
                }
              }
            }
            if (!saved) throw new Error('Could not retrieve source ZIP from share page');
            await browser.close();
            const b = fs.readFileSync('source.zip');
            if (!(b[0] === 0x50 && b[1] === 0x4b)) throw new Error('Downloaded file is not ZIP');
            console.log('source.zip bytes:', b.length);
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node download-source.js

      - name: Unpack source
        shell: bash
        run: |
          mkdir buildsrc
          unzip -q source.zip -d buildsrc
          test -f buildsrc/source/gradlew

      - name: Build unsigned release APK
        shell: bash
        working-directory: buildsrc/source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Collect APK and signing tools
        shell: bash
        run: |
          mkdir -p artifact/signing-tools/lib
          cp buildsrc/source/app/build/outputs/apk/release/*.apk artifact/Baqalati-v1.0.28-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" artifact/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" artifact/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" artifact/signing-tools/lib/
          chmod +x artifact/signing-tools/apksigner artifact/signing-tools/zipalign
          sha256sum artifact/Baqalati-v1.0.28-UNSIGNED.apk | tee artifact/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-v1.0.28-unsigned
          path: artifact/
          retention-days: 1
