name: v202 Export Offline Android Toolchain

on:
  push:
    branches: [fush/v202-local-yemen-fx-build]
    paths:
      - '.github/workflows/v202-export-offline-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Resolve FUSH dependency graph
        shell: bash
        run: |
          rm -rf bootstrap
          mkdir -p bootstrap/gradle bootstrap/app/src/main/java/com/fush/bootstrap bootstrap/app/schemas
          cat > bootstrap/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FushBootstrap"
          include(":app")
          EOF
          cat > bootstrap/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.ksp) apply false
              alias(libs.plugins.room) apply false
          }
          EOF
          cat > bootstrap/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > bootstrap/gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "9.2.0"
          kotlin = "2.3.21"
          ksp = "2.3.9"
          room = "2.8.4"
          activity = "1.13.0"
          lifecycle = "2.10.0"
          navigation = "2.9.8"
          composeBom = "2026.06.00"
          coreKtx = "1.17.0"
          junit = "4.13.2"

          [libraries]
          androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
          androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
          androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
          androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
          androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
          androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
          androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
          androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
          androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { module = "androidx.compose.ui:ui" }
          androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
          androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
          androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
          androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
          junit = { module = "junit:junit", version.ref = "junit" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          room = { id = "androidx.room", version.ref = "room" }
          EOF
          cat > bootstrap/app/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.room)
          }
          android {
              namespace = "com.fush.bootstrap"
              compileSdk = 36
              defaultConfig { applicationId = "com.fush.bootstrap"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1" }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.room.runtime)
              implementation(libs.androidx.room.ktx)
              ksp(libs.androidx.room.compiler)
              val composeBom = platform(libs.androidx.compose.bom)
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.material.icons.core)
              debugImplementation(libs.androidx.compose.ui.tooling)
              testImplementation(libs.junit)
              testImplementation(libs.androidx.room.testing)
              androidTestImplementation(libs.androidx.room.testing)
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > bootstrap/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF
          cat > bootstrap/app/src/main/java/com/fush/bootstrap/Main.kt <<'EOF'
          package com.fush.bootstrap
          class Main
          EOF
          cd bootstrap
          gradle --no-daemon :app:dependencies
          gradle --no-daemon :app:assembleDebug

      - name: Package and split offline toolchain
        shell: bash
        run: |
          rm -rf export splitout
          mkdir -p export/sdk/platforms export/sdk/build-tools export/gradle splitout
          cp -a "$ANDROID_SDK_ROOT/platforms/android-36" export/sdk/platforms/
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" export/sdk/build-tools/
          GRADLE_REAL="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_REAL")/.." && pwd)"
          cp -a "$GRADLE_HOME" export/gradle/gradle-9.4.1
          printf 'Gradle=9.4.1\nAGP=9.2.0\nKotlin=2.3.21\nKSP=2.3.9\nRoom=2.8.4\nCompileSDK=36\nBuildTools=36.0.0\n' > export/INFO.txt
          tar -czf splitout/core.tgz -C export sdk gradle INFO.txt
          tar --exclude='*.lock' --exclude='gc.properties' -czf splitout/cache.tgz -C "$HOME/.gradle" caches
          split -b 240M -d -a 2 splitout/core.tgz splitout/core-part-
          split -b 240M -d -a 2 splitout/cache.tgz splitout/cache-part-
          rm splitout/core.tgz splitout/cache.tgz
          ls -lh splitout

      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-core-part-00
          path: splitout/core-part-00
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-core-part-01
          path: splitout/core-part-01
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-core-part-02
          path: splitout/core-part-02
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-core-part-03
          path: splitout/core-part-03
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-cache-part-00
          path: splitout/cache-part-00
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-cache-part-01
          path: splitout/cache-part-01
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-cache-part-02
          path: splitout/cache-part-02
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-cache-part-03
          path: splitout/cache-part-03
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v202-cache-part-04
          path: splitout/cache-part-04
          if-no-files-found: ignore
          retention-days: 2

# Regenerated for FAZ v1.0.5 local offline build on 2026-09-06.
