name: ANDAK Supplier v0.4.0 Gate3

on:
  push:
    branches: ['andak-supplier-gate3-v040']
    paths: ['.github/workflows/andak-supplier-gate3-v040.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate3:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmd.zip
          rm -rf /tmp/cmd; mkdir -p /tmp/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download exact Gate3 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/pkI4YA-0JoJY'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v0.4.0-Gate3-Source.zip"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$URL" -o /tmp/source.zip
          echo '78f31b3b7c5bc75c13e6147da0045a82d629433cfcba0e40ff608e32dab7cf39  /tmp/source.zip' | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q /tmp/source.zip -d "$GITHUB_WORKSPACE/source"
          SRC=$(find "$GITHUB_WORKSPACE/source" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Gate3 static checks
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$SRC/apps/supplier/build.gradle.kts"
          APP="$SRC/apps/supplier/src/main/java/com/fush/market/supplier/SupplierApp.kt"
          grep -q 'applicationId = "com.fush.market.supplier"' "$BUILD"
          grep -q 'versionCode = 5' "$BUILD"
          grep -q 'versionName = "0.4.0"' "$BUILD"
          grep -q 'HANDED_OVER' "$APP"
          grep -q 'REJECTED' "$APP"
          grep -q 'pickupCode' "$APP"
          grep -q 'OrderDetailScreen' "$APP"
          grep -q 'RejectOrderScreen' "$APP"
          grep -q 'رمز استلام المندوب' "$APP"
          grep -q 'خصوصية العميل محمية' "$APP"
          grep -q 'تأكيد التسليم للمندوب' "$APP"
          echo GATE3_STATIC_PASS

      - name: Build Gate3
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          gradle :apps:supplier:assembleDebug :apps:supplier:assembleRelease :apps:supplier:bundleRelease --no-daemon --stacktrace

      - name: Write Gate3 runtime test
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/runtime-gate3.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          P=com.fush.market.supplier
          APK="$SRC/apps/supplier/build/outputs/apk/debug/supplier-debug.apk"
          E="$GITHUB_WORKSPACE/evidence"; mkdir -p "$E"

          dump_ui(){
            local n="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$E/$n.xml" >/dev/null 2>&1 || true
          }

          tap_text(){
            local txt="$1"
            dump_ui tap-source
            python - "$E/tap-source.xml" "$txt" <<'PY'
          import re,sys,subprocess,xml.etree.ElementTree as ET
          path,target=sys.argv[1],sys.argv[2]
          root=ET.parse(path).getroot()
          nodes=[n for n in root.iter('node') if n.attrib.get('text')==target or n.attrib.get('content-desc')==target]
          if not nodes:
              raise SystemExit("TEXT_NOT_FOUND "+target)
          m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',nodes[0].attrib.get('bounds',''))
          if not m:
              raise SystemExit("BAD_BOUNDS")
          x1,y1,x2,y2=map(int,m.groups())
          subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
          PY
            sleep 2
          }

          adb uninstall "$P" >/dev/null 2>&1 || true
          adb install "$APK" | tee "$E/install.txt"
          adb logcat -c
          adb shell am start -n "$P/.MainActivity" | tee "$E/start.txt" || true
          sleep 10
          PID=$(adb shell pidof "$P" | tr -d '\r' || true)
          echo "$PID" > "$E/pid.txt"; test -n "$PID"

          dump_ui home
          grep -q 'لوحة المورد' "$E/home.xml"
          grep -q 'Gate 3' "$E/home.xml"

          tap_text 'الطلبات'
          dump_ui orders
          grep -q 'تفاصيل الطلب والتجهيز والتسليم الآمن للمندوب' "$E/orders.xml"
          grep -q 'خصوصية العميل محمية' "$E/orders.xml"
          grep -q 'عرض تفاصيل الطلب' "$E/orders.xml"

          tap_text 'عرض تفاصيل الطلب'
          dump_ui detail
          grep -q 'تفاصيل الطلب #A-1048' "$E/detail.xml"
          grep -q 'بيانات الاتصال والعنوان الكامل مخفية عن المورد' "$E/detail.xml"
          grep -q 'قهوة عربية 250 جم' "$E/detail.xml"
          grep -q 'قبول الطلب' "$E/detail.xml"

          tap_text 'العودة إلى الطلبات'
          tap_text 'قبول الطلب'
          dump_ui accepted
          grep -q 'بدء التجهيز' "$E/accepted.xml"

          tap_text 'بدء التجهيز'
          dump_ui preparing
          grep -q 'تم التجهيز — جاهز للتسليم' "$E/preparing.xml"

          tap_text 'تم التجهيز — جاهز للتسليم'
          dump_ui ready
          grep -q 'رمز استلام المندوب: 4821' "$E/ready.xml"
          grep -q 'تأكيد التسليم للمندوب' "$E/ready.xml"

          tap_text 'تأكيد التسليم للمندوب'
          dump_ui handed
          grep -q 'تم تسليم الطلب لمندوب عندك بنجاح' "$E/handed.xml"

          adb logcat -d -b crash > "$E/crash.log" || true
          adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|ResourceResolutionException|Caused by|$P" > "$E/relevant.log" || true
          ! grep -q "$P" "$E/crash.log"
          adb exec-out screencap -p > "$E/final-screen.png"
          echo GATE3_RUNTIME_PASS | tee "$E/result.txt"
          EOF
          chmod +x "$GITHUB_WORKSPACE/runtime-gate3.sh"

      - name: Gate3 runtime API29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/runtime-gate3.sh"

      - name: Package Gate3
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$SRC/apps/supplier/build/outputs/apk/release/supplier-release-unsigned.apk" "$D/ANDAK-Supplier-v0.4.0-GATE3-ALIGNED-UNSIGNED.apk"
          cp "$SRC/apps/supplier/build/outputs/bundle/release/supplier-release.aab" "$D/ANDAK-Supplier-v0.4.0-GATE3-UNSIGNED.aab"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$D/apksigner.jar"
          cp /tmp/source.zip "$D/ANDAK-Supplier-v0.4.0-Gate3-Source.zip"
          cp -r "$GITHUB_WORKSPACE/evidence" "$D/"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$D/ANDAK-Supplier-v0.4.0-GATE3-ALIGNED-UNSIGNED.apk" > "$D/aapt-badging.txt"
          printf '%s\n'             'ANDAK Supplier Gate3 v0.4.0'             'applicationId=com.fush.market.supplier'             'versionCode=5'             'versionName=0.4.0'             'Build debug/release/AAB=PASS'             'Runtime order-detail/handoff API29=PASS'             'Crash buffer=clean'             'Signing=pending permanent release signing'             > "$D/GATE3-RESULT.txt"
          (cd "$D" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-v0.4.0-GATE3-PASS
          path: dist/
          if-no-files-found: error
          retention-days: 7
