name: Build Fush ERP APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct Phase 5 source archive
        shell: bash
        run: |
          cat \
            apk_source_chunks/part_00.b64 \
            apk_source_chunks/part_01.b64 \
            apk_source_chunks/part_02.b64 \
            apk_source_chunks/part_03.b64 \
            apk_source_chunks/fix04_0.b64 \
            apk_source_chunks/fix04_1.b64 \
            apk_source_chunks/fix04_2.b64 \
            apk_source_chunks/part_05.b64 \
            apk_source_chunks/part_06.b64 \
            apk_source_chunks/fix07_0.b64 \
            apk_source_chunks/fix07_1.b64 \
            apk_source_chunks/fix07_2.b64 | tr -d '\r\n' > phase5.b64
          base64 -d phase5.b64 > FushERP_Mobile_Phase5_Source.zip
          echo "80b25dd47769a042b70bf258268588b3d769d427cb8082634dce8153483f8319  FushERP_Mobile_Phase5_Source.zip" | sha256sum -c -
          unzip -t FushERP_Mobile_Phase5_Source.zip
          unzip -q FushERP_Mobile_Phase5_Source.zip
          test -f FushERP_Mobile_Phase5/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' FushERP_Mobile_Phase5/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p apk-out
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/debug/app-debug.apk apk-out/FushERP-Phase5.apk
          sha256sum apk-out/FushERP-Phase5.apk > apk-out/FushERP-Phase5.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase5-APK
          path: apk-out/*
          if-no-files-found: error
