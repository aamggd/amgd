name: Build Fush ERP APK

on:
  push:
    branches: [master]
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct Phase 5 source archive
        shell: bash
        run: |
          cat \
            apk_source_chunks/part_00.b64 \
            apk_source_chunks/part_01.b64 \
            apk_source_chunks/part_02.b64 \
            apk_source_chunks/part_03.b64 \
            apk_source_chunks/fix04_0.b64 \
            apk_source_chunks/fix04_1.b64 \
            apk_source_chunks/fix04_2.b64 \
            apk_source_chunks/part_05.b64 \
            apk_source_chunks/part_06.b64 \
            apk_source_chunks/fix07_0.b64 \
            apk_source_chunks/fix07_1.b64 \
            apk_source_chunks/fix07_2.b64 | tr -d '\r\n' > phase5.b64
          base64 -d phase5.b64 > FushERP_Mobile_Phase5_Source.zip
          unzip -q -o FushERP_Mobile_Phase5_Source.zip || true
          test -f FushERP_Mobile_Phase5/settings.gradle.kts
          base64 -d apk_source_chunks/SalesScreens.kt.gz.b64 | gunzip > FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          echo "285b0ff6d09a5111c4ffb7b52248f4de2cb84ebdf3b3db1a1a8bf1cb763f23c8  FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt" | sha256sum -c -
          sed -i 's/compileSdk = 37/compileSdk = 36/' FushERP_Mobile_Phase5/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 6 governance patch
        shell: bash
        run: |
          base64 -d phase6_patch/phase6_patch.tar.gz.b64 > phase6_patch.tar.gz
          tar -xzf phase6_patch.tar.gz -C FushERP_Mobile_Phase5
          python phase6_patch/phase6_apply.py
          grep -q 'version = 6' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/GovernanceScreen.kt

      - name: Apply Phase 7 HR and training patch
        shell: bash
        run: |
          cat phase7_patch/part_00.b64 phase7_patch/part_00_tail.b64 phase7_patch/part_01.b64 phase7_patch/part_02.b64 | tr -d '\r\n' > phase7_patch.b64
          base64 -d phase7_patch.b64 > phase7_patch.tar.gz
          tar -xzf phase7_patch.tar.gz -C FushERP_Mobile_Phase5
          grep -q 'version = 7' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q '0.7.0-phase7' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'EmployeesScreen' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          test -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/HrRules.kt
          test -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/entity/EmployeeEntities.kt
          test -f FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/domain/HrRulesTest.kt

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK and Phase 7 source
        shell: bash
        run: |
          mkdir -p apk-out releases
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/debug/app-debug.apk apk-out/FushERP-Phase7.apk
          sha256sum apk-out/FushERP-Phase7.apk > apk-out/FushERP-Phase7.apk.sha256
          cp apk-out/FushERP-Phase7.apk releases/FushERP-Phase7.apk
          cp apk-out/FushERP-Phase7.apk.sha256 releases/FushERP-Phase7.apk.sha256
          zip -qr apk-out/FushERP-Mobile-Phase7-Source.zip FushERP_Mobile_Phase5

      - name: Upload Phase 7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase7
          path: apk-out/*
          if-no-files-found: error

      - name: Publish Phase 7 APK in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/FushERP-Phase7.apk releases/FushERP-Phase7.apk.sha256
          git commit -m "Publish Fush ERP Phase 7 APK [skip ci]" || exit 0
          git push
