name: Central Consolidation - Backup Recovery P0

on:
  push:
    branches: [fush/integration-current]
    paths:
      - '.github/workflows/central-consolidation-backup-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  INPUT_TREE: '78f901e253a06898f8e5413769131e7b62e85cce'
  HANDOFF_SHA: '00f8379b858be3a8c81ba970877b963f2df4101d'
  PATCH_B64_BLOB: '0cf59f51f8daf806f15bb9cef64c83e6f52c8aaf'
  PATCH_SHA256: '2c28e60bf3db41ea16929219ad974ee47cef2488d833f444435f00e8447ea03a'

jobs:
  integrate-backup-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fush/integration-current
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          cp -a central_source work-source
          cd work-source
          git init -q
          git config user.name central-integration-ci
          git config user.email central-integration-ci@users.noreply.github.com
          git add -A
          TREE=$(git write-tree)
          echo "input_tree=$TREE"
          test "$TREE" = "$INPUT_TREE"
          git commit -qm "Cumulative Central before Backup Recovery P0"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -q 'employeeIdentityChangeAllowed' app/src/main/java/com/fush/erp/domain/HrRules.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts

      - name: Fetch exact validated Backup Recovery P0 patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://raw.githubusercontent.com/aamggd/amgd/${HANDOFF_SHA}/backup_recovery_p0/phase1.patch.gz.b64" -o backup-recovery.patch.gz.b64
          test "$(git hash-object backup-recovery.patch.gz.b64)" = "$PATCH_B64_BLOB"
          base64 -d backup-recovery.patch.gz.b64 | gzip -dc > backup-recovery.patch
          echo "${PATCH_SHA256}  backup-recovery.patch" | sha256sum -c -
          cd work-source
          git apply --check ../backup-recovery.patch
          git apply ../backup-recovery.patch
          git diff --check
          test -f app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'AES-256-GCM' app/src/main/java/com/fush/erp/backup/BackupArchiveCodec.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'BackupEncryptionKeyProvider.getOrCreate()' app/src/main/java/com/fush/erp/backup/BackupRestoreManager.kt
          grep -q 'encrypted backup must not expose SQLite header' app/src/test/java/com/fush/erp/backup/BackupArchiveCodecTest.kt
          git add -A
          git commit -qm "Integrate Backup Recovery P0"
          echo "backup_recovery_source_tree=$(git write-tree)" | tee ../backup-recovery-source-tree.txt

      - name: Backup Recovery domain regression
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.backup.BackupArchiveCodecTest'

      - name: Full unit tests
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Central safety checks
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -R -q 'MIGRATION_32_33_SECURITY' app/src/main/java
          grep -R -Eq 'Migration\(33, *34\)|MIGRATION_33_34' app/src/main/java
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          ! grep -R -nE 'deleteDatabase\(|clearAllTables\(' app/src/main/java/com/fush/erp/backup
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Replace Central source with cumulative tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf central_source
          mkdir central_source
          git -C work-source archive --format=tar HEAD | tar -x -C central_source
          grep -q 'AndroidKeyStore' central_source/app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'employeeIdentityChangeAllowed' central_source/app/src/main/java/com/fush/erp/domain/HrRules.kt

      - name: Commit actual cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central_source backup-recovery-source-tree.txt
          git commit -m "Central integration: add Backup Recovery P0"
          git push origin HEAD:fush/integration-current
