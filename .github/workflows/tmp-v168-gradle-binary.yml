name: TEMP v168 Gradle Binary

on:
  push:
    branches:
      - 'fush/tmp-v140-build-20260824'
    paths:
      - '.github/workflows/tmp-v168-gradle-binary.yml'
  workflow_dispatch:

jobs:
  package-gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Package Gradle 9.4.1 installation
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          echo "GRADLE_HOME=$GRADLE_HOME"
          tar -C "$(dirname "$GRADLE_HOME")" -czf "$RUNNER_TEMP/gradle-9.4.1.tgz" "$(basename "$GRADLE_HOME")"
          sha256sum "$RUNNER_TEMP/gradle-9.4.1.tgz" > "$RUNNER_TEMP/gradle-9.4.1.tgz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: v168-gradle-9.4.1
          path: |
            ${{ runner.temp }}/gradle-9.4.1.tgz
            ${{ runner.temp }}/gradle-9.4.1.tgz.sha256
          if-no-files-found: error
          retention-days: 1
