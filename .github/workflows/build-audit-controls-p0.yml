name: Build FUSH Audit Controls P0

on:
  push:
    branches: [fush/audit-controls]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p0-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download validated central 14.5.54 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: artifacts/base54
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750

      - name: Restore exact central baseline and overlay P0 catalog
        shell: bash
        run: |
          set -euo pipefail
          ZIP=artifacts/base54/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          test -s "$ZIP"
          mkdir -p sources/base54 final-repo
          unzip -q "$ZIP" -d sources/base54
          BASE=$(find sources/base54 -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$BASE"
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' "$BASE/" final-repo/

          cd final-repo
          git init -q
          git config user.email audit@fush.local
          git config user.name FUSH
          git add -A
          test "$(git write-tree)" = '1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff'
          cd ..
          grep -q 'applicationId = "com.fush.erp.recovery"' final-repo/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' final-repo/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f final-repo/app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' final-repo/app/src/main/java final-repo/app/build.gradle.kts

          mkdir -p final-repo/app/src/main/java/com/fush/erp/domain/audit
          mkdir -p final-repo/app/src/test/java/com/fush/erp/domain/audit
          cp phase14_5_54_audit_controls/p0/AuditEventCatalog.kt final-repo/app/src/main/java/com/fush/erp/domain/audit/AuditEventCatalog.kt
          cp phase14_5_54_audit_controls/p0/AuditEventCatalogTest.kt final-repo/app/src/test/java/com/fush/erp/domain/audit/AuditEventCatalogTest.kt

          ! grep -R -q 'fallbackToDestructiveMigration' final-repo/app/src/main/java final-repo/app/build.gradle.kts
          grep -q 'applicationId = "com.fush.erp.recovery"' final-repo/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' final-repo/app/src/main/java/com/fush/erp/data/FushDatabase.kt

      - name: P0 unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build regression
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release invariants
        shell: bash
        run: |
          set -euo pipefail
          APK=final-repo/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          grep -q 'applicationId = "com.fush.erp.recovery"' final-repo/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' final-repo/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -q 'fallbackToDestructiveMigration' final-repo/app/src/main/java final-repo/app/build.gradle.kts

      - name: Package P0 handoff source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          (cd final-repo && zip -qr ../output/FushERP-Mobile-Audit-Controls-P0-Source.zip . -x '.git/*' '.gradle/*' '.kotlin/*' 'build/*' 'app/build/*')
          cp final-repo/app/build/outputs/apk/release/app-release-unsigned.apk output/FushERP-Audit-Controls-P0-unsigned.apk
          sha256sum output/* > output/SHA256SUMS.txt

      - name: Upload P0 build
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Audit-Controls-P0-Build
          path: output/
          if-no-files-found: error
