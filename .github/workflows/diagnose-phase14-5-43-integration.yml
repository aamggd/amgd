name: Diagnose Fush ERP Phase 14.5.43 Integration

on:
  push:
    branches: [fush/integration-all-14.5.43]
    paths:
      - '.github/workflows/diagnose-phase14-5-43-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch contribution packages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fush/ui-professional-redesign fush/accounting fush/users-permissions --depth=1
          git archive --format=tar origin/fush/ui-professional-redesign \
            phase14_5_39_production_quality_ui \
            phase14_5_40_employees_sales_reps_ui \
            phase14_5_41_assets_maintenance_expenses_ui \
            phase14_5_42_reports_adaptive_ui | tar -xf -
          git archive --format=tar origin/fush/accounting fush_accounting | tar -xf -
          git archive --format=tar origin/fush/users-permissions \
            phase14_5_34_users_permissions \
            phase14_5_36_users_security_hardening | tar -xf -

      - name: Download verified Phase 14.5.38 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.38-Professional-UI-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31858347166

      - name: Download original Users Permissions base Phase 14.5.33
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.33-Expense-Dimensions-Build
          path: baseline33-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31854443269

      - name: Restore baseline and apply completed UI phases 39-42 sequentially
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          git config user.name 'FUSH Integration CI'
          git config user.email 'fush-integration@example.invalid'
          git add -A && git commit -qm 'Phase 14.5.38 baseline'
          for phase in phase14_5_39_production_quality_ui phase14_5_40_employees_sales_reps_ui phase14_5_41_assets_maintenance_expenses_ui phase14_5_42_reports_adaptive_ui; do
            for p in ../$phase/patches/*.patch; do
              if git apply --check "$p"; then
                git apply "$p"
              else
                repaired="/tmp/${phase}-$(basename "$p")"
                python - "$p" "$repaired" <<'PY'
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          if not raw.endswith(b'\n'): raw += b'\n'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
                git apply --recount --check "$repaired"
                git apply --recount "$repaired"
              fi
            done
          done
          grep -q 'versionCode = 81' app/build.gradle.kts
          grep -q '0.15.4.42-ui-reports-adaptive' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          git add -A && git commit -qm 'Apply UI 39-42'

      - name: Rebase validated accounting phases 34-35
        shell: bash
        run: |
          set -euo pipefail
          cd FushERP_Mobile_Phase5
          base64 -d ../fush_accounting/patches/phase14.5.34-accounting-integrity.patch.gz.b64 | gzip -dc > /tmp/accounting34.patch
          base64 -d ../fush_accounting/patches/phase14.5.35-accounting-periods-reconciliation.patch.gz.b64 | gzip -dc > /tmp/accounting35.patch

          git apply --check --exclude=app/build.gradle.kts --exclude=app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt /tmp/accounting34.patch
          git apply --exclude=app/build.gradle.kts --exclude=app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt /tmp/accounting34.patch
          python - <<'PY'
          import pathlib,re
          raw=pathlib.Path('/tmp/accounting34.patch').read_text()
          parts=re.split(r'(?=^diff --git )', raw, flags=re.M)
          target='app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt'
          part=next(p for p in parts if p.startswith('diff --git ') and f' b/{target}' in p.splitlines()[0])
          pathlib.Path('/tmp/party34.patch').write_text(part)
          PY
          patch -p1 --forward --fuzz=3 < /tmp/party34.patch || true
          rm -f app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt.rej
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt'); s=p.read_text()
          old='''                Button(onClick = { voucherType = "RECEIPT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند قبض") }\n                OutlinedButton(onClick = { voucherType = "PAYMENT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند صرف") }'''
          new='''                Button(onClick = { showSettlement = true }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("تحصيل فاتورة") }\n                OutlinedButton(onClick = { message = "صرف مبلغ للعميل يجب أن يتم من مرتجع المبيعات مع اختيار رد نقدي حتى تبقى الفاتورة والذمة والأستاذ متطابقة." }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("صرف للعميل") }'''
          if old not in s: raise SystemExit('customer button block not found')
          s=s.replace(old,new,1)
          old='''                Button(onClick = { voucherType = "PAYMENT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند صرف") }\n                OutlinedButton(onClick = { voucherType = "RECEIPT" }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("سند قبض") }'''
          new='''                Button(onClick = { showSettlement = true }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("دفع فاتورة") }\n                OutlinedButton(onClick = { message = "قبض مبلغ من المورد يجب أن يتم من مرتجع المشتريات مع اختيار استرداد نقدي حتى تبقى الفاتورة والذمة والأستاذ متطابقة." }, modifier = Modifier.weight(1f), shape = MaterialTheme.shapes.medium) { Text("قبض من المورد") }'''
          if old not in s: raise SystemExit('supplier button block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git add -A && git commit -qm 'Rebase accounting integrity onto professional party UI'

          git apply --check --exclude=app/build.gradle.kts --exclude=app/src/main/java/com/fush/erp/ui/screens/AccountingScreens.kt /tmp/accounting35.patch
          git apply --exclude=app/build.gradle.kts --exclude=app/src/main/java/com/fush/erp/ui/screens/AccountingScreens.kt /tmp/accounting35.patch
          python - <<'PY'
          from pathlib import Path
          import re
          patch=Path('/tmp/accounting35.patch').read_text(); target='app/src/main/java/com/fush/erp/ui/screens/AccountingScreens.kt'
          part=next(x for x in re.split(r'(?=^diff --git )',patch,flags=re.M) if x.startswith('diff --git ') and f' b/{target}' in x.splitlines()[0])
          added=[]; capture=False
          for line in part.splitlines():
              if line.startswith('+@Composable'): capture=True
              if capture:
                  if line.startswith('+') and not line.startswith('+++'): added.append(line[1:])
                  elif line.startswith(' @Composable') and added: break
          block='\n'.join(added).rstrip()+'\n\n'
          if 'private fun AccountingPeriodsTab' not in block: raise SystemExit('AccountingPeriodsTab extraction failed')
          p=Path(target); s=p.read_text()
          old='val tabs = listOf("اليومية", "الخزينة", "المصروفات", "قيد يدوي", "الأستاذ", "ميزان المراجعة", "قائمة الدخل", "المركز المالي", "التدفق النقدي")'
          new='val tabs = listOf("اليومية", "الخزينة", "المصروفات", "قيد يدوي", "الأستاذ", "ميزان المراجعة", "قائمة الدخل", "المركز المالي", "التدفق النقدي", "الفترات والمطابقة")'
          if old not in s: raise SystemExit('accounting tabs line not found')
          s=s.replace(old,new,1)
          old='''            7 -> BalanceSheetTab(container, Modifier.weight(1f))\n            else -> CashFlowTab(container, Modifier.weight(1f))'''
          new='''            7 -> BalanceSheetTab(container, Modifier.weight(1f))\n            8 -> CashFlowTab(container, Modifier.weight(1f))\n            else -> AccountingPeriodsTab(container, user, Modifier.weight(1f))'''
          if old not in s: raise SystemExit('accounting route block not found')
          s=s.replace(old,new,1)
          marker='@Composable\nprivate fun JournalTab'
          if marker not in s: raise SystemExit('JournalTab marker not found')
          p.write_text(s.replace(marker,block+marker,1))
          PY
          git add -A && git commit -qm 'Rebase accounting periods and reconciliation onto professional UI'
          grep -q 'FUSH_DB_SCHEMA_VERSION = 28' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_27_28' app/src/main/java/com/fush/erp/data/Migrations.kt
          echo ACCOUNTING_34_35_OK

      - name: Three-way merge users permissions and security hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,pathlib
          p=pathlib.Path('phase14_5_34_users_permissions')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in sorted(p.glob('patch_*.b64')))))
          pathlib.Path('/tmp/users34.patch').write_bytes(raw)
          PY
          mkdir -p /tmp/base33 /tmp/users33
          unzip -q baseline33-build/FushERP-Mobile-Phase14.5.33-Expense-Dimensions-Source.zip -d /tmp/base33
          cp -a /tmp/base33/FushERP_Mobile_Phase5 /tmp/users33/FushERP_Mobile_Phase5
          cd /tmp/users33/FushERP_Mobile_Phase5
          rm -rf .git && git init -q && git config user.name CI && git config user.email ci@example.invalid
          git add -A && git commit -qm base33
          git apply --check /tmp/users34.patch
          git apply /tmp/users34.patch
          git add -A && git commit -qm users34
          git apply --check "$GITHUB_WORKSPACE/phase14_5_36_users_security_hardening/phase14_5_36.patch"
          git apply "$GITHUB_WORKSPACE/phase14_5_36_users_security_hardening/phase14_5_36.patch"
          git diff --name-only HEAD^ > /tmp/hardening_changed.txt || true
          git add -A && git commit -qm users36
          git diff --name-only HEAD~2 HEAD | sort -u > /tmp/users_changed.txt
          echo '=== combined security changed files ==='
          cat /tmp/users_changed.txt

          cd "$GITHUB_WORKSPACE/FushERP_Mobile_Phase5"
          : > /tmp/security_conflicts.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$f" = 'app/build.gradle.kts' ]; then continue; fi
            base="/tmp/base33/FushERP_Mobile_Phase5/$f"
            theirs="/tmp/users33/FushERP_Mobile_Phase5/$f"
            ours="$f"
            if [ -f "$theirs" ] && [ ! -e "$base" ]; then
              mkdir -p "$(dirname "$ours")"; cp "$theirs" "$ours"; continue
            fi
            if [ ! -e "$theirs" ]; then
              rm -f "$ours"; continue
            fi
            if [ -f "$base" ] && [ -f "$ours" ]; then
              set +e
              git merge-file -p "$ours" "$base" "$theirs" > /tmp/merged-security-file
              rc=$?
              set -e
              cp /tmp/merged-security-file "$ours"
              if [ "$rc" -gt 0 ]; then echo "$f" >> /tmp/security_conflicts.txt; fi
            elif [ -f "$theirs" ]; then
              mkdir -p "$(dirname "$ours")"; cp "$theirs" "$ours"
            fi
          done < /tmp/users_changed.txt
          echo '=== THREE WAY CONFLICTS ==='
          cat /tmp/security_conflicts.txt || true
          echo '=== conflict marker context ==='
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "----- $f -----"
            grep -n -B5 -A12 '<<<<<<<' "$f" || true
          done < /tmp/security_conflicts.txt
