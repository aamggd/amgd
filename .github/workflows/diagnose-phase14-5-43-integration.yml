name: Diagnose Fush ERP Phase 14.5.43 Integration

on:
  push:
    branches: [fush/integration-all-14.5.43]
    paths:
      - '.github/workflows/diagnose-phase14-5-43-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch contribution packages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fush/ui-professional-redesign fush/accounting fush/users-permissions --depth=1
          git archive --format=tar origin/fush/ui-professional-redesign \
            phase14_5_39_production_quality_ui \
            phase14_5_40_employees_sales_reps_ui \
            phase14_5_41_assets_maintenance_expenses_ui \
            phase14_5_42_reports_adaptive_ui | tar -xf -
          git archive --format=tar origin/fush/accounting fush_accounting | tar -xf -
          git archive --format=tar origin/fush/users-permissions \
            phase14_5_34_users_permissions \
            phase14_5_36_users_security_hardening | tar -xf -

      - name: Download verified Phase 14.5.38 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.38-Professional-UI-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31858347166

      - name: Restore baseline and apply completed UI phases 39-42 sequentially
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          git config user.name 'FUSH Integration CI'
          git config user.email 'fush-integration@example.invalid'
          git add -A && git commit -qm 'Phase 14.5.38 baseline'
          for phase in \
            phase14_5_39_production_quality_ui \
            phase14_5_40_employees_sales_reps_ui \
            phase14_5_41_assets_maintenance_expenses_ui \
            phase14_5_42_reports_adaptive_ui
          do
            echo "=== $phase ==="
            for p in ../$phase/patches/*.patch; do
              echo "Applying $(basename "$p")"
              if git apply --check "$p"; then
                git apply "$p"
              else
                repaired="/tmp/${phase}-$(basename "$p")"
                python - "$p" "$repaired" <<'PY'
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          if not raw.endswith(b'\n'):
              raw += b'\n'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
                git apply --recount --check "$repaired"
                git apply --recount "$repaired"
              fi
            done
          done
          grep -q 'versionCode = 81' app/build.gradle.kts
          grep -q '0.15.4.42-ui-reports-adaptive' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          git add -A && git commit -qm 'Apply UI 39-42'

      - name: Rebase accounting patches sequentially
        shell: bash
        run: |
          set -euo pipefail
          cd FushERP_Mobile_Phase5
          extract_patch() {
            src="$1"; out="$2"
            set +e
            base64 -d "../fush_accounting/patches/$src" | gzip -dc > "$out"
            rc=$?
            set -e
            test -s "$out"
            grep -q '^diff --git ' "$out"
            echo "Extracted $src rc=$rc bytes=$(wc -c < "$out")"
          }
          extract_patch phase14.5.34-accounting-integrity.patch.gz.b64 /tmp/accounting34.patch
          extract_patch phase14.5.35-accounting-periods-reconciliation.patch.gz.b64 /tmp/accounting35.patch
          extract_patch phase14.5.36-operational-reversals.patch.gz.b64 /tmp/accounting36.patch
          extract_patch phase14.5.37-fiscal-year-closing.patch.gz.b64 /tmp/accounting37.patch

          echo '=== accounting 14.5.34 functional core ==='
          git apply --check \
            --exclude=app/build.gradle.kts \
            --exclude=app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt \
            /tmp/accounting34.patch
          git apply \
            --exclude=app/build.gradle.kts \
            --exclude=app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt \
            /tmp/accounting34.patch

          python - <<'PY'
          import pathlib,re
          raw=pathlib.Path('/tmp/accounting34.patch').read_text()
          parts=re.split(r'(?=^diff --git )', raw, flags=re.M)
          target='app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt'
          part=next(p for p in parts if p.startswith('diff --git ') and f' b/{target}' in p.splitlines()[0])
          pathlib.Path('/tmp/party34.patch').write_text(part)
          PY
          patch -p1 --forward --fuzz=3 < /tmp/party34.patch
          git add -A && git commit -qm 'Rebase accounting integrity'

          for spec in '35:/tmp/accounting35.patch' '36:/tmp/accounting36.patch' '37:/tmp/accounting37.patch'; do
            phase="${spec%%:*}"; p="${spec##*:}"
            echo "=== accounting 14.5.$phase ==="
            if git apply --check --verbose --exclude=app/build.gradle.kts "$p"; then
              git apply --exclude=app/build.gradle.kts "$p"
              git add -A && git commit -qm "Apply accounting phase 14.5.$phase"
            else
              echo "ACCOUNTING_REBASE_REQUIRED_PHASE=$phase"
              git apply --check --verbose --exclude=app/build.gradle.kts "$p" || true
              exit 22
            fi
          done
          echo 'ACCOUNTING_APPLY_OK'
          grep -n 'FUSH_DB_SCHEMA_VERSION' app/src/main/java/com/fush/erp/data/FushDatabase.kt || true
          grep -n 'MIGRATION_27_28\|MIGRATION_28_29\|MIGRATION_29_30' app/src/main/java/com/fush/erp/data/Migrations.kt || true

      - name: Reconstruct users permissions base patch and check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,pathlib
          p=pathlib.Path('phase14_5_34_users_permissions')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in sorted(p.glob('patch_*.b64')))))
          pathlib.Path('/tmp/users34.patch').write_bytes(raw)
          PY
          cd FushERP_Mobile_Phase5
          if git apply --check --verbose /tmp/users34.patch; then
            echo USERS34_APPLIES_CLEANLY
          else
            echo USERS34_NEEDS_REBASE
            git apply --check --verbose /tmp/users34.patch || true
          fi

      - name: Check users security hardening relationship
        shell: bash
        run: |
          set -euo pipefail
          cd FushERP_Mobile_Phase5
          grep -n '^diff --git' ../phase14_5_36_users_security_hardening/phase14_5_36.patch
