name: Build Fush ERP Phase 14.5.48 Expense Analysis

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-48-expense-analysis.yml'
      - 'phase14_5_48_expense_analysis/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.47 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.47-Aging-Reports-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31866638337

      - name: Restore Phase 14.5.47 and apply Phase 14.5.48 expense patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.47-Aging-Reports-Source.zip
          cat phase14_5_48_expense_analysis/payload/expense_analysis.patch.gz.b64.part* > expense.patch.gz.b64
          base64 -d expense.patch.gz.b64 > expense.patch.gz
          gunzip -c expense.patch.gz > expense.patch
          echo 'ff23173d004aa28c9f2c939ef49ca0b1d49bf10f760754220e3e0786c3e0d00a  expense.patch' | sha256sum -c -
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build .kotlin
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.47
          git apply --check ../expense.patch
          git apply ../expense.patch
          git diff --check HEAD
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 87' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.48-expense-analysis"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          grep -q '"المصروفات"' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          grep -q 'suspend fun reportRows(fromDate: Long, toDate: Long)' app/src/main/java/com/fush/erp/data/dao/ExpenseDao.kt
          grep -q "pv.status IN ('POSTED','REVERSED')" app/src/main/java/com/fush/erp/data/dao/ExpenseDao.kt
          grep -q "'REV-' || pv.voucherNo" app/src/main/java/com/fush/erp/data/dao/ExpenseDao.kt
          grep -q 'ExpenseReportAnalyticsMath.build' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          test -f app/src/test/java/com/fush/erp/domain/ExpenseReportAnalyticsTest.kt
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 87' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.48-expense-analysis"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-48-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-48-output/FushERP-Phase14.5.48-Expense-Analysis-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-48-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-48-output/lib/apksigner.jar
          chmod +x phase14-5-48-output/apksigner
          zip -qr phase14-5-48-output/FushERP-Mobile-Phase14.5.48-Expense-Analysis-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.48 — Expense Analysis & Dimensions' \
            'Base verified source: Phase 14.5.47 AR/AP Aging Reports' \
            'Branch: fush/reports-printing' \
            'Expense report period filtering: PASS' \
            'Expense account breakdown: PASS' \
            'Cost center breakdown: PASS' \
            'Organization unit breakdown: PASS' \
            'Employee / sales rep breakdown: PASS' \
            'Payment method breakdown: PASS' \
            'Historical expense reversal rows: PASS' \
            'Professional PDF/Excel export integration: PASS' \
            'Expense analytics regression tests: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 87' \
            'Version name: 0.15.4.48-expense-analysis' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-48-output/FushERP-Phase14.5.48-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.48-Expense-Analysis-Build
          path: phase14-5-48-output/
          if-no-files-found: error
          retention-days: 7
