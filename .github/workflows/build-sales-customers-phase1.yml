name: Build Sales Customers Phase 1

on:
  push:
    branches: [fush/sales-customers]
    paths:
      - 'sales_customers_phase1/**'
      - '.github/workflows/build-sales-customers-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch handoff
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download exact validated Phase 14.5.54 baseline
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: artifacts/base54
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750

      - name: Restore baseline and apply P0 patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP=artifacts/base54/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          test -s "$ZIP"
          echo '8adc047bc38703fcb460344b4ddd2c7f18f0c47c3ca1a6c62a51d3ef590450a1  artifacts/base54/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip' | sha256sum -c -
          base64 -d sales_customers_phase1/phase1_p0.patch.gz.b64 | gzip -dc > /tmp/phase1_p0.patch
          mkdir -p work
          unzip -q "$ZIP" -d work
          SRC=$(find work -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SRC"
          cd "$SRC"
          git init -q
          git config user.email sales-customers@fush.local
          git config user.name FUSH
          git add -A
          BASE_TREE=$(git write-tree)
          echo "BASE_TREE=$BASE_TREE"
          test "$BASE_TREE" = '1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff'
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          git apply --check /tmp/phase1_p0.patch
          git apply /tmp/phase1_p0.patch
          git diff --check
          echo "$SRC" > "$GITHUB_WORKSPACE/source_path.txt"

      - name: P0 boundary regression checks
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat source_path.txt)
          cd "$SRC"
          grep -q 'onOpenSales = { onNavigate("المبيعات") }' app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'private fun CustomerCollectionDialog' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'private fun ReverseSalesReceiptDialog' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'customers_open_sales_operations' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -q 'CustomerPartySettlementDialog' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -q 'ReverseCustomerReceiptDialog' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -q 'AddCustomerDialog\|EditCustomerDialog\|CustomerAccountStatementDialog' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat source_path.txt)
          cd "$SRC"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat source_path.txt)
          cd "$SRC"
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts

      - name: Package unsigned branch test APK and patch
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat source_path.txt)
          mkdir -p output
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$SRC/app/build/outputs/apk/release/app-release-unsigned.apk" output/FushERP-Sales-Customers-Phase1-P0-aligned-unsigned.apk
          cp /tmp/phase1_p0.patch output/phase1_p0.patch
          sha256sum output/FushERP-Sales-Customers-Phase1-P0-aligned-unsigned.apk > output/FushERP-Sales-Customers-Phase1-P0-aligned-unsigned.apk.sha256
          sha256sum output/phase1_p0.patch > output/phase1_p0.patch.sha256

      - name: Upload branch test artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Sales-Customers-Phase1-P0-Build
          path: output/*
          if-no-files-found: error
