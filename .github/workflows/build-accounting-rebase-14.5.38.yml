name: Validate FUSH Accounting Rebase on Professional UI 14.5.38

on:
  push:
    branches: [fush/accounting]
    paths:
      - '.github/workflows/build-accounting-rebase-14.5.38.yml'
      - 'fush_accounting/rebase/patch_chunks/**'
      - 'fush_accounting/rebase/ACCOUNTING_REBASE_14_5_38.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rebase-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download official Professional UI 14.5.38 baseline
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.38-Professional-UI-Build
          path: ui38-artifact
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31858347166

      - name: Verify and reconstruct clean accounting patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          CHUNKS="$ROOT/fush_accounting/rebase/patch_chunks"

          test "$(wc -c < "$CHUNKS/part00.b64")" -eq 12000
          test "$(wc -c < "$CHUNKS/part01.b64")" -eq 12000
          test "$(wc -c < "$CHUNKS/part02.b64")" -eq 12000
          test "$(wc -c < "$CHUNKS/part03.b64")" -eq 12000
          test "$(wc -c < "$CHUNKS/part04.b64")" -eq 8348

          echo 'e195f1687a34717fb866aa8f6d3217973b3c83a34c3ae688f89e1ea71864cd4b  '"$CHUNKS/part00.b64" | sha256sum -c -
          echo '487dc1693ab868afac07ca28ed783207425f487f8bcd57a9b66371861e786a0a  '"$CHUNKS/part01.b64" | sha256sum -c -
          echo '98d588cadf5264ff7bb4c6b6a7394581672fe93231316da44b9f984e7fb6270d  '"$CHUNKS/part02.b64" | sha256sum -c -
          echo '24e55f25c55246db9ef93d4b7df4e039f665c87e2ad031036911c666193863d6  '"$CHUNKS/part03.b64" | sha256sum -c -
          echo '9ece41e167e20b4e1fffc8ff44b9aa96f0856f9aa93da6c1b55033de90248af0  '"$CHUNKS/part04.b64" | sha256sum -c -

          cat "$CHUNKS"/part0*.b64 > /tmp/accounting-rebase.patch.gz.b64
          test "$(wc -c < /tmp/accounting-rebase.patch.gz.b64)" -eq 56348
          base64 --decode /tmp/accounting-rebase.patch.gz.b64 > /tmp/accounting-rebase.patch.gz
          echo 'a8f55cfdb3b43aef1587488bd8fcbfd4193aa5b169b538969e5389e0bcbf8209  /tmp/accounting-rebase.patch.gz' | sha256sum -c -
          gzip -t /tmp/accounting-rebase.patch.gz
          gzip -dc /tmp/accounting-rebase.patch.gz > /tmp/accounting-rebase.patch
          echo '3c1984f84f0f48c90f1adf5b1683185e62520f90512689befe0bed4ce1060dd6  /tmp/accounting-rebase.patch' | sha256sum -c -
          test -s /tmp/accounting-rebase.patch

      - name: Apply accounting rebase to official 14.5.38 baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/work" "$ROOT/rebase-output"
          unzip -q "$ROOT/ui38-artifact/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip" -d "$ROOT/work"
          test -d "$ROOT/work/FushERP_Mobile_Phase5"
          mv "$ROOT/work/FushERP_Mobile_Phase5" "$ROOT/work/repo"
          cd "$ROOT/work/repo"
          rm -rf .git .gradle .kotlin app/build build
          git init -q
          git config user.name 'FUSH Accounting Rebase CI'
          git config user.email 'fush-accounting-ci@example.invalid'
          git add -A
          git commit -qm 'official Professional UI Phase 14.5.38 baseline'
          git apply --check /tmp/accounting-rebase.patch
          git apply /tmp/accounting-rebase.patch
          git diff --check
          git add -A
          git commit -qm 'accounting rebase validated candidate'
          cp /tmp/accounting-rebase.patch "$ROOT/rebase-output/FushERP-Accounting-Rebased-on-Phase14.5.38-Professional-UI.patch"

      - name: Verify identity, schema and migration safety
        shell: bash
        run: |
          set -euo pipefail
          cd work/repo
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.38-ui-inventory-master-data"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 31' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_27_28' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_28_29' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_29_30' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'MIGRATION_30_31' app/src/main/java/com/fush/erp/data/Migrations.kt
          ! grep -R --line-number -E 'fallbackToDestructiveMigration|destructiveMigration' app/src/main/java

      - name: Unit tests
        working-directory: work/repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work/repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Room schema and package output
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT/work/repo"
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/schemas/com.fush.erp.data.FushDatabase/31.json
          grep -q '"version": 31' app/schemas/com.fush.erp.data.FushDatabase/31.json
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$ROOT/rebase-output/FushERP-Accounting-Rebase-14.5.38-aligned-unsigned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 \
            "$ROOT/rebase-output/FushERP-Accounting-Rebase-14.5.38-aligned-unsigned.apk"

          rm -rf .git .gradle .kotlin app/build build
          cd "$ROOT/work"
          zip -qr "$ROOT/rebase-output/FushERP-Mobile-Accounting-Rebased-on-14.5.38-Professional-UI-Source.zip" repo
          sha256sum "$ROOT/rebase-output/"* > "$ROOT/rebase-output/SHA256SUMS.txt"
          cat > "$ROOT/rebase-output/BUILD-REPORT.txt" <<'REPORT'
          FUSH ERP Mobile — Accounting rebase validation
          Baseline: official Phase 14.5.38 Professional UI artifact
          Application ID: com.fush.erp.recovery
          Baseline versionCode retained for branch testing: 77
          Baseline versionName retained for branch testing: 0.15.4.38-ui-inventory-master-data
          Accounting branch Room schema: 31 (PROVISIONAL / BRANCH ONLY; integration must renumber after other migrations)
          Clean patch SHA-256: 3c1984f84f0f48c90f1adf5b1683185e62520f90512689befe0bed4ce1060dd6
          Unit Tests: PASS
          Release Build: PASS
          Room Schema 31 generation: PASS
          Zipalign: PASS
          Signing: NOT PERFORMED IN CI — permanent signing material is intentionally not stored in GitHub
          ACCOUNTING_REBASE_VALIDATED_OK
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Accounting-Rebase-14.5.38-Validated-Build
          path: rebase-output/
          if-no-files-found: error
          retention-days: 7
