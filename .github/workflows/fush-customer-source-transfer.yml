name: FUSH Customer Source Transfer Probe

on:
  push:
    branches: [fush-customer]
    paths:
      - '.github/workflows/fush-customer-source-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate firestorage public API base
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o app.js
          echo '=== absolute URLs ==='
          grep -Eo 'https?://[^"'"'"'` )]+' app.js | sort -u | head -n 100 || true
          echo '=== api-like paths ==='
          grep -Eo '/[A-Za-z0-9_.:-]+(/[A-Za-z0-9_?=&.{}$:-]+){1,8}' app.js | grep -Ei 'api|shares|objects|files|download' | sort -u | head -n 150 || true
          echo '=== config context ==='
          grep -Eo '.{0,260}(NEXT_PUBLIC|API_BASE|apiBase|baseUrl|baseURL).{0,320}' app.js | head -n 120 || true
