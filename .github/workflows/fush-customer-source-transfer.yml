name: FUSH Customer Source Transfer Probe

on:
  push:
    branches: [fush-customer]
    paths:
      - '.github/workflows/fush-customer-source-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect firestorage file page JavaScript
        shell: bash
        env:
          BASE_URL: https://firestorage.ai
          PAGE_JS: /_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$BASE_URL$PAGE_JS" -o page.js
          echo '=== page js size ==='
          wc -c page.js
          echo '=== candidate endpoints ==='
          grep -Eo '.{0,140}(download|presign|signed|share|publicId|shareId|files|api).{0,180}' page.js | head -n 200 || true
