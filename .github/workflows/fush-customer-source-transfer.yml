name: FUSH Customer Source Transfer Probe

on:
  push:
    branches: [fush-customer]
    paths:
      - '.github/workflows/fush-customer-source-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect firestorage page assets
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/1cY8iBEwzwFx
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$SHARE_URL" -o share.html
          mapfile -t scripts < <(grep -Eo 'src="[^"]+\.js"' share.html | sed 's/src="//;s/"$//')
          for s in "${scripts[@]}"; do
            echo "=== $s ==="
            curl -L --fail --silent --show-error "https://firestorage.ai$s" -o asset.js || continue
            wc -c asset.js
            grep -Eo '.{0,160}(download|presign|signed|publicId|shareId|/api/|files).{0,220}' asset.js | head -n 80 || true
          done
