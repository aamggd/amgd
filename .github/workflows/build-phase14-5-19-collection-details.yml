name: Build Fush ERP Phase 14.5.19 Collection Details

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-19-collection-details.yml'
      - 'phase14_5_19_collection_details/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.18 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.18-Manual-Sales-Price-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31738513604
      - name: Restore Phase 14.5.18 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.18-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 57' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.18-phase14.5-manual-sales-price' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.19 collection details
        shell: bash
        run: |
          set -e
          python phase14_5_19_collection_details/apply_patch.py
          grep -q 'versionCode = 58' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.19-phase14.5-collection-details' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'collectionDetails' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'CollectionDetailRow' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/entity/ReportEntities.kt
          grep -q 'تفاصيل صافي التحصيلات' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/CollectionsDetailScreen.kt
          grep -q 'onNavigate("التحصيلات")' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 23 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-19-output
          mkdir -p phase14-5-19-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-19-output/FushERP-Phase14.5.19-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-19-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-19-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-19-output/apksigner/apksigner
          zip -qr phase14-5-19-output/FushERP-Mobile-Phase14.5.19-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-19-output/FushERP-Phase14.5.19-unsigned.apk > phase14-5-19-output/FushERP-Phase14.5.19-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.19 — Net Collections Detail List' \
            'Version: 0.15.4.19-phase14.5-collection-details (versionCode 58)' \
            'Room schema: 23 (unchanged)' \
            '' \
            'Added:' \
            '- Dashboard Net Collections KPI opens a dedicated detail list.' \
            '- List reconciles to customer receipts minus posted CASH_REFUND sales returns.' \
            '- Each row shows date/time, reference, customer, province, invoice, original currency, base amount and notes.' \
            '- Summary cards show gross receipts, refunds and net collections for the same 30-day dashboard period.' \
            '- Filters for all entries, receipts and cash refunds.' \
            '- Cash-sale automatic receipts are included because they are part of the KPI definition.' \
            > phase14-5-19-output/FushERP-Phase14.5.19-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.19-Collection-Details-Build
          path: phase14-5-19-output/
          if-no-files-found: error
          retention-days: 7
