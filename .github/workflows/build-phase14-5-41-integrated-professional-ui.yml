name: Build Fush ERP Phase 14.5.41 Integrated Professional UI

on:
  push:
    branches: [fush/ui-professional-integration-14.5.41]
    paths:
      - '.github/workflows/build-phase14-5-41-integrated-professional-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read UI phases 39-41 from redesign branch without modifying it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fush/ui-professional-redesign --depth=1
          git archive --format=tar origin/fush/ui-professional-redesign \
            phase14_5_39_production_quality_ui \
            phase14_5_40_employees_sales_reps_ui \
            phase14_5_41_assets_maintenance_expenses_ui | tar -xf -
          test -f phase14_5_39_production_quality_ui/patches/07_quality_reports.patch
          test -f phase14_5_40_employees_sales_reps_ui/patches/08_sales_rep_profile_details.patch
          test -f phase14_5_41_assets_maintenance_expenses_ui/patches/07_expense_movements_contribution.patch

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.38 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.38-Professional-UI-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31858347166

      - name: Restore Phase 14.5.38 and apply UI phases 39-41
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.38-Professional-UI-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          for phase in \
            phase14_5_39_production_quality_ui \
            phase14_5_40_employees_sales_reps_ui \
            phase14_5_41_assets_maintenance_expenses_ui
          do
            echo "Applying $phase"
            cat "../$phase/patches/"*.patch > "/tmp/$phase.patch"
            git apply --check "/tmp/$phase.patch"
            git apply "/tmp/$phase.patch"
          done
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 80' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.41-ui-assets-maintenance-expenses"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          if grep -q '^import androidx.compose.foundation.layout.weight$' app/src/main/java/com/fush/erp/ui/ProfessionalComponents.kt; then
            echo 'Unexpected incompatible Compose weight import restored'
            exit 1
          fi
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 80' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.41-ui-assets-maintenance-expenses"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-41-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-41-output/FushERP-Phase14.5.41-Integrated-Professional-UI-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-41-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-41-output/lib/apksigner.jar
          chmod +x phase14-5-41-output/apksigner
          zip -qr phase14-5-41-output/FushERP-Mobile-Phase14.5.41-Integrated-Professional-UI-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.41 — Integrated Professional UI' \
            'Base verified source: Phase 14.5.38 Professional UI' \
            'Read-only source branch: fush/ui-professional-redesign' \
            'Applied phases: 14.5.39 Production & Quality UI; 14.5.40 Employees & Sales Representatives UI; 14.5.41 Assets, Maintenance & Expenses UI.' \
            'Package: com.fush.erp.recovery' \
            'Version code: 80' \
            'Version name: 0.15.4.41-ui-assets-maintenance-expenses' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-41-output/FushERP-Phase14.5.41-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.41-Integrated-Professional-UI-Build
          path: phase14-5-41-output/
          if-no-files-found: error
          retention-days: 7
