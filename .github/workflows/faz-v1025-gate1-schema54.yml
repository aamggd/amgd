name: FAZ v1.0.25 Gate1 Schema54

on:
  push:
    branches: [faz/v1.0.25-ops-itemmaster]
    paths:
      - '.github/workflows/faz-v1025-gate1-schema54.yml'
      - 'ci/UnifiedItemMasterMigrationContractTest.kt'
      - 'ci/faz_v1025_gate1_schema54_apply.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FAZ-v1.0.24-StartupMigrationHotfix-FINAL-UNSIGNED
          path: baseline
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 34796845084
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare baseline source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          Z=$(find baseline -type f -name '*FINAL-Source.zip' -print -quit); test -n "$Z"
          mkdir -p work; unzip -q "$Z" -d work
          S=$(find work -name settings.gradle.kts -print -quit); ROOT=$(dirname "$S")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 53' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
          grep -q 'MIGRATION_52_53_SUPPLIER_PROVENANCE' "$ROOT/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt"
      - name: Apply schema54 implementation
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          python3 ci/faz_v1025_gate1_schema54_apply.py "$ROOT"
          TEST="$ROOT/app/src/test/java/com/fush/erp/domain/UnifiedItemMasterMigrationContractTest.kt"
          cp ci/UnifiedItemMasterMigrationContractTest.kt "$TEST"
      - name: GREEN - migration contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          cd "$ROOT"
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.domain.UnifiedItemMasterMigrationContractTest' | tee "$GITHUB_WORKSPACE/schema54-green.log"
      - name: Build debug and generate Room schema 54
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          cd "$ROOT"
          gradle --no-daemon :app:assembleDebug | tee "$GITHUB_WORKSPACE/schema54-build.log"
      - name: Verify generated schema and migration parity
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          python3 - "$ROOT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          candidates = list(root.rglob('54.json'))
          assert candidates, 'Room schema 54.json not found'
          good=[]
          for p in candidates:
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if d.get('database',{}).get('version') != 54:
                  continue
              js=p.read_text(encoding='utf-8')
              assert 'product_categories' in js
              assert 'categoryId' in js
              assert 'referencePurchasePrice' in js
              assert 'imageUri' in js
              good.append(p)
          assert good, 'No valid Room schema 54 with unified item master fields'
          print('ROOM_SCHEMA_54=PASS', good[0])
          PY
          grep -q 'MIGRATION_53_54_UNIFIED_ITEM_MASTER' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          grep -q 'MIGRATION_53_54_UNIFIED_ITEM_MASTER' "$ROOT/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt"
          ! grep -Rqs 'fallbackToDestructiveMigration' "$ROOT/app/src/main/java"
          echo 'STARTUP_MIGRATION_PARITY=PASS'
      - name: Package Task1 evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/schema54-green.log" "$OUT/"
          cp "$GITHUB_WORKSPACE/schema54-build.log" "$OUT/"
          SCHEMA=$(find "$ROOT" -type f -name '54.json' -path '*schemas*' -print -quit); test -n "$SCHEMA"
          cp "$SCHEMA" "$OUT/54.json"
          echo 'Gate1 Task1 Schema54 = PASS' > "$OUT/task1-verification.txt"
          echo 'Product Category master = PRESENT' >> "$OUT/task1-verification.txt"
          echo 'Family categoryId = PRESENT' >> "$OUT/task1-verification.txt"
          echo 'Variant referencePurchasePrice/imageUri = PRESENT' >> "$OUT/task1-verification.txt"
          echo 'Migration 53->54 registered in AppContainer + Startup Bootstrap = YES' >> "$OUT/task1-verification.txt"
          echo 'Destructive migration fallback = ABSENT' >> "$OUT/task1-verification.txt"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FAZ-v1.0.25-Gate1-Task1-Schema54-GREEN
          path: ${{ steps.package.outputs.out }}
          retention-days: 2
