name: Testing QA Lightweight Harness Qualification

on:
  push:
    branches: [fush/testing-qa]
    paths:
      - 'qa/qualification/**'
      - '.github/workflows/testing-qa-lightweight-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CENTRAL_SHA: 'ff9b2a1a1a3fd1ad47f454db56a638141bd3000c'
  CENTRAL_SOURCE_TREE: '6a58e2c72d86cb16c7fcd7452a799501ff085bfa'
  APP_ID: 'com.fush.erp.recovery'
  ROOM_SCHEMA: '35'
  CENTRAL_CANDIDATE_RUN_ID: '31986737748'
  CENTRAL_CANDIDATE_NAME: 'FushERP-Wave1-Remediations-Ready-For-Final-QA'
  CENTRAL_CANDIDATE_APK: 'FushERP-Wave1-Remediations-QA-unsigned.apk'
  CENTRAL_CANDIDATE_SHA256: 'aede057ba8f373676ae4ece9a4feef941fa9d1ece905d69988b526f56307f434'

jobs:
  qualify-harness:
    name: Lightweight instrumentation qualification only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact Central identity and prepare disposable test copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-source work-source exact-central-candidate evidence
          mkdir -p exact-source work-source evidence
          git fetch origin fush/integration-current
          test "$(git rev-parse origin/fush/integration-current)" = "$CENTRAL_SHA"
          git fetch origin "$CENTRAL_SHA"
          test "$(git rev-parse "$CENTRAL_SHA:central_source")" = "$CENTRAL_SOURCE_TREE"
          git archive "$CENTRAL_SHA" central_source | tar -x -C exact-source --strip-components=1
          cp -a exact-source/. work-source/
          grep -n 'applicationId = "com.fush.erp.recovery"' exact-source/app/build.gradle.kts | tee evidence/application-id.txt
          grep -n 'FUSH_DB_SCHEMA_VERSION = 35' exact-source/app/src/main/java/com/fush/erp/data/FushDatabase.kt | tee evidence/room-schema.txt
          printf '%s\n' "$CENTRAL_SHA" > evidence/central-head.txt
          printf '%s\n' "$CENTRAL_SOURCE_TREE" > evidence/central-source-tree.txt

      - name: Inject qualification-only tests and compatible Room testing runtime
        shell: bash
        run: |
          set -euo pipefail
          cat >> work-source/app/build.gradle.kts <<'EOF'

          // QA LIGHTWEIGHT QUALIFICATION ONLY — disposable work copy, never Central.
          android {
              sourceSets.getByName("androidTest").assets.srcDir("$projectDir/schemas")
          }

          configurations.configureEach {
              if (name.contains("AndroidTest", ignoreCase = true)) {
                  resolutionStrategy.force(
                      "org.jetbrains.kotlinx:kotlinx-serialization-core:1.7.3",
                      "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
                  )
              }
          }

          dependencies {
              androidTestImplementation(libs.junit)
              androidTestImplementation(libs.androidx.room.testing)
              androidTestImplementation("androidx.test:core-ktx:1.7.0")
              androidTestImplementation("androidx.test.ext:junit-ktx:1.3.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("org.jetbrains.kotlinx:kotlinx-serialization-core:1.7.3")
              androidTestImplementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
          }
          EOF
          mkdir -p work-source/app/src/androidTest/java/com/fush/erp/data
          mkdir -p work-source/app/src/androidTest/java/com/fush/erp/qa
          cp qa/qualification/AccountingP1Migration34To35QualificationTest.kt \
            work-source/app/src/androidTest/java/com/fush/erp/data/AccountingP1Migration34To35Test.kt
          cp qa/p1/Wave1P1ReleaseCandidateTest.kt \
            work-source/app/src/androidTest/java/com/fush/erp/qa/Wave1P1ReleaseCandidateTest.kt
          diff -qr exact-source work-source > evidence/qualification-work-copy-diff.txt || true
          if grep -En '![[:space:]]+grep' qa/qualification/run_lightweight_qualification.sh; then
            echo 'Negated grep checks are forbidden in the qualification harness' >&2
            exit 1
          fi

      - name: Download exact Central APK evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CENTRAL_CANDIDATE_NAME }}
          path: exact-central-candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.CENTRAL_CANDIDATE_RUN_ID }}

      - name: Verify exact APK evidence hash
        shell: bash
        run: |
          set -euo pipefail
          APK="exact-central-candidate/${CENTRAL_CANDIDATE_APK}"
          test -s "$APK"
          echo "${CENTRAL_CANDIDATE_SHA256}  ${APK}" | sha256sum -c -
          sha256sum "$APK" | tee evidence/exact-central-candidate.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and emulator packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;default;x86_64"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare deterministic QA test signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -E 'SHA256:|Alias name:' | tee evidence/qa-test-signer.txt

      - name: Select emulator acceleration mode
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'QUALIFICATION_ACCEL=on' >> "$GITHUB_ENV"
            echo 'KVM=AVAILABLE' | tee evidence/emulator-acceleration.txt
            ls -l /dev/kvm | tee -a evidence/emulator-acceleration.txt
          else
            echo 'QUALIFICATION_ACCEL=off' >> "$GITHUB_ENV"
            echo 'KVM=UNAVAILABLE; SOFTWARE_EMULATION=ENABLED' | tee evidence/emulator-acceleration.txt
          fi

      - name: Run lightweight qualification emulator gate only
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME='fush-qa-qualification-api35'
          echo no | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package 'system-images;android-35;default;x86_64' \
            --device 'pixel_6'
          adb kill-server || true
          adb start-server
          nohup emulator \
            -avd "$AVD_NAME" \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -accel "$QUALIFICATION_ACCEL" \
            > evidence/emulator-console.txt 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb logcat -d -v threadtime > evidence/final-logcat.txt 2>&1 || true
            adb shell dumpsys activity processes > evidence/final-activity-processes.txt 2>&1 || true
            adb shell dumpsys activity instrumentation > evidence/final-activity-instrumentation.txt 2>&1 || true
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sleep 10
          if kill -0 "$EMULATOR_PID" 2>/dev/null; then
            echo 'EMULATOR_PROCESS=RUNNING' | tee evidence/emulator-process.txt
          else
            echo 'EMULATOR_PROCESS=EXITED_BEFORE_ADB' | tee evidence/emulator-process.txt
            cat evidence/emulator-console.txt
            exit 1
          fi
          timeout 1200 bash qa/qualification/run_lightweight_qualification.sh

      - name: Record qualification failure only
        if: failure()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/LIGHTWEIGHT-QUALIFICATION-FAILURE.txt <<EOF
          STATUS=QA HARNESS LIGHTWEIGHT QUALIFICATION — FAILED
          Exact Central HEAD=${CENTRAL_SHA}
          Exact Central source tree=${CENTRAL_SOURCE_TREE}
          Room schema=${ROOM_SCHEMA}
          Application ID=${APP_ID}
          Business Logic changes by QA=NONE
          Full Final QA=NOT RUN
          EOF

      - name: Upload lightweight qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-QA-Harness-Lightweight-Qualification-${{ github.run_id }}
          path: |
            evidence/**
          if-no-files-found: error
