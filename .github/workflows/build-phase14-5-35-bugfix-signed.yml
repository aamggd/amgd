name: Build Fush ERP Phase 14.5.35 Bugfix Signed APK

on:
  workflow_dispatch:
  push:
    branches: ['fush/bugfixes-errors']
    paths:
      - '.github/workflows/build-phase14-5-35-bugfix-signed.yml'
      - 'phase14_5_34_ui_professionalization/**'
      - 'phase14_5_35_sales_customers_ui/**'

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_RECOVERY_CERT_SHA256: 22d5e2a8bd48ddd2339abdc4748648b509e02d046524d6e118fbe05088155586

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.33 build
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.33-Expense-Dimensions-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31854443269

      - name: Restore Phase 14.5.33 source
        run: |
          unzip -q previous-build/FushERP-Mobile-Phase14.5.33-Expense-Dimensions-Source.zip
          grep -q 'versionCode = 72' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.33-expense-dimensions-reporting' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 14.5.34 UI package
        run: |
          cat phase14_5_34_ui_professionalization/patches/0*.patch > phase14534.diff
          cd FushERP_Mobile_Phase5
          git apply --check ../phase14534.diff
          git apply ../phase14534.diff
          grep -q 'versionCode = 73' app/build.gradle.kts

      - name: Apply Phase 14.5.35 Sales Customers UI package
        run: |
          cat phase14_5_35_sales_customers_ui/patches/0*.patch > phase14535.diff
          cd FushERP_Mobile_Phase5
          git apply --check ../phase14535.diff
          git apply ../phase14535.diff
          grep -q 'versionCode = 74' app/build.gradle.kts
          grep -q '0.15.4.35-ui-sales-customers' app/build.gradle.kts

      - name: Compose compatibility correction
        run: |
          file=FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/ProfessionalComponents.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$file"
          sed -i 's/, modifier = Modifier.weight(1f))/, modifier = Modifier)/' "$file"
          ! grep -q 'foundation.layout.weight' "$file"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Room schema unchanged
        run: |
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Align unsigned release
        run: |
          mkdir -p output
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 \
            FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk \
            output/FushERP-Phase14.5.35-UI-Sales-Customers-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 \
            output/FushERP-Phase14.5.35-UI-Sales-Customers-aligned-unsigned.apk

      - name: Sign with Fush ERP Recovery update key
        env:
          FUSH_RECOVERY_KEYSTORE_B64: ${{ secrets.FUSH_RECOVERY_KEYSTORE_B64 }}
          FUSH_RECOVERY_KEYSTORE_PASSWORD: ${{ secrets.FUSH_RECOVERY_KEYSTORE_PASSWORD }}
          FUSH_RECOVERY_KEY_PASSWORD: ${{ secrets.FUSH_RECOVERY_KEY_PASSWORD }}
          FUSH_RECOVERY_KEY_ALIAS: ${{ secrets.FUSH_RECOVERY_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${FUSH_RECOVERY_KEYSTORE_B64:-}" ] || [ -z "${FUSH_RECOVERY_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Recovery signing key is not configured. Refusing to publish an unsigned APK."
            exit 1
          fi

          printf '%s' "$FUSH_RECOVERY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fush-recovery-keystore"
          chmod 600 "$RUNNER_TEMP/fush-recovery-keystore"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          INPUT_APK="output/FushERP-Phase14.5.35-UI-Sales-Customers-aligned-unsigned.apk"
          SIGNED_APK="output/FushERP-Phase14.5.35-UI-Sales-Customers-signed.apk"

          args=(
            sign
            --ks "$RUNNER_TEMP/fush-recovery-keystore"
            --ks-pass env:FUSH_RECOVERY_KEYSTORE_PASSWORD
            --v2-signing-enabled true
            --v3-signing-enabled true
            --out "$SIGNED_APK"
          )

          if [ -n "${FUSH_RECOVERY_KEY_ALIAS:-}" ]; then
            args+=(--ks-key-alias "$FUSH_RECOVERY_KEY_ALIAS")
          fi

          if [ -n "${FUSH_RECOVERY_KEY_PASSWORD:-}" ]; then
            args+=(--key-pass env:FUSH_RECOVERY_KEY_PASSWORD)
          else
            args+=(--key-pass env:FUSH_RECOVERY_KEYSTORE_PASSWORD)
          fi

          args+=("$INPUT_APK")
          "$APKSIGNER" "${args[@]}"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" | tee output/APK-SIGNATURE-REPORT.txt

          ACTUAL_CERT_SHA256="$($APKSIGNER verify --print-certs "$SIGNED_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n1)"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_RECOVERY_CERT_SHA256" ]; then
            echo "::error::Wrong APK signer. Expected Recovery certificate $EXPECTED_RECOVERY_CERT_SHA256 but got $ACTUAL_CERT_SHA256"
            rm -f "$SIGNED_APK"
            exit 1
          fi

          rm -f "$RUNNER_TEMP/fush-recovery-keystore"
          echo "APK signature verified with the existing Fush ERP Recovery update certificate."

      - name: Package verified signed build
        run: |
          rm -f output/FushERP-Phase14.5.35-UI-Sales-Customers-aligned-unsigned.apk
          zip -qr output/FushERP-Mobile-Phase14.5.35-UI-Sales-Customers-Source.zip FushERP_Mobile_Phase5
          sha256sum output/FushERP-Phase14.5.35-UI-Sales-Customers-signed.apk > output/FushERP-Phase14.5.35-UI-Sales-Customers-signed.apk.sha256
          printf '%s\n' \
            'FUSH ERP Phase 14.5.35 Bugfix Signed Build' \
            'VersionCode: 74' \
            'Room schema: 27 unchanged' \
            'APK signing: VERIFIED' \
            "Required signer SHA-256: $EXPECTED_RECOVERY_CERT_SHA256" \
            > output/BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.35-Bugfix-Signed
          path: output/
          retention-days: 7
