name: Build Fush ERP Phase 14.5.8 Historical Stock Guard

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-8-historical-stock-guard.yml'
      - 'phase14_5_8_historical_stock_guard/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.7 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.7-Warehouse-Reorder-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31658174829
      - name: Restore Phase 14.5.7 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.7-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 46' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.7-phase14.5-warehouse-reorder' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.8 historical stock guard
        shell: bash
        run: |
          set -e
          python phase14_5_8_historical_stock_guard/apply_patch.py
          grep -q 'versionCode = 47' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.8-phase14.5-historical-stock-guard' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'lotMovementTimeline' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'validateHistoricalTransferAvailability' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          grep -q 'minimumAvailableFrom' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/WarehouseTransferMath.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema remains 20
        shell: bash
        run: |
          set -e
          grep -q 'version = 20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/20.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-8-output
          mkdir -p phase14-5-8-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-8-output/FushERP-Phase14.5.8-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-8-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-8-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-8-output/apksigner/apksigner
          zip -qr phase14-5-8-output/FushERP-Mobile-Phase14.5.8-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-8-output/FushERP-Phase14.5.8-unsigned.apk > phase14-5-8-output/FushERP-Phase14.5.8-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.8 — Historical Stock Guard' \
            'Version: 0.15.4.8-phase14.5-historical-stock-guard (versionCode 47)' \
            'Room schema: 20 (unchanged)' \
            '' \
            'Fixed:' \
            '- Backdated warehouse transfers are checked against the full later stock timeline for the exact warehouse/item/lot.' \
            '- A transfer is rejected if it would make any later historical checkpoint negative.' \
            '- The guard runs when a transfer line is added and again inside the posting transaction.' \
            '- Same-timestamp existing movements are treated as preceding the newly posted backdated transfer.' \
            '- Added unit tests for later historical dips and transfer-date checkpoint behavior.' \
            > phase14-5-8-output/FushERP-Phase14.5.8-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.8-Historical-Stock-Guard-Build
          path: phase14-5-8-output/
          if-no-files-found: error
          retention-days: 7
