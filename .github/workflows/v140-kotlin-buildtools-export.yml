name: V140 Kotlin Build Tools Export

on:
  push:
    branches:
      - agent/v123-toolchain-bootstrap-20260822
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Kotlin 2.3.21 build-tools artifacts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/kbtseed /tmp/kbtcache
          mkdir -p /tmp/kbtseed /tmp/kbtcache
          cat > /tmp/kbtseed/settings.gradle.kts <<'EOF'
          rootProject.name = "kbtseed"
          dependencyResolutionManagement { repositories { mavenCentral() } }
          EOF
          cat > /tmp/kbtseed/build.gradle.kts <<'EOF'
          val kbt by configurations.creating
          dependencies {
              kbt("org.jetbrains.kotlin:kotlin-build-tools-compat:2.3.21")
              kbt("org.jetbrains.kotlin:kotlin-build-tools-impl:2.3.21")
          }
          tasks.register("resolveKbt") {
              doLast { kbt.resolve().forEach { println(it.absolutePath) } }
          }
          EOF
          GRADLE_USER_HOME=/tmp/kbtcache gradle -p /tmp/kbtseed --no-daemon resolveKbt
          tar -czf /tmp/v140-kbt-cache.tgz -C /tmp/kbtcache/caches modules-2
          sha256sum /tmp/v140-kbt-cache.tgz > /tmp/v140-kbt-cache.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v140-KotlinBuildTools-Cache
          path: |
            /tmp/v140-kbt-cache.tgz
            /tmp/v140-kbt-cache.tgz.sha256
          compression-level: 0
          retention-days: 1
