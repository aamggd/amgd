name: Build Fush ERP Phase 14.5.16 Safe Restore

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-16-safe-restore.yml'
      - 'phase14_5_16_safe_restore/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.15 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.15-Price-List-Validity-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31685328831
      - name: Restore Phase 14.5.15 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.15-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 54' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.15-phase14.5-price-list-validity' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.16 safe restore
        shell: bash
        run: |
          set -e
          python phase14_5_16_safe_restore/apply_patch.py
          grep -q 'versionCode = 55' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.16-phase14.5-safe-restore' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'const val FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'version = FUSH_DB_SCHEMA_VERSION' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'CURRENT_SCHEMA_VERSION = FUSH_DB_SCHEMA_VERSION' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/backup/BackupRestoreManager.kt
          grep -q 'atomicReplace' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/backup/RestoreFileSafety.kt
          grep -q 'checkpointClosedDatabase' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/backup/BackupRestoreManager.kt
          grep -q 'restoreDatabaseSet' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/backup/BackupRestoreManager.kt
          grep -q 'failedExtractionDeletesPartialDestination' FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/backup/BackupArchiveCodecTest.kt
          grep -q 'restoreDatabaseSetRestoresMainWalAndShm' FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/backup/RestoreFileSafetyTest.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 23 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'const val FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-16-output
          mkdir -p phase14-5-16-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-16-output/FushERP-Phase14.5.16-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-16-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-16-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-16-output/apksigner/apksigner
          zip -qr phase14-5-16-output/FushERP-Mobile-Phase14.5.16-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-16-output/FushERP-Phase14.5.16-unsigned.apk > phase14-5-16-output/FushERP-Phase14.5.16-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.16 — Safe Backup / Restore' \
            'Version: 0.15.4.16-phase14.5-safe-restore (versionCode 55)' \
            'Room schema: 23 (unchanged)' \
            '' \
            'Fixed:' \
            '- Backup/restore schema version now comes from the real Room schema constant (23), eliminating stale schema 16 drift.' \
            '- Backup, inspection and restore-staging temporary files are cleaned on both success and failure.' \
            '- A restore candidate is re-opened, re-validated and re-hashed before it becomes pending.' \
            '- Restore staging uses synced files and atomic replacement instead of deleting the pending file first.' \
            '- The current SQLite database is checkpointed before replacement so WAL data is consolidated.' \
            '- Restore uses an internal pre-restore safety snapshot and automatically rolls back if post-swap validation fails.' \
            '- The consumed pending restore is removed/moved after success so it cannot be applied twice accidentally.' \
            '- Only the latest three internal safety snapshots are retained.' \
            '- Corrupt archive extraction removes partial database output and duplicate critical ZIP entries are rejected.' \
            '- Added filesystem and corrupt-archive unit tests.' \
            > phase14-5-16-output/FushERP-Phase14.5.16-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.16-Safe-Restore-Build
          path: phase14-5-16-output/
          if-no-files-found: error
          retention-days: 7
