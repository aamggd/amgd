name: Build Fush ERP Phase 14.5.24 Multi Sample Quality

on:
  push:
    branches: [phase14-5-24-build]
    paths:
      - '.github/workflows/build-phase14-5-24-multi-sample-quality.yml'
      - 'phase14_5_24_multi_sample_quality/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.23 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.23-Legacy-Lot-Assignment-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31757260560
      - name: Restore Phase 14.5.23 source
        run: |
          unzip -q previous-build/FushERP-Mobile-Phase14.5.23-Source.zip
          grep -q 'versionCode = 62' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.24
        run: |
          cd FushERP_Mobile_Phase5
          python ../phase14_5_24_multi_sample_quality/apply_patch.py
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 24' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'quality_check_samples' app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'تسجيل قراءات العينة' app/src/main/java/com/fush/erp/ui/screens/ProductionScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 24
        run: |
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
          grep -q 'quality_check_samples' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        run: |
          mkdir -p phase14-5-24-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-24-output/FushERP-Phase14.5.24-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-24-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-24-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-24-output/apksigner/apksigner
          zip -qr phase14-5-24-output/FushERP-Mobile-Phase14.5.24-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-24-output/FushERP-Phase14.5.24-unsigned.apk > phase14-5-24-output/FushERP-Phase14.5.24-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.24 — Multi-sample Quantitative Quality' \
            'Version: 0.15.4.24-phase14.5-multi-sample-quality (versionCode 63)' \
            'Room schema: 24 (migration 23 -> 24, non-destructive)' \
            '' \
            'Added:' \
            '- Required sample size now creates one input per sampled unit.' \
            '- A quantitative check passes only when every sample reading is inside the inclusive limits.' \
            '- Individual readings are stored in quality_check_samples.' \
            '- The parent quality check stores the average and sample size for reporting compatibility.' \
            '- UI shows average, minimum, maximum, conforming count, and every sample reading.' \
            '- Existing aggregate checks are preserved as legacy records; no sample values are invented.' \
            > phase14-5-24-output/FushERP-Phase14.5.24-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.24-Multi-Sample-Quality-Build
          path: phase14-5-24-output/
          if-no-files-found: error
          retention-days: 7
