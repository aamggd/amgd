name: Build Fush ERP Phase 13.9 Production Export

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase13-9-production-export.yml'
      - 'phase13_9_production_export/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 13.8 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase13.8-Production-Reports-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31551526043

      - name: Restore Phase 13.8 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase13.8-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 28' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.8-phase13-production-reports' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 13.9 production export
        shell: bash
        run: |
          set -e
          python phase13_9_production_export/apply_patch.py
          grep -q 'versionCode = 29' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.9-phase13-production-export' FushERP_Mobile_Phase5/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase13-9-output
          mkdir -p phase13-9-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase13-9-output/FushERP-Phase13.9-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase13-9-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase13-9-output/apksigner/lib/apksigner.jar
          chmod +x phase13-9-output/apksigner/apksigner
          zip -qr phase13-9-output/FushERP-Mobile-Phase13.9-Source.zip FushERP_Mobile_Phase5
          sha256sum phase13-9-output/FushERP-Phase13.9-unsigned.apk > phase13-9-output/FushERP-Phase13.9-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase13.9-Production-Export-Build
          path: phase13-9-output/
          if-no-files-found: error
          retention-days: 7
