name: Build Fush ERP Phase 14.5.20 Customer Statement Search
on:
  push:
    branches: [master, phase14-5-20-build]
    paths: ['.github/workflows/build-phase14-5-20-customer-statement-search.yml','phase14_5_20_customer_statement_search/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.19
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.19-Collection-Details-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31742835042
      - name: Restore and patch
        run: |
          unzip -q previous-build/FushERP-Mobile-Phase14.5.19-Source.zip
          grep -q 'versionCode = 58' FushERP_Mobile_Phase5/app/build.gradle.kts
          python phase14_5_20_customer_statement_search/apply_patch.py
          grep -q 'versionCode = 59' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'بحث عن العميل' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'customerLedgerEvents' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/SalesDaos.kt
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify schema
        run: |
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package
        run: |
          mkdir -p out/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk out/FushERP-Phase14.5.20-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" out/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" out/apksigner/lib/apksigner.jar
          chmod +x out/apksigner/apksigner
          zip -qr out/FushERP-Mobile-Phase14.5.20-Source.zip FushERP_Mobile_Phase5
          sha256sum out/FushERP-Phase14.5.20-unsigned.apk > out/FushERP-Phase14.5.20-unsigned.apk.sha256
          printf '%s\n' 'Fush ERP Phase 14.5.20 — Customer Statement and Search' 'Version: 0.15.4.20-phase14.5-customer-statement-search (versionCode 59)' 'Room schema: 23 (unchanged)' '' 'Added: customer search, detailed customer account statement, running debit/credit balances, and receivable consistency for cash refunds.' > out/FushERP-Phase14.5.20-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.20-Customer-Statement-Search-Build
          path: out/
          if-no-files-found: error
          retention-days: 7
