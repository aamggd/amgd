name: ANDAK Supplier v0.3.0 Gate2 Signed Runtime

on:
  push:
    branches: ['andak-supplier-gate2-v030']
    paths: ['.github/workflows/andak-supplier-gate2-v030-signed-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official signed Gate2 APK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/shares/tQx_HG06lobu'
          curl -fsSL "$BASE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python -c 'import json; d=json.load(open("/tmp/files.json")); print([x["fileId"] for x in d["files"] if x["fileName"]=="ANDAK-Supplier-v0.3.0-GATE2-OFFICIAL-SIGNED.apk"][0])')
          curl -fsSL -X POST "$BASE/files/$FILE_ID/download" -o /tmp/download.json
          URL=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')
          curl -fL "$URL" -o /tmp/ANDAK-Supplier-v0.3.0-GATE2-OFFICIAL-SIGNED.apk
          echo 'b593bbbd9f4464e129da4b3c9050f959ed705e72ab64cd5ef8e7e781b20c3726  /tmp/ANDAK-Supplier-v0.3.0-GATE2-OFFICIAL-SIGNED.apk' | shasum -a 256 -c -
          echo "APK=/tmp/ANDAK-Supplier-v0.3.0-GATE2-OFFICIAL-SIGNED.apk" >> "$GITHUB_ENV"

      - name: Verify permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/signature-verify.txt"
          grep -qi 'certificate SHA-256 digest: 84c8e94d39a2fa8372593ffa7d75b4772bfe1192226bf2dd0de59706facff13e' "$GITHUB_WORKSPACE/signature-verify.txt"
          grep -q 'Number of signers: 1' "$GITHUB_WORKSPACE/signature-verify.txt"

      - name: Write Gate2 signed runtime
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/runtime-gate2-signed.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          P=com.fush.market.supplier
          E="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$E"

          dump_ui() {
            local name="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$E/$name.xml" >/dev/null 2>&1 || true
          }

          tap_text() {
            local txt="$1"
            dump_ui tap-source
            python - "$E/tap-source.xml" "$txt" <<'PY'
          import re, sys, subprocess, xml.etree.ElementTree as ET
          path, target = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          nodes = [n for n in root.iter('node') if n.attrib.get('text') == target or n.attrib.get('content-desc') == target]
          if not nodes:
              raise SystemExit("TEXT_NOT_FOUND " + target)
          m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', nodes[0].attrib.get('bounds',''))
          if not m:
              raise SystemExit("BAD_BOUNDS")
          x1,y1,x2,y2 = map(int,m.groups())
          subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
          PY
            sleep 2
          }

          adb uninstall "$P" >/dev/null 2>&1 || true
          adb install "$APK" | tee "$E/install.txt"
          adb logcat -c
          adb shell am start -n "$P/.MainActivity" | tee "$E/start.txt" || true
          sleep 10

          PID="$(adb shell pidof "$P" | tr -d '\r' || true)"
          echo "$PID" > "$E/pid.txt"
          test -n "$PID"

          dump_ui home
          grep -q 'لوحة المورد' "$E/home.xml"
          grep -q 'بوابة الموافقات' "$E/home.xml"

          tap_text 'المنتجات'
          dump_ui products
          grep -q 'إضافة المنتجات ومتابعة موافقة الإدارة والأسعار' "$E/products.xml"
          grep -q '+ إضافة منتج جديد' "$E/products.xml"
          grep -q 'مراجعة' "$E/products.xml"
          grep -q 'تعديل سعر' "$E/products.xml"

          tap_text 'مراجعة'
          dump_ui pending-approval
          grep -q 'مياه معدنية كرتون' "$E/pending-approval.xml"
          grep -q 'بانتظار موافقة الإدارة' "$E/pending-approval.xml"

          tap_text 'تعديل سعر'
          dump_ui pending-price
          grep -q 'عسل سدر 500 جم' "$E/pending-price.xml"
          grep -q 'تعديل سعر قيد المراجعة' "$E/pending-price.xml"

          tap_text 'الكل'
          tap_text '+ إضافة منتج جديد'
          dump_ui add-product
          grep -q 'بيانات المورد التي سترسل للإدارة للمراجعة' "$E/add-product.xml"
          adb shell input swipe 540 1500 540 450 450
          sleep 1
          dump_ui add-product-scroll
          grep -q 'الكمية المخصصة لمنصة عندك' "$E/add-product-scroll.xml"
          adb shell am force-stop "$P"
          adb shell am start -n "$P/.MainActivity" >/dev/null 2>&1 || true
          sleep 6
          tap_text 'المنتجات'
          tap_text 'معتمد'
          adb shell input swipe 540 1500 540 650 450
          sleep 1
          dump_ui approved-scrolled
          grep -q 'طلب تعديل السعر' "$E/approved-scrolled.xml"
          tap_text 'طلب تعديل السعر'
          dump_ui price-update
          grep -q 'سيبقى السعر الحالي ظاهرًا للعملاء حتى اعتماد السعر الجديد من الإدارة' "$E/price-update.xml"
          grep -q 'السعر الجديد ر.ي' "$E/price-update.xml"

          adb logcat -d -b crash > "$E/crash.log" || true
          adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|ResourceResolutionException|Caused by|$P" > "$E/relevant.log" || true
          if grep -q "$P" "$E/crash.log"; then
            cat "$E/crash.log"
            exit 1
          fi

          adb exec-out screencap -p > "$E/final-screen.png"
          echo SIGNED_GATE2_RUNTIME_PASS | tee "$E/result.txt"
          EOF
          chmod +x "$GITHUB_WORKSPACE/runtime-gate2-signed.sh"

      - name: Signed Gate2 runtime API29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/runtime-gate2-signed.sh"

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          test -f signature-verify.txt && cp signature-verify.txt evidence/
          printf '%s\n'             'ANDAK Supplier Gate2 v0.3.0 — Signed Runtime'             'applicationId=com.fush.market.supplier'             'versionCode=4'             'versionName=0.3.0'             'APK SHA-256=b593bbbd9f4464e129da4b3c9050f959ed705e72ab64cd5ef8e7e781b20c3726'             'Certificate SHA-256=84:C8:E9:4D:39:A2:FA:83:72:59:3F:FA:7D:75:B4:77:2B:FE:11:92:22:6B:F2:DD:0D:E5:97:06:FA:CF:F1:3E'             > evidence/INFO.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANDAK-Supplier-v0.3.0-GATE2-SIGNED-RUNTIME-EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
