name: FUSH Customer v219 Build Gate

on:
  push:
    branches: [fush-customer-v219-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact v219 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file'
          SHARE='qdkYKLRKRBgE'
          FILE='01a089902ef5758e8bb850f54d00b269'
          COOKIE=/tmp/firestorage.cookies
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "$BASE/shares/$SHARE/cushion-sessions" --data '{"password":null}' -o /tmp/cushion.json
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/shares/$SHARE/files/$FILE/download" -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          with open('/tmp/download.json', encoding='utf-8') as f:
              data=json.load(f)
          url=data.get('downloadUrl')
          if not url:
              raise SystemExit('downloadUrl missing')
          print(url)
          PY
          )"
          curl -fL "$DOWNLOAD_URL" -o /tmp/v219-source.zip
          echo 'f24ea07b4096b45203e3632244c73a3d5c8cbe04c467fe5be54e73af6372c781  /tmp/v219-source.zip' | sha256sum -c -
          rm -rf v219-src
          mkdir -p v219-src
          unzip -oq /tmp/v219-source.zip -d v219-src
          test -f v219-src/settings.gradle.kts
          test -f v219-src/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify v219 contract
        shell: bash
        run: |
          cd v219-src
          python3 tools/verify_v219_new_company_bootstrap.py

      - name: Unit tests
        shell: bash
        run: |
          cd v219-src
          gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble release APK
        shell: bash
        run: |
          cd v219-src
          gradle --no-daemon :app:assembleRelease

      - name: Build release AAB
        shell: bash
        run: |
          cd v219-src
          gradle --no-daemon :app:bundleRelease

      - name: Release lint
        shell: bash
        run: |
          cd v219-src
          gradle --no-daemon :app:lintVitalRelease

      - name: Align, identify and package outputs
        shell: bash
        run: |
          set -euo pipefail
          cd v219-src
          BT="$ANDROID_HOME/build-tools/36.1.0"
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -f "$APK"
          test -f "$AAB"
          APK_OUT='FUSH-Customer-v219-NewCompanyBootstrapHotfix-UNSIGNED-ALIGNED.apk'
          AAB_OUT='FUSH-Customer-v219-NewCompanyBootstrapHotfix-UNSIGNED.aab'
          "$BT/zipalign" -f -v 4 "$APK" "$APK_OUT"
          "$BT/zipalign" -c -v 4 "$APK_OUT"
          cp "$AAB" "$AAB_OUT"
          "$BT/aapt2" dump badging "$APK_OUT" | head -20 | tee APK_IDENTITY.txt
          unzip -t "$AAB_OUT" >/dev/null
          sha256sum "$APK_OUT" "$AAB_OUT" > SHA256SUMS.txt
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/
          cp "$BT/zipalign" signing-tools/
          cp "$BT/aapt2" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign signing-tools/aapt2

      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-Customer-v219-Release-Unsigned
          path: |
            v219-src/FUSH-Customer-v219-NewCompanyBootstrapHotfix-UNSIGNED-ALIGNED.apk
            v219-src/FUSH-Customer-v219-NewCompanyBootstrapHotfix-UNSIGNED.aab
            v219-src/APK_IDENTITY.txt
            v219-src/SHA256SUMS.txt
            v219-src/signing-tools/
          if-no-files-found: error
