name: Build Fush ERP Phase 13.6.2 Dashboard Navigation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase13-6-2-dashboard-navigation.yml'
      - 'phase13_6_2_dashboard_navigation/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 13.6.1 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase13.6.1-Dashboard-Return-Fix-Build
          path: previous-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: aamggd/amgd
          run-id: 31545639874

      - name: Restore Phase 13.6.1 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase13.6.1-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 25' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.6.1-phase13-dashboard-return-fix' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 13.6.2 dashboard navigation
        shell: bash
        run: |
          set -e
          python phase13_6_2_dashboard_navigation/apply_patch.py
          grep -q 'versionCode = 26' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.6.2-phase13-dashboard-navigation' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'onNavigate("المبيعات")' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'onNavigate("المواد والأصناف")' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'اضغط على أي بطاقة لفتح القسم المرتبط بها' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase13-6-2-output
          mkdir -p phase13-6-2-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase13-6-2-output/FushERP-Phase13.6.2-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase13-6-2-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase13-6-2-output/apksigner/lib/apksigner.jar
          chmod +x phase13-6-2-output/apksigner/apksigner
          zip -qr phase13-6-2-output/FushERP-Mobile-Phase13.6.2-Source.zip FushERP_Mobile_Phase5
          sha256sum phase13-6-2-output/FushERP-Phase13.6.2-unsigned.apk > phase13-6-2-output/FushERP-Phase13.6.2-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase13.6.2-Dashboard-Navigation-Build
          path: phase13-6-2-output/
          if-no-files-found: error
          retention-days: 7
