name: FUSH v112 bootstrap Gradle cache

on:
  pull_request:
    branches: [fush/v112-toolchain-target]
    paths:
      - '.github/workflows/v112-bootstrap-gradle-cache.yml'
      - 'ci/v112/deps_project/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deps-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/v112-gradle-home
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve exact v112 plugins and all compile/test dependencies
        working-directory: ci/v112/deps_project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            :app:compileDebugUnitTestKotlin \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace
          gradle --no-daemon --max-workers=2 :app:dependencies --configuration kotlinBuildToolsApiClasspath >/tmp/v112-kotlin-build-tools-deps.txt
          cat /tmp/v112-kotlin-build-tools-deps.txt
      - name: Package isolated Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GRADLE_USER_HOME/daemon" "$GRADLE_USER_HOME/workers" "$GRADLE_USER_HOME/notifications" || true
          du -sh "$GRADLE_USER_HOME"
          tar -cf fush-v112-gradle-cache.tar -C "$(dirname "$GRADLE_USER_HOME")" "$(basename "$GRADLE_USER_HOME")"
          sha256sum fush-v112-gradle-cache.tar > fush-v112-gradle-cache.tar.sha256
          ls -lh fush-v112-gradle-cache.tar
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-cache
          compression-level: 1
          path: |
            fush-v112-gradle-cache.tar
            fush-v112-gradle-cache.tar.sha256
          if-no-files-found: error
          retention-days: 1
