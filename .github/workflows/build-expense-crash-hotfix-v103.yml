name: Build Exact v103 Expense Crash Hotfix

on:
  pull_request:
    branches: [agent/expense-crash-hotfix-v103-ci-base]
    paths:
      - '.github/workflows/build-expense-crash-hotfix-v103.yml'
      - 'v103_payload/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CENTRAL_SOURCE_TREE: '30b028b75d6463c07afd0419429f53c7937fabb1'
  PAYLOAD_SHA256: '5ef57f5a729066b5301ae37517160f4e22b4396682dc9435450d2cc93f023745'
  TESTS_PAYLOAD_SHA256: 'bcb7d5d1a7801cbe9cccd894176014ada62a172c13e151bcb15f16e4f020b2cc'
  EXPECTED_APP_ID: 'com.fush.erp.recovery'
  EXPECTED_VERSION_CODE: '103'
  EXPECTED_ROOM_SCHEMA: '38'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify exact Central baseline
        shell: bash
        run: |
          set -euo pipefail
          cp -a central_source release-source
          cd release-source
          git init -q
          git add -A
          TREE=$(git write-tree)
          echo "Central source tree: $TREE"
          test "$TREE" = "$CENTRAL_SOURCE_TREE"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main

      - name: Reconstruct and apply exact v103 source deltas
        shell: bash
        run: |
          set -euo pipefail
          cat v103_payload/runtime-delta-part-*.b64 | tr -d '\r\n' > runtime-delta.b64
          base64 -d runtime-delta.b64 > runtime-delta.tar.xz
          echo "$PAYLOAD_SHA256  runtime-delta.tar.xz" | sha256sum -c -
          tar -xJf runtime-delta.tar.xz -C release-source

          base64 -d v103_payload/tests-exact.tar.xz.b64 > tests-exact.tar.xz
          echo "$TESTS_PAYLOAD_SHA256  tests-exact.tar.xz" | sha256sum -c -
          rm -rf release-source/app/src/test
          tar -xJf tests-exact.tar.xz -C release-source

          grep -q 'versionCode = 103' release-source/app/build.gradle.kts
          grep -q 'central-expense-entry-hotfix1' release-source/app/build.gradle.kts
          grep -q 'applicationId = "com.fush.erp.recovery"' release-source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 38' release-source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'Migration(35, 36)' release-source/app/src/main/java/com/fush/erp/data/AccountingWaveBMigrations.kt
          grep -q 'Migration(36, 37)' release-source/app/src/main/java/com/fush/erp/data/AccountingWaveBMigrations.kt
          grep -q 'Migration(37, 38)' release-source/app/src/main/java/com/fush/erp/data/InventoryCostLayerSupport.kt
          grep -q 'MIGRATION_35_36_ACCOUNTING_PRECISION' release-source/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt
          grep -q 'MIGRATION_36_37_JOURNAL_LINE_SEMANTICS' release-source/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt
          grep -q 'MIGRATION_37_38_INVENTORY_COST_LAYERS' release-source/app/src/main/java/com/fush/erp/data/AccountingWaveBRoomBootstrap.kt
          grep -q 'expenseScreenSafeFlow' release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt
          test -f release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseFlowSafety.kt
          grep -q 'stableAutomaticEventsHaveAReversalPathOrAreTerminalReversalEvents' release-source/app/src/test/java/com/fush/erp/domain/AccountingP1IntegrityPolicyTest.kt
          grep -q 'assertTrue("SALES_COMMISSION" in safe)' release-source/app/src/test/java/com/fush/erp/domain/AccountingIntegrationContractTest.kt
          ! grep -R -n 'fallbackToDestructiveMigration' release-source/app/src/main

      - name: Compile Kotlin debug
        working-directory: release-source
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Run full unit tests
        working-directory: release-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        working-directory: release-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release identity and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=release-source/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='$EXPECTED_APP_ID'"
          echo "$BADGING" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 38' release-source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Prepare signing input and exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/apksigner/lib
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f -v 4 \
            release-source/app/build/outputs/apk/release/app-release-unsigned.apk \
            out/FushERP-Central-v103-ExpenseCrashHotfix-unsigned-aligned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" out/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" out/apksigner/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" out/aapt
          chmod +x out/apksigner/apksigner out/aapt
          (cd release-source && zip -qr ../out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-ExactSource.zip .)
          sha256sum out/FushERP-Central-v103-ExpenseCrashHotfix-unsigned-aligned.apk > out/FushERP-Central-v103-ExpenseCrashHotfix-unsigned-aligned.apk.sha256
          sha256sum out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-ExactSource.zip > out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-ExactSource.zip.sha256

      - name: Upload v103 signing artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Central-v103-ExpenseCrashHotfix-Candidate
          path: out/*
          if-no-files-found: error
          retention-days: 7
