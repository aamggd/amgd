name: ANDAK Customer v0.1.1 CI Build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ "ci/andak-customer-v0.1.1-build" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android command-line tools + SDK 36
        run: |
          set -euxo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf /tmp/cmdline-tools
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a /tmp/cmdline-tools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source
        run: unzip -q andak-ci-slim.zip

      - name: Build debug APK
        working-directory: andak_ci_slim
        run: gradle :apps:customer:assembleDebug --stacktrace --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp andak_ci_slim/apps/customer/build/outputs/apk/debug/customer-debug.apk artifact/ANDAK-customer-v0.1.1-DEBUG.apk
          sha256sum artifact/ANDAK-customer-v0.1.1-DEBUG.apk | tee artifact/ANDAK-customer-v0.1.1-DEBUG.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-customer-v0.1.1-DEBUG
          path: artifact/*
          if-no-files-found: error
