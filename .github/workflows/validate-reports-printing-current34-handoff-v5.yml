name: Validate Reports Printing Current Central34 Handoff V5

on:
  push:
    branches: [fush/reports-printing-central34-handoff]
    paths:
      - '.github/workflows/validate-reports-printing-current34-handoff-v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 14.5.53 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.53-Accounting-Printing-Build
          path: refs/p53
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31908733997

      - name: Download Phase 14.5.55 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.55-Report-Export-Hardening-Build
          path: refs/p55
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31913717196

      - name: Download Phase 14.5.57 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.57-Management-Print-Coverage-Build
          path: refs/p57
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31915147268

      - name: Download Phase 14.5.58 reference
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.58-Nonblocking-Export-Build
          path: refs/p58
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31915869146

      - name: Reuse exact V3 selective-handoff builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/validate-reports-printing-current34-handoff-v3.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if l.strip() == '- name: Build exact current-Central selective handoff')
          run_line = next(i for i in range(start+1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line+1, len(src)) if src[i].startswith('      - uses: gradle/actions/setup-gradle@v4'))
          lines = src[run_line+1:end]
          out=[]
          for line in lines:
              if line.startswith('          '): out.append(line[10:])
              elif not line.strip(): out.append('')
              else: raise SystemExit(f'unexpected V3 builder indentation: {line!r}')
          Path('/tmp/v3-build-handoff.sh').write_text('\n'.join(out)+'\n')
          PY
          grep -q '2cb8da801fc54aec8c1f0d6a83588f097ca85117' /tmp/v3-build-handoff.sh
          grep -q 'HANDOFF.patch' /tmp/v3-build-handoff.sh
          grep -q 'QA_PRINT_TEST.patch' /tmp/v3-build-handoff.sh
          bash -euo pipefail /tmp/v3-build-handoff.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd central_source
          gradle --no-daemon :app:testDebugUnitTest

      - name: Release build and Central safety
        shell: bash
        run: |
          set -euo pipefail
          cd central_source
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -q 'MIGRATION_32_33_SECURITY' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'MIGRATION_33_34_FIXED_ASSETS' app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! grep -Rqs 'fallbackToDestructiveMigration' app/src/main

      - name: Install API35 emulator image with absolute emulator path
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          EMU="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$EMU"
          echo "Resolved emulator: $EMU"
          ls -l "$EMU"
          command -v avdmanager
          echo no | avdmanager create avd -f -n fush_reports_print -k "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          "$EMU" -list-avds | grep -Fx fush_reports_print
          "$EMU" -version | head -5
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            sudo chmod 666 /dev/kvm || true
          fi
          "$EMU" -accel-check || true

      - name: Android PDF XLSX Print Preview RTL emulator smoke
        shell: bash
        timeout-minutes: 22
        run: |
          set -euo pipefail
          mkdir -p reports_printing_current34_handoff/diagnostics
          EMU="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$EMU"
          adb kill-server >/dev/null 2>&1 || true
          adb start-server >/dev/null

          ACCEL_ARGS=()
          if [ -r /dev/kvm ] && "$EMU" -accel-check 2>&1 | grep -qiE 'usable|installed'; then
            ACCEL_ARGS=(-accel on)
            echo 'Using KVM acceleration' | tee reports_printing_current34_handoff/diagnostics/ACCEL.txt
          else
            ACCEL_ARGS=(-accel off)
            echo 'Using software acceleration fallback' | tee reports_printing_current34_handoff/diagnostics/ACCEL.txt
          fi

          nohup "$EMU" -avd fush_reports_print \
            -no-window -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -wipe-data \
            -gpu swiftshader_indirect -memory 2048 -cores 2 -no-metrics "${ACCEL_ARGS[@]}" \
            > reports_printing_current34_handoff/diagnostics/EMULATOR.log 2>&1 &
          EMU_PID=$!
          echo "$EMU_PID" > reports_printing_current34_handoff/diagnostics/EMULATOR.pid

          device_ready=0
          for i in $(seq 1 150); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'Emulator process exited before ADB became ready' >&2
              cat reports_printing_current34_handoff/diagnostics/EMULATOR.log >&2 || true
              exit 1
            fi
            adb devices > reports_printing_current34_handoff/diagnostics/ADB_DEVICES.txt 2>&1 || true
            if adb get-state 2>/dev/null | grep -qx device; then device_ready=1; break; fi
            sleep 2
          done
          if [ "$device_ready" -ne 1 ]; then
            echo 'ADB device did not become ready within 300 seconds' >&2
            cat reports_printing_current34_handoff/diagnostics/EMULATOR.log >&2 || true
            exit 1
          fi

          boot_ready=0
          for i in $(seq 1 150); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "attempt=$i boot=$boot" >> reports_printing_current34_handoff/diagnostics/BOOT_WAIT.txt
            if [ "$boot" = "1" ]; then boot_ready=1; break; fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'Emulator exited during boot' >&2
              cat reports_printing_current34_handoff/diagnostics/EMULATOR.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          if [ "$boot_ready" -ne 1 ]; then
            echo 'Android boot did not complete within 300 seconds' >&2
            adb shell getprop > reports_printing_current34_handoff/diagnostics/GETPROP.txt 2>&1 || true
            cat reports_printing_current34_handoff/diagnostics/EMULATOR.log >&2 || true
            exit 1
          fi

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true
          adb shell getprop ro.build.version.sdk | tee reports_printing_current34_handoff/diagnostics/DEVICE_API.txt

          set +e
          cd central_source
          timeout 720 gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fush.erp.ui.export.ReportPrintFrameworkSmokeTest
          TEST_RC=$?
          cd ..
          set -e
          adb logcat -d > reports_printing_current34_handoff/diagnostics/LOGCAT.txt 2>&1 || true
          adb shell dumpsys print > reports_printing_current34_handoff/PRINT_DUMPSYS.txt 2>&1 || true
          adb shell dumpsys activity activities > reports_printing_current34_handoff/diagnostics/ACTIVITIES.txt 2>&1 || true
          if [ "$TEST_RC" -ne 0 ]; then
            echo "Instrumentation PDF/XLSX/Print Preview test failed rc=$TEST_RC" >&2
            tail -250 reports_printing_current34_handoff/diagnostics/LOGCAT.txt >&2 || true
            exit "$TEST_RC"
          fi
          grep -q 'FUSH-REPORT-PRINT-SMOKE' reports_printing_current34_handoff/PRINT_DUMPSYS.txt || {
            echo 'Print job label not found in dumpsys print' >&2
            cat reports_printing_current34_handoff/PRINT_DUMPSYS.txt >&2 || true
            exit 1
          }

      - name: Package verified exact handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports-handoff-output
          cp reports_printing_current34_handoff/HANDOFF.patch reports-handoff-output/
          cp reports_printing_current34_handoff/QA_PRINT_TEST.patch reports-handoff-output/
          cp reports_printing_current34_handoff/CHANGED_FILES.txt reports-handoff-output/
          cp reports_printing_current34_handoff/PRINT_DUMPSYS.txt reports-handoff-output/
          cp reports_printing_current34_handoff/README.md reports-handoff-output/HANDOFF.md
          cp -r reports_printing_current34_handoff/diagnostics reports-handoff-output/
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 central_source/app/build/outputs/apk/release/app-release-unsigned.apk reports-handoff-output/FushERP-Reports-Printing-Current34-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 reports-handoff-output/FushERP-Reports-Printing-Current34-aligned-unsigned.apk
          sha256sum reports-handoff-output/HANDOFF.patch reports-handoff-output/QA_PRINT_TEST.patch reports-handoff-output/FushERP-Reports-Printing-Current34-aligned-unsigned.apk > reports-handoff-output/SHA256SUMS.txt
          printf '%s\n' \
            'FUSH Reports/Printing — Exact Current Central Room34 Handoff' \
            'Base Central HEAD: 2cb8da801fc54aec8c1f0d6a83588f097ca85117' \
            'Base Central source tree: 7733c6570357eb813f7e05e5093752ea26788749' \
            'Application ID: com.fush.erp.recovery' \
            'Room schema: 34 unchanged' \
            'Migrations: unchanged' \
            'Historical Phase 14.5.58 full merge/source tree: NOT USED' \
            'Historical artifacts used only to derive selective functional deltas: YES' \
            'Functional HANDOFF.patch excludes QA-only dependencies/tests: YES' \
            'Full JVM unit tests: PASS' \
            'Release build: PASS' \
            'PDF generation on Android emulator: PASS' \
            'XLSX generation on Android emulator: PASS' \
            'RTL/Arabic mixed-content smoke: PASS' \
            'Android Print Preview / PrintManager smoke: PASS' \
            'Room/Migration safety: PASS' \
            'Zipalign: PASS' \
            'STOP: ready for handoff approval; no next phase started.' > reports-handoff-output/BUILD-REPORT.txt

      - name: Upload print diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Reports-Printing-Current34-Print-Diagnostics-V5
          path: reports_printing_current34_handoff/diagnostics/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload verified handoff
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Reports-Printing-Current34-Handoff-V5
          path: reports-handoff-output/
          if-no-files-found: error
          retention-days: 7
