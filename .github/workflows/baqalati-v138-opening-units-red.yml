name: Baqalati v1.0.38 Opening Units RED

on:
  push:
    branches: [ "baqalati-build-v1.0.38" ]

jobs:
  red-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download RED source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/downloads
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import time,glob,os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage')
          opts.add_experimental_option('prefs', {'download.default_directory':'/tmp/downloads','download.prompt_for_download':False})
          d=webdriver.Chrome(options=opts)
          d.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':'/tmp/downloads'})
          d.get('https://firestorage.ai/ja/f/WHBRaGDlhJve'); time.sleep(8)
          buttons=[b for b in d.find_elements(By.TAG_NAME,'button') if (b.text or '').strip()=='ダウンロード']
          if not buttons: raise RuntimeError('download button not found')
          d.execute_script('arguments[0].click()',buttons[0])
          files=[]
          for _ in range(90):
              time.sleep(1); files=glob.glob('/tmp/downloads/*.zip')
              if files and not glob.glob('/tmp/downloads/*.crdownload'): break
          d.quit()
          if not files: raise RuntimeError('source archive was not downloaded')
          os.rename(files[0],'/tmp/source.zip')
          PY
          echo 'a0aa5cc34ffca7a275b49558b14b4af38dac2904876ffdfbde79c59968cc7ae2  /tmp/source.zip' | sha256sum -c -
          mkdir -p appsrc && unzip -q /tmp/source.zip -d appsrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run new opening-unit tests and expect RED
        working-directory: appsrc
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests com.fush.erp.domain.OpeningStockUnitMathTest --tests com.fush.erp.ui.BaqalatiV138UnitRecognitionContractTest
