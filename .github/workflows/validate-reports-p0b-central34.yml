name: Validate Reports P0-B on Central 14.5.54

on:
  push:
    branches: [fush/reports-printing-rebase-central]
    paths:
      - '.github/workflows/validate-reports-p0b-central34.yml'
      - 'reports_plan_p0b_central34/**'
      - 'reports_plan_p0a_central34/payload/p0a.patch'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download accepted Central 14.5.54 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: central-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750

      - name: Restore Central plus P0-A and apply P0-B only
        shell: bash
        run: |
          set -euo pipefail
          echo 'ce47f8b14f51d26fd8c7a56258aaced60719e90756eb26ccde1b707ced0efb5a  reports_plan_p0a_central34/payload/p0a.patch' | sha256sum -c -
          echo 'def1512efc271dfdb961fcbed9cf0c6554d607db0f50236f57910c52ed7060e3  reports_plan_p0b_central34/payload/part00.txt' | sha256sum -c -
          echo '2cc4d43cf6c102f2655bbe5e3ef139fe3a5165a1e9b26fce4de95782082a9b75  reports_plan_p0b_central34/payload/part01.txt' | sha256sum -c -
          echo 'ab23f3f65fa624c931bae842e053736d27bede13e3f83e7123e38a28e3525b12  reports_plan_p0b_central34/payload/part02.txt' | sha256sum -c -
          cat reports_plan_p0b_central34/payload/part00.txt reports_plan_p0b_central34/payload/part01.txt reports_plan_p0b_central34/payload/part02.txt > reports_plan_p0b_central34/p0b.b64
          echo '589732feb9511e99fea127b89ed42baf8920ff5398d91526c6e1ddb748ab138b  reports_plan_p0b_central34/p0b.b64' | sha256sum -c -
          base64 -d reports_plan_p0b_central34/p0b.b64 | gzip -dc > reports_plan_p0b_central34/p0b.patch
          echo '6c691ee930cba2276d2a0c342c0ce3198843b4778062e36a5515cf9df47b8d8f  reports_plan_p0b_central34/p0b.patch' | sha256sum -c -

          unzip -q central-build/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          ROOT="$(find . -maxdepth 1 -type d -name 'FushERP_Mobile_*' | head -1)"
          test -n "$ROOT"
          cd "$ROOT"
          rm -rf .git app/build .gradle build .kotlin
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm central-14.5.54-schema34

          git apply --check ../reports_plan_p0a_central34/payload/p0a.patch
          git apply ../reports_plan_p0a_central34/payload/p0a.patch
          git add -A
          git commit -qm reports-p0a-validated

          git apply --check ../reports_plan_p0b_central34/p0b.patch
          git apply ../reports_plan_p0b_central34/p0b.patch
          git add -A
          git diff --cached --check HEAD

          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -q 'MIGRATION_32_33_SECURITY' app/src/main/java/com/fush/erp/data/AppContainer.kt
          grep -q 'MIGRATION_33_34_FIXED_ASSETS' app/src/main/java/com/fush/erp/data/AppContainer.kt
          ! grep -Rqs 'fallbackToDestructiveMigration' app/src/main

          test -f app/src/main/java/com/fush/erp/ui/export/ReportExportLayout.kt
          test -f app/src/test/java/com/fush/erp/ui/export/ReportExportLayoutTest.kt
          test -f app/src/test/java/com/fush/erp/ui/export/ReportSpreadsheetExportTest.kt
          grep -q 'ReportExportLayout.requiresLandscape' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          grep -q 'buildXlsxBytesForTest' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt

          git diff --cached --name-only HEAD | grep -Fx 'app/src/main/java/com/fush/erp/ui/export/ReportExportLayout.kt'
          git diff --cached --name-only HEAD | grep -Fx 'app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt'
          git diff --cached --name-only HEAD | grep -Fx 'app/src/test/java/com/fush/erp/ui/export/ReportExportLayoutTest.kt'
          git diff --cached --name-only HEAD | grep -Fx 'app/src/test/java/com/fush/erp/ui/export/ReportSpreadsheetExportTest.kt'
          test "$(git diff --cached --name-only HEAD | wc -l)" -eq 4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find . -maxdepth 1 -type d -name 'FushERP_Mobile_*' | head -1)"
          cd "$ROOT"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find . -maxdepth 1 -type d -name 'FushERP_Mobile_*' | head -1)"
          cd "$ROOT"
          gradle --no-daemon :app:assembleRelease

      - name: Verify central safety after build
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find . -maxdepth 1 -type d -name 'FushERP_Mobile_*' | head -1)"
          test -f "$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          grep -q 'applicationId = "com.fush.erp.recovery"' "$ROOT/app/build.gradle.kts"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
          ! grep -Rqs 'fallbackToDestructiveMigration' "$ROOT/app/src/main"

      - name: Zipalign and package P0-B validation artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find . -maxdepth 1 -type d -name 'FushERP_Mobile_*' | head -1)"
          mkdir -p reports-p0b-output
          UNSIGNED="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="reports-p0b-output/FushERP-Reports-P0B-Central34-aligned-unsigned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp reports_plan_p0b_central34/p0b.patch reports-p0b-output/reports-p0b-central34.patch
          cp reports_plan_p0b_central34/README.md reports-p0b-output/HANDOFF.md
          sha256sum "$ALIGNED" reports-p0b-output/reports-p0b-central34.patch > reports-p0b-output/SHA256SUMS.txt
          printf '%s\n' \
            'FUSH Reports P0-B — Export hardening re-established on Central 14.5.54 + P0-A' \
            'Central source tree: 1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff' \
            'Reports P0-A patch: ce47f8b14f51d26fd8c7a56258aaced60719e90756eb26ccde1b707ced0efb5a' \
            'Reports P0-B patch: 6c691ee930cba2276d2a0c342c0ce3198843b4778062e36a5515cf9df47b8d8f' \
            'Central Room schema retained: 34' \
            'Application ID retained: com.fush.erp.recovery' \
            'Changed P0-B application/test files: 4' \
            'Room/Migration change: NONE' \
            'Accounting posting change: NONE' \
            'Inventory transaction change: NONE' \
            'Production transaction change: NONE' \
            'Unit tests: PASS' \
            'Room/Compose compilation: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > reports-p0b-output/BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Reports-P0B-Central34-ExportHardening
          path: reports-p0b-output/
          if-no-files-found: error
          retention-days: 7
