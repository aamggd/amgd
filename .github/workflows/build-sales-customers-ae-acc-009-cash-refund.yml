name: Build Sales Customers AE-ACC-009 CASH_REFUND Settlement

on:
  push:
    branches: [fush/sales-customers]
    paths:
      - 'sales_customers_ae_acc_009_cash_refund/**'
      - '.github/workflows/build-sales-customers-ae-acc-009-cash-refund.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CENTRAL_SHA: 'ddae764a236cb1916a46e194ccb2d3c24ca6b919'
  CENTRAL_TREE: '30b028b75d6463c07afd0419429f53c7937fabb1'

jobs:
  validate-ae-acc-009-cash-refund:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout owner branch
        uses: actions/checkout@v4
        with:
          ref: fush/sales-customers
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Restore exact verified Central and apply official AE-ACC-009
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CENTRAL_SHA}^{commit}"
          test "$(git rev-parse ${CENTRAL_SHA})" = "${CENTRAL_SHA}"
          rm -rf work-source central-ae-export output
          mkdir central-ae-export output
          git archive "${CENTRAL_SHA}" central_source | tar -x -C central-ae-export
          mv central-ae-export/central_source work-source
          cd work-source
          git init -q
          git config user.name sales-customers-ae-acc-009-cash-refund-ci
          git config user.email sales-customers-ae-acc-009-cash-refund-ci@users.noreply.github.com
          git add -A
          BASE_TREE=$(git write-tree)
          echo "BASE_TREE=${BASE_TREE}"
          test "${BASE_TREE}" = "${CENTRAL_TREE}"
          git commit -qm "Exact Central before official AE-ACC-009"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          python3 "$GITHUB_WORKSPACE/sales_customers_ae_acc_009_cash_refund/apply_fix.py"
          git diff --check

      - name: AE-ACC-009 dedicated CASH_REFUND regression
        shell: bash
        run: |
          set -euo pipefail
          cd work-source
          python3 - <<'PY'
          from pathlib import Path

          sales = Path('app/src/main/java/com/fush/erp/domain/SalesService.kt').read_text(encoding='utf-8')
          dao = Path('app/src/main/java/com/fush/erp/data/dao/SalesDaos.kt').read_text(encoding='utf-8')
          policy = Path('app/src/main/java/com/fush/erp/domain/CashRefundSettlementPolicy.kt').read_text(encoding='utf-8')

          post_return = sales.split('    suspend fun postReturn(', 1)[1].split('    suspend fun invoiceOutstandingBase(', 1)[0]
          guard = post_return.index('CashRefundSettlementPolicy.requireCashRefund(')
          received = post_return.index('db.salesDao().receivedBaseForInvoice(invoice.id)')
          prior_refunds = post_return.index('db.salesDao().cashRefundedBaseForInvoice(invoice.id)')
          treasury = post_return.index('resolveTreasury(treasuryAccountId, invoice.currencyCode)')
          first_mutation = min(
              post_return.index('numbering.nextDocumentNo("SRET", returnDate)'),
              post_return.index('db.salesDao().insertReturn('),
              post_return.index('db.salesDao().insertReturnLine('),
              post_return.index('db.salesDao().insertReturnAllocation('),
              post_return.index('db.stockDao().insertMovement(')
          )
          assert guard < treasury < first_mutation, 'cash refund eligibility must precede treasury resolution and all return mutations'
          assert received < first_mutation and prior_refunds < first_mutation
          assert 'settlementType == "CASH_REFUND"' in post_return

          reverse = sales.split('    suspend fun reverseReceipt(', 1)[1].split('    suspend fun postReturn(', 1)[0]
          reversal_guard = reverse.index('CashRefundSettlementPolicy.requireReceiptReversal(')
          reversal_mutation = min(
              reverse.index('numbering.nextDocumentNo("RCRV", reversalDate)'),
              reverse.index('db.salesDao().insertReceipt(')
          )
          assert reversal_guard < reversal_mutation, 'receipt reversal consistency guard must precede reversal writes'
          assert 'invoiceAllocations.sumOf { it.amountBase }' in reverse
          assert 'db.salesDao().cashRefundedBaseForInvoice(invoiceId)' in reverse

          assert "settlementType = 'CASH_REFUND'" in dao
          assert 'suspend fun cashRefundedBaseForInvoice(invoiceId: Long): Double' in dao
          assert "SELECT COALESCE(SUM(amountBase), 0) FROM customer_receipt_allocations WHERE invoiceId = :invoiceId" in dao

          journal = sales.split('    private suspend fun postSalesReturnJournal(', 1)[1].split('    private suspend fun postCommissionJournal(', 1)[0]
          assert 'settlementType == "CASH_REFUND"' in journal
          assert 'refundTreasuryGlAccountId' in journal
          assert 'db.accountDao().byCode("1300")' in journal
          assert 'DraftJournalLine(salesReturns.id, salesBase, 0.0)' in journal
          assert 'DraftJournalLine(settlement.id, 0.0, salesBase)' in journal

          assert 'requestedRefundBase <= refundable + EPS' in policy
          assert 'cashRefundedBase <= netCollectedAfter + EPS' in policy

          print('AE-ACC-009 regression PASS: collected-cash cap + duplicate consumption + reversal guard + existing AR/treasury journal mapping')
          PY

      - name: Exact scope and patch
        shell: bash
        run: |
          set -euo pipefail
          cd work-source
          git add -A
          mapfile -t FILES < <(git diff --cached --name-only | sort)
          EXPECTED=(
            "app/src/main/java/com/fush/erp/data/dao/SalesDaos.kt"
            "app/src/main/java/com/fush/erp/domain/CashRefundSettlementPolicy.kt"
            "app/src/main/java/com/fush/erp/domain/SalesService.kt"
            "app/src/test/java/com/fush/erp/domain/CashRefundSettlementPolicyTest.kt"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#FILES[@]}" -eq "${#EXPECTED_SORTED[@]}"
          for i in "${!FILES[@]}"; do test "${FILES[$i]}" = "${EXPECTED_SORTED[$i]}"; done
          ! git diff --cached --name-only | grep -Eq 'app/src/main/java/com/fush/erp/data/(FushDatabase|Migrations|SecurityMigrations|entity)|app/schemas/'
          ! git diff --cached | grep -q 'fallbackToDestructiveMigration'
          git diff --cached --binary > "$GITHUB_WORKSPACE/output/ae_acc_009_cash_refund_settlement.patch"
          test -s "$GITHUB_WORKSPACE/output/ae_acc_009_cash_refund_settlement.patch"
          git apply --check --reverse "$GITHUB_WORKSPACE/output/ae_acc_009_cash_refund_settlement.patch"
          echo -n 'EXACT_PATCH_SHA256='
          sha256sum "$GITHUB_WORKSPACE/output/ae_acc_009_cash_refund_settlement.patch" | awk '{print $1}'

      - name: AE-ACC-009 targeted settlement reconciliation tests
        working-directory: work-source
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.fush.erp.domain.CashRefundSettlementPolicyTest \
            --tests com.fush.erp.domain.CustomerArMathTest \
            --tests com.fush.erp.domain.SettlementAllocationMathTest \
            --tests com.fush.erp.domain.CustomerMovementIdentityTest \
            --tests com.fush.erp.domain.SalesMathTest \
            --tests com.fush.erp.domain.OperationalReversalMathTest \
            --tests com.fush.erp.domain.AccountingReconciliationMathTest \
            --tests com.fush.erp.domain.TreasuryReconciliationTest

      - name: Full unit regression suite
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Room35 AppID no-destructive release gates
        shell: bash
        run: |
          set -euo pipefail
          cd work-source
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 35' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -R -Eq 'Migration\(34, *35\)|MIGRATION_34_35' app/src/main/java
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          ! git diff --cached --name-only | grep -Eq 'app/src/main/java/com/fush/erp/data/(FushDatabase|Migrations|SecurityMigrations|entity)|app/schemas/'
          git diff --exit-code -- app/src/main/java/com/fush/erp/data/FushDatabase.kt app/src/main/java/com/fush/erp/data/Migrations.kt app/src/main/java/com/fush/erp/data/SecurityMigrations.kt app/schemas
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Package AE-ACC-009 handoff artifact
        shell: bash
        run: |
          set -euo pipefail
          cp work-source/app/build/outputs/apk/release/app-release-unsigned.apk output/FushERP-Sales-Customers-AE-ACC-009-Cash-Refund-Settlement-unsigned.apk
          cp sales_customers_ae_acc_009_cash_refund/README.md output/README.md
          sha256sum output/ae_acc_009_cash_refund_settlement.patch output/FushERP-Sales-Customers-AE-ACC-009-Cash-Refund-Settlement-unsigned.apk > output/SHA256SUMS.txt

      - name: Upload AE-ACC-009 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Sales-Customers-AE-ACC-009-Cash-Refund-Settlement
          path: output/*
          if-no-files-found: error
