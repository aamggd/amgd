name: TEMP v150 Lint Dependency

on:
  push:
    branches:
      - 'fush/tmp-v140-build-20260824'
    paths:
      - '.github/workflows/tmp-v150-lint-dep.yml'
  workflow_dispatch:

jobs:
  fetch-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Google Maven JAR
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dl.google.com/dl/android/maven2/androidx/compose/material/material-icons-core-desktop/1.7.8/material-icons-core-desktop-1.7.8.jar'
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/material-icons-core-desktop-1.7.8.jar"
          echo 'b5729220e242132b22b0c0317a304ff167a05cc685c3e9e6483d5dfca3495f56  '"$RUNNER_TEMP/material-icons-core-desktop-1.7.8.jar" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/material-icons-core-desktop-1.7.8.jar" > "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: v150-material-icons-core-desktop-1.7.8
          path: |
            ${{ runner.temp }}/material-icons-core-desktop-1.7.8.jar
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
