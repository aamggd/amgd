name: V140 Dependency Cache Export

on:
  push:
    branches:
      - agent/v123-toolchain-bootstrap-20260822
  pull_request:
  workflow_dispatch:

jobs:
  seed-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Create dependency-equivalent minimal Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/v140seed /tmp/v140-gradle-home
          mkdir -p /tmp/v140seed/app/src/main/java/com/example/seed /tmp/v140seed/app/src/main
          cat > /tmp/v140seed/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "V140Seed"
          include(":app")
          EOF
          cat > /tmp/v140seed/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
              id("com.google.devtools.ksp") version "2.3.9" apply false
              id("androidx.room") version "2.8.4" apply false
          }
          EOF
          cat > /tmp/v140seed/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
              id("androidx.room")
          }
          android {
              namespace = "com.example.seed"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.example.seed"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              ksp("androidx.room:room-compiler:2.8.4")
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              testImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > /tmp/v140seed/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" /></manifest>
          EOF
          mkdir -p /tmp/v140seed/app/src/main/res/values
          cat > /tmp/v140seed/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          GRADLE_USER_HOME=/tmp/v140-gradle-home gradle -p /tmp/v140seed --no-daemon \
            :app:compileDebugJavaWithJavac \
            :app:compileDebugAndroidTestJavaWithJavac \
            :app:compileDebugUnitTestJavaWithJavac
      - name: Package cache
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf /tmp/v140-gradle-modules.tgz -C /tmp/v140-gradle-home/caches modules-2
          sha256sum /tmp/v140-gradle-modules.tgz > /tmp/v140-gradle-modules.tgz.sha256
          rm -rf /tmp/v140-cache-parts && mkdir -p /tmp/v140-cache-parts
          split -b 180M -d -a 2 /tmp/v140-gradle-modules.tgz /tmp/v140-cache-parts/v140-gradle-modules.part-
          sha256sum /tmp/v140-cache-parts/v140-gradle-modules.part-* > /tmp/v140-cache-parts/parts.sha256
          cp /tmp/v140-gradle-modules.tgz.sha256 /tmp/v140-cache-parts/
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v140-GradleCache-00
          path: /tmp/v140-cache-parts/v140-gradle-modules.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v140-GradleCache-01
          path: /tmp/v140-cache-parts/v140-gradle-modules.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v140-GradleCache-02
          path: /tmp/v140-cache-parts/v140-gradle-modules.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v140-GradleCache-03
          path: /tmp/v140-cache-parts/v140-gradle-modules.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v140-GradleCache-Metadata
          path: |
            /tmp/v140-cache-parts/parts.sha256
            /tmp/v140-cache-parts/v140-gradle-modules.tgz.sha256
          retention-days: 1
