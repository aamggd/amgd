name: Build Fush ERP Phase 14.5.44 Reports Correctness

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-44-reports-correctness.yml'
      - 'phase14_5_44_reports_correctness/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.43 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.43-Integrated-Professional-UI-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31861273525

      - name: Restore Phase 14.5.43 and apply report correctness patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.43-Integrated-Professional-UI-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          git apply --check ../phase14_5_44_reports_correctness/patches/01_reports_receivables_correctness.patch
          git apply ../phase14_5_44_reports_correctness/patches/01_reports_receivables_correctness.patch
          git add -A
          git diff --cached --check
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 83' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.44-reports-correctness"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          cp ../phase14_5_44_reports_correctness/verify_report_receivables.py .
          python3 verify_report_receivables.py
          rm verify_report_receivables.py
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room query compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'versionCode = 83' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.44-reports-correctness"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-44-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-44-output/FushERP-Phase14.5.44-Reports-Correctness-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-44-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-44-output/lib/apksigner.jar
          chmod +x phase14-5-44-output/apksigner
          zip -qr phase14-5-44-output/FushERP-Mobile-Phase14.5.44-Reports-Correctness-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.44 — Reports Correctness' \
            'Base verified source: Phase 14.5.43 Integrated Professional UI' \
            'Branch: fush/reports-printing' \
            'Customer report receivables now include linked posted party vouchers.' \
            'Executive receivables and overdue use the corrected customer balance logic.' \
            'Package: com.fush.erp.recovery' \
            'Version code: 83' \
            'Version name: 0.15.4.44-reports-correctness' \
            'Room schema: 27 unchanged' \
            'SQL regression: PASS' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-44-output/FushERP-Phase14.5.44-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.44-Reports-Correctness-Build
          path: phase14-5-44-output/
          if-no-files-found: error
          retention-days: 7
