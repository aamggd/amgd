name: Build Fush ERP Phase 14.5.5 Inventory Integrity

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-5-inventory.yml'
      - 'phase14_5_5_inventory/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.4 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.4-Supplier-AP-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31646241330
      - name: Restore Phase 14.5.4 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.4-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 43' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.4-phase14.5-supplier-ap' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 18' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.5 inventory patch
        shell: bash
        run: |
          set -e
          python phase14_5_5_inventory/apply_patch.py
          grep -q 'versionCode = 44' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.5-phase14.5-inventory-integrity' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 19' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_18_19' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'inventoryOperationsDao' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'postTransfer' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/InventoryOperationsService.kt
          grep -q 'postGeneralMovement' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/InventoryOperationsService.kt
          test -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/entity/InventoryOperationsEntities.kt
          test -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/dao/InventoryOperationsDao.kt
          test -f FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/domain/InventoryOperationsMathTest.kt
          git -C FushERP_Mobile_Phase5 diff --check
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-5-output
          mkdir -p phase14-5-5-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-5-output/FushERP-Phase14.5.5-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-5-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-5-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-5-output/apksigner/apksigner
          zip -qr phase14-5-5-output/FushERP-Mobile-Phase14.5.5-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-5-output/FushERP-Phase14.5.5-unsigned.apk > phase14-5-5-output/FushERP-Phase14.5.5-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.5 — Inventory Integrity and Warehouse Operations' \
            'Version: 0.15.4.5-phase14.5-inventory-integrity (versionCode 44)' \
            'Room schema: 19 (migration 18 -> 19)' \
            '' \
            'Inventory fixes:' \
            '- Warehouse transfers with exact lot/expiry/historical unit-cost preservation and audit trail.' \
            '- General stock receipt, issue, adjustment-up and adjustment-down operations with balanced accounting offsets.' \
            '- Exact-lot negative-stock prevention for purchase returns, transfers and outgoing general movements.' \
            '- Inactive item and inactive warehouse checks on inventory-sensitive postings.' \
            '- Sale and production issue/reservation integrity uses sellable lots and blocks expired/quarantined/blocked lots.' \
            '- Opening stock supports required lot/expiry tracking.' \
            '- Per-warehouse total and usable stock balance view.' \
            '- Explicit historical stock balance and historical inventory value queries.' \
            '- Unit tests for transfer cost, insufficient stock, signed movement direction and journal balance.' \
            > phase14-5-5-output/FushERP-Phase14.5.5-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.5-Inventory-Integrity-Build
          path: phase14-5-5-output/
          if-no-files-found: error
          retention-days: 7
