name: Build FUSH ERP Mobile v219

on:
  push:
    branches:
      - fush-customer-v219-company-bootstrap-auth-hotfix-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact v219 payload
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < v219_payload/part00.b64 | base64 -d > /tmp/v219_payload.zip
          unzip -t /tmp/v219_payload.zip
          unzip -qo /tmp/v219_payload.zip -d .
          grep 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep 'versionCode = 219' app/build.gradle.kts
          grep 'versionName = "0.15.8.170-company-bootstrap-auth-hotfix"' app/build.gradle.kts
          grep 'const val FUSH_DB_SCHEMA_VERSION = 55' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R 'fallbackToDestructiveMigration' app/src/main/java
          python3 tools/verify_v219_company_bootstrap_hotfix.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Build release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p /tmp/out
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} /tmp/out/ \;
          sha256sum /tmp/out/* > /tmp/out/SHA256SUMS.txt

      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: fush-v219-unsigned
          path: /tmp/out/*
          if-no-files-found: error
