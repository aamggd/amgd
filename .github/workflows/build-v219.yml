name: Build FUSH ERP Mobile v219

on:
  push:
    branches:
      - fush-customer-v219-company-bootstrap-auth-hotfix-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect v219 share page
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/GLpkVejOy5iG' -o /tmp/share.html
          echo '=== SHARE PAGE LINKS ==='
          grep -Eo 'https?://[^"<> ]+|/[^"<> ]*(download|api|file)[^"<> ]*' /tmp/share.html | head -100 || true
          echo '=== SHARE PAGE HTML ==='
          cat /tmp/share.html
