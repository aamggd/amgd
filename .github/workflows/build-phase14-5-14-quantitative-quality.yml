name: Build Fush ERP Phase 14.5.14 Quantitative Quality

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-14-quantitative-quality.yml'
      - 'phase14_5_14_quantitative_quality/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.13 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.13-Labor-Cost-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31666511934
      - name: Restore Phase 14.5.13 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.13-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 52' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.13-phase14.5-labor-cost' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.14 quantitative quality
        shell: bash
        run: |
          set -e
          python phase14_5_14_quantitative_quality/apply_patch.py
          grep -q 'versionCode = 53' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.14-phase14.5-quantitative-quality' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 22' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'QualitySpecificationEntity::class' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_21_22' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'recordQuantitativeQualityCheck' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'qualityDecision' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/ProductionMath.kt
          grep -q 'الحد الأدنى لحجم العينة' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/ProductionScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 22
        shell: bash
        run: |
          set -e
          grep -q 'version = 22' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/22.json
          grep -q 'quality_specifications' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/22.json
          grep -q 'specificationId' FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/22.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-14-output
          mkdir -p phase14-5-14-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-14-output/FushERP-Phase14.5.14-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-14-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-14-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-14-output/apksigner/apksigner
          zip -qr phase14-5-14-output/FushERP-Mobile-Phase14.5.14-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-14-output/FushERP-Phase14.5.14-unsigned.apk > phase14-5-14-output/FushERP-Phase14.5.14-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.14 — Quantitative Quality Specifications' \
            'Version: 0.15.4.14-phase14.5-quantitative-quality (versionCode 53)' \
            'Room schema: 22 (migration 21 -> 22)' \
            '' \
            'Added:' \
            '- Reusable product quality specifications with units and lower/upper acceptance limits.' \
            '- Optional target values and mandatory minimum sample size.' \
            '- Actual numeric measurements stored with a snapshot of the limits used.' \
            '- Automatic PASS/FAIL based on inclusive limits.' \
            '- Required active FINAL specifications must have a latest PASS before batch acceptance.' \
            '- Failed historical measurements remain visible; open CAPA still blocks acceptance.' \
            '- Legacy descriptive checks remain available for non-quantitative observations.' \
            '- Production detail/export includes reading, unit, limits, target and sample size.' \
            '- No product-specific numeric limits are guessed or seeded.' \
            > phase14-5-14-output/FushERP-Phase14.5.14-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.14-Quantitative-Quality-Build
          path: phase14-5-14-output/
          if-no-files-found: error
          retention-days: 7
