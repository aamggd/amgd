name: Central Expense Hotfix Build v103

on:
  push:
    branches: [fush/central-unified-test-build-v102]
    paths:
      - '.github/workflows/central-unified-test-v102.yml'

permissions:
  contents: write

env:
  TEST_VERSION_CODE: '103'
  TEST_VERSION_NAME: '0.15.4.55-central-expense-entry-hotfix1'
  EXPECTED_APP_ID: 'com.fush.erp.recovery'
  EXPECTED_SCHEMA: '35'
  EXPECTED_EXPENSE_SHA256: '5a9a0e0b41e86812073e824eb8f564e8d29e0dcbd44d321ba8c45a2561efe8b8'
  HOTFIX_BRANCH: 'agent/expense-crash-hotfix-v103-build'

jobs:
  build-central-expense-hotfix-v103:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore Central source and apply exact Expenses hotfix
        shell: bash
        run: |
          set -euo pipefail
          cp -a central_source release-source
          git fetch origin "${HOTFIX_BRANCH}:refs/remotes/origin/${HOTFIX_BRANCH}"
          for n in 00 01 02 03 04 05; do
            git show "origin/${HOTFIX_BRANCH}:expense_v103_hotfix/ExpenseScreens.part${n}.b64"
          done | tr -d '\r\n' > /tmp/ExpenseScreens.b64
          base64 -d /tmp/ExpenseScreens.b64 > release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt
          ACTUAL_EXPENSE_SHA256="$(sha256sum release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt | awk '{print $1}')"
          echo "ExpenseScreens SHA-256: ${ACTUAL_EXPENSE_SHA256}"
          test "$ACTUAL_EXPENSE_SHA256" = "$EXPECTED_EXPENSE_SHA256"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('release-source/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 103', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.15.4.55-central-expense-entry-hotfix1"', s, count=1)
          assert n1 == 1 and n2 == 1, (n1, n2)
          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq 'applicationId = "com.fush.erp.recovery"' release-source/app/build.gradle.kts
          grep -Fq 'versionCode = 103' release-source/app/build.gradle.kts
          grep -Fq 'versionName = "0.15.4.55-central-expense-entry-hotfix1"' release-source/app/build.gradle.kts
          grep -Fq 'private fun <T> Flow<T>.expenseScreenSafeFlow(' release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt
          grep -Fq 'ExpenseAddDialogHost(' release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt
          grep -Fq 'rememberLauncherForActivityResult' release-source/app/src/main/java/com/fush/erp/ui/screens/ExpenseScreens.kt

      - name: Verify Room 35 and non-destructive migrations
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          DB='app/src/main/java/com/fush/erp/data/FushDatabase.kt'
          MIG='app/src/main/java/com/fush/erp/data/Migrations.kt'
          SEC='app/src/main/java/com/fush/erp/data/SecurityMigrations.kt'
          CON='app/src/main/java/com/fush/erp/data/AppContainer.kt'
          grep -Fq 'FUSH_DB_SCHEMA_VERSION = 35' "$DB"
          test -f app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -Fq '"version": 35' app/schemas/com.fush.erp.data.FushDatabase/35.json
          grep -Fq 'MIGRATION_34_35_ACCOUNTING_P1' "$MIG"
          grep -Fq 'MIGRATION_34_35_ACCOUNTING_P1' "$CON"
          grep -Fq 'MIGRATION_32_33_SECURITY' "$SEC"
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          ! grep -R -nE 'deleteDatabase\(|clearAllTables\(' app/src/main/java/com/fush/erp

      - name: Full Unit Tests
        working-directory: release-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: assembleRelease
        working-directory: release-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify package and prepare outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK='release-source/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          BADGING="$(${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging "$APK" | head -n 1)"
          echo "$BADGING" | tee out/aapt-badging.txt
          echo "$BADGING" | grep -Fq "name='${EXPECTED_APP_ID}'"
          echo "$BADGING" | grep -Fq "versionCode='${TEST_VERSION_CODE}'"
          echo "$BADGING" | grep -Fq "versionName='${TEST_VERSION_NAME}'"
          OUTAPK='out/FushERP-Central-v103-ExpenseCrashHotfix-aligned-unsigned.apk'
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -P 16 -f -v 4 "$APK" "$OUTAPK" >/tmp/zipalign-create.log
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -c -P 16 -v 4 "$OUTAPK" | tee out/zipalign-verification.txt
          sha256sum "$OUTAPK" | tee "${OUTAPK}.sha256"
          cp ${ANDROID_HOME}/build-tools/36.0.0/lib/apksigner.jar out/apksigner.jar

          TOP='FushERP_Mobile_Central_v103_ExpenseCrashHotfix'
          mkdir "$TOP"
          rsync -a --exclude '.git/' --exclude '.gradle/' --exclude '**/build/' release-source/ "$TOP/"
          zip -qr out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-Source.zip "$TOP"
          sha256sum out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-Source.zip | tee out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-Source.zip.sha256
          cat > out/BUILD-VERIFICATION.txt <<EOF
          FUSH ERP Mobile — Expense Crash Hotfix v103
          Application ID: ${EXPECTED_APP_ID}
          versionCode: ${TEST_VERSION_CODE}
          versionName: ${TEST_VERSION_NAME}
          Room schema: ${EXPECTED_SCHEMA}
          ExpenseScreens SHA-256: ${EXPECTED_EXPENSE_SHA256}
          Full Unit Tests: PASS
          assembleRelease: PASS
          zipalign: PASS
          Signing: pending local signing with permanent FUSH Recovery P12.
          EOF

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Central-v103-ExpenseCrashHotfix
          path: out/*
          if-no-files-found: error

      - name: Publish candidate to build branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases-hotfix-v103
          mkdir releases-hotfix-v103
          cp out/FushERP-Central-v103-ExpenseCrashHotfix-aligned-unsigned.apk releases-hotfix-v103/
          cp out/FushERP-Central-v103-ExpenseCrashHotfix-aligned-unsigned.apk.sha256 releases-hotfix-v103/
          cp out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-Source.zip releases-hotfix-v103/
          cp out/FushERP-Mobile-Central-v103-ExpenseCrashHotfix-Source.zip.sha256 releases-hotfix-v103/
          cp out/BUILD-VERIFICATION.txt releases-hotfix-v103/
          cp out/aapt-badging.txt releases-hotfix-v103/
          cp out/apksigner.jar releases-hotfix-v103/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases-hotfix-v103
          git commit -m "Publish v103 expense hotfix candidate [skip ci]"
          git push
