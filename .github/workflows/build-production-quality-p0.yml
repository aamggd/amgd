name: Build Production Quality P0

on:
  push:
    branches: [fush/production-quality]
    paths:
      - '.github/workflows/build-production-quality-p0.yml'
      - 'production_quality_p0/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Download accepted Central Baseline 14.5.54
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: baseline-artifact
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750

      - name: Restore source and verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          ZIP=baseline-artifact/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          test -s "$ZIP"
          mkdir -p source-root final-repo
          unzip -q "$ZIP" -d source-root
          BASE=$(find source-root -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$BASE"
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' "$BASE/" final-repo/
          cd final-repo
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          git init -q
          git config user.email production-quality@fush.local
          git config user.name 'FUSH Production Quality'
          git add -A
          git commit -qm baseline-14.5.54
          TREE=$(git write-tree)
          echo "BASELINE_TREE=$TREE"
          test "$TREE" = '1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff'

      - name: Apply P0 recipe-version freeze patch
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          git apply --check ../production_quality_p0/production-quality-p0.patch
          git apply ../production_quality_p0/production-quality-p0.patch
          git diff --check
          grep -q 'updateRecipeStatus' app/src/main/java/com/fush/erp/data/dao/ProductionDaos.kt
          ! grep -q 'suspend fun updateRecipe(row: RecipeEntity)' app/src/main/java/com/fush/erp/data/dao/ProductionDaos.kt
          grep -q 'val frozenMaterials = components.map' app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'ProductionMath.validateBomIntegrity' app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts

      - name: Unit tests
        working-directory: final-repo
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: final-repo
        run: gradle --no-daemon :app:assembleRelease

      - name: Package branch-only test artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd final-repo
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          mkdir -p ../output
          cp "$APK" ../output/FushERP-ProductionQuality-P0-branch-only-unsigned.apk
          zip -qr ../output/FushERP-ProductionQuality-P0-Source.zip . -x '.git/*' '.gradle/*' '.kotlin/*' 'app/build/*' 'build/*'
          sha256sum ../output/* > ../output/SHA256SUMS.txt

      - name: Upload branch-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-ProductionQuality-P0-BranchOnly
          path: output/*
          if-no-files-found: error
