name: Build Fush ERP Phase 14.5.47 Aging Reports

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-47-aging-reports.yml'
      - 'phase14_5_47_aging_reports/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.46 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.46-Professional-Printing-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31865897444

      - name: Restore Phase 14.5.46 and apply Phase 14.5.47 aging patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.46-Professional-Printing-Source.zip
          cat phase14_5_47_aging_reports/payload/aging_reports.patch.gz.b64.part* > aging.patch.gz.b64
          base64 -d aging.patch.gz.b64 > aging.patch.gz
          gunzip -c aging.patch.gz > aging.patch
          echo '915c906d6eadde3b93f229cd3d82887de403e3cbc842ac4790eeff27e121f677  aging.patch' | sha256sum -c -
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build .kotlin
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.46
          git apply --check ../aging.patch
          git apply ../aging.patch
          git diff --check HEAD
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 86' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.47-aging-reports"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          grep -q '"أعمار الديون"' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          grep -q 'customerAgingInvoices' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'supplierAgingInvoices' app/src/main/java/com/fush/erp/data/dao/ReportDao.kt
          grep -q 'AgingReportMath.build' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          grep -q 'سندات غير مخصصة' app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt
          test -f app/src/test/java/com/fush/erp/domain/AgingReportMathTest.kt
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and Room/Compose compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 86' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.47-aging-reports"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-47-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-47-output/FushERP-Phase14.5.47-Aging-Reports-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-47-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-47-output/lib/apksigner.jar
          chmod +x phase14-5-47-output/apksigner
          zip -qr phase14-5-47-output/FushERP-Mobile-Phase14.5.47-Aging-Reports-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.47 — AR/AP Aging Reports' \
            'Base verified source: Phase 14.5.46 Professional Printing' \
            'Branch: fush/reports-printing' \
            'Customer AR aging: PASS' \
            'Supplier AP aging: PASS' \
            'Buckets current / 1-30 / 31-60 / 61-90 / over 90: PASS' \
            'Direct unallocated party vouchers shown separately: PASS' \
            'Historical voucher reversal handling: PASS' \
            'PDF/Excel export integration: PASS' \
            'Aging math regression tests: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 86' \
            'Version name: 0.15.4.47-aging-reports' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-47-output/FushERP-Phase14.5.47-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.47-Aging-Reports-Build
          path: phase14-5-47-output/
          if-no-files-found: error
          retention-days: 7
