name: Build UI50 Snapshot For Integration

on:
  push:
    branches: [fush/integration-updates-14.5.52]
    paths:
      - '.github/workflows/build-ui50-snapshot-for-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download frozen UI47 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.47-Frozen-UI-Source
          path: artifacts/ui47
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31867210033

      - name: Fetch protected UI handoff branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fush/ui-professional-redesign:refs/remotes/origin/ui-redesign

      - name: Reconstruct UI50 source deterministically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/ui47 work
          unzip -q artifacts/ui47/FushERP-Mobile-Phase14.5.47-Frozen-UI-Source.zip -d sources/ui47
          UI47=$(find sources/ui47 -mindepth 1 -maxdepth 1 -type d | head -1)
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' "$UI47/" work/
          cd work
          git init -q
          git config user.email integration@fush.local
          git config user.name FUSH
          git add -A
          git commit -qm ui47

          apply_ui49_shared_components_semantic() {
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fush/erp/ui/ProfessionalComponents.kt')
          s = p.read_text()
          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'expected UI49 semantic anchor missing: {old[:100]!r}')
              s = s.replace(old, new, 1)
          once('import androidx.compose.foundation.layout.Column\n', 'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.ColumnScope\n')
          once('import androidx.compose.foundation.layout.sizeIn\n', 'import androidx.compose.foundation.layout.sizeIn\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll\n')
          once('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.staticCompositionLocalOf\n')
          once('enum class FushStatusTone { Neutral, Info, Success, Warning, Danger }\n', '''enum class FushStatusTone { Neutral, Info, Success, Warning, Danger }\n\nval LocalFushSnackbar = staticCompositionLocalOf<((String) -> Unit)?> { null }\n\nprivate fun fushMessageIsSuccess(message: String): Boolean {\n    val normalized = message.trim()\n    return normalized.startsWith("تم ") ||\n        normalized.startsWith("تمت ") ||\n        normalized.startsWith("بدأ") ||\n        normalized.startsWith("سيتم ")\n}\n''')
          once('    badge: String,\n', '    badge: String? = null,\n')
          once('''                Spacer(Modifier.size(10.dp))\n                FushStatusPill(badge, FushStatusTone.Info)\n''', '''                if (!badge.isNullOrBlank()) {\n                    Spacer(Modifier.size(10.dp))\n                    FushStatusPill(badge, FushStatusTone.Info)\n                }\n''')
          once(''') = FushInlineState(message, modifier, tone)\n\n@Composable\nfun FushConfirmDialog(''', ''') = FushInlineState(message, modifier, tone)\n\n@Composable\nfun FushDialogForm(\n    modifier: Modifier = Modifier,\n    content: @Composable ColumnScope.() -> Unit,\n) {\n    Column(\n        modifier = modifier\n            .fillMaxWidth()\n            .heightIn(max = 520.dp)\n            .verticalScroll(rememberScrollState()),\n        verticalArrangement = Arrangement.spacedBy(8.dp),\n        content = content,\n    )\n}\n\n@Composable\nfun FushOperationMessage(\n    message: String?,\n    modifier: Modifier = Modifier,\n    onConsumed: () -> Unit = {},\n) {\n    if (message.isNullOrBlank()) return\n    if (!fushMessageIsSuccess(message)) {\n        FushNotice(message, modifier = modifier, tone = FushStatusTone.Danger)\n        return\n    }\n\n    val snackbar = LocalFushSnackbar.current\n    if (snackbar == null) {\n        FushNotice(message, modifier = modifier, tone = FushStatusTone.Success)\n    } else {\n        LaunchedEffect(message) {\n            snackbar(message)\n            onConsumed()\n        }\n    }\n}\n\n@Composable\nfun FushConfirmDialog(''')
          p.write_text(s)
          PY
          }

          apply_remote_phase() {
            local phase="$1"
            echo "Applying $phase"
            while IFS= read -r p; do
              echo "  $p"
              if [ "$p" = 'phase14_5_49_navigation_feedback_polish/patches/03_shared_feedback_dialog_components.patch' ]; then
                apply_ui49_shared_components_semantic
              else
                git --git-dir="$GITHUB_WORKSPACE/.git" show "refs/remotes/origin/ui-redesign:$p" > /tmp/ui.patch
                if git apply --check /tmp/ui.patch; then
                  git apply /tmp/ui.patch
                else
                  echo "Formatting/context drift detected; applying bounded fuzz for $p"
                  patch --batch --forward --fuzz=3 -p1 < /tmp/ui.patch
                  test -z "$(find . -name '*.rej' -print -quit)"
                fi
              fi
              git diff --check
              git add -A
              git commit -qm "apply $p"
            done < <(git --git-dir="$GITHUB_WORKSPACE/.git" ls-tree -r --name-only refs/remotes/origin/ui-redesign "$phase/patches" | grep '\.patch$' | sort -V)
          }
          apply_remote_phase phase14_5_48_lazy_key_hotfix
          apply_remote_phase phase14_5_49_navigation_feedback_polish
          apply_remote_phase phase14_5_50_localization_foundation

          grep -q 'versionCode = 89' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.50-ui-localization-foundation"' app/build.gradle.kts
          grep -q 'val LocalFushSnackbar' app/src/main/java/com/fush/erp/ui/ProfessionalComponents.kt
          grep -q 'fun FushDialogForm' app/src/main/java/com/fush/erp/ui/ProfessionalComponents.kt
          test -z "$(find . -name '*.rej' -print -quit)"
          git diff --check
          echo "UI50_TREE=$(git write-tree)" | tee "$GITHUB_WORKSPACE/ui50-tree.txt"

      - name: Package UI50 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/.git work/.gradle work/.kotlin work/build work/app/build
          mkdir -p output/FushERP_Mobile_Phase14_5_50_UI_Snapshot
          rsync -a work/ output/FushERP_Mobile_Phase14_5_50_UI_Snapshot/
          (cd output && zip -qr FushERP-Mobile-Phase14.5.50-UI-Snapshot-Source.zip FushERP_Mobile_Phase14_5_50_UI_Snapshot)
          mv ui50-tree.txt output/
          sha256sum output/FushERP-Mobile-Phase14.5.50-UI-Snapshot-Source.zip > output/FushERP-Mobile-Phase14.5.50-UI-Snapshot-Source.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.50-UI-Snapshot-For-Integration
          path: output/*
          retention-days: 7
