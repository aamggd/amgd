name: Build Fush ERP Phase 14.4 Advanced Seasonality

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-4-seasonality-advanced.yml'
      - 'phase14_4_seasonality_advanced/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 15.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase15.2-Reports-Export-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31570867240
      - name: Restore Phase 15.2 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase15.2-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 37' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.2-phase15-reports-export' FushERP_Mobile_Phase5/app/build.gradle.kts
      - name: Apply Phase 14.4 advanced seasonality
        shell: bash
        run: |
          set -e
          python phase14_4_seasonality_advanced/apply_patch.py
          grep -q 'versionCode = 38' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.3-phase14.4-seasonality-advanced' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'تحليل الصيف والشتاء' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/PlanningScreen.kt
          grep -q 'مقارنة المحافظات الموسمية' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/PlanningScreen.kt
          grep -q 'version = 16' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-4-output
          mkdir -p phase14-4-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-4-output/FushERP-Phase14.4-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-4-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-4-output/apksigner/lib/apksigner.jar
          chmod +x phase14-4-output/apksigner/apksigner
          zip -qr phase14-4-output/FushERP-Mobile-Phase14.4-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-4-output/FushERP-Phase14.4-unsigned.apk > phase14-4-output/FushERP-Phase14.4-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.4 — Advanced Seasonality & Summer/Winter Forecasting' \
            'Version: 0.15.3-phase14.4-seasonality-advanced (versionCode 38)' \
            '' \
            'Scope:' \
            '- 24-month actual summer/winter demand analysis including zero-demand months.' \
            '- Default operational analysis calendar: summer Apr-Sep; winter Oct-Mar.' \
            '- Independent monthly seasonality factors per finished product and province.' \
            '- Summer/winter forecast from last-12-month baseline and average configured season factors.' \
            '- Cross-province seasonal comparison for selected finished product.' \
            '- Audit trail for seasonality factor changes.' \
            '- Room schema remains version 16.' \
            > phase14-4-output/FushERP-Phase14.4-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.4-Advanced-Seasonality-Build
          path: phase14-4-output/
          if-no-files-found: error
          retention-days: 7
