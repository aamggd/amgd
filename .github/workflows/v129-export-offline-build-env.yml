name: v129 Export Offline Android Build Environment

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prime exact FUSH v129 Gradle dependencies
        shell: bash
        run: |
          mkdir -p prime/app prime/gradle
          cat > prime/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FushV129Prime"
          include(":app")
          EOF
          cat > prime/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
              id("com.google.devtools.ksp") version "2.3.9" apply false
              id("androidx.room") version "2.8.4" apply false
          }
          EOF
          cat > prime/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
              id("androidx.room")
          }
          android {
              namespace = "com.fush.erp.prime"
              compileSdk = 36
              defaultConfig { applicationId = "com.fush.erp.prime"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1" }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              ksp("androidx.room:room-compiler:2.8.4")
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              testImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          mkdir -p prime/app/src/main prime/app/schemas
          cat > prime/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF
          cd prime
          gradle --no-daemon :app:dependencies >/tmp/fush-dependencies.txt
          gradle --no-daemon :app:assembleDebug >/tmp/fush-prime-build.txt

      - name: Package offline build environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p offline-env/android-sdk offline-env/gradle-home offline-env/jdk-17
          cp -a "$ANDROID_SDK_ROOT/platforms/android-36" offline-env/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" offline-env/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/platform-tools" offline-env/android-sdk/
          cp -a "$HOME/.gradle/caches" offline-env/gradle-home/
          cp -a "$HOME/.gradle/wrapper" offline-env/gradle-home/ || true
          GRADLE_BIN="$(command -v gradle)"
          GRADLE_HOME_REAL="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd -P)"
          cp -a "$GRADLE_HOME_REAL" offline-env/gradle-9.4.1
          cp -a "$JAVA_HOME"/. offline-env/jdk-17/
          printf 'sdk=%s\ngradle=%s\njdk=%s\n' "$ANDROID_SDK_ROOT" "$GRADLE_HOME_REAL" "$JAVA_HOME" > offline-env/README.txt
          tar -C offline-env -czf v129-offline-build-env.tar.gz .
          sha256sum v129-offline-build-env.tar.gz > v129-offline-build-env.tar.gz.sha256

      - name: Upload offline build environment
        uses: actions/upload-artifact@v4
        with:
          name: v129-offline-build-env-gzip
          path: |
            v129-offline-build-env.tar.gz
            v129-offline-build-env.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
