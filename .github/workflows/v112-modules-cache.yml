name: FUSH v112 modules-only dependency cache

on:
  pull_request:
    branches: [fush/v112-ci-base2]
    paths:
      - 'ci/v112/MODULES_TRIGGER_*'

permissions:
  contents: read
  actions: read

jobs:
  modules-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve v112 dependency graph
        working-directory: ci/v112/deps_project
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Package modules-2 cache only
        shell: bash
        run: |
          set -euo pipefail
          du -sh "$HOME/.gradle/caches/modules-2"
          tar -C "$HOME/.gradle/caches" -czf v112-modules-2.tar.gz modules-2
          sha256sum v112-modules-2.tar.gz > v112-modules-2.tar.gz.sha256
          ls -lh v112-modules-2.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-modules-2-cache
          path: |
            v112-modules-2.tar.gz
            v112-modules-2.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
