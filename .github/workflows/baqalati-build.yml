name: Baqalati Android Build

on:
  push:
    branches: [ "baqalati-build-v1.0.28" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/downloads
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import json,time,os,glob
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_experimental_option('prefs', {
              'download.default_directory':'/tmp/downloads',
              'download.prompt_for_download':False,
              'download.directory_upgrade':True,
              'safebrowsing.enabled':True,
          })
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL'})
          d=webdriver.Chrome(options=opts)
          d.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':'/tmp/downloads'})
          d.get('https://firestorage.ai/ja/f/sEJLGarUoaUj')
          time.sleep(8)
          buttons=d.find_elements(By.TAG_NAME,'button')
          target=None
          for b in buttons:
              print('BUTTON',repr(b.text))
              if (b.text or '').strip()=='ダウンロード': target=b
          if target is None: raise RuntimeError('download button not found')
          d.execute_script('arguments[0].click()',target)
          for _ in range(60):
              time.sleep(1)
              files=glob.glob('/tmp/downloads/*')
              print('files',[(os.path.basename(x),os.path.getsize(x)) for x in files])
              if files and not any(x.endswith('.crdownload') for x in files): break
          for rec in d.get_log('performance'):
              msg=json.loads(rec['message'])['message']
              if msg['method']=='Network.requestWillBeSent':
                  u=msg['params']['request']['url']
                  if any(k in u.lower() for k in ['api.firestorage.ai','download','shares/']): print('REQ',u)
          d.quit()
          files=glob.glob('/tmp/downloads/*')
          if not files: raise RuntimeError('no downloaded file')
          print('DOWNLOADED',[(x,os.path.getsize(x)) for x in files])
          PY
          file /tmp/downloads/*
          ls -lh /tmp/downloads
