name: Baqalati Android Build

on:
  push:
    branches: [ "baqalati-build-v1.0.28" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source archive metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,requests
          u='https://api.firestorage.ai/dev/file/shares/sEJLGarUoaUj/files?maxResults=1000'
          r=requests.get(u,timeout=30)
          print('STATUS',r.status_code,r.headers.get('content-type'))
          print(r.text)
          r.raise_for_status()
          open('/tmp/firestorage.json','w').write(r.text)
          PY
