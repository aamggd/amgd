name: Baqalati Android Build

on:
  push:
    branches: [ "baqalati-build-v1.0.28" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve temporary source download with browser
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import json,time,os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          driver.get('https://firestorage.ai/ja/f/sEJLGarUoaUj')
          time.sleep(8)
          print('TITLE',driver.title)
          print('URL',driver.current_url)
          print('BODY',driver.find_element(By.TAG_NAME,'body').text[:10000])
          print('LINKS')
          for a in driver.find_elements(By.TAG_NAME,'a'):
              print('A',a.text, a.get_attribute('href'))
          print('BUTTONS')
          buttons=driver.find_elements(By.TAG_NAME,'button')
          for b in buttons:
              print('B',b.text, b.get_attribute('disabled'))
          # print network requests likely related to API/download/storage
          for rec in driver.get_log('performance'):
              msg=json.loads(rec['message'])['message']
              if msg['method']=='Network.requestWillBeSent':
                  u=msg['params']['request']['url']
                  if any(k in u.lower() for k in ['api','download','storage','share','file']): print('REQ',u)
          # attempt click likely download button and record resulting URL/network
          for b in buttons:
              txt=(b.text or '').lower()
              if any(k in txt for k in ['download','ダウンロード']):
                  print('CLICK',b.text)
                  b.click(); time.sleep(5); break
          print('AFTER_URL',driver.current_url)
          for rec in driver.get_log('performance'):
              msg=json.loads(rec['message'])['message']
              if msg['method']=='Network.requestWillBeSent':
                  u=msg['params']['request']['url']
                  if any(k in u.lower() for k in ['api','download','storage','share','file']): print('AFTER_REQ',u)
          driver.quit()
          PY
