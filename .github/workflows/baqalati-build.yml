name: Baqalati Android Build

on:
  push:
    branches: [ "baqalati-build-v1.0.28" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect temporary source share
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          base='https://firestorage.ai/ja/f/sEJLGarUoaUj'
          s=requests.Session()
          r=s.get(base, timeout=30)
          print('page', r.status_code, len(r.content), r.url)
          scripts=[urljoin(r.url,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text)]
          for u in scripts:
              if '/_next/static/' not in u: continue
              j=s.get(u,timeout=30)
              text=j.text
              if any(k in text.lower() for k in ['download','share','public_id','file_id']):
                  print('\n=== SCRIPT',u,'bytes',len(text),'===')
                  for key in ['download','public_id','file_id','share_url','/api/']:
                      pos=0
                      shown=0
                      while shown<12:
                          i=text.lower().find(key.lower(),pos)
                          if i<0: break
                          print(text[max(0,i-350):min(len(text),i+550)])
                          print('\n---')
                          pos=i+len(key); shown+=1
          PY
