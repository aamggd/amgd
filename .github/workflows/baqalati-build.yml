name: Baqalati Android Build

on:
  push:
    branches: [ "baqalati-build-v1.0.28" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Baqalati source archive
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          u='https://firestorage.ai/ja/f/sEJLGarUoaUj'
          r=requests.get(u, timeout=30, allow_redirects=True)
          print('status', r.status_code, 'url', r.url, 'ctype', r.headers.get('content-type'), 'bytes', len(r.content))
          open('/tmp/share.bin','wb').write(r.content)
          text=r.text if 'text' in (r.headers.get('content-type') or '') else ''
          print(text[:5000])
          urls=[]
          for m in re.finditer(r'''(?:href|src)=["']([^"']+)["']''', text):
              x=urljoin(r.url,m.group(1))
              if any(k in x.lower() for k in ['download','file','api','s3','storage']): urls.append(x)
          print('candidate urls:')
          for x in urls: print(x)
          PY

      - name: Show downloaded object type
        run: file /tmp/share.bin && ls -lh /tmp/share.bin
