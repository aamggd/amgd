name: Baqalati Android Signing Tools

on:
  push:
    branches: [ "baqalati-build-v1.0.28" ]
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Package Android signing tools
        shell: bash
        run: |
          set -euxo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build tools: $BT"
          mkdir -p out
          test -f "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          cp "$BT/zipalign" out/zipalign
          LIBCPP=$(find "$BT" -type f -name 'libc++.so*' | head -n1)
          test -n "$LIBCPP"
          cp "$LIBCPP" out/libc++.so
          chmod +x out/zipalign
          printf '%s\n' "$BT" > out/android-build-tools.txt
          sha256sum out/apksigner.jar out/zipalign out/libc++.so > out/SHA256SUMS.txt
          ldd out/zipalign || true
          ls -lh out

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Baqalati-android-signing-tools-with-libcxx
          path: out/*
          retention-days: 1
