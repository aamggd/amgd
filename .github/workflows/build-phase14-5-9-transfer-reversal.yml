name: Build Fush ERP Phase 14.5.9 Transfer Reversal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-9-transfer-reversal.yml'
      - 'phase14_5_9_transfer_reversal/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.8 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.8-Historical-Stock-Guard-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31658708208
      - name: Restore Phase 14.5.8 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.8-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 47' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.8-phase14.5-historical-stock-guard' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 20' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.9 transfer reversal
        shell: bash
        run: |
          set -e
          python phase14_5_9_transfer_reversal/apply_patch.py
          grep -q 'versionCode = 48' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.9-phase14.5-transfer-reversal' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_20_21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'reverseWarehouseTransfer' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          grep -q 'TRANSFER_REVERSAL_OUT' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          grep -q 'عكس التحويل' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 21
        shell: bash
        run: |
          set -e
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/21.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-9-output
          mkdir -p phase14-5-9-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-9-output/FushERP-Phase14.5.9-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-9-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-9-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-9-output/apksigner/apksigner
          zip -qr phase14-5-9-output/FushERP-Mobile-Phase14.5.9-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-9-output/FushERP-Phase14.5.9-unsigned.apk > phase14-5-9-output/FushERP-Phase14.5.9-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.9 — Posted Warehouse Transfer Reversal' \
            'Version: 0.15.4.9-phase14.5-transfer-reversal (versionCode 48)' \
            'Room schema: 21 (migration 20 -> 21)' \
            '' \
            'Fixed:' \
            '- Posted warehouse transfers can now be fully reversed without deleting the original movements.' \
            '- Reversal creates opposite stock movements from destination back to source using original lot, expiry and unit cost.' \
            '- Reversal requires a reason and stores reversal user/time plus an immutable audit event.' \
            '- Reversal is blocked if destination stock no longer covers the full original quantity.' \
            '- Reversal also checks the later historical stock timeline to prevent negative balances.' \
            '- Added unit tests for reversal availability.' \
            > phase14-5-9-output/FushERP-Phase14.5.9-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.9-Transfer-Reversal-Build
          path: phase14-5-9-output/
          if-no-files-found: error
          retention-days: 7
