name: FUSH v112 dependency cache export

on:
  push:
    branches: [fush/v112-role-permissions-build]
    paths:
      - '.github/workflows/v112-dependency-cache.yml'
      - 'ci/v112/deps_project/**'

permissions:
  contents: write
  actions: read

jobs:
  resolve-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve exact v112 plugins and dependencies
        working-directory: ci/v112/deps_project
        run: |
          gradle --no-daemon --refresh-dependencies :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Package Gradle dependency cache
        shell: bash
        run: |
          set -euo pipefail
          du -sh "$HOME/.gradle/caches" || true
          tar -C "$HOME/.gradle" -cJf v112-gradle-caches.tar.xz caches
          sha256sum v112-gradle-caches.tar.xz > v112-gradle-caches.tar.xz.sha256
          ls -lh v112-gradle-caches.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-dependency-cache
          path: |
            v112-gradle-caches.tar.xz
            v112-gradle-caches.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Publish successful run id marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/v112/runs
          printf 'run_id=%s\nhead_sha=%s\nstatus=SUCCESS\nartifact=FUSH-v112-gradle-dependency-cache\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "ci/v112/runs/deps-${GITHUB_RUN_ID}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/v112/runs/deps-${GITHUB_RUN_ID}.txt"
          git commit -m "Record v112 dependency cache run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin fush/v112-role-permissions-build
          git push origin HEAD:fush/v112-role-permissions-build
