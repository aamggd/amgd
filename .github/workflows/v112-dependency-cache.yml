name: FUSH v112 dependency cache export

on:
  pull_request:
    branches: [fush/v112-ci-base2]

permissions:
  contents: read
  actions: read

jobs:
  resolve-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve exact v112 plugins and dependencies
        working-directory: ci/v112/deps_project
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Package and split Gradle dependency cache
        shell: bash
        run: |
          set -euo pipefail
          du -sh "$HOME/.gradle/caches" || true
          tar -C "$HOME/.gradle" -cJf v112-gradle-caches.tar.xz caches
          sha256sum v112-gradle-caches.tar.xz > v112-gradle-caches.tar.xz.sha256
          split -b 300M -d -a 2 v112-gradle-caches.tar.xz v112-gradle-caches.part-
          ls -lh v112-gradle-caches.tar.xz v112-gradle-caches.part-*
          test -f v112-gradle-caches.part-00
          test -f v112-gradle-caches.part-01
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-cache-part-00
          path: v112-gradle-caches.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-cache-part-01
          path: v112-gradle-caches.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-cache-part-02
          path: v112-gradle-caches.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-cache-checksum
          path: v112-gradle-caches.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
