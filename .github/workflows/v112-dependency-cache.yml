name: FUSH v112 dependency cache export

on:
  push:
    branches: [fush/v112-role-permissions-build]
    paths:
      - '.github/workflows/v112-dependency-cache.yml'
      - 'ci/v112/deps_project/**'

permissions:
  contents: write
  actions: read

jobs:
  resolve-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve exact v112 plugins, Kotlin build tools, runtime and test dependencies
        working-directory: ci/v112/deps_project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 --refresh-dependencies \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            :app:compileDebugUnitTestKotlin \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace
          gradle --no-daemon --max-workers=2 :app:dependencies --configuration kotlinBuildToolsApiClasspath
          gradle --no-daemon --max-workers=2 \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            --stacktrace
      - name: Package Gradle dependency cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.gradle/daemon" "$HOME/.gradle/workers" "$HOME/.gradle/notifications" || true
          du -sh "$HOME/.gradle/caches" || true
          tar -C "$HOME/.gradle" -cf v112-gradle-caches.tar caches
          sha256sum v112-gradle-caches.tar > v112-gradle-caches.tar.sha256
          ls -lh v112-gradle-caches.tar
      - uses: actions/upload-artifact@v4
        with:
          name: FUSH-v112-gradle-dependency-cache
          compression-level: 1
          path: |
            v112-gradle-caches.tar
            v112-gradle-caches.tar.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Publish successful run id marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/v112/runs
          printf 'run_id=%s\nhead_sha=%s\nstatus=SUCCESS\nartifact=FUSH-v112-gradle-dependency-cache\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "ci/v112/runs/deps-${GITHUB_RUN_ID}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/v112/runs/deps-${GITHUB_RUN_ID}.txt"
          git commit -m "Record v112 dependency cache run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin fush/v112-role-permissions-build
          git push origin HEAD:fush/v112-role-permissions-build
