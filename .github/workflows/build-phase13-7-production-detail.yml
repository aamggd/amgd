name: Build Fush ERP Phase 13.7 Production Detail

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase13-7-production-detail.yml'
      - 'phase13_7_production_detail/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Phase 13.6.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase13.6.2-Dashboard-Navigation-Build
          path: previous-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: aamggd/amgd
          run-id: 31547714528

      - name: Restore Phase 13.6.2 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase13.6.2-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 26' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.6.2-phase13-dashboard-navigation' FushERP_Mobile_Phase5/app/build.gradle.kts

      - name: Apply Phase 13.7 detailed production statement
        shell: bash
        run: |
          set -e
          python phase13_7_production_detail/apply_patch.py
          grep -q 'versionCode = 27' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.13.7-phase13-production-detail' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'بيان الإنتاج التفصيلي' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/ProductionScreens.kt
          grep -q 'المواد المستخدمة والأسعار' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/ProductionScreens.kt
          grep -q 'تفاصيل التشغيلات المصروفة' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/ProductionScreens.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase13-7-output
          mkdir -p phase13-7-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase13-7-output/FushERP-Phase13.7-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase13-7-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase13-7-output/apksigner/lib/apksigner.jar
          chmod +x phase13-7-output/apksigner/apksigner
          zip -qr phase13-7-output/FushERP-Mobile-Phase13.7-Source.zip FushERP_Mobile_Phase5
          sha256sum phase13-7-output/FushERP-Phase13.7-unsigned.apk > phase13-7-output/FushERP-Phase13.7-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase13.7-Production-Detail-Build
          path: phase13-7-output/
          if-no-files-found: error
          retention-days: 7
