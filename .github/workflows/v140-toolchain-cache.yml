name: V140 Offline Toolchain Cache

on:
  push:
    branches:
      - fush/v140-build-runner
    paths:
      - '.github/workflows/v140-toolchain-cache.yml'
  pull_request:
    branches:
      - fush/v140-build-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Create exact-dependency warm project
        shell: bash
        run: |
          mkdir -p warmproj/app/src/main/java/com/fush/warm warmproj/app/src/main/res warmproj/gradle
          cat > warmproj/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FushWarm"
          include(":app")
          EOF
          cat > warmproj/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.ksp) apply false
              alias(libs.plugins.room) apply false
          }
          EOF
          cat > warmproj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > warmproj/gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "9.2.0"
          kotlin = "2.3.21"
          ksp = "2.3.9"
          room = "2.8.4"
          activity = "1.13.0"
          lifecycle = "2.10.0"
          navigation = "2.9.8"
          composeBom = "2026.06.00"
          coreKtx = "1.17.0"
          junit = "4.13.2"
          [libraries]
          androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
          androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
          androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
          androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
          androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
          androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
          androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
          androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
          androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { module = "androidx.compose.ui:ui" }
          androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
          androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
          androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
          androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
          junit = { module = "junit:junit", version.ref = "junit" }
          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          room = { id = "androidx.room", version.ref = "room" }
          EOF
          cat > warmproj/app/build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.room)
          }
          android {
              namespace = "com.fush.warm"
              compileSdk = 36
              defaultConfig { applicationId = "com.fush.warm"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1" }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.room.runtime)
              implementation(libs.androidx.room.ktx)
              ksp(libs.androidx.room.compiler)
              val composeBom = platform(libs.androidx.compose.bom)
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.material.icons.core)
              debugImplementation(libs.androidx.compose.ui.tooling)
              testImplementation(libs.junit)
              testImplementation(libs.androidx.room.testing)
              androidTestImplementation(libs.androidx.room.testing)
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > warmproj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          EOF
          mkdir -p warmproj/app/src/main/res/values
          cat > warmproj/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF

      - name: Warm Gradle plugins and all app dependency families
        working-directory: warmproj
        shell: bash
        run: |
          gradle wrapper --gradle-version 9.4.1
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintVitalRelease

      - name: Package offline toolchain
        shell: bash
        run: |
          mkdir -p offline/android-sdk offline/gradle-home
          cp -a "$ANDROID_HOME/platforms" offline/android-sdk/
          cp -a "$ANDROID_HOME/build-tools" offline/android-sdk/
          cp -a "$ANDROID_HOME/platform-tools" offline/android-sdk/
          cp -a "$ANDROID_HOME/licenses" offline/android-sdk/ || true
          cp -a "$HOME/.gradle/caches" offline/gradle-home/
          cp -a "$HOME/.gradle/wrapper" offline/gradle-home/
          cp -a warmproj/gradle/wrapper offline/wrapper-files
          tar -C offline -czf v140-offline-toolchain.tar.gz .
          sha256sum v140-offline-toolchain.tar.gz > v140-offline-toolchain.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: v140-offline-toolchain
          path: |
            v140-offline-toolchain.tar.gz
            v140-offline-toolchain.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
