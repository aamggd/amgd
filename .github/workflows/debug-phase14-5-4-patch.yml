name: Debug Phase 14.5.4 Patch Paths

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/debug-phase14-5-4-patch.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Decode and show patch paths
        run: |
          python - <<'PY'
          import base64,gzip,pathlib
          p=pathlib.Path('phase14_5_4_supplier_ap/phase14_5_4.diff.gz.b64')
          out=pathlib.Path('phase14_5_4.diff')
          out.write_bytes(gzip.decompress(base64.b64decode(p.read_text())))
          PY
          grep '^diff --git ' phase14_5_4.diff | head -100
          grep -n 'versionCode' phase14_5_4.diff | head -10 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase14-5-4-decoded-patch
          path: phase14_5_4.diff
          retention-days: 1
