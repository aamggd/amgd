name: Build FUSH Backup Recovery P0
on:
  push:
    branches: [fush/backup-recovery]
    paths:
      - '.github/workflows/build-backup-recovery-p0.yml'
      - 'backup_recovery_p0/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch payload
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Download validated central 14.5.54 baseline
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.54-Printing-Integrated-Build
          path: artifacts/base54
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31909754750
      - name: Restore exact baseline and apply P0
        shell: bash
        run: |
          set -euo pipefail
          ZIP=artifacts/base54/FushERP-Mobile-Phase14.5.54-Printing-Integrated-Source.zip
          test -s "$ZIP"
          echo '8adc047bc38703fcb460344b4ddd2c7f18f0c47c3ca1a6c62a51d3ef590450a1  '"$ZIP" | sha256sum -c -
          mkdir -p source
          unzip -q "$ZIP" -d source
          APP=$(find source -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$APP"
          cd "$APP"
          git init -q
          git config user.email backup-recovery@fush.local
          git config user.name FUSH
          git add -A
          git commit -qm baseline-14.5.54
          BASE_TREE=$(git write-tree)
          echo "BASE_TREE=$BASE_TREE"
          test "$BASE_TREE" = '1b6af7bcaa86138ae75ea3d905db4bdba0fe04ff'
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
          cd ../..
          base64 -d backup_recovery_p0/phase1.patch.gz.b64 | gzip -dc > phase1.patch
          echo 'c9b2eb29a64517ac59c8d25fd995a0ec963a9ac25e0d6dfe44899b7f95e6133a  phase1.patch' | sha256sum -c -
          cd "$APP"
          git apply --check ../../phase1.patch
          git apply ../../phase1.patch
          git diff --check
          test -f app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'AES-256-GCM' app/src/main/java/com/fush/erp/backup/BackupArchiveCodec.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/fush/erp/backup/BackupEncryptionKeyProvider.kt
          grep -q 'BackupEncryptionKeyProvider.getOrCreate()' app/src/main/java/com/fush/erp/backup/BackupRestoreManager.kt
          grep -q 'encrypted backup must not expose SQLite header' app/src/test/java/com/fush/erp/backup/BackupArchiveCodecTest.kt
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find source -mindepth 1 -maxdepth 1 -type d | head -1)
          cd "$APP"
          gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find source -mindepth 1 -maxdepth 1 -type d | head -1)
          cd "$APP"
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java app/build.gradle.kts
      - name: Upload P0 test build
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Backup-Recovery-P0-TEST-BRANCH-ONLY
          path: |
            source/*/app/build/outputs/apk/release/app-release-unsigned.apk
            phase1.patch
          if-no-files-found: error
          retention-days: 14
