name: Build Fush ERP Phase 14.5.23 Legacy Lot Assignment
on:
  push:
    branches: [phase14-5-23-build]
    paths: ['.github/workflows/build-phase14-5-23-legacy-lot-assignment.yml','phase14_5_23_legacy_lot_assignment/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.22-Production-Expiry-Diagnostics-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31755175240
      - name: Restore and patch
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.22-Source.zip
          D=phase14_5_23_legacy_lot_assignment/chunks
          cat $D/part_00.txt $D/part_01.txt $D/part_02.txt $D/part_03.txt $D/part_04.txt $D/part_05_00.txt $D/part_05_01.txt $D/part_05_02.txt $D/part_06_00.txt > apply14523.py
          cat $D/tail_hex_00a.txt $D/tail_hex_01.txt $D/tail_hex_02.txt $D/tail_hex_03_0.txt $D/tail_hex_03_1.txt $D/tail_hex_03_2.txt $D/tail_hex_03_3.txt $D/tail_hex_04.txt $D/tail_hex_05a.txt $D/tail_hex_05b.txt $D/tail_hex_06.txt $D/tail_hex_07a.txt $D/tail_hex_07b.txt $D/tail_hex_08a.txt $D/tail_hex_08b.txt $D/tail_hex_09a.txt $D/tail_hex_09b.txt $D/tail_hex_10a.txt $D/tail_hex_10b0.txt $D/tail_hex_10b1a.txt $D/tail_hex_10b1b.txt $D/tail_hex_11a.txt $D/tail_hex_11b0.txt $D/tail_hex_11b1.txt $D/tail_hex_12a0.txt $D/tail_hex_12a1.txt $D/tail_hex_12b.txt $D/tail_hex_13a0.txt $D/tail_hex_13a1.txt $D/tail_hex_13b.txt $D/tail_hex_14.txt > tail.hex
          python -c "import zlib;open('apply14523.py','ab').write(zlib.decompress(bytes.fromhex(open('tail.hex').read().strip())))"
          python apply14523.py
          grep -q 'versionCode = 62' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'assignLegacyTracking' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package
        shell: bash
        run: |
          set -e
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
          mkdir -p out/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk out/FushERP-Phase14.5.23-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" out/apksigner/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" out/apksigner/lib/
          zip -qr out/FushERP-Mobile-Phase14.5.23-Source.zip FushERP_Mobile_Phase5
          sha256sum out/FushERP-Phase14.5.23-unsigned.apk > out/FushERP-Phase14.5.23-unsigned.apk.sha256
          printf '%s\n' 'Fush ERP Phase 14.5.23 — Legacy Lot / Expiry Assignment' 'Version: 0.15.4.23-phase14.5-legacy-lot-assignment (versionCode 62)' 'Room schema: 23 (unchanged)' 'Legacy stock can be assigned Lot/expiry without changing total stock quantity or value.' > out/FushERP-Phase14.5.23-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.23-Legacy-Lot-Assignment-Build
          path: out/
          retention-days: 7
