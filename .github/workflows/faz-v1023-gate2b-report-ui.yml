name: FAZ v1.0.23 Gate2B Supplier Movement Report UI

on:
  push:
    branches: [faz/v1.0.23-supplier-item-movement-report]
    paths:
      - '.github/workflows/faz-v1023-gate2b-report-ui.yml'
      - 'ci/SupplierItemMovementReportExportTest.kt'
      - 'ci/faz_v1023_gate2b_apply.py'
      - 'ci/faz_v1023_gate2b_fix_weight_import.py'
      - 'ci/faz_v1023_fix_legacy_schema_contracts.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FAZ-v1.0.23-Gate2A-SupplierMovementReport-Data
          path: gate2a
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 34674487668
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare Gate2A source and Android SDK
        id: src
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          Z=$(find gate2a -type f -name '*Source.zip' -print -quit); test -n "$Z"
          mkdir -p work; unzip -q "$Z" -d work
          S=$(find work -name settings.gradle.kts -print -quit); ROOT=$(dirname "$S")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'class SupplierItemMovementReportService' "$ROOT/app/src/main/java/com/fush/erp/domain/SupplierItemMovementReport.kt"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 53' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
          ! grep -Rqs 'fallbackToDestructiveMigration' "$ROOT/app/src/main/java"
      - name: Apply Gate2B UI and test-contract maintenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          python3 ci/faz_v1023_gate2b_apply.py "$ROOT"
          python3 ci/faz_v1023_gate2b_fix_weight_import.py "$ROOT"
          python3 ci/faz_v1023_fix_legacy_schema_contracts.py "$ROOT"
          TEST="$ROOT/app/src/test/java/com/fush/erp/ui/screens/SupplierItemMovementReportExportTest.kt"
          mkdir -p "$(dirname "$TEST")"
          cp ci/SupplierItemMovementReportExportTest.kt "$TEST"
          U="$ROOT/app/src/main/java/com/fush/erp/ui/screens/SupplierItemMovementReportUi.kt"
          grep -q 'import androidx.compose.foundation.layout.\*' "$U"
          ! grep -q '^import androidx.compose.foundation.layout.weight$' "$U"
          for F in EmployeeCompensationContractTest.kt EmployeeCustodyAndPayrollHotfixContractTest.kt EmployeeTerminationRetroactiveContractTest.kt ProductMasterVariantsContractTest.kt; do
            T="$ROOT/app/src/test/java/com/fush/erp/domain/$F"
            grep -q 'currentSchemaVersion(db)' "$T"
            ! grep -q 'FUSH_DB_SCHEMA_VERSION = 52' "$T"
          done
      - name: GREEN - supplier movement export contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          cd "$ROOT"
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.ui.screens.SupplierItemMovementReportExportTest' | tee "$GITHUB_WORKSPACE/gate2b-green.log"
      - name: Run complete unit test suite
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          cd "$ROOT"
          gradle --no-daemon :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/gate2b-all-tests.log"
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          cd "$ROOT"
          gradle --no-daemon :app:assembleRelease | tee "$GITHUB_WORKSPACE/gate2b-release-build.log"
      - name: Verify Room schema 53 and Gate2B source contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          python3 - "$ROOT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          schemas = list(root.rglob('53.json'))
          assert schemas, 'Room schema 53.json was not generated/preserved'
          valid = []
          for p in schemas:
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if data.get('database', {}).get('version') == 53:
                  valid.append(p)
          assert valid, 'No generated Room schema with database.version=53'
          print('ROOM_SCHEMA_53=PASS', valid[0])
          PY
          R="$ROOT/app/src/main/java/com/fush/erp/ui/screens/ReportsScreen.kt"
          U="$ROOT/app/src/main/java/com/fush/erp/ui/screens/SupplierItemMovementReportUi.kt"
          grep -q '"حركة أصناف المورد"' "$R"
          grep -q 'supplierItemMovementReportService.load' "$R"
          grep -q 'SupplierItemMovementReportFilter' "$R"
          grep -q 'SupplierItemMovementReportExportFactory.build' "$R"
          grep -q 'FAZ-Solar-Supplier-Item-Movement' "$R"
          grep -q 'REPORTS_EXPORT' "$R"
          grep -q 'غير منسوب' "$U"
          grep -q 'لا يتم تخمين' "$U"
          grep -q 'PDF وExcel' "$U"
          grep -q 'import androidx.compose.foundation.layout.\*' "$U"
          ! grep -q '^import androidx.compose.foundation.layout.weight$' "$U"
          grep -q 'MIGRATION_46_47_EMPLOYEE_COMPENSATION' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          grep -q 'MIGRATION_49_50_EMPLOYEE_TERMINATION' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          grep -q 'MIGRATION_50_51_EMPLOYEE_CUSTODY' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          grep -q 'MIGRATION_51_52_PRODUCT_MASTER' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          grep -q 'MIGRATION_52_53_SUPPLIER_PROVENANCE' "$ROOT/app/src/main/java/com/fush/erp/data/AppContainer.kt"
          ! grep -Rqs 'fallbackToDestructiveMigration' "$ROOT/app/src/main/java"
          echo 'GATE2B_SOURCE_CONTRACTS=PASS'
      - name: Package Gate2B source APK and evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          OUT="$GITHUB_WORKSPACE/gate2b-out"
          mkdir -p "$OUT"
          APK=$(find "$ROOT/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit); test -n "$APK"
          cp "$APK" "$OUT/FAZ-Solar-ERP-v1.0.23-SupplierItemMovement-UNSIGNED.apk"
          sha256sum "$OUT/FAZ-Solar-ERP-v1.0.23-SupplierItemMovement-UNSIGNED.apk" > "$OUT/FAZ-Solar-ERP-v1.0.23-SupplierItemMovement-UNSIGNED.apk.sha256"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$OUT/FAZ-Solar-ERP-v1.0.23-SupplierItemMovement-UNSIGNED.apk" > "$OUT/apk-badging.txt"
          SCHEMA=$(find "$ROOT" -type f -name '53.json' -path '*schemas*' -print -quit); test -n "$SCHEMA"
          mkdir -p "$OUT/room-schema-53"; cp "$SCHEMA" "$OUT/room-schema-53/53.json"
          cp "$GITHUB_WORKSPACE/gate2b-green.log" "$OUT/"
          cp "$GITHUB_WORKSPACE/gate2b-all-tests.log" "$OUT/"
          cp "$GITHUB_WORKSPACE/gate2b-release-build.log" "$OUT/"
          mkdir -p "$OUT/test-reports"
          if [ -d "$ROOT/app/build/reports/tests" ]; then cp -R "$ROOT/app/build/reports/tests/." "$OUT/test-reports/"; fi
          cat > "$OUT/gate2b-verification.txt" <<'EOF'
          Gate2B Supplier Item Movement Report UI = PASS
          Gate2A data/service baseline = PASS
          Export RED observed before implementation = PASS
          Export GREEN unit test = PASS
          Complete unit test suite = PASS
          Legacy schema contracts verified forward-compatible = PASS
          Release build = PASS
          Room schema = 53
          Supplier / Item / Warehouse filters = WIRED
          Unattributed legacy source shown explicitly = YES
          PDF / Excel / Print = existing ReportExportActions pipeline
          Destructive migration fallback = ABSENT
          APK signing = NOT PERFORMED IN THIS GATE
          EOF
          rm -rf "$ROOT/app/build" "$ROOT/.gradle"
          PARENT=$(dirname "$ROOT"); BASE=$(basename "$ROOT")
          (cd "$PARENT" && zip -qr "$OUT/FAZ-Solar-ERP-v1.0.23-Gate2B-SupplierItemMovement-UI-Source.zip" "$BASE")
          sha256sum "$OUT/FAZ-Solar-ERP-v1.0.23-Gate2B-SupplierItemMovement-UI-Source.zip" > "$OUT/FAZ-Solar-ERP-v1.0.23-Gate2B-SupplierItemMovement-UI-Source.zip.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FAZ-v1.0.23-Gate2B-SupplierMovementReport-UI
          path: ${{ steps.package.outputs.out }}
          retention-days: 2
