name: FAZ v1.0.23 Gate2B Supplier Movement Report UI

on:
  push:
    branches: [faz/v1.0.23-supplier-item-movement-report]
    paths:
      - '.github/workflows/faz-v1023-gate2b-report-ui.yml'
      - 'ci/SupplierItemMovementReportExportTest.kt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FAZ-v1.0.23-Gate2A-SupplierMovementReport-Data
          path: gate2a
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 34674487668
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare Gate2A source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          Z=$(find gate2a -type f -name '*Source.zip' -print -quit); test -n "$Z"
          mkdir -p work; unzip -q "$Z" -d work
          S=$(find work -name settings.gradle.kts -print -quit); ROOT=$(dirname "$S")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'class SupplierItemMovementReportService' "$ROOT/app/src/main/java/com/fush/erp/domain/SupplierItemMovementReport.kt"
          grep -q 'FUSH_DB_SCHEMA_VERSION = 53' "$ROOT/app/src/main/java/com/fush/erp/data/FushDatabase.kt"
      - name: RED - export factory must not exist yet
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.src.outputs.root }}'
          TEST="$ROOT/app/src/test/java/com/fush/erp/ui/screens/SupplierItemMovementReportExportTest.kt"
          mkdir -p "$(dirname "$TEST")"
          cp ci/SupplierItemMovementReportExportTest.kt "$TEST"
          cd "$ROOT"
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.fush.erp.ui.screens.SupplierItemMovementReportExportTest' > "$GITHUB_WORKSPACE/gate2b-red.log" 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -Eq 'SupplierItemMovementReportExportFactory|Unresolved reference|unresolved reference' "$GITHUB_WORKSPACE/gate2b-red.log"
          echo 'GATE2B_RED=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: FAZ-v1.0.23-Gate2B-RED
          path: gate2b-red.log
          retention-days: 2
