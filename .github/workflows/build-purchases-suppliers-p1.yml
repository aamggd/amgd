# P1 validation workflow — exact Central 2cb8da8 baseline
name: Build Purchases Suppliers P1

on:
  push:
    branches: [fush/purchases-suppliers]
    paths:
      - 'purchases_suppliers_p1/**'
      - '.github/workflows/build-purchases-suppliers-p1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CENTRAL_HEAD: '2cb8da801fc54aec8c1f0d6a83588f097ca85117'
  CENTRAL_SOURCE_TREE: '7733c6570357eb813f7e05e5093752ea26788749'
  PHASE_PATCH_SHA256: 'da8e434ed18d17cd136d80dee872f4a5528d708369fa473cc1ff71b3ea0f2753'

jobs:
  validate-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout specialist branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Verify exact Central baseline
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CENTRAL_HEAD}^{commit}"
          git merge-base --is-ancestor "$CENTRAL_HEAD" HEAD
          test "$(git rev-parse HEAD:central_source)" = "$CENTRAL_SOURCE_TREE"
          grep -q 'applicationId = "com.fush.erp.recovery"' central_source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' central_source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f central_source/app/schemas/com.fush.erp.data.FushDatabase/34.json
          test -f central_source/app/src/main/java/com/fush/erp/domain/SupplierMovementIdentity.kt
          ! grep -R -n 'fallbackToDestructiveMigration' central_source/app/src/main central_source/app/build.gradle.kts
          echo "${PHASE_PATCH_SHA256}  purchases_suppliers_p1/phase_p1.patch" | sha256sum -c -

      - name: Apply P1 on a clean Central working copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work-source output
          mkdir -p work-source output
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='build' --exclude='app/build' central_source/ work-source/
          cd work-source
          git init -q
          git config user.name 'FUSH Purchases Suppliers'
          git config user.email purchases-suppliers@fush.local
          git add -A
          git commit -qm 'Central baseline 2cb8da8'
          test "$(git write-tree)" = "$CENTRAL_SOURCE_TREE"

          git apply --check ../purchases_suppliers_p1/phase_p1.patch
          git apply ../purchases_suppliers_p1/phase_p1.patch
          git add -A
          git diff --cached --check

          cat > /tmp/expected-files <<'EOF'
          app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          app/src/main/java/com/fush/erp/domain/SupplierProfileMath.kt
          app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          app/src/test/java/com/fush/erp/domain/SupplierProfileMathTest.kt
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          test "$(git diff --cached --name-only | grep -c '^app/src/main/java/com/fush/erp/data/FushDatabase.kt$' || true)" -eq 0
          test "$(git diff --cached --name-only | grep -c '^app/schemas/' || true)" -eq 0
          test "$(git diff --cached --name-only | grep -c '^app/build.gradle.kts$' || true)" -eq 0
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main app/build.gradle.kts
          grep -q 'p.supplierId=:supplierId' app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'supplierVoucherAdjustmentAt' app/src/main/java/com/fush/erp/data/dao/PurchaseDaos.kt
          grep -q 'SupplierProfileMath.build' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          git commit -qm 'Purchases suppliers P1 validated working source'

      - name: P1 focused regression tests
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.fush.erp.domain.SupplierProfileMathTest' \
            --tests 'com.fush.erp.domain.SupplierMovementIdentityTest' \
            --tests 'com.fush.erp.domain.PartyStatementMathTest' \
            --tests 'com.fush.erp.domain.SupplierApMathTest' \
            --tests 'com.fush.erp.domain.AgingReportMathTest'

      - name: Full unit regression suite
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          APK=work-source/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          grep -q 'applicationId = "com.fush.erp.recovery"' work-source/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' work-source/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f work-source/app/schemas/com.fush.erp.data.FushDatabase/34.json
          ! grep -R -n 'fallbackToDestructiveMigration' work-source/app/src/main work-source/app/build.gradle.kts
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$APK" output/FushERP-Purchases-Suppliers-P1-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -v 4 output/FushERP-Purchases-Suppliers-P1-aligned-unsigned.apk
          (cd work-source && git archive --format=zip --output=../output/FushERP-Mobile-Purchases-Suppliers-P1-Source.zip HEAD)
          sha256sum output/* > output/SHA256SUMS.txt

      - name: Upload P1 validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FushERP-Purchases-Suppliers-P1-Build
          path: output/
          if-no-files-found: error
