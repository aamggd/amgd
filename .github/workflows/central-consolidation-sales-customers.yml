name: Central Consolidation - Sales Customers

on:
  push:
    branches: [fush/integration-current]
    paths:
      - '.github/workflows/central-consolidation-sales-customers.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  INPUT_TREE: '238d818b04d33a0ce0d97263efe8ed6308188ca3'
  SALES_HANDOFF_SHA: 'f8a7b2f40cc957a4352d89edbf9b4feef72a946c'
  SALES_PATCH_SHA256: '892ab6e2f519d3d5cbd1a530397f22dbf1a6660750f042450cc58fb471c10cc5'

jobs:
  integrate-sales-customers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fush/integration-current
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          test -f central_source/settings.gradle.kts
          cp -a central_source work-source
          cd work-source
          git init -q
          git config user.name central-integration-ci
          git config user.email central-integration-ci@users.noreply.github.com
          git add -A
          TREE=$(git write-tree)
          echo "input_tree=$TREE"
          test "$TREE" = "$INPUT_TREE"
          git commit -qm "Cumulative Central before Sales Customers"
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main

      - name: Fetch exact validated Sales Customers patch
        shell: bash
        run: |
          set -euo pipefail
          for p in 00 01 02; do
            curl -fL "https://raw.githubusercontent.com/aamggd/amgd/${SALES_HANDOFF_SHA}/sales_customers_phase1/patch_chunks/${p}" -o "sales-${p}"
          done
          cat sales-00 sales-01 sales-02 | base64 -d | xz -dc > sales-customers.patch
          echo "${SALES_PATCH_SHA256}  sales-customers.patch" | sha256sum -c -
          cd work-source
          git apply --check ../sales-customers.patch
          git apply ../sales-customers.patch
          git diff --check
          git add -A
          git commit -qm "Integrate Sales Customers validated handoff"
          echo "sales_source_tree=$(git write-tree)" | tee ../sales-source-tree.txt

      - name: Sales Customers domain regression
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'onOpenSales = { onNavigate("المبيعات") }' app/src/main/java/com/fush/erp/ui/screens/HomeShell.kt
          grep -q 'private fun CustomerCollectionDialog' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'private fun ReverseSalesReceiptDialog' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'customers_open_sales_operations' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -q 'CustomerPartySettlementDialog' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -q 'ReverseCustomerReceiptDialog' app/src/main/java/com/fush/erp/ui/screens/PartyScreens.kt
          ! grep -q 'AddCustomerDialog\|EditCustomerDialog\|CustomerAccountStatementDialog' app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt

      - name: Full unit tests
        working-directory: work-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: work-source
        run: gradle --no-daemon :app:assembleRelease

      - name: Central safety checks
        working-directory: work-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 34' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/34.json
          grep -R -q 'MIGRATION_32_33_SECURITY' app/src/main/java
          grep -R -Eq 'Migration\(33, *34\)|MIGRATION_33_34' app/src/main/java
          ! grep -R -n 'fallbackToDestructiveMigration' app/src/main
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ${ANDROID_HOME}/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Replace Central source with cumulative tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf central_source
          mkdir central_source
          git -C work-source archive --format=tar HEAD | tar -x -C central_source
          test -f central_source/app/src/main/java/com/fush/erp/domain/AccountingIntegrationContract.kt
          grep -q 'private fun CustomerCollectionDialog' central_source/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt

      - name: Commit actual cumulative Central source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central_source sales-source-tree.txt
          git commit -m "Central integration: add Sales Customers validated handoff"
          git push origin HEAD:fush/integration-current
