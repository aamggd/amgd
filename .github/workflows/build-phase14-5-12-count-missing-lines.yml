name: Build Fush ERP Phase 14.5.12 Count Missing Lines

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-12-count-missing-lines.yml'
      - 'phase14_5_12_count_missing_lines/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.11 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.11-Production-Issue-Guard-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31661181311
      - name: Restore Phase 14.5.11 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.11-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 50' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.11-phase14.5-production-issue-guard' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.12 count missing lines
        shell: bash
        run: |
          set -e
          python phase14_5_12_count_missing_lines/apply_patch.py
          grep -q 'versionCode = 51' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.12-phase14.5-count-missing-lines' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'addMissingCountLine' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          grep -q 'systemQtyBase = 0.0' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/AdvancedInventoryService.kt
          grep -q 'إضافة صنف/تشغيلة غير موجودة في لقطة الجرد' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt
          test -f FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/domain/InventoryCountMathTest.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 21 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'version = 21' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/21.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-12-output
          mkdir -p phase14-5-12-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-12-output/FushERP-Phase14.5.12-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-12-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-12-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-12-output/apksigner/apksigner
          zip -qr phase14-5-12-output/FushERP-Mobile-Phase14.5.12-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-12-output/FushERP-Phase14.5.12-unsigned.apk > phase14-5-12-output/FushERP-Phase14.5.12-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.12 — Inventory Count Missing Snapshot Lines' \
            'Version: 0.15.4.12-phase14.5-count-missing-lines (versionCode 51)' \
            'Room schema: 21 (unchanged)' \
            '' \
            'Fixed:' \
            '- Draft inventory counts can add an item or lot physically found but absent from the opening snapshot.' \
            '- Added missing lines use system quantity 0 and the entered physical quantity as the positive variance.' \
            '- Lot and expiry requirements follow item master-data tracking flags.' \
            '- Duplicate item/lot/expiry count lines are rejected.' \
            '- A positive unit cost is required so inventory gains are valued correctly.' \
            '- Added missing count lines are written to the audit log.' \
            > phase14-5-12-output/FushERP-Phase14.5.12-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.12-Count-Missing-Lines-Build
          path: phase14-5-12-output/
          if-no-files-found: error
          retention-days: 7
