name: Build Fush ERP Phase 14.5 Production Planning

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-production-planning.yml'
      - 'phase14_5_production_planning/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.4 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.4-Advanced-Seasonality-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31574574765
      - name: Restore Phase 14.4 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.4-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 38' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.3-phase14.4-seasonality-advanced' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 16' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply Phase 14.5 production planning
        shell: bash
        run: |
          set -e
          python phase14_5_production_planning/apply_patch.py
          grep -q 'versionCode = 39' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4-phase14.5-production-material-planning' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'version = 17' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'MIGRATION_16_17' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/Migrations.kt
          grep -q 'generateProductionPlan' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/planning/PlanningService.kt
          grep -q 'خطة الإنتاج والمواد والمخزون' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/PlanningScreen.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-output
          mkdir -p phase14-5-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-output/FushERP-Phase14.5-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-output/apksigner/apksigner
          zip -qr phase14-5-output/FushERP-Mobile-Phase14.5-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-output/FushERP-Phase14.5-unsigned.apk > phase14-5-output/FushERP-Phase14.5-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5 — Production, Materials & Inventory Planning' \
            'Version: 0.15.4-phase14.5-production-material-planning (versionCode 39)' \
            '' \
            'Scope:' \
            '- Aggregate approved demand plans for the next month across provinces.' \
            '- Net production need from demand + safety stock - usable finished goods.' \
            '- Round production to full active-recipe batches.' \
            '- BOM material requirements including expected loss.' \
            '- Usable RM stock excludes expired/quarantined stock and open-order reservations.' \
            '- Per-item safety stock days and lead time days, default 0 until configured.' \
            '- Material reorder point, suggested purchase and projected ending stock.' \
            '- Draft/approve/reopen production planning workflow with audit trail.' \
            '- Room migration 16 -> 17.' \
            > phase14-5-output/FushERP-Phase14.5-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5-Production-Planning-Build
          path: phase14-5-output/
          if-no-files-found: error
          retention-days: 7
