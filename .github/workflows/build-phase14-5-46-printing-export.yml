name: Build Fush ERP Phase 14.5.46 Professional Printing

on:
  push:
    branches: [fush/reports-printing]
    paths:
      - '.github/workflows/build-phase14-5-46-printing-export.yml'
      - 'phase14_5_46_printing_export/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download verified Phase 14.5.45 source
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.45-Financial-Reports-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31865139140

      - name: Restore Phase 14.5.45 and install Phase 14.5.46 exporter
        shell: bash
        run: |
          set -euo pipefail
          unzip -q previous-build/FushERP-Mobile-Phase14.5.45-Financial-Reports-Source.zip
          cd FushERP_Mobile_Phase5
          rm -rf .git app/build .gradle build
          git init -q
          git config user.email reports-ci@fush.local
          git config user.name "FUSH Reports CI"
          git add -A
          git commit -qm baseline-14.5.45

          cat ../phase14_5_46_printing_export/files/ReportExportSupport.kt.gz.b64.part* \
            | base64 -d \
            | gzip -d \
            > app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          echo '7e8cb427ae42b4c27b3b26db9b3eb1e5a6b564d8cdf88f28cd5d3c658d8f2cca  app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt' | sha256sum -c -

          sed -i 's/versionCode = 84/versionCode = 85/' app/build.gradle.kts
          sed -i 's/versionName = "0.15.4.45-financial-reports"/versionName = "0.15.4.46-printing-export"/' app/build.gradle.kts

          git apply --check ../phase14_5_46_printing_export/patches/02_spreadsheet_numeric_cells.patch
          git apply ../phase14_5_46_printing_export/patches/02_spreadsheet_numeric_cells.patch
          git diff --check HEAD

          grep -q 'applicationId = "com.fush.erp.recovery"' app/build.gradle.kts
          grep -q 'versionCode = 85' app/build.gradle.kts
          grep -q 'versionName = "0.15.4.46-printing-export"' app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f app/schemas/com.fush.erp.data.FushDatabase/28.json
          grep -q 'PrintAttributes.MediaSize.ISO_A4.asLandscape()' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          grep -q 'parseSpreadsheetCell(value)' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          grep -q 'drawRow(table.headers, widths, tableHeader, isHeader = true)' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt
          if grep -q 'drawWrapped("سجل ' app/src/main/java/com/fush/erp/ui/export/ReportExportSupport.kt; then
            echo 'Legacy record-by-record PDF rendering is still present'
            exit 1
          fi
          rm -rf .git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Unit tests and printing/export compilation
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and schema safety
        shell: bash
        run: |
          set -euo pipefail
          test -f FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -q 'applicationId = "com.fush.erp.recovery"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionCode = 85' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'versionName = "0.15.4.46-printing-export"' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 27' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/27.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/28.json

      - name: Zipalign and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase14-5-46-output/lib
          UNSIGNED=FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=phase14-5-46-output/FushERP-Phase14.5.46-Professional-Printing-aligned-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$ALIGNED"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-46-output/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-46-output/lib/apksigner.jar
          chmod +x phase14-5-46-output/apksigner
          zip -qr phase14-5-46-output/FushERP-Mobile-Phase14.5.46-Professional-Printing-Source.zip FushERP_Mobile_Phase5
          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          printf '%s\n' \
            'Fush ERP Phase 14.5.46 — Professional Printing & Export' \
            'Base verified source: Phase 14.5.45 Financial Reports' \
            'Branch: fush/reports-printing' \
            'Real PDF tables: PASS' \
            'Automatic portrait/landscape: PASS' \
            'Repeated table headers on page breaks: PASS' \
            'Bounded PDF cell wrapping: PASS' \
            'PDF footer with page number and timestamp: PASS' \
            'XLSX RTL/page setup: PASS' \
            'XLSX numeric/currency cells: PASS' \
            'Spreadsheet parser regression tests: PASS' \
            'Package: com.fush.erp.recovery' \
            'Version code: 85' \
            'Version name: 0.15.4.46-printing-export' \
            'Room schema: 27 unchanged' \
            'Unit tests: PASS' \
            'Release build: PASS' \
            'Zipalign: PASS' \
            > phase14-5-46-output/FushERP-Phase14.5.46-BUILD-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.46-Professional-Printing-Build
          path: phase14-5-46-output/
          if-no-files-found: error
          retention-days: 7
