name: Build Fush ERP Phase 14.5.18 Manual Sales Price

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-18-manual-sales-price.yml'
      - 'phase14_5_18_manual_sales_price/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.17 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.17-Master-Data-Controls-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31725477443
      - name: Restore Phase 14.5.17 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.17-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 56' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.17-phase14.5-master-data-controls' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.18 manual sales price
        shell: bash
        run: |
          set -e
          python phase14_5_18_manual_sales_price/apply_patch.py
          grep -q 'versionCode = 57' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.18-phase14.5-manual-sales-price' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          grep -q 'إدخال يدوي أو سعر مقترح' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/SalesScreens.kt
          grep -q 'manual sales pricing is allowed' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/SalesService.kt
          test ! -f FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/ui/screens/AdvancedInventoryScreens.kt.orig
          test -f FushERP_Mobile_Phase5/PHASE14_5_18_SCOPE.md
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 23 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-18-output
          mkdir -p phase14-5-18-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-18-output/FushERP-Phase14.5.18-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-18-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-18-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-18-output/apksigner/apksigner
          zip -qr phase14-5-18-output/FushERP-Mobile-Phase14.5.18-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-18-output/FushERP-Phase14.5.18-unsigned.apk > phase14-5-18-output/FushERP-Phase14.5.18-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.18 — Manual Sales Price' \
            'Version: 0.15.4.18-phase14.5-manual-sales-price (versionCode 57)' \
            'Room schema: 23 (unchanged)' \
            '' \
            'Changed:' \
            '- Sales invoice unit price is editable.' \
            '- Active price lists are optional reference/default values, not posting locks.' \
            '- If a valid price exists it is prefilled as a suggestion and may be changed.' \
            '- If no valid price exists, a manual price may be entered and the invoice may still be posted.' \
            '- Posted invoice lines keep the entered unit price as the historical snapshot.' \
            '- Zero and negative prices are rejected.' \
            '- Existing Fush 60 ml floor protection remains enforced with documented override.' \
            '- Removed obsolete AdvancedInventoryScreens.kt.orig.' \
            > phase14-5-18-output/FushERP-Phase14.5.18-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.18-Manual-Sales-Price-Build
          path: phase14-5-18-output/
          if-no-files-found: error
          retention-days: 7
