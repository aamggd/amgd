name: Build Fush ERP Phase 14.5.22 Production Expiry Diagnostics

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-phase14-5-22-production-expiry-diagnostics.yml'
      - 'phase14_5_22_production_expiry_diagnostics/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Phase 14.5.21 source artifact
        uses: actions/download-artifact@v4
        with:
          name: FushERP-Phase14.5.21-Production-Fixed-Batch-Build
          path: previous-build
          github-token: ${{ github.token }}
          repository: aamggd/amgd
          run-id: 31753089916
      - name: Restore Phase 14.5.21 source
        shell: bash
        run: |
          set -e
          unzip -q previous-build/FushERP-Mobile-Phase14.5.21-Source.zip
          test -d FushERP_Mobile_Phase5
          grep -q 'versionCode = 60' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.21-phase14.5-production-order-delete-fixed-batch' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
      - name: Apply and verify Phase 14.5.22
        shell: bash
        run: |
          set -e
          base64 -d phase14_5_22_production_expiry_diagnostics/patch.b64 | gunzip > /tmp/apply_phase14_5_22.py
          python /tmp/apply_phase14_5_22.py
          grep -q 'versionCode = 61' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q '0.15.4.22-phase14.5-production-expiry-diagnostics' FushERP_Mobile_Phase5/app/build.gradle.kts
          grep -q 'itemLabel' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/ProductionMath.kt
          grep -q 'item.nameAr' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/domain/ProductionService.kt
          grep -q 'expiryTrackingErrorNamesTheMaterialWhenContextIsProvided' FushERP_Mobile_Phase5/app/src/test/java/com/fush/erp/domain/ProductionMathTest.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Release build
        working-directory: FushERP_Mobile_Phase5
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Room schema 23 unchanged
        shell: bash
        run: |
          set -e
          grep -q 'FUSH_DB_SCHEMA_VERSION = 23' FushERP_Mobile_Phase5/app/src/main/java/com/fush/erp/data/FushDatabase.kt
          test -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/23.json
          test ! -f FushERP_Mobile_Phase5/app/schemas/com.fush.erp.data.FushDatabase/24.json
      - name: Package build
        shell: bash
        run: |
          set -e
          rm -rf phase14-5-22-output
          mkdir -p phase14-5-22-output/apksigner/lib
          cp FushERP_Mobile_Phase5/app/build/outputs/apk/release/app-release-unsigned.apk phase14-5-22-output/FushERP-Phase14.5.22-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" phase14-5-22-output/apksigner/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" phase14-5-22-output/apksigner/lib/apksigner.jar
          chmod +x phase14-5-22-output/apksigner/apksigner
          zip -qr phase14-5-22-output/FushERP-Mobile-Phase14.5.22-Source.zip FushERP_Mobile_Phase5
          sha256sum phase14-5-22-output/FushERP-Phase14.5.22-unsigned.apk > phase14-5-22-output/FushERP-Phase14.5.22-unsigned.apk.sha256
          printf '%s\n' \
            'Fush ERP Phase 14.5.22 — Production Expiry Diagnostics' \
            'Version: 0.15.4.22-phase14.5-production-expiry-diagnostics (versionCode 61)' \
            'Room schema: 23 (unchanged)' \
            '' \
            'Changed:' \
            '- Production FEFO tracking validation now identifies the exact material name and item code in expiry/lot errors.' \
            '- Tracking rules themselves are unchanged.' \
            '- No database migration and no existing data changes.' \
            > phase14-5-22-output/FushERP-Phase14.5.22-BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FushERP-Phase14.5.22-Production-Expiry-Diagnostics-Build
          path: phase14-5-22-output/
          if-no-files-found: error
          retention-days: 7
