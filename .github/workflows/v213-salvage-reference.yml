name: v213 Salvage Reference

on:
  push:
    branches: [v213-stock-issue-supplier-sales-build2]
    paths:
      - '.github/workflows/v213-salvage-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and salvage old v213 source prefix
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('ci/v213/parts').glob('part_*.b64'))
          assert parts, 'No ci/v213/parts found'
          out = bytearray()
          for i, p in enumerate(parts):
              raw = ''.join(p.read_text().split())
              if p.name == 'part_005.b64' and len(raw) > 10021:
                  # Historical upload inserted a 21-character marker at offset 10000.
                  candidates = [raw, raw[:10000] + raw[10021:]]
                  decoded = None
                  for candidate in candidates:
                      try:
                          decoded = base64.b64decode(candidate, validate=True)
                          break
                      except Exception:
                          pass
                  if decoded is None:
                      raise SystemExit('Unable to decode part_005')
              else:
                  decoded = base64.b64decode(raw, validate=True)
              out.extend(decoded)
              print(p.name, len(decoded))
          Path('/tmp/v213-prefix.xz').write_bytes(out)
          print('payload bytes', len(out))
          PY

          set +e
          xz -dc /tmp/v213-prefix.xz > /tmp/v213-prefix.tar
          XZ_RC=$?
          set -e
          echo "xz_rc=$XZ_RC"
          echo "tar_bytes=$(stat -c%s /tmp/v213-prefix.tar)"
          mkdir -p /tmp/salvage
          tar -xf /tmp/v213-prefix.tar -C /tmp/salvage --ignore-zeros 2>/tmp/tar.err || true
          echo '--- tar error ---'
          cat /tmp/tar.err || true
          echo '--- salvaged files ---'
          find /tmp/salvage -type f | sort | head -300
          echo '--- build identities ---'
          find /tmp/salvage -name build.gradle.kts -print -exec grep -nE 'applicationId|versionCode|versionName' {} \; || true
          echo '--- likely feature files ---'
          find /tmp/salvage -type f \( -iname '*inventory*' -o -iname '*issue*' -o -iname '*supplier*' -o -iname '*sales*' \) -print | sort | head -300
          echo '--- feature markers ---'
          grep -R -n -E 'InventoryIssue|OWNER_WITHDRAW|DAMAGE|SupplierSale|supplier.*sale|stock.*issue|صرف مخز|سحب.*مالك|تالف' /tmp/salvage 2>/dev/null | head -400 || true

      - name: Upload salvaged reference
        uses: actions/upload-artifact@v4
        with:
          name: v213-salvaged-reference
          path: /tmp/salvage
          if-no-files-found: warn
          retention-days: 1
