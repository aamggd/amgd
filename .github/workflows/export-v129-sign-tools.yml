name: Export v129 Android Sign Tools

on:
  push:
    branches: [fush/v129-cash-refund-actual-cash-guard]
    paths:
      - '.github/workflows/export-v129-sign-tools.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
      - name: Package sign tools
        shell: bash
        run: |
          mkdir -p sign-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" sign-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" sign-tools/lib/
          chmod +x sign-tools/apksigner sign-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Sign-Tools-36-v129
          path: sign-tools
          if-no-files-found: error
          retention-days: 1
