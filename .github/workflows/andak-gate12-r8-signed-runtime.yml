name: ANDAK Supplier Gate12 R8 Final Signed Runtime
on:
  push:
    branches: [andak-supplier-gate12-ci-temp]
    paths:
      - '.github/workflows/andak-gate12-r8-signed-runtime.yml'

permissions:
  contents: read
  id-token: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Download exact APKs and test harnesses
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          getf() {
            local SHARE="$1" NAME="$2" OUT="$3"
            curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
            local ID URL
            ID=$(jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' /tmp/files.json | head -1)
            test -n "$ID" && test "$ID" != "null"
            curl -fsSL -X POST "$API/shares/$SHARE/files/$ID/download" -o /tmp/download.json
            URL=$(jq -r '.downloadUrl' /tmp/download.json)
            test -n "$URL" && test "$URL" != "null"
            curl -fL --retry 3 "$URL" -o "$OUT"
          }
          getf "M9XlIVMEnYs7" "ANDAK-Supplier-v1.3.2-GATE12-R8-FINAL-SIGNED2.apk" "$GITHUB_WORKSPACE/r8.apk"
          getf "A08rHZ8pD47s" "ANDAK-Supplier-v1.3.1-GATE12-P0-HOTFIX-R7-FINAL-SIGNED.apk" "$GITHUB_WORKSPACE/r7.apk"
          getf "qnn2A2Fnt-14" "r8_backend_e2e.py" "$GITHUB_WORKSPACE/backend.py"
          getf "VrRwtLr_-JlM" "r8_runtime_final.sh" "$GITHUB_WORKSPACE/runtime.sh"
          getf "NDEVy3AaLK_a" "r8_verify_offline_sync.py" "$GITHUB_WORKSPACE/offline_verify.py"
          chmod +x "$GITHUB_WORKSPACE/runtime.sh"
          echo "c0f03f2fc37b4b985de80dbe4c1f9f801ea74c7d4fbbe88a81cb8fafd9e20379  $GITHUB_WORKSPACE/r8.apk" | sha256sum -c -
          echo "42bdd3878a64b65ca40457dd9966ac31ff872ff78f8f59f8a36f2dddec9b58b7  $GITHUB_WORKSPACE/r7.apk" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"

      - name: Create four isolated live supplier fixtures with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=andak-gate12-r8-runtime" | jq -r '.value')
          test -n "$OIDC" && test "$OIDC" != "null"
          echo "::add-mask::$OIDC"
          for R in A B C D; do
            curl -fsSL -X POST               "https://bkbjtyacoiaheunweyuu.supabase.co/functions/v1/andak-gate12-r8-runtime-fixture"               -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json"               --data '{"action":"setup"}' > "/tmp/$R.json"
            jq -e '.ok == true' "/tmp/$R.json" >/dev/null
            for K in email password user_id supplier_id supplier_code expected_order expected_product expected_store_name; do
              V=$(jq -r ".$K" "/tmp/$R.json")
              test -n "$V" && test "$V" != "null"
              echo "::add-mask::$V"
              ENVK=$(echo "$K" | tr '[:lower:]' '[:upper:]')
              echo "${R}_${ENVK}=$V" >> "$GITHUB_ENV"
              case "$K" in
                expected_order) echo "${R}_ORDER=$V" >> "$GITHUB_ENV" ;;
                expected_product) echo "${R}_PRODUCT=$V" >> "$GITHUB_ENV" ;;
                expected_store_name) echo "${R}_STORE=$V" >> "$GITHUB_ENV" ;;
              esac
            done
          done
          printf '%s' "$OIDC" > /tmp/oidc.jwt

      - name: Real-auth Backend RLS A/B and full Gate12 E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/backend.py"
          test -s "$GITHUB_WORKSPACE/backend-e2e-evidence.json"
          cp "$GITHUB_WORKSPACE/backend-e2e-evidence.json" "$GITHUB_WORKSPACE/runtime-evidence/"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Exact signed APK authenticated runtime on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/runtime.sh"

      - name: Verify offline queued inventory reached server
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/offline_verify.py"
          cp "$GITHUB_WORKSPACE/offline-server-confirmation.json" "$GITHUB_WORKSPACE/runtime-evidence/"

      - name: Cleanup all temporary live supplier fixtures
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f /tmp/oidc.jwt ]; then
            OIDC=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=andak-gate12-r8-runtime" | jq -r '.value')
          else
            OIDC=$(cat /tmp/oidc.jwt)
          fi
          for R in A B C D; do
            VARNAME="${R}_USER_ID"
            UID="${!VARNAME:-}"
            if [ -n "$UID" ]; then
              curl -fsSL -X POST                 "https://bkbjtyacoiaheunweyuu.supabase.co/functions/v1/andak-gate12-r8-runtime-fixture"                 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json"                 --data "{"action":"cleanup","user_id":"$UID"}" >/dev/null || true
            fi
          done

      - name: Upload final Gate12 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDAK-Supplier-Gate12-R8-Final-Closure-Evidence
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 2
